<link rel="import" href="./x-solicitar-producto.html">

<dom-module id="x-solicitar-producto-main">
    
    <template>
        
        <link rel="stylesheet" href="../../../css/solicitud-producto.css">

        <paper-dialog modal id="dialog_detalle_solicitud" class="dialog_redondo" 
            style="max-width: 800px; width: 90%;"
            entry-animation="scale-up-animation"
            exit-animation="fade-out-animation" with-backdrop>
            <div class="xContent">
                <h3>Detalle de Solicitud #[[solicitudSeleccionada.idsolicitud_producto]]</h3>
                <br>
                
                <div class="mb-3">
                    <p class="m-0"><strong>Sede destino:</strong> [[solicitudSeleccionada.sede_destino]]</p>
                    <p class="m-0"><strong>Fecha:</strong> [[formatearFecha(solicitudSeleccionada.fecha_solicitud)]]</p>
                    <p class="m-0"><strong>Estado:</strong> <span class$="badge-estado badge-[[solicitudSeleccionada.estado]]">[[solicitudSeleccionada.estado]]</span></p>
                    <template is="dom-if" if="[[solicitudSeleccionada.nota]]">
                        <p class="m-0"><strong>Nota:</strong> [[solicitudSeleccionada.nota]]</p>
                    </template>
                </div>
                
                <div class="xLinea2"></div>
                <br>
                
                <h4>Productos Solicitados</h4>
                <table width="100%" class="fs-13">
                    <thead>
                        <tr>
                            <th align="left">Tipo</th>
                            <th align="left">Descripción</th>
                            <th align="right">Stock Actual</th>
                            <th align="right">Cantidad Solicitada</th>
                            <th align="right">Cantidad Despachada</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template is="dom-repeat" items="[[detalleSolicitud]]" as="item">
                            <tr>
                                <td>
                                    <span class$="badge-estado badge-[[item.tipo_producto]]">
                                        [[item.tipo_producto]]
                                    </span>
                                </td>
                                <td>
                                    [[item.descripcion]]
                                    <template is="dom-if" if="[[item.codigo_unico]]">
                                        <br><span class="fs-10 fw-600 text-success">[[item.codigo_unico]]</span>
                                    </template>
                                </td>
                                <td align="right">[[item.stock_actual]]</td>
                                <td align="right" class="fw-600">[[item.cantidad_solicitada]]</td>
                                <td align="right">
                                    <template is="dom-if" if="[[item.cantidad_despachada]]">
                                        <span class="text-success fw-600">[[item.cantidad_despachada]]</span>
                                    </template>
                                    <template is="dom-if" if="[[!item.cantidad_despachada]]">
                                        <span class="text-secondary">-</span>
                                    </template>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                
                <br><br>
                <template is="dom-if" if="[[_esEnviadaYDespachada(solicitudSeleccionada, tabActiva)]]">
                    <div class="xBoton2 xVerde" on-click="abrirRecepcion">
                        <i class="fa fa-check-circle mr-1"></i>Confirmar Recepción
                    </div>
                </template>
                <div class="xBoton2 xPlomo" dialog-dismiss>Cerrar</div>
                <br><br>
            </div>
        </paper-dialog>

        <!-- Dialog Recepción -->
        <paper-dialog modal id="dialog_recepcion" class="dialog_redondo" 
            style="max-width: 900px; width: 95%;"
            entry-animation="scale-up-animation"
            exit-animation="fade-out-animation" with-backdrop>
            <div class="xContent">
                <h3><i class="fa fa-check-circle mr-2" style="color: #388e3c;"></i>Confirmar Recepción #[[solicitudSeleccionada.idsolicitud_producto]]</h3>
                <p class="text-secondary fs-12 m-0">Selecciona dónde ingresar cada producto recibido</p>
                <br>
                <div class="xLinea2"></div>
                <br>

                <template is="dom-repeat" items="[[itemsRecepcion]]" as="item" index-as="idx">
                    <div class="solicitud-card" style="cursor: default;">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <div>
                                <span class$="badge-estado badge-[[item.tipo_producto]]">[[item.tipo_producto]]</span>
                                <span class="fw-600 fs-14 ml-2">[[item.descripcion]]</span>
                            </div>
                            <div class="text-right">
                                <span class="fs-12 text-secondary">Despachado: </span>
                                <span class="fw-600 text-success">[[item.cantidad_despachada]]</span>
                            </div>
                        </div>

                        <!-- Porción -->
                        <template is="dom-if" if="[[_esPorcion(item.tipo_producto)]]">
                            <template is="dom-if" if="[[item.match]]">
                                <div class="mt-2 p-2" style="background: #e8f5e9; border-radius: 4px;">
                                    <template is="dom-repeat" items="[[item.match]]" as="m" index-as="midx">
                                        <div class="d-flex align-items-center mb-1">
                                            <input type="radio" name$="recep_porcion_[[idx]]" 
                                                data-idx$="[[idx]]" data-midx$="[[midx]]"
                                                on-change="_seleccionarPorcionRecepcion"
                                                checked$="[[_esFirstMatch(midx)]]">
                                            <span class="ml-2 fs-13">
                                                [[m.descripcion]] 
                                                <span class="text-secondary">(Stock actual: [[m.stock]])</span>
                                            </span>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <template is="dom-if" if="[[!item.match]]">
                                <div class="mt-2 p-2 match-error" style="background: #fff3f3; border-radius: 4px;">
                                    <i class="fa fa-exclamation-triangle"></i> No se encontró porción local para recibir
                                </div>
                            </template>
                        </template>

                        <!-- Producto almacén -->
                        <template is="dom-if" if="[[!_esPorcion(item.tipo_producto)]]">
                            <template is="dom-if" if="[[item.opciones_almacen.length]]">
                                <div class="mt-2 p-2" style="background: #e8f5e9; border-radius: 4px;">
                                    <label class="fs-12 text-secondary">Ingresar a almacén:</label>
                                    <select class="select-almacen mt-1" data-idx$="[[idx]]" on-change="_seleccionarAlmacenRecepcion">
                                        <option value="">-- Seleccionar --</option>
                                        <template is="dom-repeat" items="[[item.opciones_almacen]]" as="alm">
                                            <option value$="[[alm.idproducto_stock]]">
                                                [[alm.almacen_nombre]] | [[alm.producto_nombre]] (Stock: [[alm.stock]])
                                            </option>
                                        </template>
                                    </select>
                                </div>
                            </template>
                            <template is="dom-if" if="[[!item.opciones_almacen.length]]">
                                <div class="mt-2 p-2 match-error" style="background: #fff3f3; border-radius: 4px;">
                                    <i class="fa fa-exclamation-triangle"></i> No se encontró producto local para recibir
                                </div>
                            </template>
                        </template>
                    </div>
                </template>

                <br>
                <div class="d-flex" style="gap: 8px;">
                    <div class="xBoton2 xVerde" on-click="ejecutarRecepcion" style="flex:1;">
                        <i class="fa fa-check-circle mr-1"></i>Confirmar Recepción
                    </div>
                    <div class="xBoton2 xPlomo" dialog-dismiss>Cancelar</div>
                </div>
                <br>
            </div>
        </paper-dialog>

        <div class="p-2">
            <br>
            <div class="xMiCard2" style="width:90%; max-width: 1250px;">
                <div class="xEncanezadoCard d-flexx justify-content-between">
                    <div class="div-content-head-op">
                        <p class="fw-600 fs-18">Solicitud de Productos</p>
                        <p class="fw-100 text-secondary fs-12">Gestiona las solicitudes de productos y porciones entre sedes.</p>
                    </div>
                    <div>
                        <button class="btn btn-sm btn-secondary" hidden$="[[!isShowNuevaSolicitud]]" onclick="goMainSolicitud()">
                            <i class="fa fa-arrow-left mr-1"></i>Atrás
                        </button>
                    </div>
                </div>
                <div class="p-3 mb-5">

                    <div class="xContentCard" hidden$="[[isShowNuevaSolicitud]]">
                        
                        <div class="d-flexx justify-content-between align-items-center" style="margin-bottom: 20px;">
                            <div class="d-flexx" style="gap: 8px;">
                                <button class="btn btn-success" on-click="abrirNuevaSolicitud">
                                    <i class="fa fa-plus mr-1"></i>Nueva Solicitud
                                </button>
                                <button class="btn btn-secondary" on-click="cargarSolicitudes">
                                    <i class="fa fa-refresh mr-1"></i>Actualizar
                                </button>
                            </div>
                            <a href="#/solicitud-recibida" class="btn btn-sm btn-outline-success" style="border:2px solid #4caf50; color:#2e7d32; font-weight:600; text-decoration:none;">
                                <i class="fa fa-inbox mr-1"></i>Solicitudes Recibidas ([[totalRecibidas]])
                            </a>
                        </div>

                        <div class="xLinea2"></div>
                        <br>

                        <template is="dom-if" if="[[!listSolicitudesEnviadas.length]]">
                            <div class="center p-4">
                                <i class="fa fa-inbox" style="font-size: 64px; opacity: 0.3; color: #999;"></i>
                                <p class="fs-16 fw-600" style="color: #999;">No hay solicitudes enviadas</p>
                                <p class="text-secondary">Crea una nueva solicitud para comenzar</p>
                            </div>
                        </template>
                        
                        <template is="dom-repeat" items="[[listSolicitudesEnviadas]]" as="item">
                            <div class="solicitud-card" data-id="[[item.idsolicitud_producto]]" on-click="verDetalleSolicitud">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <div>
                                        <span class="fw-600 fs-15">#[[item.idsolicitud_producto]] - [[item.sede_destino]]</span>
                                        <span class$="badge-estado badge-[[item.estado]] ml-2">[[item.estado]]</span>
                                    </div>
                                    <div class="text-secondary fs-12">
                                        [[formatearFecha(item.fecha_solicitud)]]
                                    </div>
                                </div>
                                <div class="d-flex" style="gap: 16px; font-size: 13px; color: #666;">
                                    <span>
                                        <i class="fa fa-cube mr-1"></i>
                                        [[item.total_items]] items
                                    </span>
                                    <template is="dom-if" if="[[item.total_porciones]]">
                                        <span>
                                            <i class="fa fa-cutlery mr-1"></i>
                                            [[item.total_porciones]] porciones
                                        </span>
                                    </template>
                                    <template is="dom-if" if="[[item.total_productos_almacen]]">
                                        <span>
                                            <i class="fa fa-archive mr-1"></i>
                                            [[item.total_productos_almacen]] productos
                                        </span>
                                    </template>
                                </div>
                                <template is="dom-if" if="[[item.nota]]">
                                    <p class="m-0 mt-2 fs-12 text-secondary">
                                        <i class="fa fa-comment mr-1"></i>[[item.nota]]
                                    </p>
                                </template>
                            </div>
                        </template>

                    </div>

                    <div hidden$="[[!isShowNuevaSolicitud]]">
                        <x-solicitar-producto></x-solicitar-producto>
                    </div>

                </div>
            </div>
        </div>

    </template>
</dom-module>

<script>
Polymer({
    is: 'x-solicitar-producto-main',
    properties: {
        listSolicitudesEnviadas: {
            type: Array,
            value: function() { return []; }
        },
        detalleSolicitud: {
            type: Array,
            value: function() { return []; }
        },
        solicitudSeleccionada: {
            type: Object,
            value: function() { return {}; }
        },
        isShowNuevaSolicitud: {
            type: Boolean,
            value: false
        },
        tabActiva: {
            type: String,
            value: 'enviadas'
        },
        totalEnviadas: {
            type: Number,
            value: 0
        },
        totalRecibidas: {
            type: Number,
            value: 0
        },
        itemsRecepcion: {
            type: Array,
            value: function() { return []; }
        },
        _recepcionSelecciones: {
            type: Object,
            value: function() { return {}; }
        }
    },
    
    attached: function() {
        $("#Titulo_page").text("Solicitud de Productos");
        this.cargarSolicitudes();
        $('body').addClass('loaded');
    },
    
    cargarSolicitudes: async function() {
        xPopupLoad.xopen();
        
        try {
            const _httpFecht = new httpFecht();
            
            const rptEnviadas = await _httpFecht.postJson('../../bdphp/log_011.php?op=4', {});
            this.set('listSolicitudesEnviadas', rptEnviadas.datos || []);
            this.set('totalEnviadas', rptEnviadas.datos ? rptEnviadas.datos.length : 0);
            
            const rptRecibidas = await _httpFecht.postJson('../../bdphp/log_011.php?op=5', {});
            this.set('totalRecibidas', rptRecibidas.datos ? rptRecibidas.datos.length : 0);
            
        } catch (error) {
            console.error('Error al cargar solicitudes:', error);
            showToastSwal('error', 'Error al cargar solicitudes');
        }
        
        xPopupLoad.xclose();
    },
    
    abrirNuevaSolicitud: function() {
        this.set('isShowNuevaSolicitud', true);
        const solicitudComp = this.$$('x-solicitar-producto');
        if (solicitudComp && typeof solicitudComp.inicializar === 'function') {
            solicitudComp.inicializar();
        }
    },
    
    goMainSolicitud: function() {
        this.set('isShowNuevaSolicitud', false);
        this.cargarSolicitudes();
    },
    
    verDetalleSolicitud: async function(e) {
        const idsolicitud = e.model.item.idsolicitud_producto;
        const solicitud = this.listSolicitudesEnviadas.find(s => s.idsolicitud_producto == idsolicitud);
        if (!solicitud) return;
        
        this.set('solicitudSeleccionada', solicitud);
        
        xPopupLoad.xopen();
        try {
            const _httpFecht = new httpFecht();
            const rpt = await _httpFecht.postJson('../../bdphp/log_011.php?op=6', {
                idsolicitud_producto: idsolicitud
            });
            
            this.set('detalleSolicitud', rpt.datos || []);
            this.$.dialog_detalle_solicitud.open();
            
        } catch (error) {
            console.error('Error al cargar detalle:', error);
            showToastSwal('error', 'Error al cargar detalle de solicitud');
        }
        xPopupLoad.xclose();
    },

    // ===================== RECEPCIÓN =====================
    
    _esEnviadaYDespachada: function(sol, tabActiva) {
        if (!sol || !sol.estado) return false;
        return tabActiva === 'enviadas' && sol.estado === 'despachado';
    },
    
    abrirRecepcion: async function() {
        var idsolicitud = this.solicitudSeleccionada.idsolicitud_producto;
        this.$.dialog_detalle_solicitud.close();
        
        xPopupLoad.xopen();
        try {
            const _httpFecht = new httpFecht();
            const rpt = await _httpFecht.postJson('../../bdphp/log_011.php?op=15', {
                idsolicitud_producto: idsolicitud
            });
            
            if (rpt.success) {
                var items = rpt.datos || [];
                var selecciones = {};
                items.forEach(function(item, idx) {
                    selecciones[idx] = {
                        cantidad: parseFloat(item.cantidad_despachada) || 0,
                        tipo_producto: item.tipo_producto
                    };
                    if (item.tipo_producto === 'porcion' && item.match && item.match.length > 0) {
                        selecciones[idx].idporcion_local = item.match[0].idporcion;
                    }
                    if (item.tipo_producto === 'almacen' && item.opciones_almacen && item.opciones_almacen.length > 0) {
                        selecciones[idx].idproducto_stock = null;
                    }
                });
                
                this.set('itemsRecepcion', items);
                this.set('_recepcionSelecciones', selecciones);
                this.$.dialog_recepcion.open();
            } else {
                showToastSwal('error', rpt.message || 'Error al cargar datos de recepción');
            }
        } catch (error) {
            console.error('Error al cargar recepción:', error);
            showToastSwal('error', 'Error al cargar datos de recepción');
        }
        xPopupLoad.xclose();
    },
    
    _seleccionarPorcionRecepcion: function(e) {
        var idx = parseInt(e.currentTarget.dataset.idx);
        var midx = parseInt(e.currentTarget.dataset.midx);
        var match = this.itemsRecepcion[idx].match[midx];
        var sel = this._recepcionSelecciones;
        sel[idx].idporcion_local = match.idporcion;
        this.set('_recepcionSelecciones', sel);
    },
    
    _seleccionarAlmacenRecepcion: function(e) {
        var idx = parseInt(e.currentTarget.dataset.idx);
        var idproducto_stock = e.currentTarget.value;
        var sel = this._recepcionSelecciones;
        sel[idx].idproducto_stock = idproducto_stock || null;
        this.set('_recepcionSelecciones', sel);
    },
    
    ejecutarRecepcion: async function() {
        var self = this;
        var detalles = [];
        var hayError = false;
        
        this.itemsRecepcion.forEach(function(item, idx) {
            var sel = self._recepcionSelecciones[idx];
            if (!sel || sel.cantidad <= 0) return;
            
            var detalle = {
                idsolicitud_producto_detalle: item.idsolicitud_producto_detalle,
                tipo_producto: item.tipo_producto,
                cantidad: sel.cantidad
            };
            
            if (item.tipo_producto === 'porcion') {
                if (!sel.idporcion_local) {
                    hayError = true;
                    return;
                }
                detalle.idporcion_local = sel.idporcion_local;
            } else {
                if (!sel.idproducto_stock) {
                    hayError = true;
                    return;
                }
                detalle.idproducto_stock = sel.idproducto_stock;
            }
            
            detalles.push(detalle);
        });
        
        if (hayError) {
            showToastSwal('warning', 'Selecciona el destino para todos los items');
            return;
        }
        
        if (detalles.length === 0) {
            showToastSwal('warning', 'No hay items para recibir');
            return;
        }
        
        xPopupLoad.xopen();
        try {
            const _httpFecht = new httpFecht();
            const rpt = await _httpFecht.postJson('../../bdphp/log_011.php?op=16', {
                idsolicitud_producto: this.solicitudSeleccionada.idsolicitud_producto,
                detalles: detalles
            });
            
            if (rpt.success) {
                showToastSwal('success', 'Recepción confirmada. Stock actualizado.');
                this.$.dialog_recepcion.close();
                this.cargarSolicitudes();
            } else {
                showToastSwal('error', rpt.message || 'Error al confirmar recepción');
            }
        } catch (error) {
            console.error('Error al recibir:', error);
            showToastSwal('error', 'Error al confirmar recepción');
        }
        xPopupLoad.xclose();
    },

    // ===================== HELPERS =====================
    
    _esPorcion: function(tipo) {
        return tipo === 'porcion';
    },
    
    _esMatchCodigo: function(matchTipo) {
        return matchTipo === 'codigo_unico';
    },
    
    _esFirstMatch: function(midx) {
        return midx === 0;
    },
    
    formatearFecha: function(fecha) {
        if (!fecha) return '';
        const d = new Date(fecha);
        const dia = String(d.getDate()).padStart(2, '0');
        const mes = String(d.getMonth() + 1).padStart(2, '0');
        const anio = d.getFullYear();
        const hora = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${dia}/${mes}/${anio} ${hora}:${min}`;
    }
});

function goMainSolicitud() {
    const comp = document.querySelector('x-solicitar-producto-main');
    if (comp) comp.goMainSolicitud();
}
</script>
