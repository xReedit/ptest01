<dom-module id="x-solicitar-producto">
    
    <template>
        
        <link rel="stylesheet" href="../../../css/solicitud-producto.css">

        <paper-dialog modal id="dialog_sugerencias" class="dialog_redondo" 
            style="max-width: 500px; width: 90%;"
            entry-animation="scale-up-animation"
            exit-animation="fade-out-animation" with-backdrop>
            <div class="xContent">
                <h3>Productos con Stock Bajo</h3>
                <p class="text-secondary fs-13">Selecciona los productos que deseas agregar</p>
                <br>
                
                <div class="mb-3 text-center">
                    <span class$="tab-filtro [[_computeTabActivo(filtroTipo, 'todos')]]" on-click="cambiarFiltroTipo" data-tipo="todos">
                        Todos
                        <span class="badge">[[_contarPorTipo(listSugerencias, 'todos')]]</span>
                    </span>
                    <span class$="tab-filtro [[_computeTabActivo(filtroTipo, 'porcion')]]" on-click="cambiarFiltroTipo" data-tipo="porcion">
                        Porciones
                        <span class="badge">[[_contarPorTipo(listSugerencias, 'porcion')]]</span>
                    </span>
                    <span class$="tab-filtro [[_computeTabActivo(filtroTipo, 'producto')]]" on-click="cambiarFiltroTipo" data-tipo="producto">
                        Productos
                        <span class="badge">[[_contarPorTipo(listSugerencias, 'producto')]]</span>
                    </span>
                </div>
                
                <div class="mb-2 text-center">
                    <span class="mr-3">
                        <span class="semaforo-badge semaforo-rojo"></span>
                        <span class="fs-11">Crítico (<10)</span>
                    </span>
                    <span class="mr-3">
                        <span class="semaforo-badge semaforo-amarillo"></span>
                        <span class="fs-11">Bajo (10-30)</span>
                    </span>
                    <span>
                        <span class="semaforo-badge semaforo-verde"></span>
                        <span class="fs-11">Normal (>30)</span>
                    </span>
                </div>
                
                <div class="xLinea2"></div>
                <br>
                
                <div style="max-height: 400px; overflow-y: auto;">
                    <template is="dom-repeat" items="[[listSugerenciasFiltradas]]" as="item" index-as="idx">
                        <div class$="lista-item [[_computeSeleccionadoClass(item.seleccionado)]]" 
                            data-index$="[[idx]]"
                            on-tap="toggleSeleccionSugerencia">
                            <div class="check-icon">
                                <i class="fa fa-check"></i>
                            </div>
                            <div class="item">
                                <div style="flex: 1; padding-right: 30px;">
                                    <p class="fw-600 fs-13 mb-1">[[item.descripcion]]</p>
                                    <p class="fs-11 text-secondary mb-0">
                                        <span class="badge badge-secondary">[[item.tipo]]</span>
                                        <template is="dom-if" if="[[item.codigo_unico]]">
                                            <span class="ml-1">[[item.codigo_unico]]</span>
                                        </template>
                                    </p>
                                </div>
                                <div class="item-stock">
                                    <span class$="semaforo-badge semaforo-[[item.semaforo]]"></span>
                                    <div class="fw-600 fs-13">[[_formatearNumero(item.stock)]]</div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
                
                <br>
                <div class="d-flex" style="gap: 8px;">
                    <button class="btn btn-success" style="flex: 1;" on-click="agregarSeleccionados">
                        <i class="fa fa-check mr-1"></i>
                        Agregar Seleccionados
                    </button>
                    <button class="btn btn-secondary" dialog-dismiss>
                        <i class="fa fa-times"></i>
                        Cerrar
                    </button>
                </div>
                <br>
            </div>
        </paper-dialog>

        <div class="xMiCard2 xContentCard">
            <h3>Nueva Solicitud de Productos</h3>
            <p class="text-secondary fs-13">Selecciona los productos y porciones que necesitas solicitar</p>
            <br>

            <div class="d-flexx justify-content-between align-items-start">
                <div>
                    <label class="fw-600">Solicitar a:</label>
                    <select class="selected-template-1" id="sel_sede_destino" on-change="seleccionarSedeDestino">
                        <option value="">Seleccione una sede...</option>
                        <template is="dom-repeat" items="[[listSedes]]" as="sede">
                            <option value="[[sede.idsede]]">[[sede.descripcion]] - [[sede.ciudad]]</option>
                        </template>
                    </select>
                </div>  
                
                <div>
                    <div class="mb-3">
                        <button class="btn btn-info" on-click="abrirModalSugerencias" hidden$="[[!totalSugerencias]]">
                            <i class="fa fa-lightbulb-o mr-1"></i>
                            Productos con stock bajo ([[totalSugerencias]])
                        </button>
                    </div>
                </div>
            </div>

            <br>
            <div class="xLinea2"></div>
            <br>

            <div class="row">
                <div class="col-md-12">
                    

                    <label class="fw-600">Buscar Producto o Porción:</label>
                    <div class="autocomplete-container">
                        <input type="text" 
                            class="xMiInput" 
                            id="txt_buscar" 
                            placeholder="Escribe el nombre o código único..."
                            on-input="buscarProductos"
                            on-focus="mostrarAutocomplete">
                        
                        <div class="autocomplete-resultados" hidden$="[[!mostrarAutocomplete]]">
                            <template is="dom-if" if="[[!listResultadosBusqueda.length]]">
                                <div class="p-3 text-center text-secondary fs-12">
                                    <template is="dom-if" if="[[txtBusquedaVacio]]">
                                        Escribe para buscar productos o porciones
                                    </template>
                                    <template is="dom-if" if="[[!txtBusquedaVacio]]">
                                        No se encontraron resultados
                                    </template>
                                </div>
                            </template>
                            <template is="dom-repeat" items="[[listResultadosBusqueda]]" as="item">
                                <div class="autocomplete-item" on-click="agregarProductoBusqueda">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div style="flex: 1;">
                                            <div class="fw-600 fs-13">[[item.descripcion]]</div>
                                            <div class="fs-11 text-secondary mt-1">
                                                <span class$="badge-tipo badge-[[item.tipo]]">[[item.tipo]]</span>
                                                <template is="dom-if" if="[[item.codigo_unico]]">
                                                    <span class="ml-1">[[item.codigo_unico]]</span>
                                                </template>
                                            </div>
                                        </div>
                                        <div class="text-right">
                                            <span class$="semaforo-badge semaforo-[[item.semaforo]]"></span>
                                            <span class="fw-600">[[_formatearStock(item.stock)]]</span>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <br><br>
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="fw-600 fs-15">
                            <i class="fa fa-list mr-1"></i>Lista de Solicitud
                        </span>
                        <span class="badge badge-primary">[[listaSolicitud.length]] items</span>
                    </div>
                    <div class="xLinea2 mb-3"></div>

                    <template is="dom-if" if="[[!listaSolicitud.length]]">
                        <div class="text-center p-4 text-secondary">
                            <i class="fa fa-shopping-cart" style="font-size: 48px; opacity: 0.3;"></i>
                            <p class="mt-2 mb-0">No hay productos en la solicitud</p>
                            <p class="fs-12 text-secondary">Busca y agrega productos o porciones</p>
                        </div>
                    </template>

                    <template is="dom-if" if="[[listaSolicitud.length]]">
                        <table class="xTabla w-100">
                            <thead>
                                <tr>
                                    <th width="5%">#</th>
                                    <th width="10%">Tipo</th>                                    
                                    <th width="35%">Descripción</th>
                                    <th width="10%">Stock</th>
                                    <th width="15%">Cantidad</th>
                                    <th width="10%">Acción</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template is="dom-repeat" items="[[listaSolicitud]]" as="item" index-as="idx">
                                    <tr>
                                        <td class="text-center">[[_calcularNumero(idx)]]</td>
                                        <td>
                                            <span class$="badge-tipo badge-[[item.tipo]]">[[item.tipo]]</span>
                                        </td>                                        
                                        <td>
                                            <span class="fw-600">[[item.descripcion]]</span>
                                            <template is="dom-if" if="[[item.codigo_unico]]">
                                                <span class="fs-12 ml-1 text-secondary">[[item.codigo_unico]]</span>
                                            </template>
                                        </td>
                                        <td>
                                            <span class$="semaforo-badge semaforo-[[item.semaforo]]"></span>
                                            <span class="fw-600">[[_formatearStock(item.stock)]]</span>
                                        </td>
                                        <td>
                                            <input type="number" 
                                                class="cantidad-input" 
                                                value="[[item.cantidad]]"
                                                min="0.01"
                                                step="0.01"
                                                data-index="[[idx]]"
                                                on-change="actualizarCantidad">
                                        </td>
                                        <td class="text-center">
                                            <button class="btn btn-sm btn-danger" 
                                                data-index="[[idx]]"
                                                on-click="eliminarProductoSolicitud">
                                                <i class="fa fa-trash"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </template>

                    <template is="dom-if" if="[[listaSolicitud.length]]">
                        <br>
                        <div class="d-flex" style="gap: 8px;">
                            <button class="btn btn-success" style="flex: 1;" on-click="enviarSolicitud">
                                <i class="fa fa-paper-plane mr-1"></i>
                                Enviar Solicitud
                            </button>
                            <button class="btn btn-secondary" on-click="limpiarSolicitud">
                                <i class="fa fa-trash mr-1"></i>
                                Limpiar
                            </button>
                        </div>
                    </template>

                </div>

            </div>

        </div>

    </template>
</dom-module>

<script>
Polymer({
    is: 'x-solicitar-producto',
    properties: {
        listSugerencias: {
            type: Array,
            value: function() { return []; }
        },
        listSedes: {
            type: Array,
            value: function() { return []; }
        },
        listaSolicitud: {
            type: Array,
            value: function() { return []; }
        },
        listResultadosBusqueda: {
            type: Array,
            value: function() { return []; }
        },
        mostrarResultadosBusqueda: {
            type: Boolean,
            value: false
        },
        mostrarAutocomplete: {
            type: Boolean,
            value: false
        },
        txtBusquedaVacio: {
            type: Boolean,
            value: true
        },
        sedeDestinoSeleccionada: {
            type: String,
            value: ''
        },
        timeoutBusqueda: {
            type: Object,
            value: null
        },
        totalSugerencias: {
            type: Number,
            computed: 'calcularTotalSugerencias(listSugerencias.*)'
        },
        sugerenciasSeleccionadas: {
            type: Array,
            value: function() { return []; }
        },
        filtroTipo: {
            type: String,
            value: 'todos'
        },
        listSugerenciasFiltradas: {
            type: Array,
            value: function() { return []; }
        }
    },
    
    attached: function() {
        this.inicializar();
    },
    
    inicializar: async function() {
        await this.cargarSugerencias();
        await this.cargarSedes();
        this.set('listaSolicitud', []);
        this.set('sedeDestinoSeleccionada', '');
        
        this.async(function() {
            const txtNota = this.$$('#txt_nota');
            const selSede = this.$$('#sel_sede_destino');
            if (txtNota) txtNota.value = '';
            if (selSede) selSede.value = '';
        }, 100);
    },
    
    cargarSugerencias: async function() {
        try {
            const _httpFecht = new httpFecht();
            const rpt = await _httpFecht.postJson('../../bdphp/log_011.php?op=1', {});
            const datos = (rpt.datos || []).map(item => {
                item.seleccionado = false;
                return item;
            });
            this.set('listSugerencias', datos);
            this.actualizarListaFiltrada();
        } catch (error) {
            console.error('Error al cargar sugerencias:', error);
        }
    },
    
    cargarSedes: async function() {
        try {
            const _httpFecht = new httpFecht();
            const rpt = await _httpFecht.postJson('../../bdphp/log_011.php?op=2', {});
            this.set('listSedes', rpt.datos || []);
        } catch (error) {
            console.error('Error al cargar sedes:', error);
        }
    },
    
    seleccionarSedeDestino: function(e) {
        this.set('sedeDestinoSeleccionada', e.target.value);
    },
    
    agregarProductoSugerencia: function(e) {
        const item = e.model.item;
        this.agregarALista(item);
    },
    
    agregarProductoBusqueda: function(e) {
        const item = e.model.item;
        this.agregarALista(item);
        
        const txtBuscar = this.$$('#txt_buscar');
        if (txtBuscar) txtBuscar.value = '';
        this.set('mostrarAutocomplete', false);
        this.set('listResultadosBusqueda', []);
        this.set('txtBusquedaVacio', true);
    },
    
    abrirModalSugerencias: function() {
        this.set('filtroTipo', 'todos');
        this.actualizarListaFiltrada();
        this.$.dialog_sugerencias.open();
    },
    
    toggleSeleccionSugerencia: function(e) {
        e.preventDefault();
        e.stopPropagation();
        
        const index = parseInt(e.currentTarget.getAttribute('data-index'));
        const item = this.listSugerenciasFiltradas[index];
        
        if (!item) return;
        
        const indexOriginal = this.listSugerencias.findIndex(s => {
            if (item.tipo === 'porcion') {
                return s.tipo === 'porcion' && s.idporcion_codigo_unico === item.idporcion_codigo_unico;
            } else {
                return s.tipo === 'producto' && s.id === item.id;
            }
        });
        
        if (indexOriginal === -1) return;
        
        const estaSeleccionado = this.listSugerencias[indexOriginal].seleccionado || false;
        const nuevoEstado = !estaSeleccionado;
        
        this.set('listSugerencias.' + indexOriginal + '.seleccionado', nuevoEstado);
        this.set('listSugerenciasFiltradas.' + index + '.seleccionado', nuevoEstado);
        
        if (nuevoEstado) {
            const itemCopia = Object.assign({}, item);
            itemCopia.seleccionado = nuevoEstado;
            this.push('sugerenciasSeleccionadas', itemCopia);
        } else {
            const idx = this.sugerenciasSeleccionadas.findIndex(s => {
                if (item.tipo === 'porcion') {
                    return s.tipo === 'porcion' && s.idporcion_codigo_unico === item.idporcion_codigo_unico;
                } else {
                    return s.tipo === 'producto' && s.id === item.id;
                }
            });
            if (idx !== -1) {
                this.splice('sugerenciasSeleccionadas', idx, 1);
            }
        }
    },
    
    _computeSeleccionadoClass: function(seleccionado) {
        return seleccionado ? 'seleccionado' : '';
    },
    
    _formatearNumero: function(numero) {
        if (numero == null || numero === '') return '0';
        const num = parseFloat(numero);
        if (isNaN(num)) return '0';
        return num % 1 === 0 ? num.toString() : num.toFixed(2);
    },
    
    cambiarFiltroTipo: function(e) {
        const tipo = e.currentTarget.dataset.tipo;
        this.set('filtroTipo', tipo);
        this.actualizarListaFiltrada();
    },
    
    actualizarListaFiltrada: function() {
        if (!this.listSugerencias || !this.listSugerencias.length) {
            this.set('listSugerenciasFiltradas', []);
            return;
        }
        
        let listaFiltrada = this.listSugerencias.filter(item => {
            const yaEnSolicitud = this.listaSolicitud && this.listaSolicitud.some(p => {
                if (item.tipo === 'porcion') {
                    return p.tipo === 'porcion' && p.idporcion_codigo_unico === item.idporcion_codigo_unico;
                } else {
                    return p.tipo === 'producto' && p.id === item.id;
                }
            });
            return !yaEnSolicitud;
        });
        
        if (this.filtroTipo !== 'todos') {
            listaFiltrada = listaFiltrada.filter(item => item.tipo === this.filtroTipo);
        }
        
        this.set('listSugerenciasFiltradas', listaFiltrada);
    },
    
    _computeTabActivo: function(filtroActual, tipoTab) {
        return filtroActual === tipoTab ? 'activo' : '';
    },
    
    
    _contarPorTipo: function(lista, tipo) {
        if (!this.listSugerenciasFiltradas) return 0;
        if (tipo === 'todos') return this.listSugerenciasFiltradas.length;
        return this.listSugerenciasFiltradas.filter(item => item.tipo === tipo).length;
    },
    
    agregarSeleccionados: function() {
        if (this.sugerenciasSeleccionadas.length === 0) {
            showToastSwal('warning', 'Selecciona al menos un producto');
            return;
        }
        
        let agregados = 0;
        this.sugerenciasSeleccionadas.forEach(item => {
            const yaExiste = this.listaSolicitud.some(p => {
                if (item.tipo === 'porcion') {
                    return p.tipo === 'porcion' && p.idporcion_codigo_unico === item.idporcion_codigo_unico;
                } else {
                    return p.tipo === 'producto' && p.id === item.id;
                }
            });
            
            if (!yaExiste) {
                this.agregarALista(item);
                agregados++;
            }
        });
        
        this.set('sugerenciasSeleccionadas', []);
        
        this.listSugerencias.forEach((item, idx) => {
            this.set('listSugerencias.' + idx + '.seleccionado', false);
        });
        
        this.$.dialog_sugerencias.close();
        
        if (agregados > 0) {
            showToastSwal('success', agregados + ' producto(s) agregado(s)');
        } else {
            showToastSwal('info', 'Los productos ya estaban en la lista');
        }
    },
    
    mostrarAutocomplete: function() {
        this.set('mostrarAutocomplete', true);
    },
    
    calcularTotalSugerencias: function() {
        return this.listSugerencias ? this.listSugerencias.length : 0;
    },
    
    agregarALista: function(item) {
        const yaExiste = this.listaSolicitud.some(p => {
            if (item.tipo === 'porcion') {
                return p.tipo === 'porcion' && p.idporcion_codigo_unico === item.idporcion_codigo_unico;
            } else {
                return p.tipo === 'producto' && p.id === item.id;
            }
        });
        
        if (yaExiste) {
            showToastSwal('warning', 'Este producto ya está en la lista');
            return;
        }
        
        this.actualizarListaFiltrada();
        
        const nuevoItem = {
            tipo: item.tipo,
            id: item.id,
            idporcion_codigo_unico: item.idporcion_codigo_unico || null,
            idporcion: item.tipo === 'porcion' ? item.id : null,
            idproducto: item.tipo === 'producto' ? item.id : null,
            descripcion: item.descripcion,
            stock: item.stock,
            unidad: item.unidad_medida || '',
            codigo_unico: item.codigo_unico || null,
            semaforo: item.semaforo || 'verde',
            cantidad: 1
        };
        
        this.push('listaSolicitud', nuevoItem);
        showToastSwal('success', 'Producto agregado');
    },
    
    actualizarCantidad: function(e) {
        const index = parseInt(e.target.dataset.index);
        const cantidad = parseFloat(e.target.value) || 1;
        
        if (cantidad <= 0) {
            e.target.value = 1;
            return;
        }
        
        this.set('listaSolicitud.' + index + '.cantidad', cantidad);
    },
    
    eliminarProductoSolicitud: function(e) {
        const index = parseInt(e.currentTarget.dataset.index);
        this.splice('listaSolicitud', index, 1);
        showToastSwal('info', 'Producto eliminado');
    },
    
    limpiarSolicitud: function() {
        const self = this;
        Swal.fire({
            title: '¿Estás seguro?',
            text: "Se limpiará toda la lista de solicitud",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#3085d6',
            cancelButtonColor: '#d33',
            confirmButtonText: 'Sí, limpiar',
            cancelButtonText: 'Cancelar'
        }).then((result) => {
            if (result.isConfirmed) {
                self.set('listaSolicitud', []);
                showToastSwal('info', 'Lista limpiada');
            }
        });
    },
    
    enviarSolicitud: async function() {
        if (!this.sedeDestinoSeleccionada) {
            showToastSwal('warning', 'Selecciona una sede destino');
            return;
        }
        
        if (!this.listaSolicitud.length) {
            showToastSwal('warning', 'Agrega al menos un producto a la solicitud');
            return;
        }
        
        const txtNota = this.$$('#txt_nota');
        const nota = txtNota ? txtNota.value.trim() : '';
        
        const detalle = this.listaSolicitud.map(item => ({
            tipo: item.tipo,
            idporcion: item.idporcion,
            idporcion_codigo_unico: item.idporcion_codigo_unico,
            idproducto: item.idproducto,
            descripcion: item.descripcion,
            cantidad: item.cantidad,
            stock: item.stock,
            unidad: item.unidad
        }));
        
        const data = {
            idsede_destino: this.sedeDestinoSeleccionada,
            nota: nota,
            detalle: detalle
        };
        
        xPopupLoad.xopen();
        
        try {
            const _httpFecht = new httpFecht();
            const rpt = await _httpFecht.postJson('../../bdphp/log_011.php?op=3', data);
            
            if (rpt.success) {
                showToastSwal('success', 'Solicitud enviada correctamente');
                
                this.set('listaSolicitud', []);
                this.set('sedeDestinoSeleccionada', '');
                
                const selSede = this.$$('#sel_sede_destino');
                const txtNotaFinal = this.$$('#txt_nota');
                if (selSede) selSede.value = '';
                if (txtNotaFinal) txtNotaFinal.value = '';
                
                setTimeout(() => {
                    goMainSolicitud();
                }, 1000);
            } else {
                showToastSwal('error', rpt.message || 'Error al enviar solicitud');
            }
        } catch (error) {
            console.error('Error al enviar solicitud:', error);
            showToastSwal('error', 'Error al enviar solicitud');
        }
        
        xPopupLoad.xclose();
    },
    
    _calcularNumero: function(idx) {
        return idx + 1;
    },
    
    _formatearStock: function(stock) {
        if (stock == null || stock === '') return '0';
        const num = parseFloat(stock);
        if (isNaN(num)) return '0';
        return num % 1 === 0 ? num.toString() : num.toFixed(2);
    },
    
    buscarProductos: function(e) {
        const busqueda = e.target.value.trim();
        
        if (this.timeoutBusqueda) {
            clearTimeout(this.timeoutBusqueda);
        }
        
        this.set('txtBusquedaVacio', busqueda.length === 0);
        
        if (busqueda.length < 2) {
            this.set('listResultadosBusqueda', []);
            this.set('mostrarAutocomplete', true);
            return;
        }
        
        const self = this;
        this.timeoutBusqueda = setTimeout(async () => {
            try {
                const _httpFecht = new httpFecht();
                const rpt = await _httpFecht.postJson('../../bdphp/log_011.php?op=10', {
                    busqueda: busqueda
                });
                
                self.set('listResultadosBusqueda', rpt.datos || []);
                self.set('mostrarAutocomplete', true);
            } catch (error) {
                console.error('Error al buscar productos:', error);
            }
        }, 300);
    }
});

document.addEventListener('click', function(e) {
    const comp = document.querySelector('x-solicitar-producto');
    if (comp && comp.mostrarAutocomplete) {
        const autocomplete = comp.$$('.autocomplete-container');
        if (autocomplete && !autocomplete.contains(e.target)) {
            comp.set('mostrarAutocomplete', false);
        }
    }
});
</script>
