<dom-module id="x-porcion-detalle">    
    <template>

        <script type="text/javascript" src="../../../js/mi.sweet.alert.js"></script>
        <script src="../../../js/porcion.utils.js"></script>
        <link rel="import" href="x-porcion-codigo-unico.html">

        <x-porcion-codigo-unico id="comp_codigo_unico" idporcion="{{objporcion.idporcion}}" porcion-nombre="{{objporcion.porcion}}" codigo-sugerido="{{codigoSugerido}}" on-codigo-generado="onCodigoGenerado" on-codigo-vinculado="onCodigoVinculado" on-codigo-modificado="onCodigoModificado"></x-porcion-codigo-unico>

        <paper-dialog modal id="dialog_modificar_descripcion_porcion" class="dialog_redondo" modal entry-animation="scale-up-animation"

            <div class="xContent">
                <h4>Modificar Descripcion</h4>

        <div>
            <!-- head -->
            <div class="d-flexx justify-content-between align-items-start">
                <div class="d-flexx">
                    <div class="mr-5">

                        </p>

                        <div class="mt-2 xCursor">
                            <table>
                                <tr onclick="dialog_modificar_stock_porcion.open()">
                                    <td align="left" class="pl-0">STOCK ACTUAL</td>
                                    <td><p class="fs-15 fw-600 pl-2 pr-2">{{objporcion.stock}}</p></td>

                                <template is="dom-if" if="[[conversionActiva]]">
                                    <tr onclick="dialog_modificar_stock_porcion.open()">

                                </template>
                                <tr onclick="verRecetasEnlazadas()">

                                </tr>
                                <tr onclick="abrirDialogCodigoUnico()">
                                    <td align="left" class="pl-0">CÓDIGO ÚNICO</td>
                                    <td>
                                        <template is="dom-if" if="[[codigoUnico]]">
                                            <p class="fs-13 fw-600 pl-2 pr-2 text-success">[[codigoUnico]]</p>
                                        </template>
                                        <template is="dom-if" if="[[!codigoUnico]]">

                <div class="text-right d-flexx">

                </p>
            </div>
            
            <!-- historial -->
            <div>
                <br><br>
                <div class="d-flexx justify-content-between align-items-end">
                    <div>

                    </div>
                    <div class="d-flexx align-items-center">

                        </div>
                        <div class="mr-2">
                            <select class="selected-template-1"value="{{historialFiltroTipo::change}}">
                                <option value="">TODOS</option>
                                <option value="VENTA">VENTA</option>
                                <option value="VENTA DEVOLUCION">VENTA DEVOLUCION</option>
                                <option value="AUMENTA">AUMENTA</option>
                                <option value="DISMINUYE">DISMINUYE</option>
                                <option value="RECUPERACIÓN">RECUPERACIÓN</option>
                            </select>
                        </div>
                        <button class="btn btn-sm btn-secondary" onclick="limpiarFiltrosHistorial()">Limpiar</button>
                    </div>
                </div>
                <hr>
                <div class="d-flexx" style="gap: 10px; flex-wrap: wrap;">
                    <div class="xBoton_flat_2" style="padding: 8px 10px; border-radius: 8px;">

                    <div class="xBoton_flat_2" style="padding: 8px 10px; border-radius: 8px;">

                    </div>
                    <div class="xBoton_flat_2" style="padding: 8px 10px; border-radius: 8px;">
                        <p class="fs-11 text-secondary m-0">Cant. devuelta</p>
                        <p class="fs-15 fw-600 m-0">{{historialTotalDevoluciones}}</p>
                    </div>
                    <div class="xBoton_flat_2" style="padding: 8px 10px; border-radius: 8px;">
                        <p class="fs-11 text-secondary m-0">Neto (ventas + devol.)</p>
                        <p class="fs-15 fw-600 m-0">{{historialNeto}}</p>
                    </div>
                    <div class="xBoton_flat_2" style="padding: 8px 10px; border-radius: 8px;">
                        <p class="fs-11 text-secondary m-0">Último movimiento</p>
                        <p class="fs-12 fw-600 m-0">{{historialUltimo}}</p>
                    </div>

                <br>
                <table class="w-100">
                    <thead>
                        <th style="position: sticky; top: 0; background: #fff; z-index: 1;">Fecha</th>
                        <th style="position: sticky; top: 0; background: #fff; z-index: 1;">Hora</th>
                        <th style="position: sticky; top: 0; background: #fff; z-index: 1;">Usuario</th>
                        <th style="position: sticky; top: 0; background: #fff; z-index: 1;">Movimiento</th>
                        <th class="text-right" style="position: sticky; top: 0; background: #fff; z-index: 1;">Cantidad</th>
                        <th class="text-right" style="position: sticky; top: 0; background: #fff; z-index: 1;">Stock Total</th>
                    </thead>
                    <tbody>
                        <template is="dom-repeat" items="{{listPorcionHistorialView}}" as="item">
                            <template is="dom-if" if="[[item.isGroup]]">
                                <tr style="background: #f8fafc;">
                                    <td colspan="6" style="padding: 10px 8px; border-top: 1px solid #e5e7eb; border-bottom: 1px solid #e5e7eb;">
                                        <div class="d-flexx justify-content-between align-items-center">
                                            <div class="d-flexx align-items-center" style="gap: 10px;">
                                                <button class="btn btn-sm btn-secondary" data-fecha$="[[item.fecha]]" onclick="toggleGrupoHistorial(this.getAttribute('data-fecha'))">[[item.icono]]</button>
                                                <div>
                                                    <p class="m-0 fw-600">[[item.fecha]]</p>
                                                    <div class="d-flexx" style="gap: 6px; flex-wrap: wrap; margin-top: 4px;">
                                                        <span style="display:inline-block; padding:2px 8px; border-radius: 10px; background:#eef2ff;" class="fs-11">Inicio: [[item.stockInicio]]</span>
                                                        <span style="display:inline-block; padding:2px 8px; border-radius: 10px; background:#ecfeff;" class="fs-11 text-primary">Aumenta +[[item.aumenta]]</span>
                                                        <span style="display:inline-block; padding:2px 8px; border-radius: 10px; background:#fef2f2;" class="fs-11 text-danger">Venta -[[item.disminuye]]</span>
                                                        <span style="display:inline-block; padding:2px 8px; border-radius: 10px; background:#f3f4f6;" class="fs-11">Fin: [[item.stockFinal]]</span>
                                                        <span style="display:inline-block; padding:2px 8px; border-radius: 10px; background:#f0fdf4;" class="fs-11 text-success">Cant. Ventas: [[item.ventas]]</span>
                                                        <span style="display:inline-block; padding:2px 8px; border-radius: 10px; background:#fff7ed;" class="fs-11 text-warning">Cant. Devol.: [[item.devoluciones]]</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="fs-12 text-secondary">[[item.total]] movimientos</div>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                            <template is="dom-if" if="[[!item.isGroup]]">
                                <tr>
                                    <td>{{item.fecha}}</td>
                                    <td>{{item.hora}}</td>
                                    <td>{{item.nombres}}</td>
                                    <td class$="[[ item.classMovimiento ]]">
                                        <span style="display: inline-block; padding: 2px 8px; border-radius: 10px; background: #f3f4f6;" class$="[[ item.classMovimiento ]]">{{item.tipo_movimiento}}</span>
                                    </td>
                                    <td class$="fw-600 text-right [[ item.classCantidad ]]" style="font-variant-numeric: tabular-nums;">{{item.cantidad}}</td>
                                    <td class="fw-600 text-right" style="font-variant-numeric: tabular-nums;">{{item.stock_total}}</td>
                                </tr>

</dom-module>
<script>

var xthisPorcionDetalle;
let _difStockPorcion = 0
let _msjModificarStock = ''
let _stockNowPorcion = 0; 
let cantidadRecetasEnlazadasPorcion = 0

    async function xLoadDataPorcionDetalle() {
        
        xthisPorcionDetalle.btnPorcionPe = xm_log_get('app3_us').per.indexOf('e6')>-1;
        xPopupLoad.xopen();
        const _data = {
            idporcion: xthisPorcionDetalle.objporcion.idporcion
        }
        const _httpFecht = new httpFecht();
        const rpt = await _httpFecht.postJson('../../bdphp/log_009.php?op=101', _data)        
        if (rpt.success) {     
            
            cocinarArrayHistorial(rpt.datos);
            // console.log('rpt', rpt.datos);
            // xthisPorcionDetalle.listPorcionHistorial = rpt.datos;
            // xthisPorcionDetalle.listPorcionHistorial.map(x => {
            //     x.classMovimiento = x.tipo_movimiento == 'Venta' ? 'fw-600 text-success' : x.tipo_movimiento == 'Aumenta' ? 'fw-600 text-primary' : x.tipo_movimiento == 'Recuperación' ? 'fw-600 text-warning' : 'fw-600 text-danger';
            //     x.tipo_movimiento = x.tipo_movimiento.toUpperCase();
            //     return x;
            // })
        }
        // console.log('rpt', xthisPorcionDetalle.listPorcionHistorial);
        xPopupLoad.xclose();

        // recetas enlazadas
        const rptCantidadReceta = await _httpFecht.postJson('../../bdphp/log_009.php?op=11601', _data)
        if (rptCantidadReceta.success) {
            cantidadRecetasEnlazadasPorcion = rptCantidadReceta.datos.length;
            console.log('cantidadRecetasEnlazadasPorcion', cantidadRecetasEnlazadasPorcion);
            xthisPorcionDetalle.listRecetasEnlazadas = rptCantidadReceta.datos;
        }
        
        // cargar conversión de unidades si existe
        await cargarConversionActiva();
        
        // cargar código único si existe
        await cargarCodigoUnico();
    
    }

     function cocinarArrayHistorial(elArray) {
        console.log('elArray', elArray);    
            // Aplicar formato a todos los registros
            const datosFormateados = elArray.map(item => {
                // Determinar el signo según el tipo de movimiento
                let signo = '';
                if (item.tipo_movimiento === 'Venta' || item.tipo_movimiento === 'Disminuye') {
                    signo = '-';
                } else if (item.tipo_movimiento === 'Aumenta' || item.tipo_movimiento === 'Recuperación') {
                    signo = '+';
                }
                
                return {
                    ...item,
                    // Guardar la cantidad original sin signo
                    cantidadOriginal: item.cantidad,
                    // Agregar el signo a la cantidad
                    cantidad: signo + item.cantidad,
                    classCantidad: (signo === '-') ? 'text-danger' : (signo === '+') ? 'text-primary' : '',
                    classMovimiento: item.tipo_movimiento === 'Venta' ? 'fw-600 text-success' :
                        item.tipo_movimiento === 'Aumenta' ? 'fw-600 text-primary' :
                            item.tipo_movimiento === 'Recuperación' ? 'fw-600 text-warning' :
                                'fw-600 text-danger',
                    tipo_movimiento: item.tipo_movimiento.toUpperCase()
                };
            });

            xthisPorcionDetalle.listPorcionHistorial = datosFormateados;
            calcularResumenHistorial(datosFormateados);
            aplicarFiltrosHistorial();
        }

    function calcularResumenHistorial(list) {
        const totalMov = (list || []).length;
        let totalVentaCant = 0;
        let totalDevolCant = 0;
        let netoVentaDevol = 0;

        (list || []).forEach(x => {
            const tipo = (x.tipo_movimiento || '').toUpperCase();
            const n = parseFloat((x.cantidad || '0').toString().replace(',', '.'));
            if (!isNaN(n)) {
                if (tipo === 'VENTA') {
                    totalVentaCant += Math.abs(n);
                    netoVentaDevol += n;
                }
                if (tipo === 'VENTA DEVOLUCION') {
                    totalDevolCant += Math.abs(n);
                    netoVentaDevol += n;
                }
            }
        });

        const ultimo = (list && list.length > 0) ? list[0] : null;

        xthisPorcionDetalle.historialTotalMov = totalMov;
        xthisPorcionDetalle.historialTotalVentas = (isNaN(totalVentaCant) ? '0' : totalVentaCant.toString());
        xthisPorcionDetalle.historialTotalDevoluciones = (isNaN(totalDevolCant) ? '0' : totalDevolCant.toString());
        xthisPorcionDetalle.historialNeto = (isNaN(netoVentaDevol) ? '0' : netoVentaDevol.toString());
        xthisPorcionDetalle.historialUltimo = ultimo ? `${ultimo.fecha} ${ultimo.hora} - ${ultimo.nombres} - ${ultimo.tipo_movimiento}` : '';
        const totalFiltrado = (xthisPorcionDetalle.listPorcionHistorialFiltered || []).length;
        xthisPorcionDetalle.historialResumenTexto = totalMov ? `Mostrando ${totalFiltrado} de ${totalMov}` : '';
    }

    function aplicarFiltrosHistorial() {
        if (!xthisPorcionDetalle) return;

        const src = xthisPorcionDetalle.listPorcionHistorial || [];
        const txt = ((xthisPorcionDetalle.historialFiltroTexto || '') + '').trim().toUpperCase();
        const tipo = ((xthisPorcionDetalle.historialFiltroTipo || '') + '').trim().toUpperCase();

        let out = src;
        if (tipo) {
            out = out.filter(x => ((x.tipo_movimiento || '') + '').toUpperCase() === tipo);
        }
        if (txt) {
            out = out.filter(x => {
                const u = ((x.nombres || '') + '').toUpperCase();
                const t = ((x.tipo_movimiento || '') + '').toUpperCase();
                const f = ((x.fecha || '') + '').toUpperCase();
                const h = ((x.hora || '') + '').toUpperCase();
                return (u.indexOf(txt) > -1) || (t.indexOf(txt) > -1) || (f.indexOf(txt) > -1) || (h.indexOf(txt) > -1);
            });
        }

        xthisPorcionDetalle.listPorcionHistorialFiltered = out;
        cocinarVistaAgrupadaHistorial();
        xthisPorcionDetalle.historialResumenTexto = (src.length ? `Mostrando ${out.length} de ${src.length}` : '');
    }

    function cocinarVistaAgrupadaHistorial() {
        if (!xthisPorcionDetalle) return;
        const list = xthisPorcionDetalle.listPorcionHistorialFiltered || [];

        if (!xthisPorcionDetalle.historialCollapsed) {
            xthisPorcionDetalle.historialCollapsed = {};
        }

        const grouped = [];
        const byFecha = {};

        list.forEach(x => {
            const f = x.fecha || '';
            if (!byFecha[f]) byFecha[f] = [];
            byFecha[f].push(x);
        });

        const fechas = Object.keys(byFecha);
        fechas.sort((a, b) => (a < b ? 1 : a > b ? -1 : 0));

        fechas.forEach(fecha => {
            const items = byFecha[fecha] || [];
            const colapsado = !!xthisPorcionDetalle.historialCollapsed[fecha];

            let ventas = 0;
            let devoluciones = 0;
            let neto = 0;
            let aumenta = 0;
            let disminuye = 0;

            items.forEach(it => {
                const tipo = ((it.tipo_movimiento || '') + '').toUpperCase();
                if (tipo === 'VENTA') ventas += 1;
                if (tipo === 'VENTA DEVOLUCION') devoluciones += 1;
                const n = parseFloat((it.cantidad || '0').toString().replace(',', '.'));
                if (!isNaN(n)) {
                    neto += n;
                    if (tipo === 'AUMENTA' || tipo === 'RECUPERACIÓN') {
                        if (n > 0) aumenta += n;
                    }
                    if (tipo === 'VENTA' || tipo === 'DISMINUYE') {
                        if (n < 0) disminuye += Math.abs(n);
                    }
                }
            });

            const newest = items[0] || null;
            const oldest = items.length ? items[items.length - 1] : null;
            const newestStock = newest ? parseFloat((newest.stock_total || '0').toString().replace(',', '.')) : NaN;
            const oldestStockAfter = oldest ? parseFloat((oldest.stock_total || '0').toString().replace(',', '.')) : NaN;
            const oldestQty = oldest ? parseFloat((oldest.cantidad || '0').toString().replace(',', '.')) : NaN;

            const stockFinal = isNaN(newestStock) ? '' : newestStock.toString();
            const stockInicio = (!isNaN(oldestStockAfter) && !isNaN(oldestQty)) ? (oldestStockAfter - oldestQty).toString() : '';

            const icono = colapsado ? '+' : '-';
            const aumentaTxt = (isNaN(aumenta) ? '0' : aumenta.toString());
            const disminuyeTxt = (isNaN(disminuye) ? '0' : disminuye.toString());

            grouped.push({
                isGroup: true,
                fecha,
                total: items.length,
                stockInicio,
                stockFinal,
                aumenta: aumentaTxt,
                disminuye: disminuyeTxt,
                ventas,
                devoluciones,
                icono,
            });

            if (!colapsado) {
                items.forEach(it => grouped.push({ ...it, isGroup: false }));
            }
        });

        xthisPorcionDetalle.listPorcionHistorialView = grouped;
    }

    function toggleGrupoHistorial(fecha) {
        if (!xthisPorcionDetalle) return;
        if (!xthisPorcionDetalle.historialCollapsed) {
            xthisPorcionDetalle.historialCollapsed = {};
        }
        xthisPorcionDetalle.historialCollapsed[fecha] = !xthisPorcionDetalle.historialCollapsed[fecha];
        cocinarVistaAgrupadaHistorial();
    }

    function limpiarFiltrosHistorial() {
        if (!xthisPorcionDetalle) return;
        xthisPorcionDetalle.historialFiltroTexto = '';
        xthisPorcionDetalle.historialFiltroTipo = '';
        aplicarFiltrosHistorial();
    }

    function toggleUnidadStock() {
        const select = document.getElementById('select_unidad_stock');
        const stockDisplay = document.getElementById('stock_actual_display');
        const inputStock = document.getElementById('stock_new');
        
        if (!select || !stockDisplay || !xthisPorcionDetalle) return;
        
        const unidad = select.value;
        const stockBase = parseFloat(xthisPorcionDetalle.objporcion.stock) || 0;
        
        if (unidad === 'alternativa' && xthisPorcionDetalle.conversionActiva) {
            const factor = parseFloat(xthisPorcionDetalle.conversionActiva.factor_conversion) || 1;
            const stockConv = (stockBase / factor).toFixed(2);
            stockDisplay.textContent = stockConv;
        } else {
            stockDisplay.textContent = stockBase;
        }
        
        // Limpiar input
        if (inputStock) inputStock.value = '';
        xthisPorcionDetalle.msjStock = '';
        xthisPorcionDetalle.classMsjStock = '';
    }

    function changeStockPorcion(value) {
        const _stockActualPorcion = parseFloat(xthisPorcionDetalle.objporcion.stock);
        let valorIngresado = parseFloat(value);
        
        // Verificar si está usando unidad alternativa
        const select = document.getElementById('select_unidad_stock');
        const usandoUnidadAlternativa = select && select.value === 'alternativa';
        
        // Si usa unidad alternativa, convertir a unidad base
        if (usandoUnidadAlternativa && xthisPorcionDetalle.conversionActiva) {
            const factor = parseFloat(xthisPorcionDetalle.conversionActiva.factor_conversion) || 1;
            _stockNowPorcion = valorIngresado * factor;
        } else {
            _stockNowPorcion = valorIngresado;
        }

        if (isNaN(_stockNowPorcion)) {
            _msjModificarStock = '';
            xthisPorcionDetalle.classMsjStock = '';
        } else {
            if (_stockNowPorcion > _stockActualPorcion) {
                _difStockPorcion = _stockNowPorcion - _stockActualPorcion;
                const unidadTexto = usandoUnidadAlternativa && xthisPorcionDetalle.conversionActiva 
                    ? ` (${valorIngresado} ${xthisPorcionDetalle.conversionActiva.nombre_unidad_alternativa} = ${_difStockPorcion.toFixed(2)} ${xthisPorcionDetalle.objporcion.porcion})`
                    : '';
                _msjModificarStock = 'Aumenta Stock en: ' + _difStockPorcion.toFixed(2) + unidadTexto;
                xthisPorcionDetalle.classMsjStock = 'fw-600 text-primary';
            } else {
                _difStockPorcion = _stockActualPorcion - _stockNowPorcion;
                const unidadTexto = usandoUnidadAlternativa && xthisPorcionDetalle.conversionActiva 
                    ? ` (${valorIngresado} ${xthisPorcionDetalle.conversionActiva.nombre_unidad_alternativa} = ${_stockNowPorcion.toFixed(2)} ${xthisPorcionDetalle.objporcion.porcion})`
                    : '';
                _msjModificarStock = 'Disminuye Stock en: ' + _difStockPorcion.toFixed(2) + unidadTexto;
                xthisPorcionDetalle.classMsjStock = 'fw-600 text-danger';
            }
        }

        this.stock_total = _stockNowPorcion;
        xthisPorcionDetalle.msjStock = _msjModificarStock;
    }

    async function saveStockModifyPorcion() {
        xPopupLoad.xopen();
        if ( _difStockPorcion === 0 ) {return; }
        const _data = {
            idporcion: xthisPorcionDetalle.objporcion.idporcion,
            movimiento:  _msjModificarStock.split(' ')[0],
            cantidad: _difStockPorcion,
            stock_actual: _stockNowPorcion,
            stock_total: this.stock_total  
        }

        // console.log('_data', _data);

        const _httpFecht = new httpFecht();
        const rpt = await _httpFecht.postJson('../../bdphp/log_009.php?op=10', _data)
        if ( rpt.success ) {
            dialog_modificar_stock_porcion.close();
            xthisPorcionDetalle.objporcion.stock = _stockNowPorcion;
            xthisPorcionDetalle.objporcion = JSON.parse(JSON.stringify(xthisPorcionDetalle.objporcion))
            xLoadDataPorcionDetalle();
        }        
        xPopupLoad.xclose();
    }

    function xModificarDescripcionPorcionDetalle() { 
        txt_descripcion_porcion.value = xthisPorcionDetalle.objporcion.porcion;

    }

    async function xSaveModificacionDescripcionPorcion() {

            }
            const _httpFecht = new httpFecht();

            if (rpt.success) {
                dialog_modificar_descripcion_porcion.close();

    async function xEliminarPorcionDetalle() {
        const _swalAlertValues = paramsSwalAlert;
        const _cantRelacionado  = cantidadRecetasEnlazadasPorcion > 0 ? `<span class="text-warning"> Tenga en cuenta que afectara a ${cantidadRecetasEnlazadasPorcion} recetas enlazadas.</span>` : ''

        // Actualizar el código único cuando se genera uno nuevo
        if (e.detail && e.detail.codigo) {
            this.codigoUnico = e.detail.codigo;
        }
    },
    onCodigoVinculado: function(e) {
        // Actualizar el código único cuando se vincula con uno existente
        if (e.detail && e.detail.codigo) {
            this.codigoUnico = e.detail.codigo;
        }
    },
    onCodigoModificado: function(e) {
        // Actualizar el código único cuando se modifica
        if (e.detail && e.detail.codigo) {
            this.codigoUnico = e.detail.codigo;
            this.codigoSugerido = ''; // Limpiar el código sugerido
        }

// FUNCIONES PARA CONVERSIÓN DE UNIDADES
function toggleConfigConversion() {
    const div = document.getElementById('config_conversion');
    if (div.style.display === 'none') {
        div.style.display = 'block';
    } else {
        div.style.display = 'none';
    }
}

async function cargarConversionActiva() {
    if (!xthisPorcionDetalle || !xthisPorcionDetalle.objporcion) return;
    
    const _httpFecht = new httpFecht();
    const data = { idporcion: xthisPorcionDetalle.objporcion.idporcion };
    const rpt = await _httpFecht.postJson('../../bdphp/log_009.php?op=124', data);
    
    if (rpt.success && rpt.datos && rpt.datos.length > 0) {
        const conv = rpt.datos[0];
        xthisPorcionDetalle.conversionActiva = conv;
        xthisPorcionDetalle.stockConvertido = calcularStockConvertido(conv.stock, conv.factor_conversion);
        xthisPorcionDetalle.nombreUnidadAlternativa = conv.nombre_unidad_alternativa;
        xthisPorcionDetalle.factorConversion = parseFloat(conv.factor_conversion);
    } else {
        xthisPorcionDetalle.conversionActiva = null;
        xthisPorcionDetalle.stockConvertido = '';
        xthisPorcionDetalle.nombreUnidadAlternativa = '';
        xthisPorcionDetalle.factorConversion = null;
    }
}

function calcularStockConvertidoLocal() {
    if (!xthisPorcionDetalle || !xthisPorcionDetalle.conversionActiva) return;
    
    const stock = parseFloat(xthisPorcionDetalle.objporcion.stock) || 0;
    const factor = parseFloat(xthisPorcionDetalle.conversionActiva.factor_conversion) || 1;
    xthisPorcionDetalle.stockConvertido = calcularStockConvertido(stock, factor);
}

async function guardarConversion() {
    if (!xthisPorcionDetalle) return;
    
    const nombre = (xthisPorcionDetalle.nombreUnidadAlternativa || '').trim();
    const factor = parseFloat(xthisPorcionDetalle.factorConversion);
    
    if (!nombre) {
        showToastSwal('error', 'Debe ingresar el nombre de la unidad alternativa');
        return;
    }
    
    if (!factor || factor <= 0) {
        showToastSwal('error', 'El factor de conversión debe ser mayor a 0');
        return;
    }
    
    xPopupLoad.xopen();
    const _httpFecht = new httpFecht();
    const data = {
        idporcion: xthisPorcionDetalle.objporcion.idporcion,
        nombre_unidad_alternativa: nombre.toUpperCase(),
        factor_conversion: factor
    };
    
    const rpt = await _httpFecht.postJson('../../bdphp/log_009.php?op=122', data);
    xPopupLoad.xclose();
    
    if (rpt.success) {
        showToastSwal('success', 'Conversión guardada correctamente');
        await cargarConversionActiva();
        toggleConfigConversion();
    } else {
        const errorMsg = rpt.error || rpt.details || 'Error al guardar la conversión';
        showToastSwal('error', errorMsg);
        console.error('Error completo:', rpt);
    }
}

async function eliminarConversion() {
    if (!xthisPorcionDetalle || !xthisPorcionDetalle.conversionActiva) return;
    
    const _swalAlertValues = paramsSwalAlert;
    _swalAlertValues.title = '¿Eliminar conversión?';
    _swalAlertValues.text = '¿Está seguro de eliminar esta conversión de unidades?';
    _swalAlertValues.icon = 'warning';
    _swalAlertValues.showCancelButton = true;
    const result = await showAlertSwalHtmlDecision(_swalAlertValues, 1);
    if (!result.isConfirmed) return;
    
    xPopupLoad.xopen();
    const _httpFecht = new httpFecht();
    const data = {
        idporcion_unidad_conversion: xthisPorcionDetalle.conversionActiva.idporcion_unidad_conversion
    };
    
    const rpt = await _httpFecht.postJson('../../bdphp/log_009.php?op=123', data);
    xPopupLoad.xclose();
    
    if (rpt.success) {
        showToastSwal('success', 'Conversión eliminada correctamente');
        xthisPorcionDetalle.conversionActiva = null;
        xthisPorcionDetalle.stockConvertido = '';
        xthisPorcionDetalle.nombreUnidadAlternativa = '';
        xthisPorcionDetalle.factorConversion = null;
        toggleConfigConversion();
    } else {
        showToastSwal('error', 'Error al eliminar la conversión');
    }
}

// FUNCIONES PARA CÓDIGO ÚNICO
function abrirDialogCodigoUnico() {
    const comp = document.getElementById('comp_codigo_unico');
    if (comp) comp.open();
}

async function cargarCodigoUnico() {
    if (!xthisPorcionDetalle || !xthisPorcionDetalle.objporcion) return;
    
    const _httpFecht = new httpFecht();
    const data = { idporcion: xthisPorcionDetalle.objporcion.idporcion };
    const rpt = await _httpFecht.postJson('../../bdphp/log_009.php?op=126', data);
    
    if (rpt.success && rpt.datos && rpt.datos.length > 0) {
        xthisPorcionDetalle.codigoUnico = rpt.datos[0].codigo;
    } else {
        xthisPorcionDetalle.codigoUnico = '';
    }
}
