<dom-module id="x-porcion-codigo-unico">
    <script src="../../../js/porcion.utils.js"></script>
    <script src="../../../js/sedes.cache.js"></script>
    <template>
        <style>
            .codigo-display {
                background: #f0f9ff;
                padding: 15px;
                border-radius: 8px;
                border: 2px dashed #3b82f6;
                text-align: center;
            }
            .codigo-text {
                font-size: 20px;
                font-weight: 600;
                color: #059669;
                letter-spacing: 1px;
                font-family: monospace;
            }
            .info-box {
                background: #fef3c7;
                padding: 12px;
                border-radius: 6px;
                border-left: 4px solid #f59e0b;
            }
            /* Asegurar que el autocomplete aparezca por encima del dialog modal */
            .ui-autocomplete {
                z-index: 9999 !important;
                max-height: 300px;
                overflow-y: auto;
                overflow-x: hidden;
            }
        </style>

        <paper-dialog modal id="dialog_codigo_unico" class="dialog_redondo" 
            entry-animation="scale-up-animation" style="max-width: 550px;" 
            exit-animation="fade-out-animation" with-backdrop>
            <div class="xContent">
                <h3><i class="fa fa-qrcode mr-2"></i>Código Único de Porción</h3>
                <p class="fs-12 text-secondary">{{porcionNombre}}</p>
                <div class="xLinea2"></div>
                <br>

                <!-- Si tiene código -->
                <template is="dom-if" if="[[codigoUnico]]">
                    <div id="vista_codigo_guardado">
                        <div class="codigo-display mb-3">
                            <p class="fs-12 text-secondary m-0 mb-2">Código actual:</p>
                            <p class="codigo-text m-0">[[codigoUnico]]</p>
                        </div>
                        
                        <div class="d-flexx justify-content-center mb-3" style="gap: 10px;">
                            <button class="btn btn-sm btn-info" onclick="copiarCodigo()">
                                <i class="fa fa-copy mr-1"></i> Copiar Código
                            </button>
                            <button class="btn btn-sm btn-warning" onclick="habilitarModificacion()">
                                <i class="fa fa-edit mr-1"></i> Modificar
                            </button>
                            <button class="btn btn-sm btn-secondary" onclick="verPorcionesVinculadas()">
                                <i class="fa fa-link mr-1"></i> Ver Vinculadas
                            </button>
                        </div>

                        <div class="info-box">
                            <p class="fs-11 m-0">
                                <i class="fa fa-info-circle mr-1"></i>
                                Este código permite vincular esta porción con porciones equivalentes en otros locales de tu organización.
                            </p>
                        </div>
                    </div>

                    <div id="vista_modificar_codigo" style="display: none;">
                        <div class="mb-3">
                            <p class="fs-14 fw-600 mb-2">Modificar código:</p>
                            <div class="d-flexx" style="gap: 10px;">
                                <input type="text" id="input_codigo_modificar" class="xMiInput" 
                                    placeholder="Ingrese nuevo código" 
                                    value="{{codigoModificar::input}}" style="flex: 1;">
                                <button class="btn btn-sm btn-success" onclick="guardarCodigoModificado()">
                                    <i class="fa fa-check mr-1"></i> Guardar
                                </button>
                                <button class="btn btn-sm btn-secondary" onclick="cancelarModificacion()">
                                    <i class="fa fa-times mr-1"></i> Cancelar
                                </button>
                            </div>
                            <p class="fs-11 text-secondary mt-2 mb-0">
                                <i class="fa fa-exclamation-triangle mr-1"></i>
                                <strong>Importante:</strong> Al modificar el código, se actualizará para todas las porciones vinculadas.
                            </p>
                        </div>
                    </div>
                </template>

                <!-- Si NO tiene código -->
                <template is="dom-if" if="[[!codigoUnico]]">
                    <div class="mb-3">
                        <p class="fs-14 fw-600 mb-2">Código sugerido:</p>
                        <div class="d-flexx" style="gap: 10px;">
                            <input type="text" id="input_codigo_sugerido" class="xMiInput" 
                                placeholder="Generando..." 
                                value="{{codigoSugerido::input}}" style="flex: 1;">
                            <button class="btn btn-sm btn-success" onclick="guardarCodigoSugerido()">
                                <i class="fa fa-check mr-1"></i> Aceptar
                            </button>
                        </div>
                        <p class="fs-11 text-secondary mt-2 mb-0">
                            <i class="fa fa-info-circle mr-1"></i>
                            Puedes modificar el código antes de guardarlo.
                        </p>
                    </div>

                    <!-- Solo mostrar opción de vincular si hay múltiples sedes -->
                    <template is="dom-if" if="[[tieneMultiplesSedes]]">
                        <div class="text-center mb-3">
                            <p class="fs-12 text-secondary">o</p>
                            <button class="btn btn-sm btn-info" onclick="mostrarPanelVincular()">
                                <i class="fa fa-link mr-1"></i> Vincular con Código Existente
                            </button>
                        </div>

                        <!-- Panel de vinculación -->
                        <div id="panel_vincular" style="display: none; margin-top: 20px; padding-top: 20px; border-top: 2px solid #e5e7eb;">
                        <p class="fs-14 fw-600 mb-2">Vincular con código existente:</p>
                        <div class="mb-2">
                            <label class="fs-12 text-secondary">Buscar por código o nombre de porción</label>
                            <input type="text" 
                                id="input_buscar_codigo" 
                                class="xMiInput" 
                                placeholder="Escribe para buscar..."
                                style="width: 100%;">
                        </div>
                        <div class="d-flexx" style="gap: 10px;">
                            <button class="btn btn-sm btn-primary" onclick="vincularCodigoSeleccionado()">
                                <i class="fa fa-link mr-1"></i> Vincular
                            </button>
                            <button class="btn btn-sm btn-secondary" onclick="ocultarPanelVincular()">
                                Cancelar
                            </button>
                        </div>
                            <p class="fs-11 text-secondary mt-2 mb-0">
                                <i class="fa fa-lightbulb-o mr-1"></i>
                                Busca el código por su valor o por el nombre de la porción.
                            </p>
                        </div>
                    </template>

                    <div class="info-box mt-3">
                        <p class="fs-11 m-0">
                            <i class="fa fa-info-circle mr-1"></i>
                            <strong>¿Para qué sirve?</strong> El código único te permite sincronizar porciones equivalentes entre diferentes locales de tu organización.
                        </p>
                    </div>
                </template>

                <br>
                <button class="btn btn-sm btn-secondary" dialog-dismiss>Cerrar</button>
                <br>
            </div>
        </paper-dialog>
    </template>

    <script>
        let xthisCodigoUnico;

        Polymer({
            is: 'x-porcion-codigo-unico',
            properties: {
                idporcion: {
                    type: Number,
                    notify: true
                },
                porcionNombre: {
                    type: String,
                    value: ''
                },
                codigoUnico: {
                    type: String,
                    value: ''
                },
                codigoSugerido: {
                    type: String,
                    value: ''
                },
                codigoModificar: {
                    type: String,
                    value: ''
                },
                codigoVincular: {
                    type: String,
                    value: ''
                },
                sugerenciasCodigos: {
                    type: Array,
                    value: function() { return []; }
                },
                tieneMultiplesSedes: {
                    type: Boolean,
                    value: false
                }
            },
            attached: function() {
                xthisCodigoUnico = this;
            },
            open: function() {
                dialog_codigo_unico.open();
                cargarCodigo();
                verificarMultiplesSedes();
                
                // Generar código sugerido si no tiene código guardado 
                if (!this.codigoUnico) { 
                    this.generarCodigoSugerido();
                }
            },
            generarCodigoSugerido: async function() {
                if (!this.porcionNombre) return;
                
                try {
                    // Obtener el siguiente número secuencial
                    const _httpFecht = new httpFecht();
                    const rpt = await _httpFecht.postJson('../../bdphp/log_009.php?op=132', {});
                    
                    if (rpt.success && rpt.siguiente_numero) {
                        // Generar código usando las iniciales del nombre + número secuencial
                        const codigo = generarCodigoUnicoPorcion(this.porcionNombre, rpt.siguiente_numero);
                        this.codigoSugerido = codigo;
                    } else {
                        showToastSwal('error', 'Error al generar código sugerido');
                    }
                } catch (error) {
                    console.error('Error al generar código:', error);
                    showToastSwal('error', 'Error al generar código sugerido');
                }
            }
        });

        async function verificarMultiplesSedes() {
            if (!xthisCodigoUnico) return;
            
            try {
                // Usar cache centralizado
                xthisCodigoUnico.tieneMultiplesSedes = await SedesCache.tieneMultiplesSedes();
            } catch (error) {
                console.error('Error al verificar múltiples sedes:', error);
                xthisCodigoUnico.tieneMultiplesSedes = false;
            }
        }

        async function cargarCodigo() {
            if (!xthisCodigoUnico || !xthisCodigoUnico.idporcion) return;
            
            const _httpFecht = new httpFecht();
            const data = { idporcion: xthisCodigoUnico.idporcion };
            const rpt = await _httpFecht.postJson('../../bdphp/log_009.php?op=126', data);
            
            if (rpt.success && rpt.datos && rpt.datos.length > 0) {
                xthisCodigoUnico.codigoUnico = rpt.datos[0].codigo;
            } else {
                xthisCodigoUnico.codigoUnico = '';
            }
        }

        async function guardarCodigoSugerido() {
            if (!xthisCodigoUnico) return;
            
            const codigo = (xthisCodigoUnico.codigoSugerido || '').trim();
            
            if (!codigo) {
                showToastSwal('error', 'El código no puede estar vacío');
                return;
            }
            
            xPopupLoad.xopen();
            const _httpFecht = new httpFecht();
            const data = { 
                idporcion: xthisCodigoUnico.idporcion,
                codigo: codigo
            };
            
            const rpt = await _httpFecht.postJson('../../bdphp/log_009.php?op=127', data);
            xPopupLoad.xclose();
            
            if (rpt.success) {
                showToastSwal('success', 'Código guardado correctamente');
                xthisCodigoUnico.codigoUnico = codigo;
                xthisCodigoUnico.codigoSugerido = '';
                
                // Notificar al componente padre
                xthisCodigoUnico.fire('codigo-generado', { codigo: codigo });
            } else {
                showToastSwal('error', rpt.message || 'Error al guardar el código');
            }
        }

        async function vincularCodigoSeleccionado() {
            if (!xthisCodigoUnico) return;
            
            const codigo = (xthisCodigoUnico.codigoVincular || '').trim();
            
            if (!codigo) {
                showToastSwal('error', 'Debe seleccionar un código del autocomplete');
                return;
            }
            
            xPopupLoad.xopen();
            const _httpFecht = new httpFecht();
            const data = {
                idporcion: xthisCodigoUnico.idporcion,
                codigo: codigo
            };
            
            const rpt = await _httpFecht.postJson('../../bdphp/log_009.php?op=127', data);
            xPopupLoad.xclose();
            
            if (rpt.success) {
                showToastSwal('success', 'Porción vinculada correctamente');
                xthisCodigoUnico.codigoUnico = codigo;
                xthisCodigoUnico.codigoVincular = '';
                
                // Limpiar el input
                $('#input_buscar_codigo').val('');
                
                ocultarPanelVincular();
                
                // Notificar al componente padre
                xthisCodigoUnico.fire('codigo-vinculado', { codigo: codigo });
            } else {
                showToastSwal('error', rpt.message || 'Error al vincular el código');
            }
        }

        function copiarCodigo() {
            if (!xthisCodigoUnico || !xthisCodigoUnico.codigoUnico) return;
            
            const codigo = xthisCodigoUnico.codigoUnico;
            const temp = document.createElement('textarea');
            temp.value = codigo;
            temp.style.position = 'fixed';
            temp.style.opacity = '0';
            document.body.appendChild(temp);
            temp.select();
            
            try {
                document.execCommand('copy');
                showToastSwal('success', 'Código copiado');
            } catch (err) {
                showToastSwal('error', 'Error al copiar');
            }
            
            document.body.removeChild(temp);
        }

        async function verPorcionesVinculadas() {
            if (!xthisCodigoUnico || !xthisCodigoUnico.codigoUnico) return;
            
            xPopupLoad.xopen();
            const _httpFecht = new httpFecht();
            const data = { codigo: xthisCodigoUnico.codigoUnico };
            const rpt = await _httpFecht.postJson('../../bdphp/log_009.php?op=129', data);
            xPopupLoad.xclose();
            
            if (rpt.success && rpt.datos && rpt.datos.length > 0) {
                let html = '<div class="pb-2"><table class="fs-12 w-100">';
                html += '<thead><tr><th align="left">Local</th><th align="left">Porción</th><th align="left">Familia</th></tr></thead>';
                html += '<tbody>';
                
                rpt.datos.forEach(item => {
                    html += `<tr>
                        <td align="left">${item.nombre_sede}</td>
                        <td align="left">${item.descripcion}</td>
                        <td align="left">${item.familia}</td>
                    </tr>`;
                });
                
                html += '</tbody></table></div>';
                
                const _swalAlertValues = paramsSwalAlert;
                _swalAlertValues.title = '<p class="fw-600 fs-20">Porciones Vinculadas</p>';
                _swalAlertValues.html = html;
                _swalAlertValues.showCancelButton = false;
                showAlertSwalHtmlDecision(_swalAlertValues, 1);
            } else {
                showToastSwal('info', 'No hay otras porciones vinculadas');
            }
        }

        function mostrarPanelVincular() {
            const panel = document.getElementById('panel_vincular');
            if (panel) panel.style.display = 'block';
            
            // Centrar el diálogo
            dialog_codigo_unico.center();
            
            // Buscar sugerencia automática basada en la descripción de la porción
            buscarSugerenciaAutomatica();
            
            // Inicializar jQuery autocomplete después de que el panel sea visible
            setTimeout(function() {
                inicializarAutocomplete();
            }, 100);
        }
        
        async function buscarSugerenciaAutomatica() {
            if (!xthisCodigoUnico || !xthisCodigoUnico.porcionNombre) return;
            
            const _httpFecht = new httpFecht();
            const data = { termino: xthisCodigoUnico.porcionNombre };
            
            try {
                const rpt = await _httpFecht.postJson('../../bdphp/log_009.php?op=131', data);
                
                if (rpt.success && rpt.datos && rpt.datos.length > 0) {
                    // Buscar coincidencia exacta con el nombre de la porción
                    const coincidenciaExacta = rpt.datos.find(function(item) {
                        return item.porcion_nombre.toLowerCase() === xthisCodigoUnico.porcionNombre.toLowerCase();
                    });
                    
                    if (coincidenciaExacta) {
                        // Sugerir automáticamente este código
                        const input = $('#input_buscar_codigo');
                        const sugerencia = coincidenciaExacta.codigo + ' - ' + coincidenciaExacta.porcion_nombre + ' (' + coincidenciaExacta.total_vinculadas + ' vinculadas)';
                        input.val(sugerencia);
                        xthisCodigoUnico.codigoVincular = coincidenciaExacta.codigo;
                        
                        // Mostrar mensaje informativo
                        showToastSwal('info', 'Se encontró una porción con el mismo nombre. Código sugerido: ' + coincidenciaExacta.codigo);
                    }
                }
            } catch (error) {
                console.error('Error al buscar sugerencia automática:', error);
            }
        }
        
        function inicializarAutocomplete() {
            const input = $('#input_buscar_codigo');
            
            if (input.length === 0) {
                console.error('Input #input_buscar_codigo no encontrado');
                return;
            }
            
            // Destruir autocomplete anterior si existe
            if (input.autocomplete('instance')) {
                input.autocomplete('destroy');
            }
            
            input.autocomplete({
                autoFocus: true,
                minLength: 1,
                appendTo: $('#dialog_codigo_unico'),
                source: function(request, response) {
                    const _httpFecht = new httpFecht();
                    const data = { termino: request.term };
                    
                    _httpFecht.postJson('../../bdphp/log_009.php?op=131', data)
                        .then(function(rpt) {
                            if (rpt.success && rpt.datos) {
                                const sugerencias = rpt.datos.map(function(item) {
                                    return {
                                        label: item.codigo + ' - ' + item.porcion_nombre + ' (' + item.total_vinculadas + ' vinculadas)',
                                        value: item.codigo,
                                        codigo: item.codigo,
                                        porcion_nombre: item.porcion_nombre,
                                        total_vinculadas: item.total_vinculadas
                                    };
                                });
                                response(sugerencias);
                            } else {
                                response([]);
                            }
                        })
                        .catch(function(error) {
                            console.error('Error en búsqueda:', error);
                            response([]);
                        });
                },
                select: function(event, ui) {
                    if (xthisCodigoUnico) {
                        xthisCodigoUnico.codigoVincular = ui.item.codigo;
                    }
                    input.val(ui.item.label);
                    return false;
                },
                focus: function(event, ui) {
                    return false;
                },
                change: function(event, ui) {
                    if (ui.item === null) {
                        input.val('');
                        if (xthisCodigoUnico) {
                            xthisCodigoUnico.codigoVincular = '';
                        }
                    }
                    return false;
                }
            });
        }

        function ocultarPanelVincular() {
            const panel = document.getElementById('panel_vincular');
            if (panel) panel.style.display = 'none';
            
            // Limpiar el input
            const input = $('#input_buscar_codigo');
            input.val('');
            
            if (xthisCodigoUnico) xthisCodigoUnico.codigoVincular = '';
        }

        function habilitarModificacion() {
            if (!xthisCodigoUnico) return;
            
            // Copiar el código actual al input de modificación
            xthisCodigoUnico.codigoModificar = xthisCodigoUnico.codigoUnico;
            
            // Ocultar vista de código guardado y mostrar vista de modificación
            const vistaGuardado = document.getElementById('vista_codigo_guardado');
            const vistaModificar = document.getElementById('vista_modificar_codigo');
            
            if (vistaGuardado) vistaGuardado.style.display = 'none';
            if (vistaModificar) vistaModificar.style.display = 'block';
        }

        function cancelarModificacion() {
            if (!xthisCodigoUnico) return;
            
            // Limpiar el input de modificación
            xthisCodigoUnico.codigoModificar = '';
            
            // Mostrar vista de código guardado y ocultar vista de modificación
            const vistaGuardado = document.getElementById('vista_codigo_guardado');
            const vistaModificar = document.getElementById('vista_modificar_codigo');
            
            if (vistaGuardado) vistaGuardado.style.display = 'block';
            if (vistaModificar) vistaModificar.style.display = 'none';
        }

        async function guardarCodigoModificado() {
            if (!xthisCodigoUnico) return;
            
            const codigoNuevo = (xthisCodigoUnico.codigoModificar || '').trim();
            
            if (!codigoNuevo) {
                showToastSwal('error', 'El código no puede estar vacío');
                return;
            }
            
            if (codigoNuevo === xthisCodigoUnico.codigoUnico) {
                showToastSwal('info', 'El código no ha cambiado');
                cancelarModificacion();
                return;
            }
            
            xPopupLoad.xopen();
            const _httpFecht = new httpFecht();
            const data = {
                idporcion: xthisCodigoUnico.idporcion,
                codigo_anterior: xthisCodigoUnico.codigoUnico,
                codigo_nuevo: codigoNuevo
            };
            
            const rpt = await _httpFecht.postJson('../../bdphp/log_009.php?op=130', data);
            xPopupLoad.xclose();
            
            if (rpt.success) {
                showToastSwal('success', 'Código modificado correctamente');
                xthisCodigoUnico.codigoUnico = codigoNuevo;
                xthisCodigoUnico.codigoModificar = '';
                cancelarModificacion();
                
                // Notificar al componente padre
                xthisCodigoUnico.fire('codigo-modificado', { codigo: codigoNuevo });
            } else {
                showToastSwal('error', rpt.message || 'Error al modificar el código');
            }
        }
    </script>
</dom-module>
