                <div class="xLinea2"></div><br>
                <div class="d-flexx justify-content-between">
                    <div style="max-width: 90px;">
                        <p class="fs-12 text-secondary m-0">Stock Actual</p>
                        <p class="fs-15 fw-600"> {{objporcion.stock}} </p>
                        <!-- <input type="number" placeholder="Ingrese nuevo stock" class="xMiInput xPasarEnter2" value={{objporcion.stock}} readonly> -->                        
                    </div>
                    <div class="w-50">
                        <p class="fs-15 text-dark m-0 fw-600">Cual es el nuevo Stock?</p>
                        <input type="number" id="stock_new" placeholder="Ingrese nuevo stock" class="xMiInput xPasarEnter2" onchange="changeStockPorcion(this.value)" onkeyup="changeStockPorcion(this.value)">
                        
                    </div> 
                </div>  
                <br>
                <p class$="{{classMsjStock}}">{{ msjStock }}</p>

                <button class="btn btn-sm btn-primary" onclick="saveStockModifyPorcion();">Listo, guardar</button>

            </div>
        </paper-dialog>

        <paper-dialog modal id="dialog_modificar_descripcion_porcion" class="dialog_redondo" modal entry-animation="scale-up-animation"
            style="min-width: 350px;" exit-animation="fade-out-animation" with-backdrop>
            <div class="xContent">
                <h4>Modificar Descripcion</h4>
                <br>                
                <input type="text" id="txt_descripcion_porcion" placeholder="Descripcion" class="xMiInput"
                    onChange="conMayusculas(this)" espaciar><br>
                <br><br>
                <div class="xBoton2 xAzul" onclick="xSaveModificacionDescripcionPorcion();">Listo, guardar</div>
                <div class="xBoton2 xPlomo" dialog-dismiss>Cancelar</div>
                <br>
            </div>
        </paper-dialog>



        <div>
            <!-- head -->
            <div class="d-flexx justify-content-between align-items-center">
                <div class="d-flexx">
                    <div class="mr-5">
                        <p class="fs-12 text-secondary m-0">Descripcion</p>
                        <p class="fs-18 fw-600"> {{objporcion.porcion}} 
                            <i class="fa fa-pencil ml-1 text-primary xCursor" onclick="xModificarDescripcionPorcionDetalle()"></i>
                        </p>
                    </div>
                    <div class="text-center mr-5">
                        <p class="fs-12 fw-600 text-secondary m-0">Stock Actual</p>
                        <!-- <p class="fs-18 fw-600 xCursor" onclick="dialog_modificar_stock_porcion.open()"> {{objporcion.stock}} </p> -->
                        <button class="btn btn-sm btn-xsm xBoton_flat_2 fs-20 fw-600 pl-2 pr-2"
                            onclick="dialog_modificar_stock_porcion.open()">{{objporcion.stock}}</button>
                    </div>
                    <div class="text-center">
                        <p class="fs-12 fw-600 text-secondary m-0">Recetas enlazadas</p>
                        <button class="btn btn-sm btn-xsm xBoton_flat_2 fs-20 fw-600 pl-2 pr-2" onclick="verRecetasEnlazadas()">{{listRecetasEnlazadas.length}}</button>
                        <!-- <p class="fs-18 fw-600 xCursor" onclick="verRecetasEnlazadas()"> {{listRecetasEnlazadas.length}} </p> -->
                    </div>
                </div>
                <div class="text-right d-flexx">
                    <button class="btn btn-sm btn-primary ml-1" onclick="dialog_modificar_stock_porcion.open()">Modificar Stock</button>                                        
                    <button hidden$=[[!btnPorcionPe]] class="btn btn-sm btn-danger ml-1" onclick="xEliminarPorcionDetalle()"><i class="fa fa-trash mr-1"></i> Eliminar</button>
                </div>
            </div>
            <!-- historial -->
            <div>
                <br><br>
                <p class="fs-18 text-secondary">Historial de cambios</p>
                <hr>
                <table class="w-100">
                    <thead>
                        <th>Fecha</th>
                        <th>Hora</th>
                        <th>Usuario</th>
                        <th>Movimiento</th>
                        <th class="text-center">Cantidad</th>
                        <th class="text-center">Stock Total</th>
                    </thead>
                    <tbody>
                        <template is="dom-repeat" items="{{listPorcionHistorial}}" as="item">
                            <tr>
                                <td>{{item.fecha}}</td>
                                <td>{{item.hora}}</td>
                                <td>{{item.nombres}}</td>
                                <td class$="[[ item.classMovimiento ]]">
                                    {{item.tipo_movimiento}}
                                </td>
                                <td class="fw-600 text-center">{{item.cantidad}}</td>
                                <td class="fw-600 text-center">{{item.stock_total}}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </template>
</dom-module>
<script>

var xthisPorcionDetalle;
let _difStockPorcion = 0
let _msjModificarStock = ''
let _stockNowPorcion = 0; 
let cantidadRecetasEnlazadasPorcion = 0

    async function xLoadDataPorcionDetalle() {
        
        xthisPorcionDetalle.btnPorcionPe = xm_log_get('app3_us').per.indexOf('e6')>-1;
        xPopupLoad.xopen();
        const _data = {
            idporcion: xthisPorcionDetalle.objporcion.idporcion
        }
        const _httpFecht = new httpFecht();
        const rpt = await _httpFecht.postJson('../../bdphp/log_009.php?op=101', _data)        
        if (rpt.success) {     
            
            cocinarArrayHistorial(rpt.datos);
            // console.log('rpt', rpt.datos);
            // xthisPorcionDetalle.listPorcionHistorial = rpt.datos;
            // xthisPorcionDetalle.listPorcionHistorial.map(x => {
            //     x.classMovimiento = x.tipo_movimiento == 'Venta' ? 'fw-600 text-success' : x.tipo_movimiento == 'Aumenta' ? 'fw-600 text-primary' : x.tipo_movimiento == 'Recuperación' ? 'fw-600 text-warning' : 'fw-600 text-danger';
            //     x.tipo_movimiento = x.tipo_movimiento.toUpperCase();
            //     return x;
            // })
        }
        // console.log('rpt', xthisPorcionDetalle.listPorcionHistorial);
        xPopupLoad.xclose();

        // recetas enlazadas
        const rptCantidadReceta = await _httpFecht.postJson('../../bdphp/log_009.php?op=11601', _data)
        if (rptCantidadReceta.success) {
            cantidadRecetasEnlazadasPorcion = rptCantidadReceta.datos.length;
            console.log('cantidadRecetasEnlazadasPorcion', cantidadRecetasEnlazadasPorcion);
            xthisPorcionDetalle.listRecetasEnlazadas = rptCantidadReceta.datos;
        }
    
    }

     function cocinarArrayHistorial(elArray) {
        console.log('elArray', elArray);    
            // Aplicar formato a todos los registros
            const datosFormateados = elArray.map(item => {
                // Determinar el signo según el tipo de movimiento
                let signo = '';
                if (item.tipo_movimiento === 'Venta' || item.tipo_movimiento === 'Disminuye') {
                    signo = '-';
                } else if (item.tipo_movimiento === 'Aumenta' || item.tipo_movimiento === 'Recuperación') {
                    signo = '+';
                }
                
                return {
                    ...item,
                    // Guardar la cantidad original sin signo
                    cantidadOriginal: item.cantidad,
                    // Agregar el signo a la cantidad
                    cantidad: signo + item.cantidad,
                    classMovimiento: item.tipo_movimiento === 'Venta' ? 'fw-600 text-success' :
                        item.tipo_movimiento === 'Aumenta' ? 'fw-600 text-primary' :
                            item.tipo_movimiento === 'Recuperación' ? 'fw-600 text-warning' :
                                'fw-600 text-danger',
                    tipo_movimiento: item.tipo_movimiento.toUpperCase()
                };
            });

            // Agrupar ventas por fecha, usuario y tipo de movimiento
            const resultado = [];
            let ventasConsecutivas = [];
            let ultimoTipoMovimiento = null;
            let ultimoUsuario = null;
            let ultimaFecha = null;

            // Recorremos los datos ordenados
            datosFormateados.forEach((item, index) => {
                if (item.tipo_movimiento === 'VENTA') {
                    // Si el último movimiento también fue una venta, es el mismo usuario y la misma fecha, agrupamos
                    if (ultimoTipoMovimiento === 'VENTA' && 
                        ultimoUsuario === item.nombres && 
                        ultimaFecha === item.fecha) {
                        ventasConsecutivas.push(item);
                    } else {
                        // Si veníamos agrupando ventas, procesamos el grupo anterior
                        if (ventasConsecutivas.length > 0) {
                            procesarGrupoVentas();
                        }
                        
                        // Iniciamos un nuevo grupo con este item
                        ventasConsecutivas = [item];
                        ultimoTipoMovimiento = 'VENTA';
                        ultimoUsuario = item.nombres;
                        ultimaFecha = item.fecha;
                    }
                } else {
                    // Si veníamos agrupando ventas, procesamos el grupo
                    if (ventasConsecutivas.length > 0) {
                        procesarGrupoVentas();
                    }
                    
                    // Agregamos el movimiento no-venta
                    resultado.push(item);
                    ultimoTipoMovimiento = item.tipo_movimiento;
                    ultimoUsuario = item.nombres;
                    ultimaFecha = item.fecha;
                }
                
                // Si es el último elemento y hay ventas pendientes de procesar
                if (index === datosFormateados.length - 1 && ventasConsecutivas.length > 0) {
                    procesarGrupoVentas();
                }
            });
            
            // Función para procesar un grupo de ventas consecutivas
            function procesarGrupoVentas() {
                if (ventasConsecutivas.length === 1) {
                    // Si solo hay una venta, la agregamos directamente
                    resultado.push(ventasConsecutivas[0]);
                } else {
                    // Si hay múltiples ventas, las agrupamos
                    const primerVenta = ventasConsecutivas[0];
                    // Aseguramos que todas las ventas sean del mismo usuario y fecha
                    const usuario = primerVenta.nombres;
                    const fecha = primerVenta.fecha;
                    let cantidadTotal = 0;
                    
                    // Sumamos todas las cantidades
                    ventasConsecutivas.forEach(venta => {
                        cantidadTotal += parseFloat(venta.cantidad);
                    });
                    
                    // Creamos un registro agrupado
                    const ventaAgrupada = {
                        ...primerVenta,
                        cantidad: cantidadTotal.toString(),
                        hora: ventasConsecutivas.length + " VENTAS",
                        descripcion: "VENTA AGRUPADA"
                    };
                    
                    resultado.push(ventaAgrupada);
                }
                
                // Reiniciamos el grupo
                ventasConsecutivas = [];
            }
            
            xthisPorcionDetalle.listPorcionHistorial = resultado;
        }

    function changeStockPorcion(value) {
               
        const _stockActualPorcion = parseFloat(xthisPorcionDetalle.objporcion.stock)  
        _stockNowPorcion = parseFloat(value)  

        if ( isNaN(_stockNowPorcion)) {
            _msjModificarStock = '';
            xthisPorcionDetalle.classMsjStock = '';
        }
        else {
            if (_stockNowPorcion > _stockActualPorcion) {
                _difStockPorcion = _stockNowPorcion - _stockActualPorcion;
                _msjModificarStock = 'Aumenta Stock en: ' + _difStockPorcion;
                xthisPorcionDetalle.classMsjStock = 'fw-600 text-primary'
            } else {
                _difStockPorcion = _stockActualPorcion - _stockNowPorcion;
                _msjModificarStock = 'Disminuye Stock en: ' + _difStockPorcion;
                xthisPorcionDetalle.classMsjStock = 'fw-600 text-danger'
            }
        }


        this.stock_total = _stockNowPorcion;

        xthisPorcionDetalle.msjStock = _msjModificarStock
    }

    async function saveStockModifyPorcion() {
        xPopupLoad.xopen();
        if ( _difStockPorcion === 0 ) {return; }
        const _data = {
            idporcion: xthisPorcionDetalle.objporcion.idporcion,
            movimiento:  _msjModificarStock.split(' ')[0],
            cantidad: _difStockPorcion,
            stock_actual: _stockNowPorcion,
            stock_total: this.stock_total  
        }

        // console.log('_data', _data);

        const _httpFecht = new httpFecht();
        const rpt = await _httpFecht.postJson('../../bdphp/log_009.php?op=10', _data)
        if ( rpt.success ) {
            dialog_modificar_stock_porcion.close();
            xthisPorcionDetalle.objporcion.stock = _stockNowPorcion;
            xthisPorcionDetalle.objporcion = JSON.parse(JSON.stringify(xthisPorcionDetalle.objporcion))
            xLoadDataPorcionDetalle();
        }        
        xPopupLoad.xclose();
    }

    function xModificarDescripcionPorcionDetalle() { 
        txt_descripcion_porcion.value = xthisPorcionDetalle.objporcion.porcion;
        dialog_modificar_descripcion_porcion.open();
    }

    async function xSaveModificacionDescripcionPorcion() {
        if ( txt_descripcion_porcion.value.length > 2 ) {
            const _data = {
                descripcion: txt_descripcion_porcion.value,
                idporcion: xthisPorcionDetalle.objporcion.idporcion
            }
            const _httpFecht = new httpFecht();
            const rpt = await _httpFecht.postJson('../../bdphp/log_009.php?op=115', _data)
            if (rpt.success) {
                dialog_modificar_descripcion_porcion.close();
                xthisPorcionDetalle.objporcion.porcion = txt_descripcion_porcion.value;
                xthisPorcionDetalle.objporcion = JSON.parse(JSON.stringify(xthisPorcionDetalle.objporcion))
            }  
        }
    }

    async function xEliminarPorcionDetalle() {
        const _swalAlertValues = paramsSwalAlert;
        const _cantRelacionado  = cantidadRecetasEnlazadasPorcion > 0 ? `<span class="text-warning"> Tenga en cuenta que afectara a ${cantidadRecetasEnlazadasPorcion} recetas enlazadas.</span>` : ''
        _swalAlertValues.title = '<p class="fw-600 fs-20">Borrar Porción</p>';
        _swalAlertValues.html = `<div class="pb-2" style="display: inline-flex;">                    
                                    <p class="fs-15">Esta seguro de borrar la porción: <strong>${xthisPorcionDetalle.objporcion.porcion}</strong>. ${_cantRelacionado}</p>
                                </div>`;
        _swalAlertValues.confirmButtonText = 'Si, borrar';
        _swalAlertValues.showCancelButton = true;


        await showAlertSwalHtmlDecision(_swalAlertValues, 1)
            .then(async res => {
                if (res.isConfirmed) { // remove familia
                    const _data = {                     
                        idporcion: xthisPorcionDetalle.objporcion.idporcion
                    }

                    const _httpFecht = new httpFecht();
                    const rpt = await _httpFecht.postJson('../../bdphp/log_009.php?op=117', _data)
                    if (rpt.success) { 
                        goMainPorcion();
                        xLoadPorciones();
                    }
                }

            })
    }

    function verRecetasEnlazadas() {
        const _swalAlertValues = paramsSwalAlert;
        let _rowTable = '';

        xthisPorcionDetalle.listRecetasEnlazadas.forEach(element => {
            _rowTable += `<tr>
                                <td align="left">${element.descripcion}</td>
                                <td align="right">${parseFloat(element.cantidad)}</td>
                            </tr>`;
        });

        _swalAlertValues.title = '<p class="fw-600 fs-20">Recetas enlazadas</p>';        
        _swalAlertValues.html = `<div class="pb-2" style="display: inline-flex;">                    
                                    <table class="fs-12 w-100">
                                        <thead>
                                            <tr>
                                                <th align="left">Producto</th>
                                                <th align="right">Cantidad</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${_rowTable}
                                        </tbody>                                                                                
                                    </table>
                                </div>`;        
        _swalAlertValues.showCancelButton = false;
        showAlertSwalHtmlDecision(_swalAlertValues, 1);

    }   

Polymer({
    is:'x-porcion-detalle',
    properties:{
        objporcion: {
            type: Object,
            notify: true,
            reflectToAttribute: true,            
            observer: 'porcionChanged',            
        },
        msjStock: String,
        stock_total: Number,
        classMsjStock: String,
        listPorcionHistorial: [],
        btnPorcionPe: Boolean,
        listRecetasEnlazadas: [],
    },
    porcionChanged: (obj) => {   
        xLoadDataPorcionDetalle()  
    },
    attached:function(){
        this.btnPorcionPe = false;
        xthisPorcionDetalle =this;
        // xIniPorcion();
    }    
})
</script>
