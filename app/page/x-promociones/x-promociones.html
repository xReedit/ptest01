<dom-module id="x-promociones">
    <link rel="import" href="../../x-componentes/x-comp-find-item-producto/x-comp-find-item-producto.html">
    <link rel="import" href="../../x-componentes/x-comp-find-seccion/x-comp-find-seccion.html">
    <link rel="import" href="../../x-componentes/x-comp-img-upload/x-comp-img-upload.html">
    <script src="../../view/httpFech.js"></script>
    <template>

        <paper-dialog modal id="dialog_img_gif_promo" class="dialog_redondo" style="min-width: 300px;" entry-animation="scale-up-animation" exit-animation="fade-out-animation">
            <div class="xContent">
                <div class="div-content-img">
                    <template is="dom-repeat" items="{{listIconGif}}" as="item">
                        <img data-id="[[index]]" src$="[[item.path]]" alt$="[[item.titulo]]" class="xCursor" onclick="selectOptionIcoGif(this)">
                    </template>
                </div>
                <hr><br><br>
                <div class="xBoton2 xPlomo" dialog-dismiss>Cerrar</div>
            </div>
        </paper-dialog>

        <br>
        <div class="xMiCard xradius" style="width:96%; max-width: 1400px;">
            <div class="xEncanezadoCard" style="background: lavenderblush; color: #424242;">
                <div class="d-flexx justify-content-between align-items-center">
                    <p class="fs-18">Promociones · Descuentos</p>
                </div>
            </div>
            <div class="xContentCard" style="padding: 20px;">

                <!-- =================== LISTA =================== -->
                <div class="w-100 animate__animated animate__fadeIn" hidden$="[[!isShowListaPromo]]">
                    <div class="d-flexx justify-content-between align-items-center">
                        <p class="fw-600 fs-18">Lista de promociones</p>
                        <button class="btn btn-sm btn-success" onclick="xNewPromocion()">+ Nueva promoción</button>
                    </div>
                    <br>
                    <table class="w-100 tbl-promos">
                        <thead>
                            <tr>
                                <th>Activo</th>
                                <th>Estado</th>
                                <th width="28%">Título</th>
                                <th>Tipo</th>
                                <th>Inicio</th>
                                <th>Fin</th>
                                <th>Días</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template is="dom-repeat" items="{{dataPromociones}}" as="item">
                                <tr data-id="[[item.idpromocion]]">
                                    <td>
                                        <paper-toggle-button checked$="[[item.check_activo]]" onchange="xDisabledPromo(this)">Toggle</paper-toggle-button>
                                    </td>
                                    <td><span class$="chip [[item.chipClass]]">[[item.chipLabel]]</span></td>
                                    <td>
                                        <p class="fw-600">{{ item.parametros.header.titulo }}</p>
                                        <p class="text-secondary fs-10">{{ item.parametros.header.descripcion }}</p>
                                    </td>
                                    <td><span class="chip chip-tipo">[[item.tipoLabel]]</span></td>
                                    <td>
                                        <p class="fw-600">{{ item.parametros.body.f_inicio }}</p>
                                        <p class="text-secondary fs-10">{{ item.parametros.body.h_inicio }}</p>
                                    </td>
                                    <td>
                                        <p class="fw-600">{{ item.parametros.body.f_fin }}</p>
                                        <p class="text-secondary fs-10">{{ item.parametros.body.h_fin }}</p>
                                    </td>
                                    <td><span class="fs-11 text-secondary">[[item.diasLabel]]</span></td>
                                    <td>
                                        <button class="btn btn-sm btn-info" onclick="xModificarPromo(this)">Modificar</button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                    <br><br><br>
                </div>

                <!-- =================== WIZARD DE EDICIÓN =================== -->
                <div hidden$="[[isShowListaPromo]]" class="animate__animated animate__fadeIn">
                    <div class="d-flexx justify-content-between align-items-center">
                        <p class="fs-18 fw-600">[[ tituloFormulario ]]</p>
                        <button class="btn btn-secondary" onclick="backListPromo()">← Atrás</button>
                    </div>

                    <div class="wizard-grid">

                        <div class="wizard-cols">

                            <!-- ========== PASO 1: TIPO ========== -->
                            <section class="wiz-step">
                                <div class="wiz-step-head">
                                    <span class="wiz-num">1</span>
                                    <h3 class="wiz-title">Tipo de promoción</h3>
                                </div>
                                <p class="text-secondary mb-2">Elige cómo quieres premiar al cliente.</p>
                                <div class="tipo-grid">
                                    <div class$="tipo-card [[ tipoCardClass.porc ]]" onclick="setTipoPromo('porc')">
                                        <div class="tipo-ico">%</div>
                                        <div class="tipo-nom">% de descuento</div>
                                        <div class="tipo-desc">Resta un porcentaje al precio del plato o sección.</div>
                                    </div>
                                    <div class$="tipo-card [[ tipoCardClass.fijo ]]" onclick="setTipoPromo('fijo')">
                                        <div class="tipo-ico">S/.</div>
                                        <div class="tipo-nom">Monto fijo</div>
                                        <div class="tipo-desc">Resta una cantidad fija en soles al precio.</div>
                                    </div>
                                    <div class$="tipo-card [[ tipoCardClass.nxn_puro ]]" onclick="setTipoPromo('nxn_puro')">
                                        <div class="tipo-ico">2x1</div>
                                        <div class="tipo-nom">NxN puro</div>
                                        <div class="tipo-desc">Lleva N unidades, paga solo X. Aplica a un plato o sección.</div>
                                    </div>
                                    <div class$="tipo-card [[ tipoCardClass.nxn_2do_porc ]]" onclick="setTipoPromo('nxn_2do_porc')">
                                        <div class="tipo-ico">½</div>
                                        <div class="tipo-nom">2do a mitad de precio</div>
                                        <div class="tipo-desc">La 2da unidad (o N-ésima) va al 50% u otro porcentaje.</div>
                                    </div>
                                    <div class$="tipo-card [[ tipoCardClass.porc_total ]]" onclick="setTipoPromo('porc_total')">
                                        <div class="tipo-ico">Σ</div>
                                        <div class="tipo-nom">% sobre el total</div>
                                        <div class="tipo-desc">Aplica un porcentaje al subtotal completo del pedido.</div>
                                    </div>
                                    <div class$="tipo-card [[ tipoCardClass.combo ]]" onclick="setTipoPromo('combo')">
                                        <div class="tipo-ico">⊕</div>
                                        <div class="tipo-nom">Combo a precio fijo</div>
                                        <div class="tipo-desc">Pide la lista de ítems del combo a un precio total cerrado.</div>
                                    </div>
                                    <div class$="tipo-card [[ tipoCardClass.bogo ]]" onclick="setTipoPromo('bogo')">
                                        <div class="tipo-ico">⇄</div>
                                        <div class="tipo-nom">Compra X, lleva Y</div>
                                        <div class="tipo-desc">Al pedir el ítem A, el cliente recibe el ítem B con descuento o gratis.</div>
                                    </div>
                                    <div class$="tipo-card [[ tipoCardClass.escalonado ]]" onclick="setTipoPromo('escalonado')">
                                        <div class="tipo-ico">↗</div>
                                        <div class="tipo-nom">Descuento escalonado</div>
                                        <div class="tipo-desc">Mientras más unidades del mismo plato, mejor precio (tiers).</div>
                                    </div>
                                </div>

                                <br>
                                <div class="row-2col">
                                    <div>
                                        <p class="fw-600">Título</p>
                                        <input type="text" class="selected-template-1 w-100" placeholder="Ej: Happy Hour de Cervezas" onChange="conMayusculas(this)" id="titulo_promo" onKeyUp="xValidFormPromo()">
                                    </div>
                                    <div>
                                        <p class="fw-600">Ícono</p>
                                        <button class="btn btn-sm btn-secondary" onclick="dialog_img_gif_promo.open()">Seleccionar</button>
                                        <img src="" alt="" id="promo_img_ico_gif" style="height:32px; vertical-align: middle; margin-left: 6px;">
                                    </div>
                                </div>
                                <br>
                                <p class="fw-600">Descripción corta</p>
                                <textarea class="selected-template-1 w-100" maxlength="150" rows="2" id="descripcion_promo" onKeyUp="xValidFormPromo()" placeholder="Texto que verá el cliente"></textarea>
                                <br><br>
                                <p class="fw-600">Imagen promocional <span class="text-secondary fs-11">(para delivery / app)</span></p>
                                <x-comp-img-upload id="compImgPromo" medidasimg="[[medidaImg]]"></x-comp-img-upload>
                            </section>

                            <!-- ========== PASO 2: CUÁNDO ========== -->
                            <section class="wiz-step">
                                <div class="wiz-step-head">
                                    <span class="wiz-num">2</span>
                                    <h3 class="wiz-title">¿Cuándo aplica?</h3>
                                </div>

                                <p class="fw-600">Días de la semana</p>
                                <div class="dias-row">
                                    <label class="dia-chip"><input type="checkbox" class="check_dia" data-id="0"><span>Dom</span></label>
                                    <label class="dia-chip"><input type="checkbox" class="check_dia" data-id="1"><span>Lun</span></label>
                                    <label class="dia-chip"><input type="checkbox" class="check_dia" data-id="2"><span>Mar</span></label>
                                    <label class="dia-chip"><input type="checkbox" class="check_dia" data-id="3"><span>Mié</span></label>
                                    <label class="dia-chip"><input type="checkbox" class="check_dia" data-id="4"><span>Jue</span></label>
                                    <label class="dia-chip"><input type="checkbox" class="check_dia" data-id="5"><span>Vie</span></label>
                                    <label class="dia-chip"><input type="checkbox" class="check_dia" data-id="6"><span>Sáb</span></label>
                                    <button type="button" class="btn-link-mini" onclick="todosDias()">Todos</button>
                                </div>
                                <br>

                                <div class="row-2col">
                                    <div>
                                        <p class="fw-600">Vigencia (fechas)</p>
                                        <div class="d-flexx">
                                            <input type="date" id="f_ini" class="selected-template-1 mr-1" onChange="xValidFormPromo()">
                                            <input type="date" id="f_fin" class="selected-template-1" onChange="xValidFormPromo()">
                                        </div>
                                    </div>
                                    <div>
                                        <p class="fw-600">Horario <span class="text-secondary fs-11">(00:00 a 00:00 = todo el día)</span></p>
                                        <div class="d-flexx">
                                            <input type="time" id="h_ini" class="selected-template-1 mr-1" onChange="xValidFormPromo()">
                                            <input type="time" id="h_fin" class="selected-template-1" onChange="xValidFormPromo()">
                                            <button type="button" class="btn-link-mini" onclick="todoElDia()">Todo el día</button>
                                        </div>
                                    </div>
                                </div>
                                <br>

                                <div class="restr-block">
                                    <p class="fw-600">Restricciones adicionales <span class="text-secondary fs-11">(opcionales)</span></p>
                                    <div class="row-2col">
                                        <div>
                                            <p class="text-secondary fs-12 mb-1">Importe mínimo de consumo (S/.)</p>
                                            <input type="number" class="selected-template-1 w-100" min="0" value="0" id="importe_consumo_min">
                                        </div>
                                        <div>
                                            <p class="text-secondary fs-12 mb-1">Solo primeros N pedidos del día</p>
                                            <input type="number" class="selected-template-1 w-100" min="0" value="0" id="num_primeros_pedidos">
                                        </div>
                                    </div>
                                    <br>
                                    <label class="check-inline">
                                        <input type="checkbox" id="check_solo_app">
                                        <span>Solo aplica desde la app de delivery (Papaya Express)</span>
                                    </label>
                                </div>
                            </section>

                            <!-- ========== PASO 3: A QUÉ APLICA ========== -->
                            <section class="wiz-step">
                                <div class="wiz-step-head">
                                    <span class="wiz-num">3</span>
                                    <h3 class="wiz-title">¿A qué aplica?</h3>
                                </div>
                                <p class="text-secondary mb-2">[[ ayudaPaso3 ]]</p>

                                <!-- Panel especial para % sobre el total (no requiere lista) -->
                                <div class="add-aplica" hidden$="[[ !tipoEsPorcTotal ]]">
                                    <div class="add-row">
                                        <div class="add-field add-field-grow">
                                            <label class="lbl">% sobre el subtotal del pedido</label>
                                            <input type="number" class="selected-template-1 w-100" id="porc_total_input" min="1" max="100" value="10" placeholder="Ej. 10" onkeyup="actualizarPreview()">
                                        </div>
                                    </div>
                                    <p class="text-secondary fs-12 mb-0">Este descuento se aplica una sola vez sobre el subtotal completo del pedido.</p>
                                </div>

                                <!-- Precio total del combo (visible solo en tipo combo) -->
                                <div class="add-aplica" hidden$="[[ !tipoEsCombo ]]" style="margin-top: 8px;">
                                    <div class="add-row">
                                        <div class="add-field add-field-grow">
                                            <label class="lbl">Precio total del combo (S/.)</label>
                                            <input type="number" class="selected-template-1 w-100" id="combo_precio_total" min="0" step="0.01" placeholder="Ej. 59.90" onkeyup="actualizarPreview()">
                                        </div>
                                    </div>
                                    <p class="text-secondary fs-12 mb-0">El cliente pagará este precio cuando lleve los ítems listados abajo, en las cantidades indicadas.</p>
                                </div>

                                <!-- Form de agregar (resto de tipos) -->
                                <div class="add-aplica" hidden$="[[ tipoEsPorcTotal ]]">
                                    <div class="add-row" hidden$="[[ ocultarFormItem ]]">
                                        <div class="add-field" hidden$="[[ tipoEsBogo ]]">
                                            <label class="lbl">¿Para qué?</label>
                                            <select class="selected-template-1 w-100" id="sel_tipo_aplica" onchange="selectedTipo(this)">
                                                <option value="0">Un plato o producto</option>
                                                <option value="2">Toda una sección de la carta</option>
                                            </select>
                                        </div>
                                        <div class="add-field add-field-grow">
                                            <label class="lbl">[[ labelBuscador ]]</label>
                                            <div hidden$="[[ !isShowProductoItem ]]">
                                                <x-comp-find-item-producto clasecss="selected-template-1 w-100" id="compItemProducto"></x-comp-find-item-producto>
                                            </div>
                                            <div hidden$="[[ isShowProductoItem ]]">
                                                <x-comp-find-seccion clasecss="selected-template-1 w-100" id="compFindSeccion"></x-comp-find-seccion>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Inputs específicos por tipo -->
                                    <div class="add-row" hidden$="[[ tipoEsNxN ]]">
                                        <div class="add-field add-field-grow">
                                            <label class="lbl">[[ labelDescuento ]]</label>
                                            <input type="number" class="selected-template-1 w-100" id="imp_desct" min="0" step="0.01" placeholder="[[ placeholderDescuento ]]" onkeyup="precioFinalProductoItem()">
                                        </div>
                                        <div class="add-field" hidden$="[[ !mostrarPrecioOriginal ]]">
                                            <label class="lbl">Precio original</label>
                                            <p class="fw-600 mt-1">S/. {{ itemProductoSeleted.precio }}</p>
                                        </div>
                                        <div class="add-field" hidden$="[[ !mostrarPrecioOriginal ]]">
                                            <label class="lbl">Precio final</label>
                                            <p class="fw-600 mt-1 text-success">S/. {{ precioFinal }}</p>
                                        </div>
                                    </div>

                                    <div class="add-row" hidden$="[[ !tipoEsNxN ]]">
                                        <div class="add-field">
                                            <label class="lbl">El cliente lleva</label>
                                            <select id="sel_cant" class="selected-template-1 w-100" onchange="actualizarPreview()">
                                                <option value="2">2 unidades</option>
                                                <option value="3">3 unidades</option>
                                                <option value="4">4 unidades</option>
                                                <option value="5">5 unidades</option>
                                            </select>
                                        </div>
                                        <div class="add-field" hidden$="[[ mostrarPorcEnNxN ]]">
                                            <label class="lbl">Y paga solo por</label>
                                            <select id="sel_cant_x" class="selected-template-1 w-100" onchange="actualizarPreview()">
                                                <option value="1">1 unidad</option>
                                                <option value="2">2 unidades</option>
                                                <option value="3">3 unidades</option>
                                                <option value="4">4 unidades</option>
                                            </select>
                                        </div>
                                        <div class="add-field" hidden$="[[ !mostrarPorcEnNxN ]]">
                                            <label class="lbl">% sobre la última unidad</label>
                                            <input type="number" class="selected-template-1 w-100" id="imp_desct_2do" min="1" max="100" value="50" onkeyup="actualizarPreview()">
                                        </div>
                                    </div>

                                    <!-- Combo: cantidad requerida del ítem dentro del combo -->
                                    <div class="add-row" hidden$="[[ !tipoEsCombo ]]">
                                        <div class="add-field">
                                            <label class="lbl">Cantidad de este ítem en el combo</label>
                                            <input type="number" class="selected-template-1 w-100" id="combo_cant_item" min="1" value="1">
                                        </div>
                                    </div>

                                    <!-- BOGO: rol del ítem (trigger / regalo) y % del regalo -->
                                    <div class="add-row" hidden$="[[ !tipoEsBogo ]]">
                                        <div class="add-field">
                                            <label class="lbl">Rol en la promoción</label>
                                            <select id="bogo_rol" class="selected-template-1 w-100" onchange="onChangeBogoRol()">
                                                <option value="trigger">El cliente compra este (trigger)</option>
                                                <option value="regalo">Y se lleva este de regalo</option>
                                            </select>
                                        </div>
                                        <div class="add-field" hidden$="[[ !bogoEsRegalo ]]">
                                            <label class="lbl">% de descuento del regalo</label>
                                            <input type="number" class="selected-template-1 w-100" id="bogo_porc_regalo" min="0" max="100" value="100" placeholder="100 = gratis">
                                        </div>
                                    </div>

                                    <!-- Escalonado: tier (cantidad mínima → precio unitario o % desc) -->
                                    <div class="add-row" hidden$="[[ !tipoEsEscalonado ]]">
                                        <div class="add-field">
                                            <label class="lbl">Si pide</label>
                                            <input type="number" class="selected-template-1 w-100" id="esc_cant_min" min="2" value="2"> <span class="text-secondary fs-11">o más unidades</span>
                                        </div>
                                        <div class="add-field">
                                            <label class="lbl">Precio unitario rebajado (S/.)</label>
                                            <input type="number" class="selected-template-1 w-100" id="esc_precio_un" min="0" step="0.01" placeholder="Ej. 25.00">
                                        </div>
                                    </div>

                                    <div class="add-actions">
                                        <button class="btn btn-info" onclick="addListDescuentoItem()">+ Agregar a la promoción</button>
                                    </div>

                                    <div hidden$="[[ !isShowError ]]" class="animate__animated animate__shakeX">
                                        <p class="fw-600 text-danger">{{ isShowMsjError }}</p>
                                    </div>
                                </div>

                                <!-- Lista descriptiva de lo agregado -->
                                <p class="fw-600 mt-3" hidden$="[[ !hayItemsDesct ]]">Esta promoción incluye:</p>
                                <div class="aplica-list" hidden$="[[ !hayItemsDesct ]]">
                                    <template is="dom-repeat" items="{{listItemsDescuento}}" as="item">
                                        <div class="aplica-row" data-id="[[index]]">
                                            <div class="aplica-icon">[[ item.iconoTipo ]]</div>
                                            <div class="aplica-body">
                                                <p class="aplica-titulo">[[ item.descripcion ]] <span class="aplica-badge">[[ item.alcanceLabel ]]</span></p>
                                                <p class="aplica-frase">[[ item.fraseHumana ]]</p>
                                            </div>
                                            <div class="aplica-quitar" title="Quitar" onclick="removeItemListPromo(this);">×</div>
                                        </div>
                                    </template>
                                </div>
                            </section>

                        </div>

                        <!-- ========== VISTA PREVIA ========== -->
                        <aside class="wiz-preview">
                            <div class="preview-card">
                                <div class="preview-top">
                                    <span class="preview-kicker">Vista previa</span>
                                </div>
                                <div class="preview-body">
                                    <p class="preview-titulo">[[ previewTitulo ]]</p>
                                    <p class="preview-frase">[[ previewFrase ]]</p>
                                    <div class="preview-aplica" hidden$="[[ !previewAplicaTexto ]]">
                                        <span class="preview-label">Aplica en</span>
                                        <p>[[ previewAplicaTexto ]]</p>
                                    </div>
                                </div>
                                <div class="preview-foot">
                                    <span class$="chip [[ previewEstadoClass ]]">[[ previewEstadoLabel ]]</span>
                                    <span class="preview-note">Se actualiza al editar</span>
                                </div>
                            </div>
                        </aside>

                    </div>

                    <br>
                    <x-comp-button-succes id="btnSucces" disabled$="[[!isFormValid]]" loader="{{isShowLoaderSave}}"></x-comp-button-succes>
                    <button class="btn btn-secondary ml-2" onclick="backListPromo()">Atrás</button>
                    <br><br><br>
                </div>

            </div>
        </div>
        <br><br>
    </template>
</dom-module>

<style>
    /* Lista */
    .tbl-promos th, .tbl-promos td { padding: 6px 8px; vertical-align: middle; }
    .tbl-promos thead th { font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid #e5e7eb; }
    .tbl-promos tbody tr { border-bottom: 1px solid #f1f5f9; }

    .chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; line-height: 1.6; }
    .chip-vigente   { background: #dcfce7; color: #166534; }
    .chip-programada{ background: #dbeafe; color: #1e40af; }
    .chip-expirada  { background: #fee2e2; color: #991b1b; }
    .chip-pausada   { background: #f3f4f6; color: #4b5563; }
    .chip-tipo      { background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }

    /* Wizard */
    .wizard-grid {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 24px;
        margin-top: 12px;
    }
    @media (max-width: 980px) { .wizard-grid { grid-template-columns: 1fr; } }

    .wizard-cols { display: grid; gap: 16px; }

    .wiz-step {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        padding: 18px 20px;
    }
    .wiz-step-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .wiz-num {
        width: 28px; height: 28px; border-radius: 999px;
        background: #007bff; color: #fff; font-weight: 700;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 14px;
    }
    .wiz-title { margin: 0; font-size: 16px; font-weight: 600; color: #111827; }

    /* Tipo cards */
    .tipo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 10px;
        margin: 10px 0;
    }
    .tipo-card {
        border: 2px solid #e5e7eb;
        border-radius: 10px;
        padding: 14px;
        cursor: pointer;
        transition: all .15s;
        background: #fafafa;
    }
    .tipo-card:hover { border-color: #9ec5fe; background: #e7f1ff; }
    .tipo-card.tipo-active {
        border-color: #007bff;
        background: #e7f1ff;
        box-shadow: 0 0 0 3px rgba(99,102,241,.12);
    }
    .tipo-ico {
        width: 36px; height: 36px;
        background: #fff;
        border-radius: 8px;

<script>
    // =========================================================================
    // Estado del componente
    // =========================================================================
    var xThisProm,
        btnSucces, compItemProducto, compFindSeccion, compImgPromo,
        tipoElementId = 0, tipoElementNom = 'Item',
        _listItemsDescuento = [],
        diasSemana = '',
        idPromoSelected = 0,
        firstIconGif = '',
        tipoPromoActual = 'porc'; // 'porc' | 'fijo' | 'nxn_puro' | 'nxn_2do_porc'

    // =========================================================================
    // Helpers de tipo de promoción
    // =========================================================================
    function _isNxN(tipo) { return tipo === 'nxn_puro' || tipo === 'nxn_2do_porc'; }

    function _labelTipoCorto(tipo) {
        switch (tipo) {
            case 'fijo':         return 'S/.';
            case 'nxn_puro':     return 'NxN';
            case 'nxn_2do_porc': return '2do%';
            case 'porc_total':   return 'Σ%';
            case 'combo':        return 'Combo';
            case 'bogo':         return 'BOGO';
            case 'escalonado':   return 'Tiers';
            case 'porc':
            default:             return '%';
        }
    }

    function _inferirTipoLegacy(promo) {
        // Para promos viejas sin parametros.body.tipo_descuento
        const explicit = promo?.parametros?.body?.tipo_descuento;
        if (explicit) return explicit;
        // No hay forma de leer is_nxn aquí (la lista viene sin detalle), default 'porc'
        return 'porc';
    }

    // Vigencia: misma lógica que _xPromoEsVigente() del motor del POS
    function _promoEsVigente(promo, ahora) {
        try {
            const body = promo?.parametros?.body;
            if (!body) return { estado: 'pausada', label: 'Pausada' };

            ahora = ahora || new Date();
            const pad = n => String(n).padStart(2, '0');
            const hoy = `${ahora.getFullYear()}-${pad(ahora.getMonth()+1)}-${pad(ahora.getDate())}`;
            const horaActual = `${pad(ahora.getHours())}:${pad(ahora.getMinutes())}`;
            const diaActual = String(ahora.getDay());

            if (body.f_inicio && hoy < body.f_inicio) return { estado: 'programada', label: 'Programada' };
            if (body.f_fin && hoy > body.f_fin)       return { estado: 'expirada',   label: 'Expirada' };

            if (body.h_inicio && body.h_fin && body.h_inicio !== body.h_fin) {
                if (horaActual < body.h_inicio || horaActual > body.h_fin) {
                    return { estado: 'programada', label: 'Fuera de horario' };
                }
            }
            if (body.dias_semana) {
                const dias = String(body.dias_semana).split(',').map(s => s.trim()).filter(Boolean);
                if (dias.length > 0 && !dias.includes(diaActual)) {
                    return { estado: 'programada', label: 'Otro día' };
                }
            }
            return { estado: 'vigente', label: 'Vigente ahora' };
        } catch (e) {
            return { estado: 'pausada', label: 'Error' };
        }
    }

    function _diasLabel(csv) {
        const nombres = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
        const ids = String(csv || '').split(',').map(s => s.trim()).filter(Boolean);
        if (ids.length === 0) return '—';
        if (ids.length === 7) return 'Todos';
        return ids.map(i => nombres[parseInt(i,10)] || '').join(' ');
    }

    // =========================================================================
    // Init
    // =========================================================================
    function xIniPromociones() {
        xThisProm.medidaImg = { width: 350, height: 180 };
        xThisProm.isShowListaPromo = true;
        xThisProm.tituloFormulario = 'Detalle Promoción';

        xLoadListaPromocion();
        xLoadDataPromociones();
        xloadGifPromo();

        $('body').addClass('loaded');
        btnSucces = document.getElementById('btnSucces');
        btnSucces.addEventListener('onclix', () => guardarPromo());

        compItemProducto = document.getElementById('compItemProducto');
        compItemProducto.addEventListener('elementSeleted', (e) => {
            xThisProm.itemProductoSeleted = e.detail || null;
            precioFinalProductoItem();
        });
        compFindSeccion = document.getElementById('compFindSeccion');
        compImgPromo = document.getElementById('compImgPromo');

        $('.check_dia').on('change', () => {
            recalcDiasSemana();
            xValidFormPromo();
            actualizarPreview();
        });

        // Reactividad robusta: 'input' + 'change' en todos los controles relevantes
        const idsReactivos = ['titulo_promo','descripcion_promo','f_ini','f_fin','h_ini','h_fin',
                              'imp_desct','imp_desct_2do','sel_cant','sel_cant_x',
                              'importe_consumo_min','num_primeros_pedidos','check_solo_app'];
        idsReactivos.forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('input', actualizarPreview);
            el.addEventListener('change', actualizarPreview);
        });

        _listItemsDescuento = [];
        xThisProm.isFormValid = false;
        setTipoPromo('porc');
        actualizarPreview();
    }

    function recalcDiasSemana() {
        diasSemana = '';
        $('.check_dia').each((i, e) => {
            diasSemana += e.checked ? i.toString() + ',' : '';
        });
    }

    function todosDias() {
        $('.check_dia').each((i,e) => { e.checked = true; });
        recalcDiasSemana();
        xValidFormPromo();
        actualizarPreview();
    }

    function todoElDia() {
        h_ini.value = '00:00';
        h_fin.value = '00:00';
        xValidFormPromo();
        actualizarPreview();
    }

    // =========================================================================
    // Selector de tipo
    // =========================================================================
    function setTipoPromo(tipo) {
        tipoPromoActual = tipo;

        const cls = { porc:'', fijo:'', nxn_puro:'', nxn_2do_porc:'', porc_total:'', combo:'', bogo:'', escalonado:'' };
        cls[tipo] = 'tipo-active';
        xThisProm.tipoCardClass = cls;

        xThisProm.tipoEsNxN             = _isNxN(tipo);
        xThisProm.mostrarPorcEnNxN      = tipo === 'nxn_2do_porc';
        xThisProm.mostrarPrecioOriginal = (tipo === 'porc' || tipo === 'fijo');
        xThisProm.tipoEsPorcTotal       = tipo === 'porc_total';
        xThisProm.tipoEsCombo           = tipo === 'combo';
        xThisProm.tipoEsBogo            = tipo === 'bogo';
        xThisProm.tipoEsEscalonado      = tipo === 'escalonado';
        // En porc_total el form de ítems se oculta completo
        xThisProm.ocultarFormItem       = false;

        xThisProm.labelDescuento = (tipo === 'fijo') ? 'Monto a descontar (S/.)' : '% de descuento';
        xThisProm.placeholderDescuento = (tipo === 'fijo') ? 'Ej. 5.00' : 'Ej. 20';
        xThisProm.labelBuscador = xThisProm.tipoEsBogo
            ? 'Plato del rol seleccionado'
            : (xThisProm.isShowProductoItem ? 'Plato o producto de la carta' : 'Sección de la carta');

        xThisProm.ayudaPaso3 = ({
            porc:         'Indica a qué platos/productos o secciones aplicará el % de descuento. Puedes agregar varios.',
            fijo:         'Resta una cantidad fija (S/.) al precio de los platos o secciones que elijas.',
            nxn_puro:     'Por cada N unidades del mismo plato (o de la misma sección), el cliente pagará solo X. Las extras van gratis.',
            nxn_2do_porc: 'Por cada N unidades del mismo plato, la última (Nésima) va con el % de descuento que elijas.',
            porc_total:   'Define el % de descuento que se aplicará al subtotal completo del pedido.',
            combo:        'Lista los ítems que conforman el combo y la cantidad de cada uno. El precio total del combo se define en la Vista previa.',
            bogo:         'Define primero el ítem que el cliente debe comprar (trigger) y luego el ítem que recibe de regalo (con % de descuento).',
            escalonado:   'Define los tramos: a partir de N unidades el precio unitario baja a S/.X. Puedes apilar varios tiers para el mismo plato.'
        })[tipo];

        // En BOGO solo ítem/producto, no sección (necesita identidad puntual)
        if (xThisProm.tipoEsBogo) {
            tipoElementId = 0;
            tipoElementNom = 'Item';
            xThisProm.isShowProductoItem = true;
            const sel = document.getElementById('sel_tipo_aplica');
            if (sel) sel.value = '0';
        }

        // Si cambia el tipo y hay items previos, limpiar
        if (_listItemsDescuento.length > 0 && _listItemsDescuento[0].tipoPromo !== tipo) {
            _listItemsDescuento = [];
            xThisProm.listItemsDescuento = [];
            xThisProm.hayItemsDesct = false;
        }

        xValidFormPromo();
        actualizarPreview();
    }

    function onChangeBogoRol() {
        const rol = document.getElementById('bogo_rol')?.value || 'trigger';
        xThisProm.bogoEsRegalo = (rol === 'regalo');
        actualizarPreview();
    }

    function selectedTipo(e) {
        tipoElementId = e.value;
        tipoElementNom = e[e.selectedIndex].text;
        xThisProm.isShowProductoItem = e.value !== "2";
        xThisProm.labelBuscador = xThisProm.isShowProductoItem
            ? 'Plato o producto de la carta'
            : 'Sección de la carta';
    }

    function precioFinalProductoItem() {
        if (!xThisProm.itemProductoSeleted || !xThisProm.isShowProductoItem) {
            xThisProm.precioFinal = 0;
            return;
        }
        const precio = parseFloat(xThisProm.itemProductoSeleted.precio || 0);
        const valor = isNaN(parseFloat(imp_desct?.value)) ? 0 : parseFloat(imp_desct.value);

        let final = precio;
        if (tipoPromoActual === 'porc')  final = precio - (precio * (valor / 100));
        if (tipoPromoActual === 'fijo')  final = Math.max(0, precio - valor);
        // NxN: precio final unitario = precio (el descuento se aplica a las extras)
        xThisProm.precioFinal = final.toFixed(2);
    }

    // =========================================================================
    // Lista de detalles (Paso 3)
    // =========================================================================
    function addListDescuentoItem() {
        xThisProm.isShowError = false;
        xThisProm.isShowMsjError = '';

        // porc_total no requiere lista de ítems
        if (xThisProm.tipoEsPorcTotal) {
            xThisProm.isShowError = true;
            xThisProm.isShowMsjError = 'Este tipo no necesita ítems: solo configura el % en el campo de arriba.';
            return;
        }

        const ItemSelected = xThisProm.itemProductoSeleted;
        const seccionSeleted = xThisProm.isShowProductoItem ? null : compFindSeccion.getSeccion();

        if (xThisProm.tipoEsBogo && !ItemSelected) {
            xThisProm.isShowError = true;
            xThisProm.isShowMsjError = 'BOGO requiere un Ítem o Producto puntual.';
            return;
        }
        if (xThisProm.tipoEsEscalonado && !ItemSelected) {
            xThisProm.isShowError = true;
            xThisProm.isShowMsjError = 'El descuento escalonado se aplica a un plato o producto puntual (no a sección).';
            return;
        }
        if (!ItemSelected && !seccionSeleted) {
            xThisProm.isShowError = true;
            xThisProm.isShowMsjError = 'Selecciona un Ítem, Producto o Sección.';
            return;
        }

        const splitDescripcionItem = ItemSelected?.label?.split(' | ') || [];
        const elementDescripcion = seccionSeleted ? seccionSeleted.descripcion : splitDescripcionItem[splitDescripcionItem.length - 1];
        const elementPrecio      = seccionSeleted ? 0 : parseFloat(ItemSelected.precio || 0);
        const idItem             = ItemSelected?.procede == '0' ? ItemSelected.iditem : null;
        const idItemSubItem      = idItem ? ItemSelected.iditem_subitem : null;
        const idProducto_stock   = ItemSelected?.procede == '1' ? ItemSelected.value : null;
        const idSeccion          = seccionSeleted ? seccionSeleted.idseccion : null;
        const elementIdimpresora = ItemSelected ? ItemSelected.idimpresora : seccionSeleted.idimpresora;

        let cantidad = '0', cantidadX = null, porcDescuento = 0, precioFinalCalc = elementPrecio.toFixed(2), descuentoLabel = '', subtipo = '';

        if (tipoPromoActual === 'porc') {
            porcDescuento = parseFloat(imp_desct.value || 0);
            if (porcDescuento <= 0) {
                xThisProm.isShowError = true; xThisProm.isShowMsjError = 'Ingresa un % de descuento mayor a 0.'; return;
            }
            precioFinalCalc = (elementPrecio - elementPrecio * (porcDescuento / 100)).toFixed(2);
            descuentoLabel = `${porcDescuento}%`;
        } else if (tipoPromoActual === 'fijo') {
            porcDescuento = parseFloat(imp_desct.value || 0); // reutilizamos columna como monto
            if (porcDescuento <= 0) {
                xThisProm.isShowError = true; xThisProm.isShowMsjError = 'Ingresa un monto mayor a 0.'; return;
            }
            precioFinalCalc = Math.max(0, elementPrecio - porcDescuento).toFixed(2);
            descuentoLabel = `S/.${porcDescuento.toFixed(2)}`;
        } else if (tipoPromoActual === 'nxn_puro') {
            cantidad  = sel_cant.value;
            cantidadX = sel_cant_x.value;
            if (parseInt(cantidad,10) <= parseInt(cantidadX,10)) {
                xThisProm.isShowError = true; xThisProm.isShowMsjError = '"Lleva" debe ser mayor a "Paga".'; return;
            }
            porcDescuento = 0;
            precioFinalCalc = elementPrecio.toFixed(2);
            descuentoLabel = `${cantidad}x${cantidadX}`;
        } else if (tipoPromoActual === 'nxn_2do_porc') {
            cantidad  = sel_cant.value;
            cantidadX = sel_cant.value; // misma cantidad: la N-ésima va al porc%
            porcDescuento = parseFloat(imp_desct_2do.value || 50);
            if (porcDescuento <= 0 || porcDescuento > 100) {
                xThisProm.isShowError = true; xThisProm.isShowMsjError = 'El % de la 2da unidad debe estar entre 1 y 100.'; return;
            }
            precioFinalCalc = elementPrecio.toFixed(2);
            descuentoLabel = `${cantidad}º al ${porcDescuento}%`;
        } else if (tipoPromoActual === 'combo') {
            cantidad = String(parseInt(combo_cant_item.value || '1', 10) || 1);
            porcDescuento = 0;
            precioFinalCalc = elementPrecio.toFixed(2);
            descuentoLabel = `${cantidad}× en el combo`;
        } else if (tipoPromoActual === 'bogo') {
            const rol = document.getElementById('bogo_rol')?.value || 'trigger';
            subtipo = rol; // 'trigger' | 'regalo'
            if (rol === 'trigger') {
                if (_listItemsDescuento.some(x => x.subtipo === 'trigger')) {
                    xThisProm.isShowError = true; xThisProm.isShowMsjError = 'Solo se permite un trigger por promoción BOGO.'; return;
                }
                cantidad = '1';
                porcDescuento = 0;
                descuentoLabel = `Compra (trigger)`;
            } else {
                if (!_listItemsDescuento.some(x => x.subtipo === 'trigger')) {
                    xThisProm.isShowError = true; xThisProm.isShowMsjError = 'Primero define el ítem trigger.'; return;
                }
                if (_listItemsDescuento.some(x => x.subtipo === 'regalo')) {
                    xThisProm.isShowError = true; xThisProm.isShowMsjError = 'Solo se permite un regalo por promoción BOGO.'; return;
                }
                cantidad = '1';
                porcDescuento = parseFloat(document.getElementById('bogo_porc_regalo')?.value || 100);
                if (porcDescuento <= 0 || porcDescuento > 100) {
                    xThisProm.isShowError = true; xThisProm.isShowMsjError = 'El % del regalo debe estar entre 1 y 100.'; return;
                }
                descuentoLabel = porcDescuento === 100 ? 'Gratis' : `Regalo al ${porcDescuento}%`;
                precioFinalCalc = (elementPrecio * (1 - porcDescuento / 100)).toFixed(2);
            }
        } else if (tipoPromoActual === 'escalonado') {
            const cantMin = parseInt(esc_cant_min.value || 0, 10);
            const precioUn = parseFloat(esc_precio_un.value || 0);
            if (cantMin < 2) {
                xThisProm.isShowError = true; xThisProm.isShowMsjError = 'La cantidad mínima del tier debe ser 2 o más.'; return;
            }
            if (precioUn <= 0 || precioUn >= elementPrecio) {
                xThisProm.isShowError = true; xThisProm.isShowMsjError = `El precio rebajado debe ser mayor a 0 y menor al precio actual (S/.${elementPrecio.toFixed(2)}).`; return;
            }
            cantidad = String(cantMin);
            cantidadX = null;
            porcDescuento = +(((elementPrecio - precioUn) / elementPrecio) * 100).toFixed(2);
            precioFinalCalc = precioUn.toFixed(2);
            descuentoLabel = `${cantMin}+ a S/.${precioUn.toFixed(2)} c/u`;
        }

        tipoElementNom = idItem ? 'Item' : idSeccion ? 'Seccion' : 'Producto';

        // En BOGO permitimos el mismo ítem si tiene rol distinto (trigger vs regalo no es la regla común,
        // pero sí dos ítems distintos). Validamos por descripción + subtipo.
        const claveDup = (tipoPromoActual === 'bogo')
            ? `${elementDescripcion}::${subtipo}`
            : elementDescripcion;
        const yaExiste = _listItemsDescuento.some(x => {
            const k = (x.tipoPromo === 'bogo') ? `${x.descripcion}::${x.subtipo || ''}` : x.descripcion;
            return k === claveDup;
        });
        if (yaExiste) {
            xThisProm.isShowError = true;
            xThisProm.isShowMsjError = `"${elementDescripcion}" ya está en la lista.`;
            return;
        }

        const tipoNombrePlano = idItem ? 'Ítem' : (idSeccion ? 'Sección' : 'Producto de almacén');
        const fraseHumana = _construirFraseHumana(tipoPromoActual, {
            descripcion: elementDescripcion,
            esSeccion: !!idSeccion,
            precio: elementPrecio,
            precioFinal: parseFloat(precioFinalCalc),
            cantidad: cantidad,
            cantidad_x: cantidadX,
            porcDescuento: porcDescuento,
            subtipo: subtipo
        });

        const iconoTipo = (() => {
            switch (tipoPromoActual) {
                case 'fijo':         return 'S/.';
                case 'porc':         return '%';
                case 'nxn_puro':     return `${cantidad}x${cantidadX}`;
                case 'nxn_2do_porc': return '½';
                case 'combo':        return '⊕';
                case 'bogo':         return subtipo === 'regalo' ? '🎁' : '⇄';
                case 'escalonado':   return '↗';
                default:             return '%';
            }
        })();

        _listItemsDescuento.push({
            tipoId: tipoElementId,
            tipo: tipoNombrePlano,
            alcanceLabel: idSeccion ? 'Sección completa' : tipoNombrePlano,
            iconoTipo: iconoTipo,
            tipoPromo: tipoPromoActual,
            subtipo: subtipo,
            descripcion: elementDescripcion,
            descuentoLabel: descuentoLabel,
            fraseHumana: fraseHumana,
            cantidad: cantidad,
            cantidad_x: cantidadX,
            porc_descuento: porcDescuento,
            precio: elementPrecio.toFixed(2),
            precio_final: precioFinalCalc,
            iditem: idItem,
            iditem_subitem: idItemSubItem,
            idproducto_stock: idProducto_stock,
            idseccion: idSeccion,
            idimpresora: elementIdimpresora,
            is_nxn: _isNxN(tipoPromoActual)
        });

        xThisProm.listItemsDescuento = _listItemsDescuento.slice();
        xThisProm.hayItemsDesct = _listItemsDescuento.length > 0;
        if (imp_desct) imp_desct.value = '';
        xThisProm.precioFinal = 0;
        xThisProm.isShowError = false;
        xThisProm.isShowMsjError = '';
        xValidFormPromo();
        actualizarPreview();
    }

    function _construirFraseHumana(tipo, ctx) {
        const dest = ctx.esSeccion
            ? `cualquier plato de la sección "${ctx.descripcion}"`
            : `"${ctx.descripcion}"`;

        switch (tipo) {
            case 'porc':
                return `El cliente paga ${ctx.porcDescuento}% menos por ${dest}. Precio S/.${ctx.precio.toFixed(2)} → S/.${ctx.precioFinal.toFixed(2)}.`;
            case 'fijo':
                return `Se descuentan S/.${ctx.porcDescuento.toFixed(2)} de ${dest}. Precio S/.${ctx.precio.toFixed(2)} → S/.${ctx.precioFinal.toFixed(2)}.`;
            case 'nxn_puro':
                return `Por cada ${ctx.cantidad} unidades de ${dest}, el cliente paga solo ${ctx.cantidad_x} (las ${parseInt(ctx.cantidad,10)-parseInt(ctx.cantidad_x,10)} restantes van gratis).`;
            case 'nxn_2do_porc':
                return `Por cada ${ctx.cantidad} unidades de ${dest}, la última lleva ${ctx.porcDescuento}% de descuento.`;
            case 'combo':
                return `Forma parte del combo: incluye ${ctx.cantidad} unidad(es) de ${dest}.`;
            case 'bogo':
                if (ctx.subtipo === 'trigger')
                    return `Cuando el cliente pida ${dest} se activa la promoción.`;
                if (ctx.subtipo === 'regalo')
                    return ctx.porcDescuento === 100
                        ? `Recibe ${dest} GRATIS junto con el ítem trigger.`
                        : `Recibe ${dest} con ${ctx.porcDescuento}% de descuento (S/.${ctx.precio.toFixed(2)} → S/.${ctx.precioFinal.toFixed(2)}).`;
                return '';
            case 'escalonado':
                return `Si el cliente pide ${ctx.cantidad} o más unidades de ${dest}, cada una vale S/.${ctx.precioFinal.toFixed(2)} (precio normal S/.${ctx.precio.toFixed(2)}).`;
        }
        return '';
    }

    function removeItemListPromo(obj) {

        if (!row || !row.dataId) return;
        const idx = parseInt(row.dataId, 10);
        _listItemsDescuento.splice(idx, 1);
        xThisProm.listItemsDescuento = _listItemsDescuento.slice();
        xThisProm.hayItemsDesct = _listItemsDescuento.length > 0;
        xValidFormPromo();
        actualizarPreview();
    }

    // =========================================================================
    // Vista previa
    // =========================================================================
    function actualizarPreview() {
        if (!xThisProm) return;

        const tipoNom = {
            porc:         '% de descuento',
            fijo:         'Monto fijo',
            nxn_puro:     'NxN',
            nxn_2do_porc: '2do a precio especial',
            porc_total:   '% sobre el total del pedido',
            combo:        'Combo a precio fijo',
            bogo:         'Compra X y lleva Y',
            escalonado:   'Descuento escalonado'
        }[tipoPromoActual] || 'Promoción';

        const titEl = document.getElementById('titulo_promo');
        xThisProm.previewTitulo = (titEl?.value || '').trim() || `Nueva ${tipoNom.toLowerCase()}`;

        const fIni = document.getElementById('f_ini')?.value || '';
        const fFin = document.getElementById('f_fin')?.value || '';
        const hIni = document.getElementById('h_ini')?.value || '';
        const hFin = document.getElementById('h_fin')?.value || '';

        const partes = [];
        if (tipoPromoActual === 'porc_total') {
            const p = parseFloat(document.getElementById('porc_total_input')?.value || 0);
            partes.push(p > 0 ? `${p}% de descuento sobre el total del pedido` : tipoNom);
        } else if (tipoPromoActual === 'combo') {
            const precio = parseFloat(document.getElementById('combo_precio_total')?.value || 0);
            const lista = _listItemsDescuento.length;
            if (lista > 0 && precio > 0) partes.push(`Combo de ${lista} ítem(s) a S/.${precio.toFixed(2)}`);
            else partes.push(tipoNom);
        } else if (tipoPromoActual === 'bogo') {
            const t = _listItemsDescuento.find(x => x.subtipo === 'trigger');
            const r = _listItemsDescuento.find(x => x.subtipo === 'regalo');
            if (t && r) partes.push(`Compra "${t.descripcion}" y lleva "${r.descripcion}" (${r.descuentoLabel})`);
            else partes.push(tipoNom);
        } else if (_listItemsDescuento.length > 0) {
            partes.push(`${tipoNom} sobre ${_listItemsDescuento.length} ítem(s)/sección(es)`);
        } else {
            partes.push(tipoNom);
        }

        recalcDiasSemana();
        const dias = _diasLabel(diasSemana);
        if (dias && dias !== '—') partes.push(`los ${dias}`);

        if (hIni && hFin && hIni === hFin) {
            partes.push('todo el día');
        } else if (hIni && hFin) {
            partes.push(`de ${hIni} a ${hFin}`);
        }

        if (fIni && fFin) {
            partes.push(`del ${fIni} al ${fFin}`);
        }

        xThisProm.previewFrase = partes.join(', ') + '.';

        if (_listItemsDescuento.length > 0) {
            xThisProm.previewAplicaTexto = _listItemsDescuento
                .map(x => `• ${x.descripcion} (${x.descuentoLabel})`)
                .join('\n');
        } else {
            xThisProm.previewAplicaTexto = '';
        }

        if (fIni && fFin) {
            const v = _promoEsVigente({
                parametros: { body: {
                    f_inicio: fIni, f_fin: fFin,
                    h_inicio: hIni || '00:00', h_fin: hFin || '00:00',
                    dias_semana: diasSemana
                }}
            });
            xThisProm.previewEstadoLabel = v.label;
            xThisProm.previewEstadoClass = `chip-${v.estado}`;
        } else {
            xThisProm.previewEstadoLabel = 'Sin fechas';
            xThisProm.previewEstadoClass = 'chip-pausada';
        }
    }

    function xValidFormPromo() {
        const tieneTitulo = (titulo_promo?.value || '').trim() !== '';
        const tieneDesc   = (descripcion_promo?.value || '').trim() !== '';
        recalcDiasSemana();
        const tieneDias  = diasSemana !== '';
        const tieneFechas = (f_ini?.value || '') !== '' && (f_fin?.value || '') !== '';
        const tieneHoras  = (h_ini?.value || '') !== '' && (h_fin?.value || '') !== '';

        let tipoOk = true;
        if (tipoPromoActual === 'porc_total') {
            tipoOk = parseFloat(document.getElementById('porc_total_input')?.value || 0) > 0;
        } else if (tipoPromoActual === 'combo') {
            tipoOk = _listItemsDescuento.length >= 2
                && parseFloat(document.getElementById('combo_precio_total')?.value || 0) > 0;
        } else if (tipoPromoActual === 'bogo') {
            const hayTrigger = _listItemsDescuento.some(x => x.subtipo === 'trigger');
            const hayRegalo  = _listItemsDescuento.some(x => x.subtipo === 'regalo');
            tipoOk = hayTrigger && hayRegalo;
        } else {
            tipoOk = _listItemsDescuento.length > 0;
        }

        xThisProm.isFormValid = tieneTitulo && tieneDesc && tieneDias && tieneFechas && tieneHoras && tipoOk;
    }

    async function guardarPromo() {
        recalcDiasSemana();

        const body = {
            f_fin: f_fin.value, h_fin: h_fin.value,
            f_inicio: f_ini.value, h_inicio: h_ini.value,
            solo_app: check_solo_app.checked ? 1 : 0,
            dias_semana: diasSemana,
            importe_consumo_min: parseFloat(importe_consumo_min.value || 0) === 0 ? null : importe_consumo_min.value,
            num_primeros_pedidos: parseInt(num_primeros_pedidos.value || 0, 10) === 0 ? null : num_primeros_pedidos.value,
            tipo_descuento: tipoPromoActual
        };
        if (tipoPromoActual === 'porc_total') {
            body.porc_total_pedido = parseFloat(document.getElementById('porc_total_input')?.value || 0);
        }
        if (tipoPromoActual === 'combo') {
            body.combo_precio_total = parseFloat(document.getElementById('combo_precio_total')?.value || 0);
        }
        const _parametros = {
            body: body,
            header: {
                titulo: titulo_promo.value,
                descripcion: descripcion_promo.value,
                establecio_img: compImgPromo.getIsEstablecioImg() ? 1 : 0,
                icon: xThisProm.promoIcoGifSeleted
            }
        };

        // Mapeo a idpromocion_lista legacy (compat backward).
        let idPromoListaCompat = null;
        if (Array.isArray(xThisProm.listPromos) && xThisProm.listPromos.length > 0) {
            const buscarNxN = _isNxN(tipoPromoActual);
            idPromoListaCompat = xThisProm.listPromos.find(p => (p.nxn === '1') === buscarNxN)?.idpromocion_lista
                              || xThisProm.listPromos[0].idpromocion_lista;
        }

        let idImprsoras = '';
        _listItemsDescuento.forEach(x => {
            const id = (x.idimpresora ? x.idimpresora : '') + ',';
            if (idImprsoras.indexOf(id) === -1) idImprsoras += id;
        });

        // Para BOGO mapeamos el subtipo al campo `tipo` que persiste el SP
        const listaParaSend = _listItemsDescuento.map(x => {
            const out = Object.assign({}, x);
            if (x.tipoPromo === 'bogo' && x.subtipo) {
                out.tipo = x.subtipo === 'trigger' ? 'BOGO_TRIGGER' : 'BOGO_REGALO';
            }
            return out;
        });

        const _dataSend = {
            idpromocion: idPromoSelected,
            idpromocion_lista: idPromoListaCompat,
            idimpresoras: idImprsoras,
            parametros: _parametros,
            lista: listaParaSend,
            op: 501
        };

        xValidFormPromo();
        if (!xThisProm.isFormValid) return;

        btnSucces.setLoader(true);
        xThisProm.isShowError = false;
        xThisProm.isShowMsjError = '';

        try {
            // Hacemos fetch directo para poder leer el body aunque el status sea 5xx.
            const respHttp = await fetch('../../bdphp/log_009.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(_dataSend)
            });
            const textoBody = await respHttp.text();
            console.log('guardarPromo HTTP', respHttp.status, 'body:', textoBody);

            let rpt = null;
            try { rpt = JSON.parse(textoBody); } catch (eParse) {
                throw new Error(`Servidor devolvió HTTP ${respHttp.status}. Body no es JSON: ${textoBody.substring(0, 300)}`);
            }

            if (!respHttp.ok) {
                throw new Error(`HTTP ${respHttp.status}: ${rpt && rpt.mensaje ? rpt.mensaje : textoBody.substring(0, 200)}`);
            }
            if (rpt && rpt.error) {
                throw new Error(rpt.mensaje || 'Error reportado por el servidor');
            }
            if (!rpt || rpt.respuesta === undefined || rpt.respuesta === null) {
                throw new Error('Respuesta inválida del servidor (sin campo "respuesta").');
            }
            const idGuardado = parseInt(rpt.respuesta, 10);
            if (isNaN(idGuardado) || idGuardado <= 0) {
                throw new Error('El servidor no devolvió un id válido. Resp: ' + JSON.stringify(rpt));
            }
            idPromoSelected = idGuardado;

            try {
                const nomfileImg = 'promo' + idPromoSelected;
                const img_promo = compImgPromo.getImgBase64();
                if (img_promo) uploadImgPromo(img_promo, nomfileImg);
            } catch (eImg) {
                console.warn('Error subiendo imagen (no bloquea):', eImg);
            }

            setTimeout(() => btnSucces.setSave(true), 600);

        } catch (err) {
            console.error('Error guardando promoción:', err);
            // Reset manual: el componente no expone setLoader(false)
            try {
                if (typeof xThisComBtnSuccess !== 'undefined' && xThisComBtnSuccess) {
                    xThisComBtnSuccess.loader = false;
                    xThisComBtnSuccess.isSave = false;
                }
                const _btnDom = document.getElementById('btnComSuccess');
                if (_btnDom) _btnDom.disabled = false;
            } catch (_e) { /* ignore */ }

            xThisProm.isShowError = true;
            xThisProm.isShowMsjError = 'No se pudo guardar la promoción: ' + (err && err.message ? err.message : 'error desconocido');
        }
    }

    function xModificarPromo(obj) {
        xPopupLoad.xopen();
        const idPromo = xGetIdPromo(obj);
        const dataPromo = xThisProm.dataPromociones.find(x => x.idpromocion === idPromo);
        const params = dataPromo.parametros;

        xThisProm.tituloFormulario = 'Editar promoción';
        xThisProm.medidaImg = { width: 350, height: 180 };
        idPromoSelected = idPromo;

        titulo_promo.value = params.header.titulo;
        descripcion_promo.value = params.header.descripcion;
        xThisProm.promoIcoGifSeleted = params.header.icon || firstIconGif;
        setIcoGifPromo();

        f_ini.value = params.body.f_inicio;
        f_fin.value = params.body.f_fin;
        h_ini.value = params.body.h_inicio;
        h_fin.value = params.body.h_fin;

        diasSemana = '';
        $('.check_dia').each((i, e) => {
            e.checked = String(params.body.dias_semana || '').indexOf(i) > -1;
            diasSemana += e.checked ? i.toString() + ',' : '';
        });

        num_primeros_pedidos.value = params.body.num_primeros_pedidos || 0;
        importe_consumo_min.value  = params.body.importe_consumo_min  || 0;
        check_solo_app.checked     = params.body.solo_app === 1;

        // Campos específicos por tipo nuevo
        const _porcTotalEl = document.getElementById('porc_total_input');
        if (_porcTotalEl) _porcTotalEl.value = params.body.porc_total_pedido || '';
        const _comboPrecioEl = document.getElementById('combo_precio_total');
        if (_comboPrecioEl) _comboPrecioEl.value = params.body.combo_precio_total || '';

        if (params.header.establecio_img === 1) {
            compImgPromo.setImgPathFile(URL_IMG_PROMO + dataPromo.img);
        } else {
            compImgPromo.resetControl();
        }

        // Cargar detalle
        $.ajax({ type: 'POST', url: '../../bdphp/log_009.php?op=504', data: { id: idPromo } })
            .done(res => {
                const detalle = JSON.parse(res).datos;
                _listItemsDescuento = detalle.map(x => {
                    const tipoP = params.body.tipo_descuento
                        || (parseInt(x.cantidad_x || 0, 10) > 0
                            ? (parseFloat(x.porc_descuento) > 0 ? 'nxn_2do_porc' : 'nxn_puro')
                            : 'porc');
                    let descuentoLabel = '';
                    switch (tipoP) {
                        case 'fijo':         descuentoLabel = `S/.${parseFloat(x.porc_descuento).toFixed(2)}`; break;
                        case 'nxn_puro':     descuentoLabel = `${x.cantidad}x${x.cantidad_x}`; break;
                        case 'nxn_2do_porc': descuentoLabel = `${x.cantidad}º al ${x.porc_descuento}%`; break;
                        default:             descuentoLabel = `${x.porc_descuento}%`;
                    }

                    const esSeccion = !!x.idseccion;
                    const precioNum = parseFloat(x.precio || 0);
                    const precioFinalNum = parseFloat(x.precio_final || precioNum);
                    const fraseHumana = _construirFraseHumana(tipoP, {
                        descripcion: x.descripcion,
                        esSeccion: esSeccion,
                        precio: precioNum,
                        precioFinal: precioFinalNum,
                        cantidad: x.cantidad,
                        cantidad_x: x.cantidad_x,
                        porcDescuento: parseFloat(x.porc_descuento || 0)
                    });
                    const iconoTipo = _isNxN(tipoP)
                        ? (tipoP === 'nxn_puro' ? `${x.cantidad}x${x.cantidad_x}` : `½`)
                        : (tipoP === 'fijo' ? 'S/.' : '%');
                    const alcanceLabel = esSeccion ? 'Sección completa' : (x.iditem ? 'Ítem' : 'Producto');

                    let subtipo = '';
                    if (tipoP === 'bogo') {
                        if (String(x.tipo) === 'BOGO_TRIGGER') subtipo = 'trigger';
                        else if (String(x.tipo) === 'BOGO_REGALO') subtipo = 'regalo';
                    }

                    return Object.assign({}, x, {
                        tipoPromo: tipoP,
                        subtipo: subtipo,
                        descuentoLabel,
                        fraseHumana,
                        iconoTipo,
                        alcanceLabel,
                        tipo: alcanceLabel
                    });
                });
                xThisProm.listItemsDescuento = _listItemsDescuento.slice();
                xThisProm.hayItemsDesct = _listItemsDescuento.length > 0;

                // Restaurar tipo activo (con base en tipo_descuento o el detalle)
                const tipoCargado = params.body.tipo_descuento
                    || (_listItemsDescuento[0]?.tipoPromo)
                    || 'porc';
                setTipoPromo(tipoCargado);

                xThisProm.isFormValid = true;
                xThisProm.isShowListaPromo = false;
                xPopupLoad.xclose();
                actualizarPreview();
            });
    }
