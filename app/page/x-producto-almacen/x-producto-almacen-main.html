        <paper-dialog modal id="dialog_additem_pro" class="dialog_redondo alm-dialog" modal entry-animation="scale-up-animation"
            exit-animation="fade-out-animation" with-backdrop>

                <div class="alm-dialog-head">
                    <button type="button" class="alm-dialog-close" dialog-dismiss aria-label="Cerrar">×</button>
                    <h3 class="alm-dialog-title">Agregar producto</h3>
                    <p class="alm-dialog-subtitle">Registra el producto, stock inicial y precios de venta.</p>
                </div>
                <form id="frm_item_pro_alm">
                    <label for="sel_almacen_pro">Almacen donde ingresa:</label><br>
                    <select id="sel_almacen_pro" name="no_post" class="selected-template-1"></select>
                    <br><br>
                    <div class="xLinea2"></div>

                    <div class="d-flexx">
                        <div class="mr-2">

        
                            <p class="m-0 fs-10 text-secondary mt-2">Descripcion</p>
                            <input type="text" id="descripcion" name="descripcion" placeholder="Descripcion"
                                class="selected-template-1 xPasarEnter2" onChange="conMayusculas(this)" autofocus required espaciar><br>
        
                            <p class="m-0 fs-10 text-secondary mt-2">Familia</p>
                            <input type="text" id="sel_familia_pro_alm" name="no_post" class="selected-template-1 xPasarEnter2" placeholder="Familia"
                                onChange="conMayusculas(this)" required espaciar><br>
        
                            <p class="m-0 fs-10 text-secondary mt-2">Codigo de Barras</p>
                            <input type="text" id="codigo_barra" name="codigo_barra" placeholder="Codigo de barras"
                                class="selected-template-1 xPasarEnter2" onChange="conMayusculas(this)" espaciar><br>
        
                            <p class="m-0 fs-10 text-secondary mt-2">Stock</p>
                            <input type="text" id="stock" name="no_post" placeholder="Stock" class="selected-template-1 xPasarEnter2"
                                onChange="conMayusculas(this)" espaciar required><br>
                        </div>

                        <div>
                            <p class="m-0 fs-10 text-secondary mt-2">Stock Minimo</p>
                            <input type="text" id="stock_minimo" name="stock_minimo" placeholder="Stock minimo"
                                class="selected-template-1 xPasarEnter2" onChange="conMayusculas(this)" espaciar><br>
        
                            <p class="m-0 fs-10 text-secondary mt-2">Precio de Compra</p>
                            <input type="text" id="precio" name="precio" placeholder="Precio de compra" onblur="xRetornaMoneda(this)"
                                class="selected-template-1 xPasarEnter2" onChange="conMayusculas(this)" required espaciar><br>
        
                            <p class="m-0 fs-10 text-secondary mt-2">Precio de Venta</p>                    
                            <input type="text" id="precio_venta" name="precio_venta" placeholder="Precio de venta x unidad"
                                onblur="xRetornaMoneda(this)" class="selected-template-1 xPasarEnter2 xPrecioAddPro" onChange="conMayusculas(this)"
                                required espaciar><br>
        
                            

                        </div>
                    </div>

                    <div>
                        <br>
                        <paper-checkbox id="check_venta_x_peso"></paper-checkbox>Se vendará por peso<br>
                        <span class="text-secondary fs-11">Podrá modificar la cantidad en Punto de Venta.</span>
                    </div>

                    <br><br>
                    <div class="xLinea2"></div>

                        
                    <div class="xInvisible">
                        <input type="text" id="idproducto" name="idproducto">
                        <input type="text" id="idorg" name="idorg">
                        <input type="text" id="idsede" name="idsede">
                        <input type="text" id="idproducto_familia" name="idproducto_familia">
                        <input type="text" id="precio_unitario" name="precio_unitario">
                        <input type="text" id="venta_x_peso" name="venta_x_peso">
                    </div>
                </form>
                <br><br>
                <div class="xBoton2 xAzul" onclick="xGuardarItemProPP();">Listo, guardar</div>
                <div class="xBoton2 xPlomo" dialog-dismiss>Cancelar</div>
                <br><br><br>
            </div>
        </paper-dialog>


        <div class="p-2">

            <div class="xMiCard xradius alm-shell" style="width:90%; max-width: 1250px;">
                <div class="xEncanezadoCard d-flexx justify-content-between"
                    style="background: lavenderblush; color: #424242;">
                    <div class="div-content-head-op">
                        <p class="fw-600 fs-18">Productos en Almacen</p>
                        <p class="fw-100 text-secondary fs-12">Los productos que se encuentren en almacen "Bodega" apareceran en todas sus cartas, disponible para la venta.</p>
                    </div>
                    <div>
                        <button class="btn btn-sm btn-secondary" hidden$="[[isShowMainProducto]]"
                            onclick="goMainProducto()">Atras</button>
                    </div>
                </div>
                <div class="p-3">
                    

                    <!-- main -->
                    <div hidden$="[[!isShowMainProducto]]">
                        <!-- header -->

                        <div class="alm-toolbar">
                            <div>
                                <div class="alm-warehouse-row">
                                    <label class="alm-filter-label">Almacen</label>
                                    <x-comp-find-almacen id="sel_almacen_pp" optodos="true"></x-comp-find-almacen>
                                </div>
                                <div class="alm-search-row mt-1 mb-1">
                                    <div class="alm-search-field">
                                        <label class="alm-filter-label">Buscar</label>
                                        <input type="text" class="selected-template-1 w-100" placeholder="Producto o familia" inline id="txt_buscar_producto_almacen">
                                        <span class="alm-help">Busca por nombre del producto o por su familia.</span>
                                    </div>
                                </div>
                                <label class="alm-check">
                                    <paper-checkbox id="chec_min"></paper-checkbox>
                                    <span>Solo stock minimo</span>
                                </label>
                            </div>
                            <div class="alm-action-row" style="flex-direction: column; align-items: flex-end;">
                                <button class="btn btn-sm btn-secondary" onclick="goProductoFamilias();">
                                    <i class="fa fa-group"></i> Familias </button>
                                <button class="btn btn-sm btn-primary" onclick="dialog_additem_pro.open();">
                                    + Agregar producto </button>
                                <button class="btn btn-sm btn-success" onclick="exportarProductosExcel();">
                                    <i class="fa fa-file-excel-o"></i> Exportar a Excel </button>
                            </div>
                        </div>

                        <div class="alm-summary-grid">
                            <div class="alm-kpi alm-kpi-products" onclick="filtrarTodosProductosAlmacen()">
                                <p class="alm-kpi-label">Productos filtrados</p>
                                <p class="alm-kpi-value">{{ totalProductos }}</p>
                                <span class="alm-kpi-note">Ver todos</span>
                            </div>
                            <div class="alm-kpi alm-kpi-stock" onclick="filtrarTodosProductosAlmacen()">
                                <p class="alm-kpi-label">Stock total</p>
                                <p class="alm-kpi-value">{{ totalStockProductos }}</p>
                                <span class="alm-kpi-note">Segun filtro actual</span>
                            </div>
                            <div class="alm-kpi alm-kpi-danger" onclick="filtrarStockMinimoAlmacen()">
                                <p class="alm-kpi-label">Bajo stock minimo</p>
                                <p class="alm-kpi-value">{{ totalStockMinimo }}</p>
                                <span class="alm-kpi-note">Ver alertas</span>
                            </div>
                            <div class="alm-kpi alm-kpi-view" onclick="filtrarTodosProductosAlmacen()">
                                <p class="alm-kpi-label">Vista actual</p>
                                <p class="alm-kpi-value fs-15">{{ almacenResumen }}</p>
                                <span class="alm-kpi-note">Conservar almacen</span>
                            </div>
                        </div>

                        <div class="alm-table-wrap">
                            <table class="alm-table">
                                <thead>
                                    <tr>
                                        <th width="28%">Producto</th>
                                        <th width="18%">Familia</th>
                                        <th width="18%">Almacen</th>
                                        <th width="120px">Stock</th>
                                        <template is="dom-repeat" items="{{tipoPrecios}}" as="tipo">
                                            <th width="90px">P. {{ tipo.titulo }}</th>
                                        </template>
                                        <th width="90px">Accion</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template is="dom-repeat" items="{{xdt_prodcutos}}" as="item" index-as="productoIndex">
                                        <tr data-id="[[item.idproducto_stock]]" class="xCursor">
                                            <td>
                                                <p class="alm-product-name">{{ item.producto }}</p>
                                            </td>
                                            <td><span class="alm-chip">{{ item.familia }}</span></td>
                                            <td><span class="alm-chip">{{ item.almacen }}</span></td>
                                            <td>
                                                <div class$="alm-stock [[_stockClass(item)]]">
                                                    <span class="alm-stock-main">{{ item.stock }}</span>
                                                    <template is="dom-if" if="[[_isStockBajo(item)]]">
                                                        <span class="alm-stock-alert">
                                                            <i class="fa fa-exclamation-triangle"></i> Bajo minimo
                                                        </span>
                                                    </template>
                                                </div>
                                            </td>
                                            <template is="dom-repeat" items="{{item.tipo_precios}}" as="tipo" index-as="tipoIndex">
                                                <td class="alm-price-cell">
                                                    <span class="alm-price-edit" on-click="mostrarInput" data-tipo-index$="{{tipoIndex}}" data-producto-index$="{{productoIndex}}">{{ tipo.precio }}</span>
                                                    <input type="text" class="hidden w-50 selected-template-1" value="{{tipo.precio::input}}" data-tipo-index$="{{tipoIndex}}"
                                                        data-producto-index$="{{productoIndex}}" on-blur="ocultarInput" on-change="guardarPrecio">
                                                </td>
                                            </template>
                                            <td>
                                                <button data-id="[[item.idproducto_stock]]" onclick="xGoDetalleProducto(this)"
                                                    class="alm-detail-btn">
                                                    Detalle
                                                </button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                        <br><br>                        
                        <br>
                    </div>

    function xLoadProductos_dt(xid_filtro) {

                        return {

        const checkStockMin = document.getElementById('chec_min');
        if (checkStockMin) checkStockMin.checked = false;
        xAplicarFiltrosCombinados();
    }
    
    // Ya no necesitamos esta función porque se eliminó el selector de familia

    function xAplicarFiltrosCombinados() {
        // Obtener valores de los filtros
            const textoBusqueda = String($("#txt_buscar_producto_almacen").val() || '').toLowerCase();
            const filtroStockMin = $("#chec_min").prop('checked');
            const almacenSeleccionado = sel_almacen_pp.getAlmacen();
            const filtroAlmacen = almacenSeleccionado ? almacenSeleccionado.idalmacen : '';

        // Aplicar todos los filtros en conjunto
        xThisAlmPro.xdt_prodcutos = xThisAlmPro.listProductosMaster.filter(x => {
            // Filtro por texto de búsqueda (producto o familia)
            const pasaTextoProducto = String(x.producto || '').toLowerCase().includes(textoBusqueda);
            const pasaTextoFamilia = String(x.familia || '').toLowerCase().includes(textoBusqueda);
            const pasaTexto = pasaTextoProducto || pasaTextoFamilia;
            
            // Filtro por stock mínimo
            const pasaStockMin = !filtroStockMin || (parseFloat(x.stock_minimo) >= parseFloat(x.stock));
            
            // Filtro por almacén - solo aplicamos el filtro si hay un almacén seleccionado
            // Si el almacén seleccionado es "TODOS LOS ALMACENES" (idalmacen vacío) o no hay almacén seleccionado,
            // mostramos todos los productos
            const pasaAlmacen = filtroAlmacen === '' || x.idalmacen === filtroAlmacen;
            
            // Producto pasa todos los filtros
            return pasaTexto && pasaStockMin && pasaAlmacen;
        });
        
        xSumTotalProductoAlmacen();
    }

    function xSumTotalProductoAlmacen() {
        xThisAlmPro.totalProductos = xThisAlmPro.xdt_prodcutos.length;
        xThisAlmPro.totalStockProductos = Number(xThisAlmPro.xdt_prodcutos.reduce((sum, producto) => sum + parseFloat(producto.stock || 0), 0).toFixed(2));
        xThisAlmPro.totalStockMinimo = xThisAlmPro.xdt_prodcutos.filter(producto => parseFloat(producto.stock || 0) < parseFloat(producto.stock_minimo || 0)).length;

        try {
            const almacenSeleccionado = sel_almacen_pp && sel_almacen_pp.getAlmacen ? sel_almacen_pp.getAlmacen() : null;
            xThisAlmPro.almacenResumen = almacenSeleccionado && almacenSeleccionado.descripcion ? almacenSeleccionado.descripcion : 'Todos los almacenes';
        } catch (e) {
            xThisAlmPro.almacenResumen = 'Todos los almacenes';
        }
    }
    
    function exportarProductosExcel() {
        // Verificar si hay productos para exportar
        if (!xThisAlmPro.xdt_prodcutos || xThisAlmPro.xdt_prodcutos.length === 0) {
            alert('No hay productos para exportar');
            return;
        }
        
        try {
            // Crear un array con los datos de la tabla
            const datos = [];
            
            // Agregar encabezados
            datos.push(['Almacén', 'Familia', 'Producto', 'Stock', 'Stock Mínimo', 'Unidad', 'Precio']);
            
            // Agregar datos de productos
            xThisAlmPro.xdt_prodcutos.forEach(producto => {
                datos.push([
                    producto.almacen || '',
                    producto.familia || '',
                    producto.producto || '',
                    producto.stock || '0',
                    producto.stock_minimo || '0',
                    producto.unidad || '',
                    producto.precio || '0'
                ]);
            });
            
            // Crear una hoja de cálculo con SheetJS
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(datos);
            
            // Establecer anchos de columna
            const wscols = [
                {wch: 15}, // Almacén
                {wch: 15}, // Familia
                {wch: 40}, // Producto
                {wch: 10}, // Stock
                {wch: 15}, // Stock Mínimo
                {wch: 10}, // Unidad
                {wch: 15}  // Precio
            ];
            ws['!cols'] = wscols;
            
            // Agregar la hoja al libro
            XLSX.utils.book_append_sheet(wb, ws, 'Productos');
            
            // Generar el archivo y descargarlo
            const nombreArchivo = 'productos_almacen_' + new Date().toISOString().slice(0, 10) + '.xlsx';
            XLSX.writeFile(wb, nombreArchivo);
            
        } catch (error) {
            console.error('Error al exportar a Excel:', error);
            alert('Error al exportar a Excel: ' + error.message);
        }
    }

        var tipoIndex = e.target.getAttribute('data-tipo-index');

        var input = Polymer.dom(this.root).querySelector(`input[data-tipo-index="${tipoIndex}"][data-producto-index="${productoIndex}"]`);
        var span = e.target;
        if (input) {
            input.classList.remove('hidden');
            span.classList.add('hidden');
            input.select();
            input.focus();
        }
    },
    ocultarInput: function (e) {
        var tipoIndex = e.target.getAttribute('data-tipo-index');
        var productoIndex = e.target.getAttribute('data-producto-index');
        var input = e.target;
        var span = Polymer.dom(this.root).querySelector(`span[data-tipo-index="${tipoIndex}"][data-producto-index="${productoIndex}"]`);
