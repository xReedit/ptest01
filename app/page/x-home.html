async function xVerificarAcc(){
	xArray_us_home=xm_log_get('app3_Us_home');
	xper_bd=xm_log_get('app3_woA');

	const dataSede = xm_log_get('datos_org_sede');
	const dataSedeMarca = xm_log_get('datos_sede_holding');

	let isHoldingCenter = false;
	try {
		isHoldingCenter = dataSede[0].is_holding === '1';		
	} catch (error) {
		console.error('Error al verificar is_holding:', error);
	}

	console.log('dataSede', dataSede);
	console.log('dataSedeMarca', dataSedeMarca);

	
	try {		
		if (isHoldingCenter) {
			await getHoldingOpcionesCenter();
		}
	
		if (dataSedeMarca.length > 0) {
			await getHoldingOpcionesMarca();
		}
	} catch (error) {
		console.error('Error al cargar opciones de holding:', error);
	}


	console.log('xArray_us_home', xArray_us_home);

	//xLoadSetDatosSession(function(acc){
		//xper_bd=acc;
		var xCharAcc='';
		var xOpView=new Array();
		var xidGrupoBd;
		var xTituloSeccion;
		var xt;

		if(typeof xper_bd === 'string'){
			xper_bd=xper_bd.split(',')
		}
		
		for (var i = 0; i < xper_bd.length; i++) {
			xCharFind=xper_bd[i];
		

			// verificar solo tiene un permiso entonces lleva a ese permiso son mostrar panel principal - caso contador			
			if (xper_bd.length === 2 ) { 
				const _codOne = xArray_us_home.filter(x => x.codigo === xCharFind).map( x => x.num_opcion)[0];
				xOneOptionPage(_codOne);
				return; 
			}

			for (var z = 0; z < xArray_us_home.length; z++) {
				if(xArray_us_home[z].codigo==xCharFind){					
					xidGrupoBd=xArray_us_home[z].idgrupo
					if(xOpView[xidGrupoBd]==undefined){
						switch(xidGrupoBd){
							case '0':xTituloSeccion='Operatividad'; break;
							case '1':xTituloSeccion='Logistica'; break;
							case '2':xTituloSeccion='Contable'; break;
							case '3':xTituloSeccion='Administracion'; break;
						}
						xOpView[xidGrupoBd]={'titulo':xTituloSeccion};
					}
					xOpView[xidGrupoBd][i]={op:'<div class="xMiBoton_icon" data-id="'+xCharFind+'" data-op="'+xArray_us_home[z].num_opcion+'"><img src="../../images/'+xArray_us_home[z].img+'"><p>'+xArray_us_home[z].titulo+'</p></div>'};
				}
			};
		};

		var xHtmlOpView='';

		// facturacion del servicios		
		xOpView[xOpView.length - 1][-1] = {op: '<div class=\"xMiBoton_icon\" data-id=\"F1\" data-op=\"47\"><img src=\"../../images/_e_facturacion.png\"><p>Facturación</p></div>'};


		for (i in xOpView) {
			xHtmlOpView=String(xHtmlOpView+'<div><h3>'+xOpView[i].titulo+'</h3><div class="xLinea2"></div><br>')

			$.map(xOpView[i], function(n, z) {
				if (typeof n=="object"){
					xHtmlOpView=String(xHtmlOpView+xOpView[i][z].op);
				}
			})
			xHtmlOpView=String(xHtmlOpView+'</div><br>');
		};
		

		$("#xBodyOp").html(xHtmlOpView).trigger('create');
	//})

	// verificar si hay problemas de cpe xml
	// checkAlertCPESede()
}

async function getHoldingOpcionesMarca() {
	const dt = await $.ajax({
		type: 'POST',
		url: '../../bdphp/log_010.php?op=get-holding-opciones-marca'
	});			
	
	const rpt = JSON.parse(dt);	
	try {			
		addHoldingOpciones(rpt.datos);
	} catch (error) {
		console.log(error);			
	}
}

async function getHoldingOpcionesCenter() {
	const dt = await $.ajax({
		type: 'POST',
		url: '../../bdphp/log_010.php?op=get-holding-opciones-center'
	});			
	const rpt = JSON.parse(dt);	
	try {	
		addHoldingOpciones(rpt.datos);		
	} catch (error) {
		console.log(error);			
	}
}

function addHoldingOpciones(listOpciones) {
	// solo si el usuario tiene mas de 4 opciones asignadas
	xper_bd = xper_bd.split(',');
	if (xper_bd.length < 4) return;
	listOpciones.forEach(element => {
		xArray_us_home.push(element);		
		xper_bd.push(element.codigo);
		xper_bd = xper_bd.join(',');
	});
}
