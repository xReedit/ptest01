<dom-module id="x-inventario-conteos">
	<template>
		<paper-dialog modal id="dlg_inv_nuevo" class="xdlg" entry-animation="scale-up-animation" exit-animation="fade-out-animation">
			<div class="xContent">
				<div class="xdlg-head">
					<h3>Nuevo conteo</h3>
					<p>Elige que se va a contar. Al crearlo se congela la lista de items del alcance.</p>
				</div>
				<div class="xdlg-body">
					<div class="inv-form-row">
						<span class="inv-label">Alcance</span>
						<select class="inv-select inv-w100" id="inv_sel_almacen"></select>
					</div>
					<div class="inv-form-row" id="inv_div_familia">
						<span class="inv-label">Familia (solo productos)</span>
						<select class="inv-select inv-w100" id="inv_sel_familia"><option value="">TODAS</option></select>
					</div>
					<div class="inv-form-row">
						<label class="inv-check"><input type="checkbox" id="inv_chk_ciego" checked> Conteo ciego <span class="inv-muted">&nbsp;· quien cuenta no ve el stock del sistema</span></label>
					</div>
					<div class="inv-form-row">
						<span class="inv-label">Observacion (opcional)</span>
						<input type="text" class="inv-input inv-w100" id="inv_txt_obs" placeholder="Ej: conteo de fin de mes" maxlength="250">
					</div>
				</div>
				<div class="xdlg-foot">
					<button class="btn btn-sm btn-light" dialog-dismiss>Cancelar</button>
					<button class="btn btn-sm btn-success" onclick="xInvCrearConteo()">Crear conteo</button>
				</div>
			</div>
		</paper-dialog>
		<br>
		<div class="xMiCard xradius inv-card">
			<div class="xEncanezadoCard inv-head">
				<div class="inv-head-top">
					<div>
						<h3>Conteos fisicos de inventario</h3>
						<p>Crea un conteo por almacen (o de porciones), cuenta, cierra y un administrador aprueba. Al aprobar, las diferencias se registran como AJUSTE INVENTARIO en el kardex.</p>
					</div>
					<div class="inv-head-acciones">
						<button class="btn btn-sm btn-light" onclick="xInvIr('reportes')">Reportes</button>
						<button class="btn btn-sm btn-success" onclick="xInvAbrirNuevo()">+ Nuevo conteo</button>
					</div>
				</div>
			</div>
			<div class="xContentCard">
				<div class="inv-toolbar">
					<div class="inv-field">
						<span class="inv-label">Estado</span>
						<select class="inv-select" id="inv_filtro_estado" onchange="xInvConteosCargar()">
							<option value="">Todos los estados</option>
							<option value="borrador">Borrador</option>
							<option value="cerrado">Cerrado (por aprobar)</option>
							<option value="aprobado">Aprobado</option>
							<option value="anulado">Anulado</option>
						</select>
					</div>
					<span class="inv-sep"></span>
					<p class="inv-ayuda" id="inv_conteos_resumen"></p>
				</div>
				<div class="inv-table-wrap">
					<table class="inv-table" id="tb_inv_conteos">
						<thead><tr>
							<th>#</th><th>Alcance</th><th>Familia</th><th>Estado</th><th>Creado</th>
							<th class="inv-num">Items</th><th class="inv-num">Contados</th><th class="inv-num">Con dif.</th>
							<th>Aprobado</th><th>Acciones</th>
						</tr></thead>
						<tbody></tbody>
					</table>
				</div>
			</div>
		</div>
		<br><br>
	</template>
<script>
function xInvConteosCargar() {
	xPopupLoad.titulo = 'Cargando...'; xPopupLoad.xopen();
	xInvApi('listar', { estado: $('#inv_filtro_estado').val() || '' }).then(function (r) {
		xPopupLoad.xclose();
		if (!r.success) { return; }
		var html = '';
		r.datos.forEach(function (c) {
			var acc = '';
			if (c.estado === 'borrador') { acc += '<span class="inv-link" onclick="xInvIr(\'contar\',' + c.idinventario_conteo + ')">Contar</span><span class="inv-link" onclick="xInvAnular(' + c.idinventario_conteo + ')">Anular</span>'; }
			if (c.estado === 'cerrado') { acc += '<span class="inv-link" onclick="xInvIr(\'resultado\',' + c.idinventario_conteo + ')">Revisar / Aprobar</span><span class="inv-link" onclick="xInvAnular(' + c.idinventario_conteo + ')">Anular</span>'; }
			if (c.estado === 'aprobado') { acc += '<span class="inv-link" onclick="xInvIr(\'resultado\',' + c.idinventario_conteo + ')">Ver resultado</span>'; }
			html += '<tr>' +
				'<td>' + c.idinventario_conteo + '</td>' +
				'<td>' + xInvEsc(c.almacen) + (parseInt(c.ciego) === 1 ? ' <span class="inv-tag">ciego</span>' : '') + '</td>' +
				'<td>' + xInvEsc(c.familia) + '</td>' +
				'<td><span class="inv-estado ' + c.estado + '">' + c.estado.toUpperCase() + '</span></td>' +
				'<td>' + xInvEsc(c.fecha_crea || '') + '<span class="inv-sub">' + xInvEsc(c.crea || '') + '</span></td>' +
				'<td class="inv-num">' + c.n_items + '</td>' +
				'<td class="inv-num">' + c.n_contados + '</td>' +
				'<td class="inv-num">' + ((c.n_dif === null || c.n_dif === undefined) ? '-' : c.n_dif) + '</td>' +
				'<td>' + (c.fecha_aprob ? xInvEsc(c.fecha_aprob) + '<span class="inv-sub">' + xInvEsc(c.aprob || '') + '</span>' : '<span class="inv-muted">-</span>') + '</td>' +
				'<td class="inv-acciones">' + acc + '</td></tr>';
		});
		$('#tb_inv_conteos tbody').html(html || '<tr><td colspan="10" class="inv-empty">No hay conteos con este filtro. Crea uno con <b>+ Nuevo conteo</b>.</td></tr>');
		$('#inv_conteos_resumen').text(r.datos.length ? r.datos.length + ' conteo(s)' : '');
	});
}
function xInvAbrirNuevo() {
	$.ajax({ type: 'POST', url: '../../bdphp/log.php?op=1604' }).done(function (txt) {
		var alm = $.parseJSON(txt).datos || [];
		var html = '<option value="0">PORCIONES (cocina)</option>';
		alm.forEach(function (a) { html += '<option value="' + a.idalmacen + '">ALMACEN: ' + xInvEsc(a.descripcion) + '</option>'; });
		$('#inv_sel_almacen').html(html).off('change').on('change', function () { $('#inv_div_familia').toggle(parseInt(this.value) > 0); });
		$('#inv_div_familia').hide();
		$.ajax({ type: 'POST', url: '../../bdphp/log.php?op=1601' }).done(function (t2) {
			var fam = $.parseJSON(t2).datos || [];
			var h2 = '<option value="">TODAS</option>';
			fam.forEach(function (f) { h2 += '<option value="' + f.value + '">' + xInvEsc(f.label) + '</option>'; });
			$('#inv_sel_familia').html(h2);
			$('#inv_txt_obs').val(''); $('#inv_chk_ciego').prop('checked', true);
			dlg_inv_nuevo.open();
		}).fail(function () { xInvAviso('No se pudo cargar almacenes/familias', 'error'); });
	}).fail(function () { xInvAviso('No se pudo cargar almacenes/familias', 'error'); });
}
function xInvCrearConteo() {
	var body = { idalmacen: parseInt($('#inv_sel_almacen').val()) || 0, idfamilia: $('#inv_sel_familia').val() || '',
		ciego: $('#inv_chk_ciego').is(':checked') ? 1 : 0, obs: $('#inv_txt_obs').val() };
	xPopupLoad.titulo = 'Creando conteo...'; xPopupLoad.xopen();
	xInvApi('crear', body).then(function (r) {
		xPopupLoad.xclose();
		if (!r.success) { return; }
		dlg_inv_nuevo.close();
		xInvIr('contar', r.datos.id);
	});
}
function xInvAnular(id) {
	xInvConfirmar('No se aplicara ningun ajuste al stock.', 'Anular el conteo #' + id + '?', 'Si, anular').then(function (ok) {
		if (!ok) { return; }
		xInvApi('anular', { id: id }).then(function (r) { if (r.success) { xInvConteosCargar(); } });
	});
}
Polymer({ is: 'x-inventario-conteos' });
</script>
</dom-module>
