<dom-module id="x-inventario-mermas">
	<template>
		<paper-dialog modal id="dlg_inv_merma" class="xdlg" entry-animation="scale-up-animation" exit-animation="fade-out-animation">
			<div class="xContent">
				<div class="xdlg-head">
					<h3>Registrar merma</h3>
					<p>Lo que se rompió, venció, malogró o consumió el personal. Se descuenta del almacén.</p>
				</div>
				<div class="xdlg-body">
					<div class="inv-form-row">
						<span class="inv-label">Almacén</span>
						<select class="inv-select inv-w100" id="inv_mm_alm" onchange="xInvMermaDatos(this.value)"></select>
					</div>
					<div class="inv-form-row">
						<span class="inv-label">Producto</span>
						<input type="text" class="inv-input inv-w100" id="inv_mm_prod" list="inv_mm_lista" placeholder="Escribe para buscar..." oninput="xInvMermaProd()">
						<datalist id="inv_mm_lista"></datalist>
						<span class="inv-sub" id="inv_mm_hay"></span>
					</div>
					<div class="inv-form-row">
						<span class="inv-label">Cuánto se perdió</span>
						<input type="number" class="inv-input" id="inv_mm_cant" min="0" step="any" inputmode="decimal" style="width:120px"> <span class="inv-muted" id="inv_mm_und"></span>
					</div>
					<div class="inv-form-row">
						<span class="inv-label">¿Por qué?</span>
						<select class="inv-select inv-w100" id="inv_mm_mot">
							<option value="">— elegir —</option>
							<option value="roto">Se rompió o derramó</option>
							<option value="vencido">Se venció</option>
							<option value="mal_estado">En mal estado / malogrado</option>
							<option value="consumo">Consumo del personal</option>
							<option value="otro">Otro (escribe qué pasó)</option>
						</select>
					</div>
					<div class="inv-form-row">
						<span class="inv-label">Nota (opcional)</span>
						<input type="text" class="inv-input inv-w100" id="inv_mm_nota" maxlength="150" placeholder="Ej: se cayó la caja al descargar">
					</div>
				</div>
				<div class="xdlg-foot">
					<button class="btn btn-sm btn-light" dialog-dismiss><i class="fa fa-times"></i>Cancelar</button>
					<button class="btn btn-sm btn-success" id="inv_mm_ok" onclick="xInvMermaGuardar()"><i class="fa fa-check"></i>Registrar merma</button>
				</div>
			</div>
		</paper-dialog>
		<br>
		<div class="xMiCard xradius inv-card">
			<div class="xEncanezadoCard inv-head">
				<div class="inv-head-top">
					<div>
						<h3>Mermas y pérdidas</h3>
						<p>Cuánto se pierde y por qué: mermas registradas, salidas por deterioro o consumo del personal, y lo que faltó en los conteos aprobados.</p>
					</div>
					<div class="inv-head-acciones">
						<button class="btn btn-sm btn-light" onclick="xInvIr('conteos')"><i class="fa fa-arrow-left"></i>Volver a conteos</button>
						<button class="btn btn-sm btn-success" onclick="xInvMermaAbrir()"><i class="fa fa-plus"></i>Registrar merma</button>
					</div>
				</div>
			</div>
			<div class="xContentCard">
				<div class="inv-toolbar">
					<div class="inv-field">
						<span class="inv-label">Periodo</span>
						<select class="inv-select" id="inv_pd_per" onchange="xInvPerdidasCargar()">
							<option value="mes">Este mes</option>
							<option value="7">Últimos 7 días</option>
							<option value="30">Últimos 30 días</option>
							<option value="mes_ant">Mes pasado</option>
						</select>
					</div>
					<div class="inv-field">
						<span class="inv-label">&nbsp;</span>
						<div><button class="btn btn-sm btn-light" onclick="xInvExcel('tb_inv_perdidas', 'Mermas y perdidas')"><i class="fa fa-file-excel-o"></i>Excel</button></div>
					</div>
					<span class="inv-sep"></span>
					<p class="inv-resumen" id="inv_pd_total"></p>
				</div>
				<p class="inv-resumen" id="inv_pd_motivos"></p>
				<div class="inv-table-wrap">
					<table class="inv-table" id="tb_inv_perdidas">
						<thead><tr>
							<th>Cuándo</th><th>Producto</th><th class="inv-num">Cantidad</th><th>Motivo</th><th>Almacén</th><th>Quién</th><th class="inv-num">Valor</th>
						</tr></thead>
						<tbody></tbody>
					</table>
				</div>
			</div>
		</div>
		<br><br>
	</template>
<script>
// Mermas del modulo Inventario. La logica (stock, kardex, lotes, reporte) vive en bdphp/_mermas.php,
// la misma que usa Logistica para ver todas las sedes. Estado en .data() del dialogo: nada suelto en nivel superior.

function xInvPerdidasCargar() {
	xPopupLoad.titulo = 'Cargando...'; xPopupLoad.xopen();
	xInvApi('perdidas', { periodo: $('#inv_pd_per').val() }).then(function (r) {
		xPopupLoad.xclose();
		if (!r.success) { return; }
		var d = r.datos, html = '';
		d.filas.forEach(function (f) {
			html += '<tr><td>' + xInvEsc(f.fecha) + '</td><td>' + xInvEsc(f.producto) + '</td>' +
				'<td class="inv-num">' + xInvFmtNum(f.cantidad) + ' ' + xInvEsc(f.unidad) + '</td>' +
				'<td>' + xInvEsc(d.nombres[f.motivo] || f.motivo) + (f.origen === 'almacen' ? ' <span class="inv-tag">salida de almacén</span>' : '') +
				(f.nota ? '<span class="inv-sub">' + xInvEsc(f.nota) + '</span>' : '') + '</td>' +
				'<td>' + xInvEsc(f.almacen || '') + '</td><td>' + xInvEsc(f.usuario || '') + '</td>' +
				'<td class="inv-num">' + xInvFmtSoles(f.valor) + '</td></tr>';
		});
		$('#tb_inv_perdidas tbody').html(html || '<tr><td colspan="7" class="inv-empty">No hay pérdidas en este periodo.</td></tr>');
		$('#inv_pd_total').html(d.filas.length ? 'Total perdido: <b class="inv-neg">' + xInvFmtSoles(d.total) + '</b>' : '');
		$('#inv_pd_motivos').html(Object.keys(d.motivos).map(function (k) {
			return xInvEsc(d.nombres[k] || k) + ': <b>' + xInvFmtSoles(d.motivos[k]) + '</b>';
		}).join(' &nbsp;·&nbsp; '));
	});
}
function xInvMermaAbrir() {
	$('#dlg_inv_merma').data('token', 'mm' + Date.now() + Math.random().toString(36).slice(2));   // doble clic -> una sola merma
	$('#inv_mm_prod, #inv_mm_cant, #inv_mm_nota').val(''); $('#inv_mm_mot').val(''); $('#inv_mm_hay, #inv_mm_und').text('');
	xInvMermaDatos(0, true);
}
// carga almacenes y los productos con stock del almacen elegido
// al cambiar de almacen rapido solo vale la ultima respuesta (una lenta no pisa la lista del almacen elegido)
function xInvMermaDatos(idalmacen, abrir) {
	var dlg = $('#dlg_inv_merma'), pedido = (dlg.data('pedido') || 0) + 1, idalm = parseInt(idalmacen) || 0;
	dlg.data('pedido', pedido);
	if (!abrir) { dlg.data('productos', []); xInvMermaProd(); }   // mientras carga no se usa el stock del almacen anterior
	xInvApi('merma-datos', { idalmacen: idalm }).then(function (r) {
		if (dlg.data('pedido') !== pedido) { return; }
		if (idalm && parseInt($('#inv_mm_alm').val()) !== idalm) { return; }
		if (!r.success) { return; }
		$('#dlg_inv_merma').data('productos', r.datos.productos);
		$('#inv_mm_alm').html(r.datos.almacenes.map(function (a) {
			return '<option value="' + a.idalmacen + '"' + (parseInt(a.idalmacen) === r.datos.idalmacen ? ' selected' : '') + '>' + xInvEsc(a.descripcion) + '</option>';
		}).join(''));
		$('#inv_mm_lista').html(r.datos.productos.map(function (p) { return '<option value="' + xInvAttr(p.descripcion) + '">'; }).join(''));
		$('#inv_mm_prod').val(''); xInvMermaProd();
		if (abrir) { dlg_inv_merma.open(); }
	});
}
function xInvMermaElegido() {
	var t = $.trim($('#inv_mm_prod').val()).toUpperCase();
	return ($('#dlg_inv_merma').data('productos') || []).filter(function (p) { return p.descripcion.toUpperCase() === t; })[0] || null;
}
function xInvMermaProd() {
	var p = xInvMermaElegido();
	$('#inv_mm_hay').text(p ? 'Hay ' + xInvFmtNum(p.stock) + ' ' + p.unidad + ' en este almacén' : '');
	$('#inv_mm_und').text(p ? p.unidad : '');
}
function xInvMermaGuardar() {
	var p = xInvMermaElegido(), cant = parseFloat($('#inv_mm_cant').val()), mot = $('#inv_mm_mot').val();
	if (!p) { xInvAviso('Elige el producto de la lista.'); return; }
	if ($('#inv_mm_cant')[0].validity.badInput) { xInvAviso('La cantidad está mal escrita. Usa punto para decimales (ej: 1.5).'); return; }
	if (!(cant > 0)) { xInvAviso('Escribe cuánto se perdió.'); return; }
	if (cant > p.stock) { xInvAviso('Solo hay ' + xInvFmtNum(p.stock) + ' ' + p.unidad + ' de ' + p.descripcion + '.'); return; }
	if (!mot) { xInvAviso('Elige por qué se perdió.'); return; }
	if (mot === 'otro' && !$.trim($('#inv_mm_nota').val())) { xInvAviso('Si el motivo es "Otro", escribe qué pasó en la nota.'); return; }
	$('#inv_mm_ok').prop('disabled', true);
	xInvApi('merma-registrar', { idalmacen: parseInt($('#inv_mm_alm').val()), idproducto: p.idproducto, cantidad: cant, motivo: mot,
		nota: $('#inv_mm_nota').val(), token: $('#dlg_inv_merma').data('token') }).then(function (r) {
		$('#inv_mm_ok').prop('disabled', false);
		if (!r.success) { return; }
		dlg_inv_merma.close();
		xInvAviso(xInvFmtNum(r.datos.cantidad) + ' de ' + r.datos.producto + ' (' + xInvFmtSoles(r.datos.valor) + ') registrado como merma.', 'success', 'Listo');
		xInvPerdidasCargar();
	});
}
Polymer({ is: 'x-inventario-mermas' });
</script>
</dom-module>
