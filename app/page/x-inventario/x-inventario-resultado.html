<dom-module id="x-inventario-resultado">
	<template>
		<br>
		<div class="xMiCard xradius inv-card">
			<div class="xEncanezadoCard inv-head">
				<div class="inv-head-top">
					<div>
						<h3 id="inv_res_titulo">Resultado del conteo</h3>
						<p id="inv_res_nota">Revisa las diferencias, desmarca lo que no quieras ajustar y aprueba.</p>
					</div>
					<div class="inv-head-acciones">
						<button class="btn btn-sm btn-light" onclick="xInvIr('conteos')"><i class="fa fa-arrow-left"></i>Volver</button>
						<button class="btn btn-sm btn-light" onclick="xInvExcel('tb_inv_resultado', 'Resultado conteo')"><i class="fa fa-file-excel-o"></i>Excel</button>
						<button class="btn btn-sm btn-success" id="inv_res_btn_aprobar" onclick="xInvAprobar()" style="display:none"><i class="fa fa-check-circle"></i>Aprobar y aplicar ajustes</button>
					</div>
				</div>
			</div>
			<div class="xContentCard">
				<div class="inv-kpis" id="inv_res_kpis"></div>
				<div class="inv-toolbar">
					<label class="inv-check"><input type="checkbox" id="inv_res_solo_dif" checked onchange="xInvResFiltrar()"> Mostrar solo items con diferencia</label>
					<span class="inv-sep"></span>
					<p class="inv-ayuda" id="inv_res_ayuda"></p>
				</div>
				<div class="inv-table-wrap">
					<table class="inv-table" id="tb_inv_resultado">
						<thead><tr>
							<th class="inv-cen">Aplicar</th><th>Producto</th><th>Familia</th><th>Und.</th>
							<th class="inv-num">Sistema</th><th class="inv-num">Contado</th><th class="inv-num">Diferencia</th>
							<th class="inv-num">Costo</th><th class="inv-num">Dif. S/</th><th>Conto</th><th>Obs.</th>
						</tr></thead>
						<tbody></tbody>
					</table>
				</div>
			</div>
		</div>
		<br><br>
	</template>
<script>
var xInvResId = 0, xInvResUltimo = null;

function xInvResultadoCargar(id) {
	xInvResId = id;
	// limpiar antes de pedir: si la carga falla no deben quedar las filas ni el boton del conteo anterior
	$('#tb_inv_resultado tbody').empty();
	$('#inv_res_titulo').text('Resultado del conteo');
	$('#inv_res_nota').text('Revisa las diferencias, desmarca lo que no quieras ajustar y aprueba.');
	$('#inv_res_ayuda').text('');
	$('#inv_res_kpis').empty();
	$('#inv_res_btn_aprobar').hide();
	xPopupLoad.titulo = 'Cargando resultado...'; xPopupLoad.xopen();
	$.when(xInvApi('obtener', { id: id }), xInvApi('rep-resultado', { id: id })).then(function (ro, rr) {
		xPopupLoad.xclose();
		if (!ro.success || !rr.success) { xInvIr('conteos'); return; }
		var c = ro.datos.cabecera, k = rr.datos.kpi;
		$('#inv_res_titulo').html('Conteo #' + c.idinventario_conteo + ' · ' + xInvEsc(c.almacen) +
			'<span class="inv-estado ' + c.estado + '">' + xInvIconoEstado(c.estado) + c.estado.toUpperCase() + '</span>');
		$('#inv_res_nota').text(c.fecha_cierre ? 'Cerrado el ' + c.fecha_cierre + ' por ' + (c.cierre || '') : 'Revisa las diferencias, desmarca lo que no quieras ajustar y aprueba.');
		$('#inv_res_btn_aprobar').toggle(c.estado === 'cerrado' && parseInt(c.es_admin) === 1);
		$('#inv_res_ayuda').text(c.estado === 'cerrado' && parseInt(c.es_admin) !== 1 ? 'Solo un administrador puede aprobar.' :
			(c.estado === 'aprobado' ? 'Ajustes aplicados: entrada #' + (c.idalmacen_ie_entrada || '-') + ', salida #' + (c.idalmacen_ie_salida || '-') : ''));
		$('#inv_res_kpis').html(
			'<div class="inv-kpi"><span>Contados</span><b>' + k.contados + ' / ' + k.items + '</b></div>' +
			'<div class="inv-kpi inv-kpi-azul"><span>Con diferencia</span><b>' + k.con_dif + '</b></div>' +
			'<div class="inv-kpi inv-kpi-celeste"><span>Exactitud</span><b>' + k.exactitud_pct + '%</b></div>' +
			'<div class="inv-kpi inv-kpi-rojo"><span>Faltante</span><b class="inv-neg">' + xInvFmtSoles(k.faltante_soles) + '</b></div>' +
			'<div class="inv-kpi inv-kpi-verde"><span>Sobrante</span><b class="inv-pos">' + xInvFmtSoles(k.sobrante_soles) + '</b></div>' +
			'<div class="inv-kpi"><span>Neto</span><b class="' + xInvResSigno(k.neto_soles) + '">' + xInvFmtSoles(k.neto_soles) + '</b></div>' +
			(k.sin_costo > 0 ? '<div class="inv-kpi inv-kpi-rojo"><span>Sin costo</span><b>' + k.sin_costo + '</b><em>items valorizados en 0</em></div>' : ''));
		var html = '';
		rr.datos.filas.forEach(function (f) {
			var dif = parseFloat(f.diferencia), tieneDif = f.contado !== null && Math.abs(dif) > 0.00001;
			var chk = c.estado === 'cerrado'
				? '<input type="checkbox" ' + (parseInt(f.aplicar) === 1 ? 'checked' : '') + ' onchange="xInvSetAplicar(' + f.idinventario_conteo_detalle + ', this)">'
				: (parseInt(f.aplicar) === 1 ? 'Sí' : 'No');
			html += '<tr class="' + (tieneDif ? 'inv-dif' : 'inv-sindif') + (parseInt(f.aplicar) === 1 ? '' : ' inv-noaplica') + '">' +
				'<td class="inv-cen">' + (tieneDif ? chk : '') + '</td>' +
				'<td>' + xInvEsc(f.descripcion) + '</td><td>' + xInvEsc(f.familia || '') + '</td><td>' + xInvEsc(f.unidad || '') + '</td>' +
				'<td class="inv-num">' + xInvNumRaw(f.stock_cierre) + '</td>' +
				'<td class="inv-num">' + (f.contado === null ? '<span class="inv-muted">sin contar</span>' : xInvNumRaw(f.contado)) + '</td>' +
				'<td class="inv-num ' + xInvResSigno(dif) + '">' + (f.contado === null ? '' : xInvNumRaw(dif)) + '</td>' +
				'<td class="inv-num">' + xInvFmtNum(f.costo_unit) + (f.costo_origen === 'ninguno' ? ' <span class="inv-nocosto">sin costo</span>' : '<span class="inv-sub">' + xInvEsc(f.costo_origen) + '</span>') + '</td>' +
				'<td class="inv-num ' + xInvResSigno(dif) + '">' + (f.contado === null ? '' : xInvFmtSoles(f.dif_soles)) + '</td>' +
				'<td><span class="inv-sub">' + xInvEsc(f.cuenta || '') + '</span></td><td><span class="inv-sub">' + xInvEsc(f.obs || '') + '</span></td></tr>';
		});
		$('#tb_inv_resultado tbody').html(html || '<tr><td colspan="11" class="inv-empty">Sin items</td></tr>');
		xInvResFiltrar();
	});
}
// clase de color segun el signo: faltante en rojo, sobrante en verde, sin diferencia sin color
function xInvResSigno(n) {
	var v = parseFloat(n);
	return v < 0 ? 'inv-neg' : (v > 0 ? 'inv-pos' : '');
}
function xInvResFiltrar() {
	var solo = $('#inv_res_solo_dif').is(':checked');
	$('#tb_inv_resultado .inv-sindif').toggle(!solo);
	$('#tb_inv_resultado .inv-vacio').remove();
	// hay items pero ninguno con diferencia: con el filtro puesto la tabla quedaria vacia sin explicacion
	if (solo && $('#tb_inv_resultado .inv-dif').length === 0 && $('#tb_inv_resultado .inv-sindif').length > 0) {
		$('#tb_inv_resultado tbody').append('<tr class="inv-vacio"><td colspan="11" class="inv-empty">Sin diferencias</td></tr>');
	}
}
function xInvSetAplicar(iddet, chk) {
	xInvResUltimo = xInvApi('set-aplicar', { id: xInvResId, iddet: iddet, aplicar: chk.checked ? 1 : 0 });
	xInvResUltimo.then(function (r) {
		if (!r.success) { chk.checked = !chk.checked; return; }
		$(chk).closest('tr').toggleClass('inv-noaplica', !chk.checked);
	});
}
function xInvAprobar() {
	var btn = $('#inv_res_btn_aprobar');
	if (btn.attr('data-busy') === '1') { return; } // ya hay una aprobacion en curso
	btn.attr('data-busy', '1');
	// esperar el set-aplicar en vuelo: el confirm debe contar lo que el servidor ya tiene guardado
	$.when(xInvResUltimo).then(function () {
		var n = $('#tb_inv_resultado .inv-dif input:checked').length;
		xInvConfirmar('Se aplicaran <b>' + n + ' ajuste(s)</b> al stock.<br><br>La accion queda en el kardex y no se deshace desde aqui.',
			'Aprobar el conteo #' + xInvResId + '?', 'Si, aprobar').then(function (ok) {
			if (!ok) { btn.removeAttr('data-busy'); return; }
			xPopupLoad.titulo = 'Aplicando ajustes...'; xPopupLoad.xopen();
			xInvApi('aprobar', { id: xInvResId }).then(function (r) {
				xPopupLoad.xclose();
				btn.removeAttr('data-busy');
				if (r.success) { xInvResultadoCargar(xInvResId); }
			});
		});
	});
}
Polymer({ is: 'x-inventario-resultado' });
</script>
</dom-module>
