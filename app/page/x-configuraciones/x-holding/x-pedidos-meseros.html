<!-- para la administracion del holding -  pedidos de los meseros -->
<script type="text/javascript" src="../../../view/socket.service.p.js"></script>
<dom-module id="x-pedidos-meseros">
    <link rel="import" href="../../../page/x-configuraciones/x-holding/componentes/x-metodo-pago.html">
    <template>

        <paper-dialog class="dialog_redondo" id="dialogMetodoPago" modal with-backdrop>
            <x-metodo-pago id="metodoPago"></x-metodo-pago>
            <br>
            <div>
                <button class="btn btn-sm btn-dark" dialog-dismiss>Cerrar</button>
            </div>
        </paper-dialog>

        <br>
        <div class="xMiCard xradius" style="width:85%; max-width: 1100px;">
            <div class="xEncanezadoCard" style="background: lavenderblush; color: #424242;">
                <div class="d-flexx justify-content-between align-items-center">
                    <div>
                        <h3>Pedidos cobrados por los meseros</h3>
                        <span>En este se pueden ver los pedidos cobrados por los meseros. En la opción "Metodos de pago" se pueden configurar los <br>tipos de pago y comisiones que estarán disponibles en la aplicacion del mesero</span>
                    </div>

                    <div>                        
                        <button class="btn btn-sm btn-secondary ml-2" on-click="getShowMetodosPago">
                            <i class="fa fa-credit-card"></i>
                            <span>Metodos de pago</span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="xLinea2"></div>
            <div class="xContentCard" style="padding: 20px;">
                <div class="container">
                
                    <!-- Agregar filtro de marcas -->
                    <div class="filter-section mb-2 d-flexx justify-content-between align-items-end">
                        <div class="d-flexx align-items-end">
                            <div>
                                <p class="fw-600">Nombre</p>
                                <select class="selected-template-1 fs-15" id="filterMozo" on-change="_filterByMozo">
                                    <option value="">Todas los meseros</option>
                                    <template is="dom-repeat" items="[[listaMozos]]">
                                        <option value="[[item.nom_mozo]]">[[item.nom_mozo]]</option>
                                    </template>
                                </select>
                            </div>
                
                            <div class="ml-3">
                                <p class="fw-600">Fecha</p>
                                <input type="text" style="height: 20px;" class="selected-template-1 xCursor" id="txt_fecha_pedido_mozo"
                                    placeholder="Elige fecha">
                            </div>
                            <button class="btn btn-sm btn-dark ml-2" on-click="getPedidosHoldingMeserosByDay">
                                <i class="fa fa-refresh"></i>
                                <span>Actualizar</span>
                            </button>
                        </div>
                    </div>
                    <hr>
                
                
                
                    <table class="w-100">
                        <thead>
                            <th>#</th>
                            <th align="left">Fecha</th>
                            <th align="center">Pedido</th>
                            <th align="center">Atendido Por</th>
                            <th align="center">Marca</th>
                            <th align="center">Mesa</th>
                            <th align="right">Medios</th>
                            <th align="right">Estado</th>
                        </thead>
                        <tbody>
                            <template is="dom-repeat" items="[[pedidosFiltrados]]">
                                <tr class="pedido-item">
                                    <td>{{displayIndex(index)}}</td>
                                    <td>[[item.fecha]]</td>
                                    <td align="center">[[item.idpedido]]</td>
                                    <td align="center">[[item.nom_us]]</td>
                                    <td align="center">[[item.marca]]</td>
                                    <td align="center">
                                        <p>Mesa: [[item.nummesa]]</p>
                                    </td>
                                    <td align="right">
                                        <!-- metodos de pago -->
                                        <div class="d-flexx justify-content-end">
                                            <img src="[[item.icon]]" alt="Método de pago" width="16" class="ml-1">
                                            <span class="ml-1">[[item.importe]]</span>
                                        </div>
                                    </td>
                                    <td align="right">
                                        <span class$="[[_getCerradoClass(item.estado_cerrado)]]">[[item.estado_cerrado]]</span>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                
                
                    <!-- Agregar resumen de pagos -->
                    <br><br>
                    <div>
                        <p class="fs-18 fw-600">Resumen de pagos</p>
                        <br>
                        <div>
                            <div class="resumen-content d-flexx fs-15">
                
                                <div class="metodos-pago">
                                    <template is="dom-repeat" items="[[resumenMetodosPago]]">
                                        <div class="metodo-item">
                                            <img src="[[item.icon]]" alt="Método de pago" width="16" class="ml-1">
                                            <span class="ml-2">[[item.cantidad]]</span>
                                            <span class="fw-600 ml-2">[[item.metodo]]</span>
                                            <span class="fw-900 ml-2">[[_formatImporte(item.total)]]</span>
                                        </div>
                                    </template>
                                </div>
                
                                <div class="total-general ml-5">
                                    <p>
                                        <span class="fw-900">Total de pedidos:</span> [[pedidosFiltrados.length]]
                                    </p>
                                    <p><span class="fw-900">Importe Total:</span> <span class="fs-18">[[importeTotal]]</span></p>
                                </div>
                
                                <div class="ml-5">
                                    <button class="btn btn-primary" on-click="cerrarCuentaMozo"
                                        hidden$="[[!showBtnCerrarCuentaMozo]]">Cerrar cuenta</button>
                                </div>
                
                            </div>
                
                        </div>
                    </div>
                    <br>
                
                </div>
            </div>
        </div>

        
    </template>

    <style>
        /* Add these styles to your existing styles */
        .comision-info {
            font-size: 0.9em;
            color: #666;
        }

        .total-general div {
            margin: 5px 0;
        }

        .comision-amount {
            color: #d32f2f;
        }

        .total-after-commission {
            font-weight: bold;
            color: #1976d2;
        }

        .metodo-item {
            display: flex;
            margin: 5px 0;
        }

        .resumen-content {
            display: flex;
            font-size: 14px;
        }
    </style>

    <script>
        Polymer({
            is: 'x-pedidos-meseros',
            properties: {
                pedidos: {
                    type: Array,
                    value: function () { return []; }
                },
                listIdsPedidos: {
                    type: Array,
                    value: function () { return []; }
                },
                pedidosFiltrados: {
                    type: Array,
                    value: function () { return []; }
                },
                listaMarcas: {
                    type: Array,
                    value: function () { return []; }
                },
                listaMozos: {
                    type: Array,
                    value: function () { return []; }
                },
                resumenMetodosPago: {
                    type: Array,
                    value: function () { return []; }
                },                
                showBtnCerrarCuentaMozo: {
                    type: Boolean,
                    value: false
                },
                mozoSeleccionada: {
                    type: Object,
                    value: function () { return {}; }
                },
                fechaSelected: {
                    type: String,
                    value: ''
                },
                importeTotal: {
                    type: Number,
                    value: 0
                },
                dataSedeHolding: {
                    type: Object,
                    value: function () { return {}; }
                },
                idsede_holding: {
                    type: Number,
                    value: 0
                }
            },

            attached: function () {
                this.pedidos = [];
                this._initializeSocket();
                this.initPage();
                $('body').addClass('loaded');
            },

            detached: function () {

            },

            initPage: async function () {
                // datos de sede o holding
                this.dataSedeHolding = xm_log_get('datos_sede_holding');
                this.idsede_holding = this.dataSedeHolding.idsede_holding || 0;
                console.log('dataSedeHolding', this.dataSedeHolding);
            },

            _pintarPedidoHolding: function (pedido) {
                console.log('pedido', pedido);
                this.getPedidoById(pedido.idpedido);
            },

            async getPedidoById(idpedido) {
                console.log('idpedido', idpedido);
                const searchItem = this.searchItemInPedidos(idpedido);
                if (searchItem) {
                    return;
                }

                this.listIdsPedidos.push(idpedido);

                await delay(1000);

                await $.ajax({
                    type: 'POST',
                    url: '../../bdphp/log_010.php',
                    data: JSON.stringify({
                        op: 'get-pedidos-holding-meseros-by-id',
                        idpedido: idpedido,
                        idsede_holding: this.idsede_holding                        
                    })
                }).done(dt => {
                    let listItemsPedido = JSON.parse(dt).datos;
                    console.log('listItemsPedido', listItemsPedido);
                    listItemsPedido.forEach(itemPedido => {
                        this.addPedidoInPedidos(itemPedido);
                    });
                });
            },

            _initializeSocket: async function () {
                _cpSocketOpen();
                // await this.getComisionMetodoPago();
                this.getPedidosHoldingMeserosByDay();
                

                $('#txt_fecha_pedido_mozo').pickadate({
                    format: 'dd mmmm, yyyy',
                    today: 'Hoy',
                    clear: 'Borrar',
                    close: 'Cerrar',
                    onSet: (context) => {
                        const fechaInput = context.select ? xDevolverFechaDada2(context.select) : '';
                        this.fechaSelected = xSetInputDate(fechaInput);
                        console.log('this.fechaSelected', this.fechaSelected);
                        this.getPedidosHoldingMeserosByDay();
                    }
                });
            },

            searchItemInPedidos: function (idpedido_search) {
                return this.listIdsPedidos.find((idpedido) => {
                    return idpedido == idpedido_search;
                });
            },

            getPedidosHoldingMeserosByDay() {
                xPopupLoad.xopen();
                this.pedidos = [];
                this.pedidosFiltrados = [];
                $.ajax({
                    type: 'POST',
                    url: '../../bdphp/log_010.php',
                    data: JSON.stringify({
                        op: 'get-pedidos-holding-meseros-by-day',
                        fecha: this.fechaSelected,
                        idsede_holding: this.idsede_holding                        
                    })
                }).done(dt => {
                    xPopupLoad.xclose();
                    console.log('getPedidosHoldingMeserosByDay', JSON.parse(dt));
                    let pedidos = JSON.parse(dt).datos;
                    console.log('pedidos', pedidos);
                    if (pedidos.length === 0) {
                        this.pedidosFiltrados = JSON.parse(JSON.stringify(this.pedidosFiltrados));
                        this._actualizarResumen();
                        return;
                    }

                    pedidos.forEach(itemPedido => {
                        this.addPedidoInPedidos(itemPedido);
                    });



                    console.log('this.pedidos', this.pedidos);
                });
            },

            addPedidoInPedidos(itemPedido) {                
                itemPedido.estado_cerrado = itemPedido.cerrado_mesero == '1' ? 'Cerrado' : 'Pendiente';
                this.pedidos.push(itemPedido);

                itemPedido.icon = `../../images/${itemPedido.icon}`;
                
                // Ordenar los pedidos con los más recientes primero (por idpedido descendente)
                this.pedidos.sort((a, b) => parseInt(b.idpedido) - parseInt(a.idpedido));
                this.pedidosFiltrados = this.pedidos;
                
                this.listIdsPedidos.push(itemPedido.idpedido);

                this.pedidosFiltrados = JSON.parse(JSON.stringify(this.pedidosFiltrados));

                // Actualizar lista de marcas
                this._actualizarListaMozos();
                this._actualizarResumen();

            },

            _actualizarListaMozos() {
                // Obtener marcas únicas
                const mozosUnicas = [...new Set(this.pedidos.map(p => {
                    return {
                        nom_mozo: p.nom_mozo,
                        idusuario: p.idusuario
                    }
                }))];
                console.log('mozosUnicas', mozosUnicas);

                // agrupar marcas por idsede
                this.listaMozos = mozosUnicas.reduce((acc, mozo) => {
                    const mozoEncontrada = acc.find(m => m.nom_mozo === mozo.nom_mozo);
                    if (!mozoEncontrada) {
                        acc.push({
                            nom_mozo: mozo.nom_mozo,
                            idusuario: mozo.idusuario
                        });
                    }
                    return acc;
                }, []);

            },

            _filterByMozo(e) {
                const nomMozoSeleccionada = e.target.value;
                this.mozoSeleccionada = this.listaMozos.find(m => m.nom_mozo === nomMozoSeleccionada);
                console.log('nomMozoSeleccionada', this.nomMozoSeleccionada);
                this.showBtnCerrarCuentaMozo = nomMozoSeleccionada !== '';
                
                if (!nomMozoSeleccionada) {
                    this.pedidosFiltrados = this.pedidos;
                } else {
                    this.pedidosFiltrados = this.pedidos.filter(p => p.nom_mozo === nomMozoSeleccionada);
                    const hasNonMozoOrders = this.pedidosFiltrados.some(p => p.cerrado_mesero !== '1');
                    this.showBtnCerrarCuentaMozo = hasNonMozoOrders;

                    if (!hasNonMozoOrders) {
                        // const idregistro_pago_marca = this.pedidosFiltrados[0].idregistro_pago_marca;
                        // this.getRegistroPagoMarca(idregistro_pago_marca);
                    }
                    
                }

                this.pedidosFiltrados = JSON.parse(JSON.stringify(this.pedidosFiltrados));
                this._actualizarResumen();
            },

            _actualizarResumen() {
                let resumen = {
                    totalPedidos: new Set(),
                    metodosPago: {}
                };

                this.pedidosFiltrados.forEach(pedido => {
                    // Count unique orders
                    resumen.totalPedidos.add(pedido.idregistro_pago);

                    // Group by payment method
                    if (!resumen.metodosPago[pedido.des_tp]) {
                        resumen.metodosPago[pedido.des_tp] = {
                            cantidad: 0,
                            total: 0,
                            icon: pedido.icon
                        };
                    }
                    resumen.metodosPago[pedido.des_tp].cantidad++;
                    resumen.metodosPago[pedido.des_tp].total += parseFloat(pedido.importe);
                });

                this.resumenMetodosPago = Object.keys(resumen.metodosPago).map(key => {
                    return {
                        metodo: key,
                        cantidad: resumen.metodosPago[key].cantidad,
                        total: resumen.metodosPago[key].total,
                        icon: resumen.metodosPago[key].icon
                    };
                });

                this.importeTotal = this.pedidosFiltrados.reduce((acc, p) => {
                    return acc + parseFloat(p.importe);
                }, 0);

                this.importeTotal = this.importeTotal.toFixed(2);

                this.resumenMetodosPago = JSON.parse(JSON.stringify(this.resumenMetodosPago));
            },

            cerrarCuentaMozo: function () {
                xPopupLoad.xopen();
                const idpedidos = this.pedidosFiltrados.map(p => p.idpedido).join(',');
                console.log('idpedidos cerrar', idpedidos);
                $.ajax({
                    type: 'POST',
                    url: '../../bdphp/log_010.php',
                    data: JSON.stringify({
                        op: 'set-cerrar-pedidos-meseros',
                        idpedidos: idpedidos
                    })
                }).done(dt => {
                    console.log('cerrar-cuenta-mozo', dt);
                    this.showBtnCerrarCuentaMozo = false;                    
                    this.getPedidosHoldingMeserosByDay();
                });
            },

            _formatImporte: function (importe) {
                return parseFloat(importe).toFixed(2);
            },

            _getCerradoClass: function (estado) {
                return estado === 'Cerrado' ? 'text-success' : 'text-danger';
            },
           
            _formatTime: function (timestamp) {
                return new Date(timestamp).toLocaleTimeString();
            },

            displayIndex: function (index) {
                const total = this.pedidos.length;
                const reverseIndex = total - index;
                return xCeroIzq(reverseIndex, 1);
            },

            getShowMetodosPago: function () {
                dialogMetodoPago.open();
            }
        });
    </script>
</dom-module>
