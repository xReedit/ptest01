<script>
var xThis;
function xIniUsuarios(){
	// if(xIdOrg=='' || xIdOrg==undefined){xIdOrg=window.localStorage.getItem('::app3_wo');}
	// if(xIdUsuario=='' || xIdUsuario==undefined){xIdUsuario=window.localStorage.getItem('::app3_woU');}
	$("#Titulo_page").text("Usuarios");

	xm_log_get('ini_us');
	$('body').addClass('loaded');
	const sufijoSede = xm_log_get('datos_org_all_sede')[0].sufijo;
	
	xThis.xt_org=xIdOrg;
	xThis.xt_idsede=xIdSede;
	xThis.xt_idus=xIdUsuario;
	xThis.xt_sufijo = sufijoSede;
	xThis.showFormRepartidor = false;
	xThis.sedesOrgPromise = null;
	xThis.sedesAt = null;
	xSedesAtiendeCss();
	xSedesAtiendeOrg();
	xUsCss();
	$('#acc_us').off('.usb').on('change.usb', 'paper-checkbox', xUsResumen);
	$('#usb_resumen').off('.usb').on('click.usb', '.usb-chip-x', xUsQuitarAcceso);

function tipoUsuario($event) {
	xThis.showFormRepartidor = $event.selectedIndex === 4; // Updated index for REPARTIDOR
	
	// Automatically set permissions based on role
	if ($event.value) {
		// Clear all checkboxes first
		$(".checkA").each(function(index, element){
			element.checked = false;
		});
		$(".checkP").each(function(index, element){
			element.checked = false;
		});
		
		// Set permissions based on role
		switch ($event.value) {
			case "1": // ADMINISTRADOR - All permissions
				$(".checkA").each(function(index, element){
					element.checked = true;
				});
				$(".checkP").each(function(index, element){
					element.checked = true;
				});
				break;
				
			case "2": // MESERO / MOZO - Only "Realizar Pedidos"
				$(".checkA").each(function(index, element){
					if (element.dataset.id === 'A2,') { // Realizar Pedidos
						element.checked = true;
					}
				});
				break;
				
			case "4": // CAJERO - Specific permissions
				$(".checkA").each(function(index, element){
					// Check specific permissions for Cajero
					if (
						element.dataset.id === 'A2,' || // Realizar Pedidos
						element.dataset.id === 'A3,' || // Caja
						element.dataset.id === 'A4,' || // Control de Mesas
						element.dataset.id === 'A5,' || // Punto de Venta
						element.dataset.id === 'A7,' || // Registro de pagos
						element.dataset.id === 'A8,' || // Zona de Despacho
						element.dataset.id === 'A10,' || // Facturador CPE
						element.dataset.id === 'A11,' || // CPE Emitidos
						element.dataset.id === 'A12,' || // Servidor de Impresion
						element.dataset.id === 'A28,' || // Vincular Yape (WizPay)
						element.dataset.id === 'A29,' // Aplicaciones descargables
					) {
						element.checked = true;
					}
				});
				break;
		}
	}
	xUsRolPintar();
	xUsResumen();
	xSedesAtiendeVer();
}

function xUsNombre(el) {
	return xSedesAtiendeEsc($.trim($(el).text()));
}

function xUsResumen() {
	var acc = $('#acc_us .checkA'), per = $('#acc_us .checkP');
	var accOn = acc.filter(function () { return this.checked; });
	var perOn = per.filter(function () { return this.checked; });
	var perOff = per.filter(function () { return !this.checked; });
	var n = accOn.length + perOn.length, html;
	// con muchos accesos el resumen se vuelve lista: se cortan a 16 y el resto se ve en la lista completa
	var chips = function ($els, cls) {
		var html = $els.slice(0, 16).map(function () {
			var nom = xUsNombre(this);
			return '<span class="usb-chip ' + cls + '">' + nom + '<button type="button" class="usb-chip-x" data-id="' + xSedesAtiendeEsc(this.dataset.id) +
				'" title="Quitar" aria-label="Quitar ' + nom + '">&times;</button></span>';
		}).get().join('');
		if ($els.length > 16) { html += '<button type="button" class="usb-chip usb-chip-mas" onclick="xUsPersonalizar(true)">y ' + ($els.length - 16) + ' más</button>'; }
		return '<div class="usb-chips">' + html + '</div>';
	};

	if (n === 0) {
		html = '<div class="usb-res-tit">Todavía no tiene accesos</div>' +
			'<div class="usb-ayuda">Elija un rol arriba o toque «Elegir accesos uno por uno».</div>';
	} else if (n === acc.length + per.length) {
		html = '<div class="usb-res-tit">Puede usar todo el sistema <span>' + n + ' accesos</span></div>';
	} else {
		html = '<div class="usb-res-tit">Podrá usar <span>' + n + ' accesos</span></div>' + chips(accOn, '');
		if (perOn.length) { html += '<div class="usb-res-sub">Permisos especiales</div>' + chips(perOn, 'usb-chip-p'); }
		if (perOff.length) {
			html += '<div class="usb-no"><b>No podrá:</b> ' + perOff.map(function () { return xUsNombre(this).toLowerCase(); }).get().join(', ') + '.</div>';
		}
	}
	$('#usb_resumen').html(html);
	xUsPuedeGuardar();
}

/* ===== Sedes que atiende (call center A27 y repartidor). Plan: plan/REPARTIDOR-MULTISEDE-PLAN.md Tarea 3 =====
   Solo aparece si la organizacion tiene mas de una sede operable (sedes-org.total > 1). */
function xSedesAtiendePost(op, body) {
	return $.ajax({ type: 'POST', url: '../../bdphp/log_sedes_atiende.php?op=' + op, contentType: 'application/json',
		data: JSON.stringify(body || {}), dataType: 'json' });
}

// sedes operables de la org (una vez por carga de pagina); si falla, total 0 = no se muestra nada nuevo
function xSedesAtiendeOrg() {
	if (!xThis.sedesOrgPromise) {
		xThis.sedesOrgPromise = xSedesAtiendePost('sedes-org').then(function (r) {
			var org = (r && r.success && r.datos) ? r.datos : { sedes: [], total: 0 };
			xThis.sedesAt = org;
			return org;
		}, function () {
			xThis.sedesAt = { sedes: [], total: 0 };
			return $.Deferred().resolve(xThis.sedesAt).promise();
		});
	}
	return xThis.sedesOrgPromise;
}

function xSedesAtiendeAviso(msj) {
	if (typeof xm_all_xToastOpen === 'function') { xm_all_xToastOpen(msj, 5000, false); }
}

function xSedesAtiendeEsc(t) {
	return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
		return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
	});
}

// minusculas y sin tildes, para el buscador
function xSedesAtiendeNorm(t) {
	return String(t == null ? '' : t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}

function xSedesAtiendeCss() {
	if (document.getElementById('xsa-css')) { return; }
	var st = document.createElement('style');
	st.id = 'xsa-css';
	st.textContent = '.xsa{margin:8px 0 4px 26px;max-width:340px;font-size:13px;color:#212529}' +
		'.xsa[hidden],.xsa [hidden]{display:none!important}' +
		'#sedesAtiendeRep{margin:12px 0 0 5px}#sedesAtiendeDlg{margin:0 24px;max-width:none}' +
		'.xsa-tit{font-size:11px;font-weight:600;color:#6c757d;letter-spacing:.3px;margin-bottom:6px}' +
		'.xsa-n{color:#3f51b5}' +
		'.xsa-buscar{width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid #cdcdcd;border-radius:6px;margin-bottom:8px;font-size:13px}' +
		'.xsa-ciudad{border:1px solid #ddd;border-radius:8px;margin-bottom:6px;background:#f8fafc}' +
		'.xsa-cab{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;user-select:none}' +
		'.xsa-flecha{display:inline-block;width:10px;color:#6c757d;font-size:10px;transition:transform .15s}' +
		'.xsa-abierta>.xsa-cab .xsa-flecha{transform:rotate(90deg)}' +
		'.xsa-cnom{flex:1;font-weight:600}' +
		'.xsa-cont{font-size:11px;font-weight:600;color:#3f51b5;white-space:nowrap}' +
		'.xsa-sedes{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:8px 10px 10px 28px;background:#fff;border-top:1px solid #eee;border-radius:0 0 8px 8px}' +
		'.xsa-sede{display:flex;align-items:center;gap:6px;cursor:pointer;line-height:1.2}' +
		'.xsa-sede small{color:#6c757d}' +
		'.xsa input[type=checkbox]{width:16px;height:16px;accent-color:#3f51b5;margin:0;flex:none;cursor:pointer}' +
		'#sedesAtiendeDlg .xsa-lista{max-height:50vh;overflow:auto}' +
		'.xsa-icono{display:inline-block;padding:2px 8px;border:1px solid #3f51b5;border-radius:12px;color:#3f51b5;font-size:11px;font-weight:600;white-space:nowrap}';
	document.head.appendChild(st);
}

// pinta el bloque: titulo con contador, buscador y ciudades plegables con "marcar toda la ciudad"
function xSedesAtiendePintar(contenedor, sedesOrg, marcadas, casa) {
	xSedesAtiendeCss();
	var $c = $(contenedor);
	var marc = (marcadas || []).map(Number);
	var grupos = {}, orden = [];
	(sedesOrg || []).forEach(function (s) {
		var ciudad = $.trim(s.ciudad || '') || 'Sin ciudad';
		if (!grupos[ciudad]) { grupos[ciudad] = []; orden.push(ciudad); }
		grupos[ciudad].push(s);
	});
	var iSin = orden.indexOf('Sin ciudad');
	if (iSin > -1) { orden.splice(iSin, 1); orden.push('Sin ciudad'); }

	var html = '<div class="xsa-tit">SEDES QUE ATIENDE · <span class="xsa-n"></span></div>' +
		'<input type="search" class="xsa-buscar" placeholder="Buscar sede o ciudad" autocomplete="off"><div class="xsa-lista">';
	orden.forEach(function (ciudad) {
		html += '<div class="xsa-ciudad" data-c="' + xSedesAtiendeEsc(ciudad) + '"><div class="xsa-cab"><span class="xsa-flecha">&#9654;</span>' +
			'<input type="checkbox" class="xsa-todas" title="Marcar toda la ciudad"><span class="xsa-cnom">' + xSedesAtiendeEsc(ciudad) + '</span>' +
			'<span class="xsa-cont"></span></div><div class="xsa-sedes" hidden>';
		grupos[ciudad].forEach(function (s) {
			var id = Number(s.idsede), esCasa = id === Number(casa);
			html += '<label class="xsa-sede" data-n="' + xSedesAtiendeEsc(xSedesAtiendeNorm(s.nombre)) + '"><input type="checkbox" class="xsa-chk" value="' + id + '"' +
				(esCasa || marc.indexOf(id) > -1 ? ' checked' : '') + (esCasa ? ' disabled' : '') + '> ' + xSedesAtiendeEsc(s.nombre) +
				(esCasa ? ' <small>(su sede)</small>' : '') + '</label>';
		});
		html += '</div></div>';
	});
	html += '</div>';

	$c.html(html).attr('data-pintado', '1').off('.xsa')
		.on('click.xsa', '.xsa-cab', function (e) {
			if ($(e.target).hasClass('xsa-todas')) { return; }
			xSedesAtiendePlegar($(this).parent(), null);
		})
		.on('change.xsa', '.xsa-todas', function () {
			$(this).closest('.xsa-ciudad').find('.xsa-chk:not(:disabled)').prop('checked', this.checked);
			xSedesAtiendeContar($c);
		})
		.on('change.xsa', '.xsa-chk', function () { xSedesAtiendeContar($c); })
		.on('input.xsa', '.xsa-buscar', function () { xSedesAtiendeFiltrar($c, this.value); });
	xSedesAtiendeContar($c);
}

function xSedesAtiendePlegar($ciudad, abrir) {
	var sedes = $ciudad.find('.xsa-sedes')[0];
	if (abrir === null) { abrir = sedes.hidden; }
	sedes.hidden = !abrir;
	$ciudad.toggleClass('xsa-abierta', abrir);
}

// "x de y" por ciudad, estado intermedio de "marcar toda la ciudad" y "N de M" del titulo
function xSedesAtiendeContar($c) {
	var total = 0, marc = 0;
	$c.find('.xsa-ciudad').each(function () {
		var chks = $(this).find('.xsa-chk'), n = chks.filter(':checked').length, todas = $(this).find('.xsa-todas')[0];
		total += chks.length;
		marc += n;
		$(this).find('.xsa-cont').text(n + ' de ' + chks.length);
		todas.checked = n === chks.length;
		todas.indeterminate = n > 0 && n < chks.length;
		todas.disabled = chks.filter(':not(:disabled)').length === 0;
	});
	$c.find('.xsa-n').text(marc + ' de ' + total);
}

// por nombre de sede o ciudad; con texto abre las ciudades que coinciden, sin texto vuelve todo plegado
function xSedesAtiendeFiltrar($c, texto) {
	var q = xSedesAtiendeNorm($.trim(texto || ''));
	$c.find('.xsa-ciudad').each(function () {
		var $ciudad = $(this), alguna = false;
		var ciudadOk = !q || xSedesAtiendeNorm($ciudad.attr('data-c')).indexOf(q) > -1;
		$ciudad.find('.xsa-sede').each(function () {
			var ok = ciudadOk || String($(this).attr('data-n')).indexOf(q) > -1;
			this.hidden = !ok;
			if (ok) { alguna = true; }
		});
		this.hidden = !alguna;
		xSedesAtiendePlegar($ciudad, !!q);
	});
}

// ids marcados sin la sede de casa (siempre cuenta, no se guarda)
function xSedesAtiendeMarcadas(contenedor) {
	return $(contenedor).find('.xsa-chk:checked:not(:disabled)').map(function () { return Number(this.value); }).get();
}

function xSedesAtiendeLimpiar() {
	if (!xThis) { return; }
	xThis.sedesAtLeido = null;
	$('#sedesAtiendeAcc, #sedesAtiendeRep').each(function () {
		this.hidden = true;
		$(this).off('.xsa').empty().removeAttr('data-pintado');
	});
}

// lista guardada del usuario a modificar; si falla queda marcado el error y no se toca su lista al guardar
function xSedesAtiendeLeerUs(idusuario) {
	return xSedesAtiendeOrg().then(function (org) {
		if (org.total <= 1) { return null; }
		return xSedesAtiendePost('leer', { tipo: 'usuario', id: Number(idusuario) }).then(function (r) {
			xThis.sedesAtLeido = (r && r.success) ? r.datos : { error: true };
		}, function () {
			xThis.sedesAtLeido = { error: true };
			return $.Deferred().resolve().promise();
		});
	});
}

// muestra u oculta los bloques segun Call Center (Accesos) y rol Repartidor (Datos)
function xSedesAtiendeVer() {
	if (!xThis) { return; }
	var org = xThis.sedesAt || { sedes: [], total: 0 };
	var leido = xThis.sedesAtLeido || { casa: Number(xThis.xt_idsede), sedes: [] };
	var a27 = $('#acc_us .checkA[data-id="A27,"]')[0];
	xSedesAtiendeMostrar('#sedesAtiendeAcc', org.total > 1 && !!(a27 && a27.checked), org, leido);
	xSedesAtiendeMostrar('#sedesAtiendeRep', org.total > 1 && !!xThis.showFormRepartidor, org, { casa: Number(xThis.xt_idsede), sedes: [] });
}

function xSedesAtiendeMostrar(sel, ver, org, leido) {
	var $c = $(sel);
	if (!$c.length) { return; }
	if (ver && $c.attr('data-pintado') !== '1') {
		if (leido.error) {
			$c.html('<span class="fs-12 text-danger">No se pudo cargar las sedes que atiende. Cierre y vuelva a abrir el usuario.</span>');
		} else {
			xSedesAtiendePintar($c, org.sedes, leido.sedes, leido.casa);
		}
	}
	$c[0].hidden = !ver;
}

function xSedesAtiendeGuardar(body) {
	return xSedesAtiendePost('guardar', body).then(function (r) {
		if (!r || !r.success) { xSedesAtiendeAviso((r && r.error) || 'No se pudo guardar las sedes que atiende.'); }
	}, function () {
		xSedesAtiendeAviso('No se pudo guardar las sedes que atiende. Revise su conexion.');
		return $.Deferred().resolve().promise();
	});
}

// tras ManejoBD_IUD (devuelve el id): con Call Center su lista, sin Call Center lista vacia
function xSedesAtiendeGuardarUs(id) {
	var org = xThis.sedesAt || { total: 0 };
	var idus = parseInt(String(id).trim(), 10);
	var a27 = $('#acc_us .checkA[data-id="A27,"]')[0];
	var conA27 = !!(a27 && a27.checked);
	var pintado = $('#sedesAtiendeAcc').attr('data-pintado') === '1';
	var errorLeer = !!(xThis.sedesAtLeido && xThis.sedesAtLeido.error);
	if (org.total <= 1 || !(idus > 0) || (conA27 && (!pintado || errorLeer))) {
		return $.Deferred().resolve().promise();
	}
	return xSedesAtiendeGuardar({ tipo: 'usuario', id: idus, sedes: conA27 ? xSedesAtiendeMarcadas('#sedesAtiendeAcc') : [] });
}

// repartidor recien creado (log_005 op=11 no devuelve id): el endpoint lo busca por usuario en la sede de la sesion
function xSedesAtiendeGuardarRepNuevo(usuarioRep) {
	var org = xThis.sedesAt || { total: 0 };
	var sedes = xSedesAtiendeMarcadas('#sedesAtiendeRep');
	if (org.total <= 1 || $('#sedesAtiendeRep').attr('data-pintado') !== '1' || !sedes.length) {
		return $.Deferred().resolve().promise();
	}
	return xSedesAtiendeGuardar({ tipo: 'repartidor', usuario: usuarioRep, sedes: sedes });
}

// icono "Sedes" de un repartidor existente
function xSedesRepAbrir(obj) {
	var $tr = $(obj).closest('tr'), id = Number($tr.attr('data-id')), nombre = $.trim($tr.find('td').first().text());
	xPopupLoad.titulo = "Cargando..";
	xPopupLoad.xopen();
	xSedesAtiendeOrg().then(function (org) {
		return xSedesAtiendePost('leer', { tipo: 'repartidor', id: id }).then(function (r) {
			xPopupLoad.xclose();
			xPopupLoad.titulo = "Guardando..";
			if (!r || !r.success) { xSedesAtiendeAviso((r && r.error) || 'No se pudo cargar las sedes.'); return; }
			xSedesAtiendePintar('#sedesAtiendeDlg', org.sedes, r.datos.sedes, r.datos.casa);
			$('#dialog_sedes_rep .xsa-dlg-tit').text('Sedes que atiende · ' + nombre);
			$('#sedesAtiendeDlgErr')[0].hidden = true;
			dialog_sedes_rep.dataset.id = id;
			dialog_sedes_rep.open();
		}, function () {
			xPopupLoad.xclose();
			xPopupLoad.titulo = "Guardando..";
			xSedesAtiendeAviso('No se pudo cargar las sedes. Revise su conexion.');
		});
	});
}

function xSedesRepGuardar() {
	var $err = $('#sedesAtiendeDlgErr');
	var body = { tipo: 'repartidor', id: Number(dialog_sedes_rep.dataset.id), sedes: xSedesAtiendeMarcadas('#sedesAtiendeDlg') };
	xSedesAtiendePost('guardar', body).then(function (r) {
		if (r && r.success) { dialog_sedes_rep.close(); return; }
		$err.text((r && r.error) || 'No se pudo guardar.')[0].hidden = false;
	}, function () {
		$err.text('No se pudo guardar. Revise su conexion.')[0].hidden = false;
	});
}
