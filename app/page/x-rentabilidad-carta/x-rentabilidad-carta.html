<dom-module id="x-rentabilidad-carta">
	<script type="text/javascript" src="../../view/export.excel.js"></script>
	<template>
		<paper-dialog modal id="dlg_cos_detalle" class="xdlg" entry-animation="scale-up-animation" exit-animation="fade-out-animation">
			<div class="xContent">
				<div class="xdlg-head">
					<h3 id="cos_det_titulo">Plato</h3>
					<p id="cos_det_bajada"></p>
				</div>
				<div class="xdlg-body">
					<div class="inv-table-wrap">
						<table class="inv-table" id="tb_cos_detalle">
							<thead><tr>
								<th>Ingrediente</th><th class="inv-num">Cant.</th>
								<th class="inv-num">Costo hoy</th><th class="inv-num">Al crear receta</th>
								<th>Origen del costo</th><th></th>
							</tr></thead>
							<tbody></tbody>
						</table>
					</div>
					<p class="inv-nota">Las porciones con <b>costo fijo</b> no cambian cuando sube el insumo. Vincúlalas a su insumo para que el costo se actualice solo.</p>
				</div>
				<div class="xdlg-foot">
					<button class="btn btn-sm btn-light" dialog-dismiss>Cerrar</button>
				</div>
			</div>
		</paper-dialog>

		<paper-dialog modal id="dlg_cos_porciones" class="xdlg" entry-animation="scale-up-animation" exit-animation="fade-out-animation">
			<div class="xContent">
				<div class="xdlg-head">
					<h3>Porciones: ¿de qué insumo salen?</h3>
					<p>Vincula cada porción a su insumo (ej: 1/8 de pollo = 0.125 de POLLO). Así, cuando cambie el precio del insumo, el costo de todos los platos que la usan se actualiza solo.</p>
				</div>
				<div class="xdlg-body">
					<p class="cos-porc-avance" id="cos_porc_avance"></p>
					<div class="inv-table-wrap cos-porc-wrap">
						<table class="inv-table" id="tb_cos_porciones">
							<thead><tr>
								<th>Porción</th><th class="inv-num">Platos</th><th>Sale de</th>
								<th class="inv-num">Costo por porción</th><th></th>
							</tr></thead>
							<tbody></tbody>
						</table>
					</div>
				</div>
				<div class="xdlg-foot">
					<button class="btn btn-sm btn-light" dialog-dismiss>Cerrar</button>
				</div>
			</div>
		</paper-dialog>

		<paper-dialog modal id="dlg_cos_vincular" class="xdlg" entry-animation="scale-up-animation" exit-animation="fade-out-animation">
			<div class="xContent">
				<div class="xdlg-head">
					<h3 id="cos_vin_titulo">Vincular porción a insumo</h3>
					<p>Dinos de qué producto comprado sale esta porción y cuánto pesa. El sistema calcula su costo con el precio de compra.</p>
				</div>
				<div class="xdlg-body">
					<div class="inv-form-row">
						<span class="inv-label">1. ¿De qué producto sale? (tal como lo compras)</span>
						<input type="text" class="inv-input inv-w100" id="cos_vin_insumo" placeholder="Escribe para buscar. Ej: PECHUGA">
					</div>
					<div class="inv-form-row">
						<span class="inv-label">2. ¿Cuánto pesa la porción? <span id="cos_vin_und"></span></span>
						<input type="number" class="inv-input" id="cos_vin_cant" min="0" step="any" placeholder="Ej: 100">
					</div>
					<div class="inv-form-row">
						<span class="inv-label">3. ¿Cuánto se pierde al limpiar o cortar este producto? (%)</span>
						<input type="number" class="inv-input" id="cos_vin_merma" min="0" max="90" step="1" value="0" style="width:90px">
						<span class="cos-vin-ayuda">Ej: si de 1 kg entero quedan 800 g limpios, pon <b>20</b>. Si no se pierde nada, deja <b>0</b>.
						Se guarda para el producto y sirve para todos sus cortes (filete de 100 g, de 150 g...).</span>
					</div>
					<p class="inv-resumen" id="cos_vin_preview"></p>
				</div>
				<div class="xdlg-foot">
					<button class="btn btn-sm btn-light" dialog-dismiss>Cancelar</button>
					<button class="btn btn-sm btn-success" onclick="xCosGuardarVinculo()">Guardar vínculo</button>
				</div>
			</div>
		</paper-dialog>

		<paper-dialog modal id="dlg_cos_umbrales" class="xdlg" entry-animation="scale-up-animation" exit-animation="fade-out-animation">
			<div class="xContent">
				<div class="xdlg-head">
					<h3>Umbrales de food cost</h3>
					<p>Porcentaje del precio de venta que se va en insumos. Se aplica a todos los platos de esta sede.</p>
				</div>
				<div class="xdlg-body">
					<div class="inv-form-row">
						<span class="inv-label">En observación desde (%)</span>
						<input type="number" class="inv-input" id="cos_um_amarillo" min="1" max="100" step="0.5">
					</div>
					<div class="inv-form-row">
						<span class="inv-label">No rentable sobre (%)</span>
						<input type="number" class="inv-input" id="cos_um_rojo" min="1" max="100" step="0.5">
					</div>
					<p class="inv-nota">Referencia usual en restaurantes: 28–35 %.</p>
				</div>
				<div class="xdlg-foot">
					<button class="btn btn-sm btn-light" dialog-dismiss>Cancelar</button>
					<button class="btn btn-sm btn-success" onclick="xCosGuardarUmbrales()">Guardar</button>
				</div>
			</div>
		</paper-dialog>

		<br>
		<div class="xMiCard xradius inv-card">
			<div class="xEncanezadoCard inv-head">
				<div class="inv-head-top">
					<div>
						<h3>Rentabilidad de carta</h3>
						<p>Costo de cada plato calculado con el precio actual de sus insumos. Si sube un insumo, el costo se actualiza solo y el plato cambia de color.</p>
					</div>
					<div class="inv-head-acciones">
						<button class="btn btn-sm btn-light" onclick="window.location.href='#/recetas'">Volver a recetas</button>
						<button class="btn btn-sm btn-light" onclick="xCosPorcionesAbrir()"><i class="fa fa-link"></i>Porciones</button>
						<button class="btn btn-sm btn-light" onclick="xCosAbrirUmbrales()"><i class="fa fa-sliders"></i>Umbrales</button>
						<button class="btn btn-sm btn-primary" onclick="xCosSimToggle()"><i class="fa fa-flask"></i>Simular subida</button>
						<button class="btn btn-sm btn-success" onclick="xCosExcel()">Exportar a Excel</button>
					</div>
				</div>
			</div>
			<div class="xContentCard">
				<div class="cos-sim" id="cos_sim" style="display:none">
					<p class="cos-sim-ayuda">Elige un insumo y cuánto sube su precio. Verás al instante qué platos dejan de ser rentables. <b>No se guarda nada.</b></p>
					<div class="inv-toolbar cos-sim-bar">
						<div class="inv-field">
							<span class="inv-label">1. Insumo</span>
							<select class="inv-select" id="cos_sim_insumo" style="width:280px" onchange="xCosSimAplicar()"></select>
						</div>
						<div class="inv-field">
							<span class="inv-label">2. ¿Cuánto sube?</span>
							<div class="cos-sim-pcts" id="cos_sim_pcts">
								<button class="btn btn-sm btn-light" data-pct="10" onclick="xCosSimPct(10)">+10 %</button>
								<button class="btn btn-sm btn-light" data-pct="20" onclick="xCosSimPct(20)">+20 %</button>
								<button class="btn btn-sm btn-light" data-pct="30" onclick="xCosSimPct(30)">+30 %</button>
								<input type="number" class="inv-input" id="cos_sim_pct" value="10" step="1" style="width:80px" oninput="xCosSimAplicar()" title="Otro porcentaje">
								<span class="inv-muted">%</span>
							</div>
						</div>
						<span class="inv-sep"></span>
						<button class="btn btn-sm btn-light" onclick="xCosSimToggle()"><i class="fa fa-times"></i>Cerrar simulación</button>
					</div>
					<p class="cos-sim-resumen" id="cos_sim_resumen"></p>
				</div>
				<div class="cos-alertas" id="cos_alertas" style="display:none"></div>
				<div class="inv-kpis" id="cos_kpis"></div>
				<div class="inv-toolbar">
					<div class="inv-field">
						<span class="inv-label">Buscar</span>
						<input type="text" class="inv-input" id="cos_buscar" placeholder="Plato o sección" oninput="xCosPintar()">
					</div>
					<div class="inv-field">
						<span class="inv-label">Estado</span>
						<select class="inv-select" id="cos_filtro" onchange="xCosPintar()">
							<option value="">Todos</option>
							<option value="rojo">No rentables</option>
							<option value="amarillo">En observación</option>
							<option value="verde">Rentables</option>
							<option value="incompleto">Costo incompleto</option>
							<option value="simulados">Afectados por la simulación</option>
						</select>
					</div>
					<span class="inv-sep"></span>
					<p class="inv-ayuda" id="cos_leyenda"></p>
				</div>
				<div class="inv-table-wrap">
					<table class="inv-table" id="tb_cos_platos">
						<thead><tr>
							<th>Plato</th><th class="inv-num">Precio</th><th class="inv-num">Costo</th>
							<th class="inv-num">Margen</th><th class="inv-cen">Food cost</th><th>Avisos</th><th></th>
						</tr></thead>
						<tbody></tbody>
					</table>
				</div>
			</div>
		</div>
		<br><br>
	</template>
<script>
// Umbrales de food cost (% del precio): vienen de costeo_config por sede en cada 'listar'
var COS_UMBRAL_AMARILLO = 30;
var COS_UMBRAL_ROJO = 38;
var xCosPlatos = [];
var xCosInsumos = null;
var xCosVinculo = {};
var xCosSinReceta = 0;
var xCosSimBase = null;   // [{iditem, idproducto, descripcion, costo}] costo de cada insumo dentro de cada plato
var xCosSim = null;       // { idproducto, nombre, pct } simulacion activa

var COS_ORIGEN = {
	promedio: 'Costo promedio', compra: 'Última compra', manual: 'Precio manual · revisar',
	ninguno: 'Sin precio', fijo: 'Costo fijo', subreceta: 'Subreceta', subreceta_parcial: 'Subreceta (parcial)'
};
var COS_TIPO = { '1': 'Porción', '2': 'Producto', '3': 'Subreceta' };

function xCosAviso(texto, icono) { showAlertSwalOk(icono || 'warning', '', texto, 'Entendido', 1); }
function xCosConfirmar(texto, titulo, boton) {
	return showAlertSwalHtmlDecision({ title: titulo, html: texto, icon: 'question', showCancelButton: true,
		confirmButtonText: boton, cancelButtonText: 'Cancelar' }, 1).then(function (r) { return !!(r && r.isConfirmed); });
}
// El popup vive en el <x-load> de la pagina y se asigna recien en el ready,
// asi que cada uso va protegido: si todavia no esta, la llamada igual sale.
function xCosLoad(abrir, titulo) {
	try {
		if (!abrir) { xPopupLoad.xclose(); return; }
		xPopupLoad.titulo = titulo || 'Un momento...';
		xPopupLoad.xopen();
	} catch (e) {}
}

// `cargando`: false = sin popup (llamadas de fondo), texto = ese titulo,
// nada = el titulo por defecto.
//
// El popup se maneja ACA y no en cada boton: "Ver costo" tarda un par de
// segundos y sin señal la gente vuelve a tocar creyendo que no funciona. Son
// nueve llamadas en la pagina y solo una lo tenia.
function xCosApi(op, body, cargando) {
	var conLoader = cargando !== false;
	if (conLoader) { xCosLoad(true, typeof cargando === 'string' ? cargando : null); }

	var d = $.Deferred();
	$.ajax({ type: 'POST', url: '../../bdphp/log_costeo.php?op=' + op,
		data: JSON.stringify(body || {}), contentType: 'application/json', dataType: 'json' })
	.done(function (r) {
		if (conLoader) { xCosLoad(false); }
		if (!r || !r.success) { xCosAviso((r && r.error) || 'Error de comunicación con el servidor', 'error'); }
		d.resolve(r || { success: false });
	})
	.fail(function (x) {
		xCosLoad(false);
		xCosAviso(x && x.status === 401 ? 'Tu sesión expiró, vuelve a entrar.' : 'No se pudo conectar con el servidor', 'error');
		d.resolve({ success: false });
	});
	return d.promise();
}
function xCosEsc(s) { return $('<div>').text(s === null || s === undefined ? '' : String(s)).html(); }
function xCosSoles(n) { var v = parseFloat(n); return isNaN(v) ? '' : 'S/ ' + v.toFixed(2); }
function xCosNum(n, dec) { var v = parseFloat(n); return isNaN(v) ? '' : String(Math.round(v * Math.pow(10, dec || 4)) / Math.pow(10, dec || 4)); }

// Estado del plato: rojo = pierde o food cost alto; incompleto = hay ingredientes sin costo real
function xCosEstado(p) {
	if (p.costo <= 0) { return 'incompleto'; }
	if (p.margen <= 0 || p.fc > COS_UMBRAL_ROJO) { return 'rojo'; }
	if (p.fc >= COS_UMBRAL_AMARILLO) { return 'amarillo'; }
	return 'verde';
}
var COS_ORDEN = { rojo: 0, amarillo: 1, verde: 2, incompleto: 3 };

function xCosCargar() {
	return xCosApi('listar', null, 'Calculando costos...').then(function (r) {
		if (!r.success) { return; }
		COS_UMBRAL_AMARILLO = parseFloat(r.datos.umbrales.amarillo) || 30;
		COS_UMBRAL_ROJO = parseFloat(r.datos.umbrales.rojo) || 38;
		xCosAlertas(r.datos.alertas || []);
		xCosPlatos = r.datos.platos.map(function (p) {
			var precio = parseFloat(p.precio) || 0, costo = parseFloat(p.costo) || 0;
			var x = $.extend({}, p, {
				precio: precio, costo: costo, costo_receta: parseFloat(p.costo_receta) || 0,
				costo_30d: p.costo_30d === null ? null : parseFloat(p.costo_30d),
				margen: precio - costo, fc: precio > 0 ? costo * 100 / precio : null,
				n_sin_costo: parseInt(p.n_sin_costo) || 0, n_fijos: parseInt(p.n_fijos) || 0,
				n_manual: parseInt(p.n_manual) || 0, n_incons: parseInt(p.n_incons) || 0
			});
			x.estado = xCosEstado(x);
			x.incompleto = x.n_sin_costo > 0 || x.n_fijos > 0;
			return x;
		}).sort(function (a, b) {
			return (COS_ORDEN[a.estado] - COS_ORDEN[b.estado]) || ((b.fc || 0) - (a.fc || 0));
		});
		xCosSinReceta = r.datos.sin_receta;
		xCosSimBase = null; // los costos cambiaron: la base del simulador se vuelve a pedir
		if (xCosSim) { return xCosSimCargarBase().then(xCosRefrescarVista); }
		xCosRefrescarVista();
	});
}
function xCosRefrescarVista() { xCosKpis(); xCosPintar(); xCosSimResumen(); }

// Platos a mostrar: los reales o, con simulacion activa, copias con el costo proyectado
function xCosVista() {
	if (!xCosSim || !xCosSimBase) { return xCosPlatos; }
	var extra = {};
	xCosSimBase.forEach(function (b) {
		if (b.idproducto == xCosSim.idproducto) { extra[b.iditem] = (extra[b.iditem] || 0) + parseFloat(b.costo) * xCosSim.pct / 100; }
	});
	return xCosPlatos.map(function (p) {
		var ex = extra[p.iditem] || 0;
		if (!ex) { return p; }
		var costo = p.costo + ex;
		var x = $.extend({}, p, { costo: costo, margen: p.precio - costo, fc: p.precio > 0 ? costo * 100 / p.precio : null,
			sim_extra: ex, costo_real: p.costo, estado_real: p.estado });
		x.estado = xCosEstado(x);
		return x;
	}).sort(function (a, b) {
		return (COS_ORDEN[a.estado] - COS_ORDEN[b.estado]) || ((b.fc || 0) - (a.fc || 0));
	});
}
// Precio para volver al umbral amarillo, redondeado hacia arriba a 10 centimos
function xCosPrecioSugerido(costo) { return Math.ceil(costo / (COS_UMBRAL_AMARILLO / 100) * 10) / 10; }
function xCosFcPromedio(lista) {
	var c = 0, pr = 0;
	lista.forEach(function (p) { if (p.costo > 0 && p.precio > 0) { c += p.costo; pr += p.precio; } });
	return pr > 0 ? c * 100 / pr : null;
}

function xCosKpis() {
	var vista = xCosVista(), sinReceta = xCosSinReceta;
	var conCosto = vista.filter(function (p) { return p.costo > 0 && p.precio > 0; });
	var sumC = 0, sumP = 0;
	conCosto.forEach(function (p) { sumC += p.costo; sumP += p.precio; });
	var rojos = vista.filter(function (p) { return p.estado === 'rojo'; }).length;
	var incompletos = vista.filter(function (p) { return p.incompleto; }).length;
	$('#cos_kpis').html(
		'<div class="inv-kpi inv-kpi-azul"><span>Food cost promedio</span><b>' + (sumP > 0 ? (sumC * 100 / sumP).toFixed(1) + ' %' : '-') + '</b><em>' + conCosto.length + ' platos con costo</em></div>' +
		'<div class="inv-kpi inv-kpi-rojo cos-kpi-click" onclick="xCosFiltrar(\'rojo\')"><span>No rentables</span><b class="' + (rojos ? 'text-danger' : '') + '">' + rojos + '</b><em>food cost &gt; ' + COS_UMBRAL_ROJO + ' % o margen negativo</em></div>' +
		'<div class="inv-kpi inv-kpi-celeste cos-kpi-click" onclick="xCosFiltrar(\'incompleto\')"><span>Costo incompleto</span><b>' + incompletos + '</b><em>ingredientes sin precio o con costo fijo</em><span class="cos-kpi-accion" onclick="event.stopPropagation(); xCosPorcionesAbrir()">Vincular porciones →</span></div>' +
		'<div class="inv-kpi"><span>Platos sin receta</span><b>' + sinReceta + '</b><em>no se pueden costear</em></div>'
	);
	$('#cos_leyenda').html('<span class="cos-fc verde">&lt; ' + COS_UMBRAL_AMARILLO + ' %</span> <span class="cos-fc amarillo">' + COS_UMBRAL_AMARILLO + '–' + COS_UMBRAL_ROJO + ' %</span> <span class="cos-fc rojo">&gt; ' + COS_UMBRAL_ROJO + ' %</span>');
}
function xCosAlertas(lista) {
	if (!lista.length) { $('#cos_alertas').hide().html(''); return; }
	var html = '<div class="cos-alertas-top"><b><i class="fa fa-exclamation-triangle"></i>' + lista.length + ' plato' + (lista.length > 1 ? 's dejaron' : ' dejó') +
		' de ser rentable' + (lista.length > 1 ? 's' : '') + '</b><span class="inv-link" onclick="xCosAlertasVistas()"><i class="fa fa-check"></i>Marcar como vistas</span></div>';
	lista.forEach(function (a) {
		html += '<div class="cos-alerta">' +
			'<span class="inv-link" onclick="xCosDetalle(' + a.iditem + ')">' + xCosEsc(a.descripcion) + '</span>' +
			' · food cost ' + (a.fc_antes === null ? '-' : parseFloat(a.fc_antes).toFixed(1) + ' %') + ' → <b class="text-danger">' + (a.fc_despues === null ? '-' : parseFloat(a.fc_despues).toFixed(1) + ' %') + '</b>' +
			' · costo ' + xCosSoles(a.costo_antes) + ' → ' + xCosSoles(a.costo_despues) + ' · precio ' + xCosSoles(a.precio) +
			(a.causa ? '<span class="inv-sub">' + xCosEsc(a.causa) + ' · ' + xCosEsc(a.fecha) + '</span>' : '') +
			'</div>';
	});
	$('#cos_alertas').html(html).show();
}
function xCosAlertasVistas() {
	xCosApi('alertas-vistas', null, false).then(function (r) {
		if (!r.success) { return; }
		xCosAlertas([]);
		try { window.localStorage.removeItem('::app3_sys_costeo_alertas'); } catch (e) {}
		showToastSwal('success', 'Alertas marcadas como vistas');
	});
}
function xCosAbrirUmbrales() {
	$('#cos_um_amarillo').val(COS_UMBRAL_AMARILLO);
	$('#cos_um_rojo').val(COS_UMBRAL_ROJO);
	dlg_cos_umbrales.open();
}
function xCosGuardarUmbrales() {
	xCosApi('config-guardar', { umbral_amarillo: parseFloat($('#cos_um_amarillo').val()), umbral_rojo: parseFloat($('#cos_um_rojo').val()) })
	.then(function (r) {
		if (!r.success) { return; }
		dlg_cos_umbrales.close();
		showToastSwal('success', 'Umbrales guardados');
		xCosCargar();
	});
}
function xCosFiltrar(v) { $('#cos_filtro').val(v); xCosPintar(); }

function xCosPintar() {
	var txt = ($('#cos_buscar').val() || '').toLowerCase();
	var filtro = $('#cos_filtro').val();
	var html = '';
	xCosVista().forEach(function (p) {
		if (txt && (p.descripcion + ' ' + (p.seccion || '')).toLowerCase().indexOf(txt) < 0) { return; }
		if (filtro === 'incompleto' ? !p.incompleto : (filtro === 'simulados' ? !p.sim_extra : (filtro && p.estado !== filtro))) { return; }
		var avisos = '';
		if (p.n_fijos) { avisos += '<span class="inv-tag cos-tag-warn">' + p.n_fijos + ' costo fijo</span> '; }
		if (p.n_sin_costo) { avisos += '<span class="inv-tag cos-tag-warn">' + p.n_sin_costo + ' sin precio</span> '; }
		if (p.n_manual) { avisos += '<span class="inv-tag">' + p.n_manual + ' precio manual</span> '; }
		if (p.n_incons) { avisos += '<span class="inv-tag cos-tag-err" title="La cantidad que descuenta el stock no coincide con la de la receta">' + p.n_incons + ' receta inconsistente</span>'; }
		// Variacion contra hace 30 dias si hay historial; si no, contra el costo guardado en la receta
		var base = p.costo_30d !== null ? p.costo_30d : p.costo_receta;
		var dif = p.costo - base;
		var sub = p.sim_extra ? '<span class="inv-sub cos-sube">+' + xCosSoles(p.sim_extra) + ' simulado (hoy ' + xCosSoles(p.costo_real) + ')</span>' : Math.abs(dif) >= 0.01 ? '<span class="inv-sub' + (dif > 0 ? ' cos-sube' : '') + '">' + (dif > 0 ? '▲ ' : '▼ ') + xCosSoles(Math.abs(dif)) +
			(p.costo_30d !== null ? ' vs 30 días' : ' vs receta') + '</span>' : '';
		html += '<tr>' +

// Cantidad escrita -> unidad kardex (lo que se guarda y lo que usa la vista)
function xCosCantKardex() {
	var ins = xCosVinculo.insumo, cant = parseFloat($('#cos_vin_cant').val());

}
function xCosMerma() {

// Unidad en la que se escribe el peso (la de receta si el producto tiene conversion, si no la de compra)
function xCosUndPeso(ins) {
	var usaReceta = parseFloat(ins.factor) > 1 && ins.und_receta;

	var u = xCosUndPeso(ins);
	var bruto = k / (1 - m / 100);
	var costo = bruto * parseFloat(ins.costo_kardex);
	var neto = xCosNum(k * u.factor, 3) + ' ' + xCosEsc(u.und);
	var html = m > 0

		: 'Cada porción usa ' + neto + ' de ' + xCosEsc(ins.descripcion || ins.label) + '.';

function xCosGuardarVinculo() {
