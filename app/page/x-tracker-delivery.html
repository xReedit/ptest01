	<script>
		var TRK_INTERVALO_MS = 20000;
		var TRK_SIN_SENAL_MS = 5 * 60 * 1000;
		var TRK_PEDIDO_TARDE_MIN = 45;
		var TRK_FALLOS_MAX = 3;
		var TRK_FACTOR_CALLE = 1.3;   // por calles, no en linea recta
		var TRK_VEL_KMH = 18;         // moto en ciudad chica, con paradas
		// La estimacion se infla a proposito. Si prometemos 3 min y el repartidor llega en 5, el cliente
		// reclama; si prometemos 9 y llega en 5, siente que lo atendieron rapido. El colchon cubre ademas
		// lo que el calculo no ve: estacionar, encontrar la puerta, cobrar.
		var TRK_ETA_HOLGURA = 1.7;
		// En una ciudad chica casi todo queda a menos de 1 km, asi que un piso alto aplastaba la
		// estimacion y todos los pedidos decian lo mismo. Con 2 min solo se evita prometer "1 min".
		var TRK_ETA_PISO_MIN = 2;

		// Un color por repartidor, no por tipo: el tipo ya esta en su columna y en el globo, y lo que
		// hace falta en el mapa es saber de un vistazo cual marcador es cual. El color sale del id,
		// asi que no cambia cuando se reordena la tabla ni entre un refresco y el siguiente.
		var TRK_PALETA = ['#e6194b', '#3cb44b', '#4363d8', '#f58231', '#911eb4', '#008080',
			'#f032e6', '#9a6324', '#046307', '#000075', '#b15928', '#00838f'];
		var TRK_PESO_CARGA = 1.2;     // cada pedido encima pesa como 1.2 km al sugerir repartidor
		var TRK_ALERTA_SIN_ASIGNAR_MIN = 10;   // un pedido sin repartidor pasado esto ya es un problema

		var xTrkMapa = null;
		var xTrkCapas = null;
		var xTrkTimer = null;
		var xTrkMarcadores = {};
		var xTrkCentrado = false;
		var xTrkVivo = false;
		var xTrkEnVuelo = false;
		var xTrkFallos = 0;
		var xTrkUltimo = null;   // ultimo agrupado pintado, para el historial sin consultar de nuevo
		var xTrkRendicion = null;   // repartidor cuya rendicion se esta armando
		var xTrkMetodos = [];       // metodos de pago que acepta la sede
		var xTrkRendTotal = 0;      // lo que el repartidor debe entregar por lo marcado
		var xTrkModo = 'pedido';    // 'pedido' = metodo por pedido | 'mano' = reparto manual del total
		var xTrkDemorados = 0;   // para avisar solo cuando el numero sube, no en cada refresco
		var xTrkSede = null;     // datos de la sede del ultimo refresco, para el dialogo de ayuda
		var xTrkMapaS = null;    // mapa chico del dialogo, para mover la ubicacion del local
		var xTrkMarcadorS = null;
		var xTrkUbicacionNueva = null;
		var xTrkMapaR = null;    // mapa del dialogo de recorrido
		var xTrkCapaR = null;
		var TRK_REC_CERCA_M = 150;   // dentro de esto se considera que llego a la direccion
		var TRK_REC_LEJOS_M = 500;   // pasado esto el recorrido contradice la entrega
		var TRK_REC_CORTE_MIN = 3;   // si el ultimo punto es mas viejo que esto, el trazo no sirve

		/**
		 * Siempre resuelve con {success, datos, error}.
		 * `silencioso` existe porque esta pantalla se refresca sola cada 20 s: si el modal saltara en
		 * cada fallo, una sesion caida le abriria al usuario un dialogo que se reabre solo, para siempre.
		 * El refresco automatico informa en la cabecera; el boton "Actualizar" si avisa con modal.
		 */
		function xTrkApi(op, body, silencioso) {
			var d = $.Deferred();
			$.ajax({ type: 'POST', url: '../../bdphp/log_tracker.php?op=' + op,
				data: JSON.stringify(body || {}), contentType: 'application/json', dataType: 'json' })
			.done(function (r) {
				if ((!r || !r.success) && !silencioso) { xTrkAviso((r && r.error) || 'Error de comunicacion con el servidor', 'error'); }
				d.resolve(r || { success: false, datos: null, error: 'sin respuesta' });
			})
			.fail(function (jqXHR) {
				if (!silencioso) {
					xTrkAviso(jqXHR && jqXHR.status === 401 ? 'Tu sesion expiro, vuelve a entrar.' : 'No se pudo conectar con el servidor', 'error');
				}
				d.resolve({ success: false, datos: null, error: 'red' });
			});
			return d.promise();
		}

		// Avisos: SweetAlert tema 1, nunca alert()/confirm() nativos (docs/design.md seccion 7).
		function xTrkAviso(texto, icono, titulo) {
			showAlertSwalOk(icono || 'warning', titulo || '', texto, 'Entendido', 1);
		}

		function xTrkEsc(s) { return $('<div>').text(s === null || s === undefined ? '' : String(s)).html(); }

		/** El color identifica a la persona, no al tipo. Mismo color en el pin, el chip, el destino y la linea. */
		function xTrkColor(r) { return r.color || TRK_PALETA[0]; }

		/** El circulito con la inicial, igual en el mapa y en las tablas. */
		function xTrkChip(r) {
			return '<span class="trk-chip' + (r.sinSenal ? ' sinsenal' : '') + '" style="background:' + xTrkColor(r) + '">' +
				xTrkEsc(r.etiqueta) + '</span>';
		}

		/** Distancia en linea recta, en km. */
		function xTrkDistanciaKm(lat1, lng1, lat2, lng2) {
			var R = 6371;
			var dLat = (lat2 - lat1) * Math.PI / 180;
			var dLng = (lng2 - lng1) * Math.PI / 180;
			var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
				Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
				Math.sin(dLng / 2) * Math.sin(dLng / 2);
			return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
		}

		/**
		 * Llamar y WhatsApp. El numero se limpia de espacios y guiones, y si viene de 9 digitos se le
		 * antepone el 51: asi estan guardados los telefonos peruanos en la base.
		 */
		function xTrkContacto(telefono) {
			var limpio = String(telefono || '').replace(/[^0-9]/g, '');
			if (limpio.length < 6) { return ''; }
			return ' <a class="trk-contacto" href="tel:' + limpio + '" title="Llamar"><i class="fa fa-phone"></i></a>' +
				' <a class="trk-contacto wa" href="javascript:void(0)" onclick="xTrkWhatsapp(\'' + limpio + '\')"' +
				' title="WhatsApp"><i class="fa fa-whatsapp"></i></a>';
		}

		/**
		 * Abre el chat de WhatsApp sin acumular pestanas.
		 *
		 * Dos decisiones, las dos por un motivo concreto:
		 * - Ventana con nombre en vez de _blank: el segundo clic reutiliza la misma pestana. Con _blank
		 *   cada repartidor abria una nueva y quedaban diez a la media hora.
		 * - web.whatsapp.com/send en vez de wa.me: wa.me muestra una pagina intermedia que pregunta si
		 *   abrir la aplicacion o la web, y al elegir la web arranca una sesion nueva que desconecta la
		 *   que ya estaba abierta. Yendo directo se entra al chat en la sesion que ya existe.
		 *
		 * No lleva rel="noopener": eso obliga a un contexto nuevo y anularia la reutilizacion.
		 */
		function xTrkWhatsapp(telefono) {
			var limpio = String(telefono || '').replace(/[^0-9]/g, '');
			if (limpio.length < 6) { return; }
			var numero = limpio.length === 9 ? '51' + limpio : limpio;   // celular peruano sin prefijo
			var w = window.open('https://web.whatsapp.com/send?phone=' + numero, 'papaya_whatsapp');
			if (w) { w.focus(); }
		}

		function xTrkFmtDistancia(km) {
			return km < 1 ? Math.round(km * 1000) + ' m' : km.toFixed(1) + ' km';
		}

		/**
		 * Estimacion honesta, no una ruta real: nadie viaja en linea recta, asi que la distancia se
		 * corrige por TRK_FACTOR_CALLE antes de dividirla por la velocidad. Calcularlo con el servicio
		 * de rutas de Google daria el tiempo exacto, pero serian dos llamadas pagas por pedido cada 20 s
		 * en cada terminal de cada comercio. Por eso dice "aprox" en pantalla.
		 */
		function xTrkTramo(r, p) {
			if (!isFinite(r.lat) || !isFinite(r.lng) || !isFinite(p.lat) || !isFinite(p.lng)) { return null; }
			var km = xTrkDistanciaKm(r.lat, r.lng, p.lat, p.lng) * TRK_FACTOR_CALLE;
			var crudo = km / TRK_VEL_KMH * 60;
			return { km: km, min: Math.max(TRK_ETA_PISO_MIN, Math.round(crudo * TRK_ETA_HOLGURA)) };
		}

		function xTrkTramoTexto(r, p) {
			var t = xTrkTramo(r, p);
			return t ? xTrkFmtDistancia(t.km) + ' · ~' + t.min + ' min' : '';
		}

		function xTrkFmtMin(n) {
			if (n === null || n === undefined || isNaN(n)) { return '—'; }
			if (n < 60) { return n + ' min'; }
			return Math.floor(n / 60) + ' h ' + (n % 60) + ' min';
		}

		// MySQL devuelve "2026-09-17 13:22:41"; sin la T, Safari y iOS lo leen como fecha invalida.
		function xTrkFecha(txt) {
			if (!txt) { return null; }
			var d = new Date(String(txt).replace(' ', 'T'));
			return isNaN(d.getTime()) ? null : d;
		}

		function xTrkMinutos(desde, hasta) {
			if (!desde || !hasta) { return null; }
			return Math.round((hasta.getTime() - desde.getTime()) / 60000);
		}

		/**
		 * Lo que el repartidor declaro al entregar: con que le pagaron y cuanto. Viene del JSON
		 * `operacion`, que la app del repartidor llena al marcar la entrega. Puede no estar: las
		 * entregas anteriores a esa funcion, y las que el repartidor cerro sin especificar, vienen vacias.
		 */
		function xTrkPago(operacion, importeDefecto) {
			var o = {};
			try { o = operacion ? (typeof operacion === 'string' ? JSON.parse(operacion) : operacion) : {}; }
			catch (e) { o = {}; }
			if (!o || !o.descripcion) { return null; }
			var imp = parseFloat(o.importe);
			return {
				idtipo_pago: parseInt(o.idtipo_pago, 10) || 1,
				descripcion: String(o.descripcion),
				importe: isFinite(imp) ? imp : importeDefecto,
				alLocal: !!o.pago_al_local
			};
		}

		/**
		 * Costo de delivery del pedido. El campo del JSON manda; si falta, la diferencia entre lo que
		 * paga el cliente y el total del pedido. No siempre coinciden: puede haber propina de por medio.
		 */
		function xTrkCostoDelivery(f) {
			var c = parseFloat(f.costo_delivery);
			if (isFinite(c)) { return c; }
			var tr = parseFloat(f.total_r), t = parseFloat(f.total);
			return (isFinite(tr) && isFinite(t)) ? Math.max(0, tr - t) : 0;
		}

		/** Una fila de pedido y una de repartidor propio traen los mismos campos: un solo constructor. */
		function xTrkRepartidorDesde(f, idr, ahora) {
			var pos = {};
			try { pos = f.position_now ? (typeof f.position_now === 'string' ? JSON.parse(f.position_now) : f.position_now) : {}; }
			catch (e) { pos = {}; }
			var sello = xTrkFecha(f.position_now_fecha);

			return {
				idrepartidor: idr,
				nombre: ((f.nombre || '') + ' ' + (f.apellido || '')).trim() || ('Repartidor ' + idr),
				telefono: f.telefono || '',
				// propio es "suscrito A ESTA sede", no "suscrito a alguna": un repartidor de otra
				// sede que toma un pedido tuyo es global para vos. Lo resuelve el SQL (es_propio).
				esPropio: parseInt(f.es_propio, 10) === 1,
				conectado: parseInt(f.online, 10) === 1 && !!f.socketid,
				// nunca entro a la app: sin esto no hay seguimiento posible, por mas que este trabajando
				sinApp: parseInt(f.tiene_app, 10) !== 1,
				sinSenal: !sello || (ahora.getTime() - sello.getTime()) > TRK_SIN_SENAL_MS,
				lat: parseFloat(pos.latitude),
				lng: parseFloat(pos.longitude),
				porEntregar: [],
				entregados: []
			};
		}

		function xTrkAgrupar(filas, propios) {
			var ahora = new Date();
			var porId = {};
			var sinAsignar = [];

			(filas || []).forEach(function (f) {
				// un pedido cancelado por el repartidor no cuenta ni como pendiente ni como entrega
				if (f.pwa_delivery_status === '5') { return; }

				var creado = xTrkFecha(f.fecha_hora);
				var entrega = xTrkFecha(f.fecha_entrega);
				var entregado = f.pwa_delivery_status === '4';

				var pedido = {
					idpedido: f.idpedido,
					numero: f.correlativo_dia || f.numpedido,
					cliente: f.cliente || 'Sin nombre',
					direccion: f.dest_direccion || '',
					referencia: f.dest_referencia || '',
					importe: parseFloat(f.total_r) || 0,
					lat: parseFloat(f.dest_lat),
					lng: parseFloat(f.dest_lng),
					entregado: entregado,
					minutos: entregado ? xTrkMinutos(creado, entrega) : xTrkMinutos(creado, ahora),
					horaEntrega: entrega ? entrega.toTimeString().slice(0, 5) : '',
					horaPedido: creado ? creado.toTimeString().slice(0, 5) : '',
					pago: xTrkPago(f.operacion, parseFloat(f.total_r) || 0),
					rendido: parseInt(f.rendido, 10) === 1,
					costoDelivery: xTrkCostoDelivery(f)
				};

				var idr = parseInt(f.idrepartidor, 10) || 0;
				if (!idr) { sinAsignar.push(pedido); return; }

				if (!porId[idr]) { porId[idr] = xTrkRepartidorDesde(f, idr, ahora); }
				porId[idr][entregado ? 'entregados' : 'porEntregar'].push(pedido);
			});

			// los propios sin pedidos hoy no salen de la consulta de pedidos, y son justo los que estan
			// libres para recibir uno: se agregan aqui para que el encargado los vea y pueda asignarles
			(propios || []).forEach(function (f) {
				var idr = parseInt(f.idrepartidor, 10) || 0;
				if (idr && !porId[idr]) { porId[idr] = xTrkRepartidorDesde(f, idr, ahora); }
			});

			Object.keys(porId).forEach(function (k) {
				porId[k].porRendir = porId[k].entregados.filter(function (p) { return !p.rendido; });
			});

			var repartidores = Object.keys(porId).map(function (k) {
				var r = porId[k];
				var conTiempo = r.entregados.filter(function (p) { return p.minutos !== null; });
				r.minutosPromedio = conTiempo.length
					? Math.round(conTiempo.reduce(function (a, p) { return a + p.minutos; }, 0) / conTiempo.length)
					: null;
				return r;
			});

			// los que todavia tienen trabajo, primero
			repartidores.sort(function (a, b) { return b.porEntregar.length - a.porEntregar.length; });

			// el mismo identificador va en el pin del mapa y en la fila de la tabla, para poder
			// relacionarlos de un vistazo. Si dos comparten inicial se numeran, o serian el mismo.
			var usadas = {};
			repartidores.forEach(function (r) {
				var base = (r.nombre.charAt(0) || '?').toUpperCase();
				usadas[base] = (usadas[base] || 0) + 1;
				r.etiqueta = usadas[base] > 1 ? base + usadas[base] : base;
			});

			// El color se reparte por posicion en la lista ordenada por id, no por (id % paleta): con el
			// modulo, dos repartidores separados por el tamano de la paleta caian en el mismo color.
			// Ordenar por id lo mantiene estable entre refrescos aunque la tabla se reordene por carga.
			repartidores.slice().sort(function (a, b) { return a.idrepartidor - b.idrepartidor; })
				.forEach(function (r, i) { r.color = TRK_PALETA[i % TRK_PALETA.length]; });

			return { repartidores: repartidores, sinAsignar: sinAsignar };
		}

		function xTrkCrearMapa() {
			xTrkMapa = L.map('trk_mapa').setView([-6.0331, -76.9747], 14);
			L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
				maxZoom: 19,
				attribution: '&copy; colaboradores de <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
			}).addTo(xTrkMapa);
			xTrkCapas = L.layerGroup().addTo(xTrkMapa);
		}

		/** `auto` = lo disparo el temporizador, no el usuario: falla en silencio y avisa en la cabecera. */
		function xTrkCargar(auto) {
			if (xTrkEnVuelo) { return; }
			xTrkEnVuelo = true;
			xTrkApi('estado', {}, !!auto).then(function (r) {
				xTrkEnVuelo = false;
				// si salieron de la pantalla con la consulta en vuelo, detached ya destruyo las capas
				if (!xTrkVivo || !xTrkCapas) { return; }
				if (!r.success || !r.datos) {
					xTrkFallos++;
					$('#trk_actualizado').text('Sin conexion, reintentando...');
					// tres fallos seguidos: algo esta roto de verdad, dejar de golpear al servidor
					if (xTrkFallos >= TRK_FALLOS_MAX && xTrkTimer) {
						clearInterval(xTrkTimer); xTrkTimer = null;
						$('#trk_actualizado').text('Sin conexion. Pulsa Actualizar para reintentar.');
					}
					return;
				}
				xTrkFallos = 0;
				if (!xTrkTimer && xTrkVivo) { xTrkTimer = setInterval(function () { xTrkCargar(true); }, TRK_INTERVALO_MS); }
				xTrkPintar(r.datos);
				$('#trk_actualizado').text('Actualizado ' + new Date().toLocaleTimeString('es-PE'));
			});
		}

		function xTrkPintar(datos) {
			xTrkCapas.clearLayers();
			xTrkMarcadores = {};

			var sede = datos.sede || {};
			xTrkSede = sede;
			if (datos.metodos && datos.metodos.length) { xTrkMetodos = datos.metodos; }
			var sedeLat = parseFloat(sede.latitude);
			var sedeLng = parseFloat(sede.longitude);

			if (isFinite(sedeLat) && isFinite(sedeLng)) {
				L.marker([sedeLat, sedeLng], {
					icon: L.divIcon({ className: '', html: '<div class="trk-local"><i class="fa fa-home"></i>' + xTrkEsc(sede.nombre || 'Local') + '</div>' })
				}).addTo(xTrkCapas);
				if (!xTrkCentrado) { xTrkMapa.setView([sedeLat, sedeLng], 14); xTrkCentrado = true; }
			}

			var agrupado = xTrkAgrupar(datos.filas, datos.propios);
			xTrkUltimo = agrupado;

			agrupado.repartidores.forEach(function (r) {
				// cada destino lleva el color de su repartidor: en gris uniforme no se sabia de quien era
				var color = xTrkColor(r);

				r.porEntregar.forEach(function (p) {
					if (!isFinite(p.lat) || !isFinite(p.lng)) { return; }
					L.marker([p.lat, p.lng], {
						icon: L.divIcon({ className: '', iconSize: [16, 16], iconAnchor: [8, 8],
							html: '<div class="trk-destino" style="background:' + color + '"></div>' })
					}).addTo(xTrkCapas).bindPopup(
						'<div class="trk-popup"><b>#' + xTrkEsc(p.numero) + ' · ' + xTrkEsc(p.cliente) + '</b>' +
						'<span>' + xTrkEsc(p.direccion) + '</span>' +
						'<span>Lleva ' + xTrkEsc(r.nombre) + '</span>' +
						(xTrkTramoTexto(r, p) ? '<span class="trk-eta">A ' + xTrkTramoTexto(r, p) + ' de distancia</span>' : '') +
						'</div>');
				});

				if (!isFinite(r.lat) || !isFinite(r.lng)) { return; }

				// un repartidor global que ya entrego todo lo tuyo deja de ser tuyo: su fila se queda en
				// la tabla como resumen del dia, pero seguir viendo donde esta seria rastrear a alguien
				// que en este momento no trabaja para esta sede
				if (!r.esPropio && r.porEntregar.length === 0) { return; }

				var marcador = L.marker([r.lat, r.lng], {
					icon: L.divIcon({ className: '', iconSize: [30, 30], iconAnchor: [15, 15],
						html: '<div class="trk-pin' + (r.sinSenal ? ' sinsenal' : '') +
							'" style="background:' + color + '">' + xTrkEsc(r.etiqueta) + '</div>' })
				}).addTo(xTrkCapas);

				// linea hacia la proxima entrega
				var siguiente = r.porEntregar.filter(function (p) { return isFinite(p.lat) && isFinite(p.lng); })[0];

				marcador.bindPopup(
					'<div class="trk-popup"><b>' + xTrkEsc(r.nombre) + '</b>' +
					'<span>' + (r.esPropio ? 'Propio del local' : 'Repartidor global') + (r.sinSenal ? ' · sin senal' : '') + '</span>' +
					'<span>Por entregar: ' + r.porEntregar.length + ' · Entregados hoy: ' + r.entregados.length + '</span>' +
					(siguiente
						? '<span class="trk-eta">Proxima: #' + xTrkEsc(siguiente.numero) + ' a ' + xTrkTramoTexto(r, siguiente) + '</span>'
						: '<span class="trk-eta"><i class="fa fa-check"></i> Libre, volviendo al local</span>') +
					(r.telefono ? '<span>' + xTrkEsc(r.telefono) + '</span>' : '') + '</div>');

				xTrkMarcadores[r.idrepartidor] = marcador;

				// sin pedidos pendientes la linea apunta al local: es como se ve que va de vuelta
				var hacia = siguiente
					? { lat: siguiente.lat, lng: siguiente.lng }
					: (isFinite(sedeLat) && isFinite(sedeLng) ? { lat: sedeLat, lng: sedeLng } : null);

				if (hacia) {
					// halo blanco debajo: sobre las calles claras de OSM un trazo fino se pierde
					L.polyline([[r.lat, r.lng], [hacia.lat, hacia.lng]], {
						color: '#fff', weight: 7, opacity: .9
					}).addTo(xTrkCapas);
					L.polyline([[r.lat, r.lng], [hacia.lat, hacia.lng]], {
						color: siguiente ? color : '#adb5bd', weight: 3,
						dashArray: siguiente ? '9,6' : '3,7', opacity: 1
					}).addTo(xTrkCapas);
				}
			});

			// los pedidos que nadie tomo: son los que exigen una decision, asi que van en el mapa
			agrupado.sinAsignar.forEach(function (p) {
				if (!isFinite(p.lat) || !isFinite(p.lng)) { return; }
				var tarde = p.minutos !== null && p.minutos > TRK_ALERTA_SIN_ASIGNAR_MIN;
				L.marker([p.lat, p.lng], {
					icon: L.divIcon({ className: '', iconSize: [24, 24], iconAnchor: [12, 12],
						html: '<div class="trk-libre' + (tarde ? ' tarde' : '') + '">!</div>' })
				}).addTo(xTrkCapas).bindPopup(
					'<div class="trk-popup"><b>#' + xTrkEsc(p.numero) + ' · ' + xTrkEsc(p.cliente) + '</b>' +
					'<span>' + xTrkEsc(p.direccion) + '</span>' +
					'<span>Esperando ' + xTrkFmtMin(p.minutos) + ' sin repartidor</span>' +
					'<span class="trk-eta"><a href="javascript:void(0)" onclick="xTrkAbrirAsignar(' + p.idpedido + ')">' +
					'<i class="fa fa-user-plus"></i> Asignar repartidor</a></span></div>');
			});

			xTrkPintarTablas(agrupado);
		}

		function xTrkPintarTablas(agrupado) {
			var reps = agrupado.repartidores;
			var sin = agrupado.sinAsignar;

			var enRuta = reps.filter(function (r) { return r.porEntregar.length > 0; }).length;
			var porEntregar = reps.reduce(function (a, r) { return a + r.porEntregar.length; }, 0) + sin.length;
			var entregados = reps.reduce(function (a, r) { return a + r.entregados.length; }, 0);
			var tiempos = reps.filter(function (r) { return r.minutosPromedio !== null; });
			var promedio = tiempos.length
				? Math.round(tiempos.reduce(function (a, r) { return a + r.minutosPromedio; }, 0) / tiempos.length)
				: null;

			// Nadie mira la pantalla todo el rato: los pedidos que se pasaron de tiempo se cuentan aparte
			// y avisan solos. El toast salta solo cuando el numero sube, no en cada refresco.
			var demorados = reps.reduce(function (a, r) {
				return a + r.porEntregar.filter(function (p) { return p.minutos !== null && p.minutos > TRK_PEDIDO_TARDE_MIN; }).length;
			}, 0) + sin.filter(function (p) { return p.minutos !== null && p.minutos > TRK_ALERTA_SIN_ASIGNAR_MIN; }).length;

			if (demorados > xTrkDemorados) {
				showToastSwal('warning', demorados === 1 ? 'Hay 1 pedido demorado' : 'Hay ' + demorados + ' pedidos demorados');
			}
			xTrkDemorados = demorados;
			$('#trk_alerta').html(demorados
				? '<i class="fa fa-exclamation-triangle"></i>' + demorados + (demorados === 1 ? ' pedido demorado' : ' pedidos demorados')
				: '').toggleClass('activa', demorados > 0);

			// Solo molesta cuando hay algo que hacer: si todos tienen la app, el aviso no existe.
			var sinApp = reps.filter(function (r) { return r.esPropio && r.sinApp; });
			$('#trk_aviso_app').html(sinApp.length
				? '<i class="fa fa-mobile"></i> <b>' + (sinApp.length === 1
						? xTrkEsc(sinApp[0].nombre) + ' no aparece en el mapa</b> porque todavia no inicio sesion en la aplicacion.'
						: sinApp.length + ' repartidores no aparecen en el mapa</b> porque todavia no iniciaron sesion en la aplicacion: ' +
						  xTrkEsc(sinApp.map(function (r) { return r.nombre; }).join(', ')) + '.') +
					' <a href="javascript:void(0)" onclick="xTrkComoActivar()">Ver como activarlos</a>'
				: '').toggleClass('activo', sinApp.length > 0);

			$('#trk_kpis').html(
				'<div class="inv-kpi inv-kpi-azul"><span>Repartidores en ruta</span><b>' + enRuta + '</b></div>' +
				'<div class="inv-kpi inv-kpi-celeste"><span>Pedidos por entregar</span><b>' + porEntregar + '</b></div>' +
				'<div class="inv-kpi inv-kpi-verde"><span>Entregados hoy</span><b>' + entregados + '</b></div>' +
				'<div class="inv-kpi"><span>Tiempo promedio</span><b>' + xTrkFmtMin(promedio) + '</b></div>');

			var html = '';
			reps.forEach(function (r) {
				var demoradosDe = r.porEntregar.filter(function (p) {
					return p.minutos !== null && p.minutos > TRK_PEDIDO_TARDE_MIN;
				}).length;

				// Dos cosas distintas que antes competian por el mismo lugar: lo que esta haciendo y si
				// la app lo esta reportando. Un repartidor puede estar LIBRE y ademas desconectado, y el
				// encargado necesita ver las dos, porque a un desconectado no le puede asignar nada.
				var trabajo = r.porEntregar.length
					? '<span class="inv-estado aprobado"><i class="fa fa-motorcycle"></i>EN RUTA</span>'
					: '<span class="inv-estado cerrado"><i class="fa fa-check"></i>LIBRE</span>';

				var conexion;
				if (r.sinApp) {
					conexion = '<span class="trk-conexion sinapp"><i class="fa fa-mobile"></i>Sin la app instalada</span>';
				} else if (!r.conectado) {
					conexion = '<span class="trk-conexion off"><i class="fa fa-circle"></i>Desconectado</span>';
				} else if (r.sinSenal) {
					conexion = '<span class="trk-conexion alerta"><i class="fa fa-exclamation-triangle"></i>Sin senal</span>';
				} else {
					conexion = '<span class="trk-conexion on"><i class="fa fa-circle"></i>Conectado</span>';
				}
				var estado = trabajo + conexion;

				var verEnMapa = (isFinite(r.lat) && isFinite(r.lng))
					? '<span class="inv-link" onclick="xTrkVerRepartidor(' + r.idrepartidor + ')"><i class="fa fa-map-marker"></i>Ver en el mapa</span>'
					: '<span class="inv-muted">Sin ubicacion</span>';

				html += '<tr>' +
					'<td><div class="trk-rep">' +
						xTrkChip(r) +
						'<div class="trk-rep-datos"><b>' + xTrkEsc(r.nombre) + '</b>' +
						(r.telefono ? '<span class="inv-sub">' + xTrkEsc(r.telefono) + xTrkContacto(r.telefono) + '</span>' : '') + '</div>' +
						'</div></td>' +
					'<td><span class="inv-tag">' + (r.esPropio ? 'PROPIO' : 'GLOBAL') + '</span></td>' +
					'<td>' + estado + '</td>' +
					'<td class="inv-num">' + (r.porEntregar.length
						? '<span class="inv-link trk-cuenta" onclick="xTrkVerPedidos(' + r.idrepartidor + ',\'pendientes\')">' +
							r.porEntregar.length + '</span>' +
							(demoradosDe ? '<span class="inv-sub trk-tarde">' + demoradosDe + ' demorado' + (demoradosDe > 1 ? 's' : '') + '</span>' : '')
						: '0') + '</td>' +
					'<td class="inv-num">' + (r.entregados.length
						? '<span class="inv-link trk-cuenta" onclick="xTrkVerPedidos(' + r.idrepartidor + ',\'entregados\')">' + r.entregados.length + '</span>'
						: '0') + '</td>' +
					'<td class="inv-num">' + xTrkFmtMin(r.minutosPromedio) + '</td>' +
					'<td class="inv-acciones">' + verEnMapa +
						(r.porRendir && r.porRendir.length
							? '<span class="inv-link trk-rendir" onclick="xTrkAbrirRendicion(' + r.idrepartidor + ')">' +
								'<i class="fa fa-money"></i>Rendir (' + r.porRendir.length + ')</span>'
							: '') + '</td>' +
					'</tr>';
			});
			$('#tb_trk_repartidores tbody').html(html ||
				'<tr><td colspan="7" class="inv-empty">Esta sede no tiene repartidores propios registrados y ninguno de la red lleva pedidos tuyos. Puedes registrar los tuyos en <b>Control de delivery</b>.</td></tr>');

			var htmlSin = '';
			sin.forEach(function (p) {
				var tarde = p.minutos !== null && p.minutos > TRK_PEDIDO_TARDE_MIN;
				htmlSin += '<tr>' +
					'<td><b>#' + xTrkEsc(p.numero) + '</b></td>' +
					'<td>' + xTrkEsc(p.cliente) + '</td>' +
					'<td>' + xTrkEsc(p.direccion) + (p.referencia ? '<span class="inv-sub">' + xTrkEsc(p.referencia) + '</span>' : '') + '</td>' +
					'<td class="inv-num' + (tarde ? ' trk-tarde' : '') + '">' + xTrkFmtMin(p.minutos) + '</td>' +
					'<td class="inv-acciones"><span class="inv-link" onclick="xTrkAbrirAsignar(' + p.idpedido + ')">' +
						'<i class="fa fa-user-plus"></i>Asignar</span></td>' +
					'</tr>';
			});
			$('#tb_trk_sin_asignar tbody').html(htmlSin ||
				'<tr><td colspan="5" class="inv-empty">Todos los pedidos de delivery de hoy tienen repartidor.</td></tr>');
		}

		/**
		 * Ordena los repartidores para un pedido: primero el que llega antes y lleva menos encima.
		 * La carga pesa TRK_PESO_CARGA km por pedido pendiente, asi que uno a 500 m con tres entregas
		 * encima queda detras de otro a 2 km con las manos libres. Sin posicion, al final.
		 */
		function xTrkCandidatos(pedido) {
			if (!xTrkUltimo) { return []; }
			return xTrkUltimo.repartidores.map(function (r) {
				var t = xTrkTramo(r, pedido);
				return {
					r: r,
					km: t ? t.km : null,
					min: t ? t.min : null,
					puntaje: (t ? t.km : 999) + r.porEntregar.length * TRK_PESO_CARGA + (r.sinSenal ? 50 : 0)
				};
			}).sort(function (a, b) { return a.puntaje - b.puntaje; });
		}

		var TRK_URL_PLAY = 'https://play.google.com/store/apps/details?id=papaya.com.pe.repartidor';
		var TRK_URL_IOS = 'https://apps.apple.com/pe/app/papaya-repartidor/id1661062301';

		function xTrkComoActivar() {
			// los QR se dibujan al abrir, no al cargar la pagina: en un canvas oculto salen de 0 px
			try {
				new QRious({ element: document.getElementById('trk_qr_play'), value: TRK_URL_PLAY, size: 120, level: 'M' });
				new QRious({ element: document.getElementById('trk_qr_ios'), value: TRK_URL_IOS, size: 120, level: 'M' });
			} catch (e) { }

			var s = xTrkSede || {};
			$('#trk_chk_mapa').prop('checked', parseInt(s.pwa_habilitar_busqueda_mapa, 10) === 1);

			dlg_trk_ayuda.open();
			// Leaflet mide el contenedor al crearlo y dentro de un dialogo cerrado mide 0: hay que
			// esperar a que la animacion de apertura termine, y despues avisarle que ya tiene tamano.
			setTimeout(xTrkMapaSede, 350);
		}

		/** Mapa chico del dialogo: el marcador del local se arrastra o se coloca tocando el mapa. */
		function xTrkMapaSede() {
			var s = xTrkSede || {};
			var lat = parseFloat(s.latitude), lng = parseFloat(s.longitude);
			var hayCoords = isFinite(lat) && isFinite(lng);
			// sin coordenadas propias arranca donde este mirando el mapa grande, que es mejor que el mar
			var centro = hayCoords ? [lat, lng] : (xTrkMapa ? xTrkMapa.getCenter() : [-6.0331, -76.9747]);

			if (!xTrkMapaS) {
				xTrkMapaS = L.map('trk_mapa_sede', { attributionControl: false }).setView(centro, 16);
				L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(xTrkMapaS);

				xTrkMarcadorS = L.marker(centro, {
					draggable: true,
					icon: L.divIcon({ className: '', iconSize: [30, 30], iconAnchor: [15, 15],
						html: '<div class="trk-local-pin"><i class="fa fa-home"></i></div>' })
				}).addTo(xTrkMapaS);

				xTrkMarcadorS.on('dragend', function () { xTrkUbicacionMovida(xTrkMarcadorS.getLatLng()); });
				xTrkMapaS.on('click', function (e) { xTrkMarcadorS.setLatLng(e.latlng); xTrkUbicacionMovida(e.latlng); });
			} else {
				xTrkMapaS.setView(centro, 16);
				xTrkMarcadorS.setLatLng(centro);
			}

			xTrkMapaS.invalidateSize();
			xTrkUbicacionNueva = null;
			$('#trk_btn_ubicacion, #trk_btn_deshacer').prop('disabled', true);
			$('#trk_coords').removeClass('movida').text(hayCoords
				? lat.toFixed(6) + ', ' + lng.toFixed(6)
				: 'Sin coordenadas: coloca el marcador donde esta tu local.');
		}

		function xTrkUbicacionMovida(latlng) {
			xTrkUbicacionNueva = latlng;
			$('#trk_btn_ubicacion, #trk_btn_deshacer').prop('disabled', false);
			$('#trk_coords').addClass('movida')
				.text(latlng.lat.toFixed(6) + ', ' + latlng.lng.toFixed(6) + ' — sin guardar');
		}

		function xTrkResetUbicacion() { xTrkMapaSede(); }

		function xTrkGuardarUbicacion() {
			if (!xTrkUbicacionNueva) { return; }
			var lat = xTrkUbicacionNueva.lat, lng = xTrkUbicacionNueva.lng;
			xPopupLoad.titulo = 'Guardando ubicacion...'; xPopupLoad.xopen();
			xTrkApi('set-ubicacion-sede', { latitude: lat, longitude: lng }).then(function (r) {
				xPopupLoad.xclose();
				if (!r.success) { return; }
				if (xTrkSede) { xTrkSede.latitude = lat; xTrkSede.longitude = lng; }
				xTrkUbicacionNueva = null;
				$('#trk_btn_ubicacion, #trk_btn_deshacer').prop('disabled', true);
				$('#trk_coords').removeClass('movida').text(lat.toFixed(6) + ', ' + lng.toFixed(6));
				showToastSwal('success', 'Ubicacion del local actualizada');
				// el mapa grande tiene que recentrar en el sitio nuevo, no en el viejo
				xTrkCentrado = false;
				xTrkCargar(false);
			});
		}

		/**
		 * La primera vez que alguien abre el tracker en esta sede, se le explica que hace falta para que
		 * funcione. Si no, ve un mapa vacio y no tiene forma de saber por que. Se espera al primer
		 * refresco para poder mostrar las coordenadas reales del local y el estado del ajuste.
		 * La marca es por sede y por navegador: cambiar de sede vuelve a mostrarlo una vez.
		 */
		function xTrkAyudaPrimeraVez() {
			var clave = 'trk_ayuda_vista_' + (xIdSede || 0);
			try { if (localStorage.getItem(clave)) { return; } } catch (e) { return; }
			setTimeout(function () {
				if (!xTrkVivo || !xTrkSede) { return; }
				try { localStorage.setItem(clave, '1'); } catch (e) { }
				xTrkComoActivar();
			}, 1200);
		}

		function xTrkGuardarBusquedaMapa(habilitar) {
			xTrkApi('set-busqueda-mapa', { habilitar: habilitar ? 1 : 0 }).then(function (r) {
				if (!r.success) {
					// el servidor no lo acepto: la casilla vuelve a donde estaba para no mentir
					$('#trk_chk_mapa').prop('checked', !habilitar);
					return;
				}
				if (xTrkSede) { xTrkSede.pwa_habilitar_busqueda_mapa = habilitar ? 1 : 0; }
				showToastSwal('success', habilitar
					? 'Activado. Los pedidos nuevos podran ubicarse en el mapa.'
					: 'Desactivado. Los pedidos nuevos no apareceran en el mapa.');
			});
		}

		/**
		 * Avisa al repartidor por el mismo evento que usa Control de delivery: el servidor lo reenvia a
		 * su socket y le manda la notificacion push. Se usa el singleton de socket directamente en vez
		 * de _cpSocketOpen(), porque ese registra los oyentes de Control de pedidos, que en esta
		 * pantalla llamarian a funciones que no existen.
		 * Si el aviso no llega, la app del repartidor relee su estado sola cada 60 s: el pedido aparece
		 * igual, solo que mas tarde. Por eso esto no bloquea ni revierte la asignacion.
		 */
		function xTrkAvisarRepartidor(idpedido, idrepartidor) {
			try {
				var skt = socketService.getInstance();
				if (!skt._socket) { skt.connectSocket(); }
				skt.emit('set-repartidor-pedido-asigna-comercio', { idpedido: idpedido, idrepartidor: idrepartidor });
			} catch (e) {
				$('#trk_actualizado').text('Asignado. El repartidor lo vera en menos de un minuto.');
			}
		}

		function xTrkAbrirAsignar(idpedido) {
			if (!xTrkUltimo) { return; }
			var p = xTrkUltimo.sinAsignar.filter(function (x) { return x.idpedido === idpedido; })[0];
			if (!p) { xTrkAviso('Ese pedido ya no esta sin asignar. Actualiza la pantalla.', 'info'); return; }

			var candidatos = xTrkCandidatos(p);
			var html = '';
			candidatos.forEach(function (c, i) {
				var r = c.r;
				var motivo = c.km === null
					? '<span class="inv-muted">Sin ubicacion conocida</span>'
					: xTrkFmtDistancia(c.km) + ' · llega en ~' + c.min + ' min';
				html += '<tr>' +
					'<td><div class="trk-rep">' +
						xTrkChip(r) +
						'<div class="trk-rep-datos"><b>' + xTrkEsc(r.nombre) + '</b>' +
						'<span class="inv-sub">' + motivo + '</span></div></div></td>' +
					'<td><span class="inv-tag">' + (r.esPropio ? 'PROPIO' : 'GLOBAL') + '</span></td>' +
					'<td class="inv-num">' + r.porEntregar.length + '</td>' +
					'<td>' + (r.sinSenal ? '<span class="inv-estado anulado">SIN SENAL</span>'
						: (r.porEntregar.length === 0 ? '<span class="inv-estado cerrado">LIBRE</span>'
							: '<span class="inv-estado aprobado">EN RUTA</span>')) + '</td>' +
					'<td class="inv-acciones">' +
						(i === 0 ? '<span class="inv-tag trk-sugerido">SUGERIDO</span> ' : '') +
						'<button class="btn btn-sm btn-success" onclick="xTrkAsignar(' + idpedido + ',' + r.idrepartidor + ')">' +
						'<i class="fa fa-check"></i>Asignar</button></td>' +
					'</tr>';
			});

			$('#trk_asig_titulo').text('Asignar el pedido #' + p.numero);
			$('#trk_asig_sub').text(p.cliente + ' · ' + p.direccion + ' · esperando ' + xTrkFmtMin(p.minutos));
			$('#tb_trk_candidatos tbody').html(html ||
				'<tr><td colspan="5" class="inv-empty">No hay repartidores disponibles para esta sede. Registra uno en <b>Control de delivery</b> o solicita uno de la red.</td></tr>');
			dlg_trk_asignar.open();
		}

		function xTrkAsignar(idpedido, idrepartidor) {
			xPopupLoad.titulo = 'Asignando...'; xPopupLoad.xopen();
			xTrkApi('asignar', { idpedido: idpedido, idrepartidor: idrepartidor }).then(function (r) {
				xPopupLoad.xclose();
				if (!r.success) { return; }   // xTrkApi ya mostro el motivo
				dlg_trk_asignar.close();
				showToastSwal('success', 'Pedido #' + idpedido + ' asignado a ' + r.datos.nombre);
				xTrkAvisarRepartidor(idpedido, idrepartidor);
				xTrkCargar(false);
			});
		}

		/**
		 * El recorrido guardado de un pedido. Es la respuesta a "nunca llego": en vez de la palabra del
		 * repartidor contra la del cliente, el trazo real y a cuantos metros de la puerta termino.
		 *
		 * A diferencia del dialogo de pedidos, este si consulta: el recorrido son cientos de puntos y
		 * traerlos en el refresco de cada 20 segundos, para todos los pedidos, no tendria sentido.
		 */
		function xTrkVerRecorrido(idpedido) {
			xPopupLoad.titulo = 'Cargando recorrido...'; xPopupLoad.xopen();
			xTrkApi('recorrido', { idpedido: idpedido }).then(function (r) {
				xPopupLoad.xclose();
				if (!xTrkVivo || !r || !r.success || !r.datos) { return; }
				var d = r.datos;

				$('#trk_rec_titulo').text('Recorrido del pedido #' + (d.correlativo || d.numpedido || idpedido));
				$('#trk_rec_sub').text([d.repartidor, d.dest_direccion].filter(Boolean).join(' · '));
				$('#trk_rec_veredicto').html(xTrkVeredicto(d));

				dlg_trk_recorrido.open();
				// Leaflet mide el contenedor al crearlo y dentro de un dialogo cerrado mide 0:
				// hay que esperar a que la animacion de apertura termine.
				setTimeout(function () { if (xTrkVivo) { xTrkPintarRecorrido(d); } }, 350);
			});
		}

		/** '2026-09-19 13:35:02' -> Date. El navegador no parsea ese formato con espacio. */
		function xTrkFechaSql(t) {
			if (!t) { return null; }
			var d = new Date(String(t).replace(' ', 'T'));
			return isNaN(d.getTime()) ? null : d;
		}

		/**
		 * La conclusion en una linea, arriba del mapa, porque es lo unico que el encargado necesita
		 * para responderle al cliente. El mapa esta abajo para el que quiera verlo con sus ojos.
		 *
		 * Esta pantalla decide si a alguien se le descuenta un pedido, asi que cuando el dato no
		 * alcanza tiene que decir "no se puede saber" y no acusar. El caso peligroso es el trazo que
		 * se corto antes de la entrega: Android mata la app en segundo plano, se acaban los datos o
		 * apagan la ubicacion, y entonces el ultimo punto no es donde estaba al entregar.
		 */
		function xTrkVeredicto(d) {
			var caja = function (clase, icono, titulo, detalle) {
				return '<div class="trk-rec-veredicto ' + clase + '"><i class="fa ' + icono + '"></i>' +
					'<div><b>' + xTrkEsc(titulo) + '</b><span>' + xTrkEsc(detalle) + '</span></div></div>';
			};

			if (!d.puntos || !d.puntos.length) {
				return caja('vacio', 'fa-info-circle', 'No hay recorrido guardado para este pedido.',
					'Se guarda solo si el repartidor llevaba la app abierta con la ubicacion activada. ' +
					'Los pedidos anteriores a esta funcion tampoco lo tienen.');
			}
			if (d.metros_final === null || d.metros_final === undefined) {
				return caja('vacio', 'fa-info-circle', d.puntos.length + ' puntos guardados.',
					'La direccion del pedido no tiene coordenadas, asi que no se puede medir que tan cerca llego. ' +
					'Se arregla activando la busqueda por mapa en "Como activar el seguimiento".');
			}

			// El ultimo punto solo vale si es de cuando marco la entrega, asi que hay que poder
			// compararlo con esa hora. Sin ella no hay veredicto posible: la hora de entrega sale de
			// repartidor_pedido_entregado, pero el boton se pinta con pwa_delivery_status = '4', y hay
			// pedidos con el estado puesto y sin la fila. Para esos, callarse es la unica respuesta
			// honesta: es justo donde menos dato hay y donde mas firme sonaria la pantalla.
			var fin = xTrkFechaSql(d.fin), entrega = xTrkFechaSql(d.fecha_entrega);
			if (!entrega || !fin) {
				return caja('vacio', 'fa-info-circle', 'No se puede saber si llego.',
					'Este pedido no tiene registrada la hora de entrega, asi que el ultimo punto del ' +
					'recorrido no se puede comparar con nada. Mira el trazo en el mapa.');
			}
			// TRK_REC_CORTE_MIN da aire para el pulso de 30 s y para el reloj del telefono;
			// mas que eso es un trazo que se corto antes de que el repartidor llegara.
			var desfase = Math.round((entrega - fin) / 60000);
			if (desfase > TRK_REC_CORTE_MIN) {
				return caja('vacio', 'fa-info-circle', 'El recorrido se corto antes de la entrega.',
					'El ultimo punto guardado es de ' + xTrkFmtMin(desfase) +
					' antes de que marcara entregado, asi que no sirve para saber si llego. ' +
					'Suele pasar cuando el repartidor se queda sin señal o cierra la app.');
			}

			var m = d.metros_final;
			var hora = d.fin ? ', a las ' + String(d.fin).slice(11, 16) : '';
			var detalle = 'El recorrido termino a ' + xTrkFmtDistancia(m / 1000) + ' de la direccion del pedido' + hora + '.';
			var aviso = d.reasignado
				? ' Ojo: este pedido cambio de repartidor, asi que el trazo puede tener tramos de dos personas.' : '';
			if (m <= TRK_REC_CERCA_M) { return caja('ok', 'fa-check-circle', 'El repartidor llego a la direccion.', detalle + aviso); }
			if (m <= TRK_REC_LEJOS_M) { return caja('duda', 'fa-exclamation-circle', 'Termino cerca, pero no en la puerta.', detalle + aviso); }
			return caja('mal', 'fa-times-circle', 'Termino lejos de la direccion.', detalle + aviso);
		}

		/** Local, trazo, ultimo punto y direccion, todo en un mapa que se ajusta a lo que haya. */
		function xTrkPintarRecorrido(d) {
			var puntos = (d.puntos || []).map(function (p) { return [p[0], p[1]]; });

			if (!xTrkMapaR) {
				xTrkMapaR = L.map('trk_mapa_rec', { attributionControl: false });
				L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(xTrkMapaR);
				xTrkCapaR = L.layerGroup().addTo(xTrkMapaR);
			}
			xTrkCapaR.clearLayers();
			xTrkMapaR.invalidateSize();

			var pin = function (latlng, clase, icono) {
				return L.marker(latlng, { icon: L.divIcon({ className: '', iconSize: [30, 30], iconAnchor: [15, 15],
					html: '<div class="' + clase + '"><i class="fa ' + icono + '"></i></div>' }) });
			};
			var vistas = [];

			var s = d.sede || {};
			var sLat = parseFloat(s.latitude), sLng = parseFloat(s.longitude);
			if (isFinite(sLat) && isFinite(sLng)) {
				pin([sLat, sLng], 'trk-local-pin', 'fa-home').addTo(xTrkCapaR);
				vistas.push([sLat, sLng]);
			}

			if (puntos.length) {
				L.polyline(puntos, { color: '#2f7ed8', weight: 4, opacity: 0.85 }).addTo(xTrkCapaR);
				pin(puntos[0], 'trk-rec-pin-ini', 'fa-circle').addTo(xTrkCapaR);
				pin(puntos[puntos.length - 1], 'trk-rec-pin-fin', 'fa-motorcycle').addTo(xTrkCapaR);
				vistas = vistas.concat(puntos);
			}

			// parseFloat y no isFinite a secas: isFinite(null) es true y pintaria un destino en el mar
			var dLat = parseFloat(d.dest_lat), dLng = parseFloat(d.dest_lng);
			if (isFinite(dLat) && isFinite(dLng)) {
				pin([dLat, dLng], 'trk-rec-pin-dest', 'fa-map-marker').addTo(xTrkCapaR);
				// el circulo es el mismo radio con el que el veredicto dice "llego a la direccion"
				L.circle([dLat, dLng], { radius: TRK_REC_CERCA_M, color: '#2e7d32', weight: 1, fillOpacity: 0.07 })
					.addTo(xTrkCapaR);
				vistas.push([dLat, dLng]);
			}

			if (vistas.length > 1) { xTrkMapaR.fitBounds(L.latLngBounds(vistas).pad(0.15)); }
			else if (vistas.length === 1) { xTrkMapaR.setView(vistas[0], 16); }
			else { xTrkMapaR.setView([-6.0331, -76.9747], 13); }
		}

		/**
		 * Lista los pedidos de un repartidor, pendientes o entregados. Con muchos pedidos la celda de la
		 * tabla no alcanzaba, asi que el detalle vive aqui. Se arma con lo que ya esta en pantalla, en
		 * xTrkUltimo: no hay una consulta nueva, abre al instante y no le agrega carga al servidor.
		 */
		function xTrkVerPedidos(idrepartidor, modo) {
			if (!xTrkUltimo) { return; }
			var r = xTrkUltimo.repartidores.filter(function (x) { return x.idrepartidor === idrepartidor; })[0];
			if (!r) { return; }

			var pendientes = modo === 'pendientes';
			var lista = pendientes ? r.porEntregar : r.entregados;
			if (!lista.length) { return; }

			var cabecera, html = '', total = 0, demoras = [], porPago = {}, resumenPago = '';

			if (pendientes) {
				cabecera = '<tr><th>Pedido</th><th>Cliente</th><th>Direccion</th>' +
					'<th class="inv-cen">Hora</th><th class="inv-num">Esperando</th>' +
					'<th class="inv-num">Distancia</th><th class="inv-num">Llega en</th><th class="inv-num">Importe</th></tr>';
				// del mas antiguo al mas nuevo: el que mas espero es el que hay que mirar primero
				lista.slice().sort(function (a, b) { return (b.minutos || 0) - (a.minutos || 0); }).forEach(function (p) {
					total += p.importe || 0;
					var tarde = p.minutos !== null && p.minutos > TRK_PEDIDO_TARDE_MIN;
					var t = xTrkTramo(r, p);
					html += '<tr>' +
						'<td><b>#' + xTrkEsc(p.numero) + '</b></td>' +
						'<td>' + xTrkEsc(p.cliente) + '</td>' +
						'<td>' + xTrkEsc(p.direccion) +
							(p.referencia ? '<span class="inv-sub">' + xTrkEsc(p.referencia) + '</span>' : '') + '</td>' +
						'<td class="inv-cen">' + xTrkEsc(p.horaPedido) + '</td>' +
						'<td class="inv-num' + (tarde ? ' trk-tarde' : '') + '">' + xTrkFmtMin(p.minutos) + '</td>' +
						'<td class="inv-num">' + (t ? xTrkFmtDistancia(t.km) : '—') + '</td>' +
						'<td class="inv-num">' + (t ? '~' + t.min + ' min' : '<span class="inv-muted">sin ubicacion</span>') + '</td>' +
						'<td class="inv-num">S/ ' + (p.importe || 0).toFixed(2) + '</td>' +
						'</tr>';
				});
				$('#trk_dlg_titulo').text('Por entregar · ' + r.nombre);
				$('#trk_dlg_sub').text(lista.length + ' pedido(s) pendiente(s) · S/ ' + total.toFixed(2) + ' por cobrar');
			} else {
				cabecera = '<tr><th>Pedido</th><th>Cliente</th><th>Direccion</th>' +
					'<th class="inv-cen">Pedido</th><th class="inv-cen">Entregado</th>' +
					'<th class="inv-num">Demora</th><th>Pago</th><th class="inv-num">Importe</th>' +
					'<th class="inv-cen">Recorrido</th></tr>';
				lista.slice().sort(function (a, b) { return (a.horaEntrega || '').localeCompare(b.horaEntrega || ''); })
					.forEach(function (p) {
						total += p.importe || 0;
						if (p.minutos !== null) { demoras.push(p.minutos); }
						var clave = p.pago ? (p.pago.alLocal ? 'Pago al local' : p.pago.descripcion) : 'Sin especificar';
						porPago[clave] = (porPago[clave] || 0) + (p.pago ? p.pago.importe : (p.importe || 0));
						var lento = p.minutos !== null && p.minutos > TRK_PEDIDO_TARDE_MIN;
						html += '<tr>' +
							'<td><b>#' + xTrkEsc(p.numero) + '</b></td>' +
							'<td>' + xTrkEsc(p.cliente) + '</td>' +
							'<td>' + xTrkEsc(p.direccion) +
								(p.referencia ? '<span class="inv-sub">' + xTrkEsc(p.referencia) + '</span>' : '') + '</td>' +
							'<td class="inv-cen">' + xTrkEsc(p.horaPedido) + '</td>' +
							'<td class="inv-cen">' + xTrkEsc(p.horaEntrega) + '</td>' +
							'<td class="inv-num' + (lento ? ' trk-tarde' : '') + '">' + xTrkFmtMin(p.minutos) + '</td>' +
							'<td>' + (p.pago
								? '<span class="inv-tag trk-pago">' + xTrkEsc(p.pago.descripcion) + '</span>' +
								  (p.pago.alLocal ? '<span class="inv-sub">Pago al local</span>' : '')
								: '<span class="inv-muted">sin especificar</span>') + '</td>' +
							'<td class="inv-num">S/ ' + (p.importe || 0).toFixed(2) + '</td>' +
							'<td class="inv-cen"><span class="inv-link trk-rec-btn" title="Ver por donde paso" ' +
								'onclick="xTrkVerRecorrido(' + (parseInt(p.idpedido, 10) || 0) + ')"><i class="fa fa-map-o"></i></span></td>' +
							'</tr>';
					});
				var prom = demoras.length
					? Math.round(demoras.reduce(function (a, b) { return a + b; }, 0) / demoras.length) : null;
				$('#trk_dlg_titulo').text('Entregas de ' + r.nombre);
				$('#trk_dlg_sub').text(lista.length + ' entrega(s) hoy · ' +
					(prom !== null ? 'demora promedio ' + xTrkFmtMin(prom) + ' · ' : '') +
					'S/ ' + total.toFixed(2) + ' cobrados');

				// El desglose es lo que el repartidor rinde en caja. Se ordena de mayor a menor porque lo
				// primero que se quiere saber es cuanto efectivo trae encima.
				var chips = Object.keys(porPago).sort(function (a, b) { return porPago[b] - porPago[a]; })
					.map(function (k) {
						return '<span class="trk-total-pago' + (k === 'Sin especificar' ? ' vacio' : '') + '">' +
							'<em>' + xTrkEsc(k) + '</em><b>S/ ' + porPago[k].toFixed(2) + '</b></span>';
					}).join('');
				resumenPago = '<div class="trk-pagos"><div class="inv-titulo-sec">Como le pagaron</div>' +
					'<div class="trk-pagos-chips">' + chips + '</div>' +
					'<p class="inv-nota">Es lo que el repartidor declaro al marcar cada entrega, para dar cuenta en caja. No reemplaza al registro de pagos.</p></div>';
			}

			$('#tb_trk_pedidos thead').html(cabecera);
			$('#tb_trk_pedidos tbody').html(html);
			$('#trk_dlg_pagos').html(resumenPago);
			dlg_trk_pedidos.open();
		}

		/**
		 * Lo que el repartidor entrega por un pedido.
		 * Propio: todo, incluido el costo de envio, porque el local se lo queda y a el le paga sueldo.
		 * Global: el pedido y sus extras, pero no el envio, que es su ganancia.
		 */
		function xTrkARendir(r, p) {
			var cobro = p.importe || 0;
			return r.esPropio ? cobro : Math.max(0, cobro - (p.costoDelivery || 0));
		}

		function xTrkAbrirRendicion(idrepartidor) {
			if (!xTrkUltimo) { return; }
			var r = xTrkUltimo.repartidores.filter(function (x) { return x.idrepartidor === idrepartidor; })[0];
			if (!r || !r.porRendir || !r.porRendir.length) {
				xTrkAviso('Este repartidor no tiene entregas pendientes de rendir.', 'info');
				return;
			}
			xTrkRendicion = r;
			xTrkModo = 'pedido';

			var opciones = (xTrkMetodos || []).map(function (m) {
				return '<option value="' + m.idtipo_pago + '">' + xTrkEsc(m.descripcion) + '</option>';
			}).join('');

			var html = r.porRendir.map(function (p) {
				var aRendir = xTrkARendir(r, p);
				return '<tr>' +
					'<td class="inv-cen"><input type="checkbox" class="trk-chk" checked ' +
						'data-idpedido="' + p.idpedido + '" data-monto="' + aRendir.toFixed(2) + '" ' +
						'data-envio="' + (p.costoDelivery || 0).toFixed(2) + '" ' +
						'onchange="xTrkRendicionCambio(true)"></td>' +
					'<td><b>#' + xTrkEsc(p.numero) + '</b><span class="inv-sub">' + xTrkEsc(p.cliente) + '</span></td>' +
					'<td><select class="inv-select trk-metodo" data-idpedido="' + p.idpedido + '" ' +
						'onchange="xTrkRendicionCambio(true)">' + opciones + '</select>' +
						(p.pago && p.pago.alLocal ? '<span class="inv-sub">Declarado: pago al local</span>' : '') + '</td>' +
					'<td class="inv-num">S/ ' + (p.importe || 0).toFixed(2) + '</td>' +
					(r.esPropio ? '' : '<td class="inv-num">S/ ' + (p.costoDelivery || 0).toFixed(2) + '</td>') +
					'<td class="inv-num"><b>S/ ' + aRendir.toFixed(2) + '</b></td>' +
					'</tr>';
			}).join('');

			$('#tb_trk_rendicion thead').html('<tr><th class="inv-cen">Ok</th><th>Pedido</th>' +
				'<th>Metodo de pago</th><th class="inv-num">Cobro</th>' +
				(r.esPropio ? '' : '<th class="inv-num">Su envio</th>') +
				'<th class="inv-num">Entrega</th></tr>');
			$('#tb_trk_rendicion tbody').html(html);

			// cada fila arranca con lo que declaro el repartidor; el cajero corrige el que no fue asi
			r.porRendir.forEach(function (p) {
				$('#tb_trk_rendicion .trk-metodo[data-idpedido="' + p.idpedido + '"]')
					.val(String(p.pago ? p.pago.idtipo_pago : 1));
			});

			$('#trk_rend_titulo').text('Rendicion de ' + r.nombre);
			$('#trk_rend_sub').text(r.porRendir.length + ' entrega(s) sin rendir - ' +
				(r.esPropio ? 'propio: entrega todo, envio incluido' : 'global: se queda con su costo de envio'));
			$('#trk_rend_caja').text(xNomU || 'el usuario actual');

			xTrkPintarModo();
			xTrkRendicionCambio(true);
			dlg_trk_rendir.open();
		}

		/**
		 * Dos formas de decir como te pagan, porque son dos situaciones distintas:
		 * - "Segun cada pedido": el metodo sale de la fila de cada pedido. Cuadra siempre por
		 *   construccion y ademas refleja como pago cada cliente.
		 * - "Repartir a mano": el repartidor junta todo y te entrega, por ejemplo, 100 en efectivo y 32
		 *   por Yape, sin que eso siga la linea de los pedidos.
		 */
		function xTrkSetModo(modo) {
			if (xTrkModo === modo) { return; }
			xTrkModo = modo;
			xTrkPintarModo();
			// al pasar a mano se arranca con el reparto que salia de los pedidos, para no empezar de cero
			xTrkRendicionCambio(true);
		}

		function xTrkPintarModo() {
			$('#trk_rend_seg .inv-seg-item').each(function () {
				$(this).toggleClass('activa', $(this).data('modo') === xTrkModo);
			});
			$('#trk_rend_pie').toggleClass('activo', xTrkModo === 'mano');
			$('#trk_rend_ayuda').text(xTrkModo === 'pedido'
				? 'El metodo sale de cada pedido. Corrigelo arriba si el repartidor cobro de otra forma.'
				: 'Reparte el total como te lo entrega; tiene que sumar exacto. Cada pedido se cobra por '
				  + 'separado igual: el reparto se reparte entre ellos, y a alguno le puede quedar pago mixto.');
		}

		function xTrkRendicionCambio(rearmar) {
			var total = 0, n = 0, entregas = 0, porMetodo = {};
			$('#tb_trk_rendicion .trk-chk').each(function () {
				if (!this.checked) { return; }
				var idp = $(this).data('idpedido');
				var monto = parseFloat($(this).data('monto')) || 0;
				var tp = parseInt($('#tb_trk_rendicion .trk-metodo[data-idpedido="' + idp + '"]').val(), 10) || 1;
				entregas += parseFloat($(this).data('envio')) || 0;
				porMetodo[tp] = (porMetodo[tp] || 0) + monto;
				total += monto;
				n++;
			});
			total = Math.round(total * 100) / 100;
			xTrkRendTotal = total;

			var lineas = Object.keys(porMetodo).map(function (tp) {
				return { idtipo_pago: parseInt(tp, 10), importe: Math.round(porMetodo[tp] * 100) / 100 };
			}).sort(function (a, b) { return b.importe - a.importe; });

			if (xTrkModo === 'pedido') {
				xTrkPintarChips(lineas);
			} else if (rearmar) {
				xTrkPintarLineasPago(lineas.length ? lineas : [{ idtipo_pago: 1, importe: total }]);
			}

			$('#trk_rend_total').text('S/ ' + total.toFixed(2));
			$('#trk_rend_entregas').html(xTrkRendicion && xTrkRendicion.esPropio && entregas > 0
				? 'De ese total, <b>S/ ' + entregas.toFixed(2) + '</b> son costos de entrega de ' + n +
				  ' pedido(s), por si le pagas por entrega a ' + xTrkEsc(xTrkRendicion.nombre) + '.'
				: '').toggleClass('activo', !!(xTrkRendicion && xTrkRendicion.esPropio && entregas > 0));

			xTrkValidarReparto();
		}

		/** Resumen de solo lectura: en este modo el reparto ya cuadra porque sale de los pedidos. */
		function xTrkPintarChips(lineas) {
			var html = lineas.map(function (l) {
				var m = (xTrkMetodos || []).filter(function (x) { return x.idtipo_pago === l.idtipo_pago; })[0];
				return '<span class="trk-total-pago' + (l.idtipo_pago === 1 ? ' efectivo' : '') + '">' +
					'<em>' + xTrkEsc(m ? m.descripcion : ('#' + l.idtipo_pago)) + '</em>' +
					'<b>S/ ' + l.importe.toFixed(2) + '</b></span>';
			}).join('');
			$('#trk_rend_montos').removeClass('modo-mano')
				.html(html || '<p class="inv-ayuda">No hay pedidos marcados.</p>');
		}

		function xTrkPintarLineasPago(lineas) {
			var opciones = (xTrkMetodos || []).map(function (m) {
				return '<option value="' + m.idtipo_pago + '">' + xTrkEsc(m.descripcion) + '</option>';
			}).join('');

			var html = lineas.map(function (l, i) {
				return '<div class="trk-linea">' +
					'<select class="inv-select trk-linea-tp" onchange="xTrkValidarReparto()">' + opciones + '</select>' +
					'<input type="number" step="0.10" min="0" class="inv-input trk-linea-imp" ' +
						'value="' + l.importe.toFixed(2) + '" oninput="xTrkValidarReparto()">' +
					(i === 0 ? '<span class="trk-linea-hueco"></span>'
						: '<button type="button" class="trk-linea-quitar" onclick="xTrkQuitarLineaPago(this)" ' +
						  'title="Quitar"><i class="fa fa-times"></i></button>') +
					'</div>';
			}).join('');

			$('#trk_rend_montos').addClass('modo-mano').html(html);
			$('#trk_rend_montos .trk-linea').each(function (i) {
				$(this).find('.trk-linea-tp').val(String(lineas[i].idtipo_pago));
			});
		}

		function xTrkAgregarLineaPago() {
			var actuales = [];
			$('#trk_rend_montos .trk-linea').each(function () {
				actuales.push({
					idtipo_pago: parseInt($(this).find('.trk-linea-tp').val(), 10) || 1,
					importe: parseFloat($(this).find('.trk-linea-imp').val()) || 0
				});
			});
			// la linea nueva arranca con lo que falta: es lo que se va a poner casi siempre
			var asignado = actuales.reduce(function (a, l) { return a + l.importe; }, 0);
			var falta = Math.round((xTrkRendTotal - asignado) * 100) / 100;
			actuales.push({ idtipo_pago: 1, importe: Math.max(0, falta) });
			xTrkPintarLineasPago(actuales);
			xTrkValidarReparto();
		}

		function xTrkQuitarLineaPago(btn) {
			$(btn).closest('.trk-linea').remove();
			xTrkValidarReparto();
		}

		/** Solo hace falta validar en modo manual: por pedido el reparto cuadra por construccion. */
		function xTrkValidarReparto() {
			if (xTrkModo === 'pedido') {
				$('#trk_rend_dif').removeClass('activo').html('');
				$('#trk_btn_rendir').prop('disabled', xTrkRendTotal <= 0);
				return;
			}

			var suma = 0;
			$('#trk_rend_montos .trk-linea-imp').each(function () {
				var v = parseFloat(this.value);
				if (isFinite(v) && v > 0) { suma += v; }
			});
			suma = Math.round(suma * 100) / 100;
			var dif = Math.round((xTrkRendTotal - suma) * 100) / 100;
			var ok = Math.abs(dif) < 0.01 && xTrkRendTotal > 0;

			$('#trk_rend_dif').html(ok ? ''
				: (dif > 0 ? 'Falta asignar <b>S/ ' + dif.toFixed(2) + '</b>'
						   : 'Te pasaste por <b>S/ ' + Math.abs(dif).toFixed(2) + '</b>'))
				.toggleClass('activo', !ok);
			$('#trk_btn_rendir').prop('disabled', !ok);
		}

		/** El detalle de como funciona la caja se lee una vez; despues solo ocupa alto. Por eso va plegado. */
		function xTrkToggleInfo() { $('#trk_rend_info').toggleClass('abierto'); }

		function xTrkConfirmarRendicion() {
			if (!xTrkRendicion) { return; }
			var idpedidos = [], items = [], pagos = [];

			// en modo pedido viaja el metodo de CADA pedido: el servidor hace un cobro por cada uno,
			// con su propio cliente. Mandar el resumen agrupado producia un unico cobro mixto.
			$('#tb_trk_rendicion .trk-chk').each(function () {
				if (!this.checked) { return; }
				var idp = $(this).data('idpedido');
				idpedidos.push(idp);
				items.push({
					idpedido: idp,
					idtipo_pago: parseInt($('#tb_trk_rendicion .trk-metodo[data-idpedido="' + idp + '"]').val(), 10) || 1
				});
			});

			if (xTrkModo === 'mano') {
				$('#trk_rend_montos .trk-linea').each(function () {
					var imp = parseFloat($(this).find('.trk-linea-imp').val());
					if (isFinite(imp) && imp > 0) {
						pagos.push({ idtipo_pago: parseInt($(this).find('.trk-linea-tp').val(), 10) || 1,
									 importe: Math.round(imp * 100) / 100 });
					}
				});
			}
			if (!idpedidos.length) { return; }
			if (xTrkModo === 'pedido' ? !items.length : !pagos.length) { return; }

			xPopupLoad.titulo = 'Registrando rendicion...'; xPopupLoad.xopen();
			xTrkApi('rendir', {
				idrepartidor: xTrkRendicion.idrepartidor,
				repartidor: xTrkRendicion.nombre,
				modo: xTrkModo,
				idpedidos: idpedidos,
				items: items,
				pagos: pagos
			}).then(function (res) {
				xPopupLoad.xclose();
				if (!res.success) { return; }
				dlg_trk_rendir.close();
				showToastSwal('success', res.datos.cobros + ' pedido(s) cobrado(s) - S/ ' + res.datos.total.toFixed(2));
				xTrkRendicion = null;
				xTrkCargar(false);
			});
		}

		function xTrkVerRepartidor(idrepartidor) {
			// al volver a entrar, las tablas siguen mostrando las filas de la visita anterior hasta
			// el primer refresco, y sus marcadores apuntan a un mapa que detached ya destruyo
			if (!xTrkVivo || !xTrkMapa) { return; }
			var marcador = xTrkMarcadores[idrepartidor];
			if (!marcador) { return; }
			xTrkMapa.setView(marcador.getLatLng(), 16);
			marcador.openPopup();
			$('#trk_mapa')[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
		}

		Polymer({
			is: 'x-tracker-delivery',

			attached: function () {
				xPopupLoad = document.getElementById('xLoad');
				xTrkVivo = true;
				// la primera carga va DENTRO del callback: fuera se dispara antes de que xm_LogChequea confirme la sesion
				xm_LogChequea(function () {
					// si salieron de la pantalla mientras se verificaba la sesion, detached ya limpio:
					// crear el mapa y el intervalo aqui dejaria un intervalo que nadie va a limpiar nunca
					if (!xTrkVivo) { return; }
					// entrar, salir y volver a entrar rapido deja dos callbacks en vuelo y los dos ven
					// xTrkVivo en true: sin esto, el segundo crea un mapa sobre un contenedor ya inicializado
					if (xTrkMapa) { return; }
					xm_log_get('ini_us');
					$('body').addClass('loaded');
					xTrkCentrado = false;
					xTrkMarcadores = {};
					xTrkFallos = 0;
					xTrkEnVuelo = false;
					xTrkCrearMapa();
					xTrkCargar(false);
					xTrkAyudaPrimeraVez();
					if (xTrkTimer) { clearInterval(xTrkTimer); }
					xTrkTimer = setInterval(function () { xTrkCargar(true); }, TRK_INTERVALO_MS);
				});
				$("#Titulo_page").text("Tracker Delivery");
			},

			detached: function () {
				xTrkVivo = false;
				// sin esto queda un intervalo vivo por cada vez que se entro a la pantalla
				if (xTrkTimer) { clearInterval(xTrkTimer); xTrkTimer = null; }
				if (xTrkMapa) { xTrkMapa.remove(); xTrkMapa = null; }
				// el mapa del dialogo vive en el mismo template: al salir se va el contenedor, y si
				// quedara la referencia, al volver a entrar se operaria sobre un mapa muerto
				if (xTrkMapaS) { xTrkMapaS.remove(); xTrkMapaS = null; }
				if (xTrkMapaR) { xTrkMapaR.remove(); xTrkMapaR = null; xTrkCapaR = null; }
				xTrkMarcadorS = null;
				xTrkUbicacionNueva = null;
				xTrkCapas = null;
				// si queda el registro, una fila vieja puede abrir el globo de un marcador muerto
				xTrkMarcadores = {};
			}
		});
	</script>
</dom-module>
