<dom-module id="x-cuentas-por-cobrar">
    <script src="../../view/xSOAPSunat.js"></script>
    
    <template>  
        
        

        <!-- Diálogo para mostrar detalles del consumo -->
        <paper-dialog id="dialog_registro_detalle_consumo" class="dialog_redondo"
            style="overflow: auto; overscroll-behavior: auto; min-width: 50%; max-width: 700px;"
            entry-animation="scale-up-animation" exit-animation="fade-out-animation" with-backdrop>
        
            <div class="modal-dialog modal-lg" role="document">
                <div class="modal-content">
                    <div class="d-flexx justify-content-between align-items-center header-dialog">
                        <h4>Detalle del Consumo</h4>
                        <button class="btn btn-sm btn-secondary ml-2" dialog-dismiss>X</button>
                    </div>
                    <div class="modal-body mt-3">
                        <div id="detalle-consumo-contenido">                            
                            <!-- Aquí se cargará dinámicamente el contenido del detalle -->
                            <div>       
                                <p><strong>Fecha Consumo:</strong> {{consumoDetalle.fecha_consumo}}</p>
                                <p><strong>Transcurrido:</strong> {{consumoDetalle.pasaron}}</p>                                                                
                            </div>
                            <br>
                            <table class="w-100">
                                <thead>
                                    <tr>
                                        <th>Descripción</th>
                                        <th align="center">Cantidad</th>
                                        <th align="right">Precio</th>
                                    </tr>
                                </thead>
                                <tbody id="detalle-items">
                                    <!-- Aquí se cargarán los items -->
                                    <template is="dom-repeat" items="[[listItemsConsumo]]">
                                        <tr>
                                            <td>{{item.descripcion}}</td>
                                            <td align="center">{{item.cantidad}}</td>
                                            <td align="right">{{item.ptotal}}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                            
                            <br>
                            <div style="display: flex; align-items: flex-end; flex-direction: column;" class="mr-2">
                                <p><strong>Total Consumo:</strong> {{consumoDetalle.importe}}</p>
                                <p><strong>Total Pagado:</strong> {{consumoDetalle.pagado}}</p>
                                <p><strong>Debe Aún:</strong> {{consumoDetalle.debe}}</p>
                            </div>

                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-primary" hidden$="[[!tieneComprobante(consumoDetalle.external_id)]]" on-tap="verPdfComprobante">
                            <i class="fa fa-file-pdf-o"></i> Ver Comprobante
                        </button>
                        <button dialog-dismiss class="btn btn-secondary">Cerrar</button>
                    </div>
                </div>
            </div>
        </paper-dialog>









        <div class="p-2">
            <div class="d-flexx justify-content-between">
                <p class="fw-600 fs-15">Cuentas por Cobrar</p>
                <button hidden$="[[!showDetalleCuentaCobrar]]" class="btn btn-sm btn-secondary" onclick="xGoBackListaCuentasCobrar()">
                    <i class="fa fa-arrow-left mr-1"></i>
                    Atras
                </button>

                <div hidden$="[[showDetalleCuentaCobrar]]">
                    <button class="btn btn-sm btn-primary" onclick="xGoListCuentaCobrarHistorial()">
                        <i class="fa fa-history"></i>
                        Historial
                    </button>

                    <button class="btn btn-sm btn-secondary" onclick="xGoBackListaCuentasCobrarPrincipal()">
                        <i class="fa fa-arrow-left mr-1"></i>
                        Atras
                    </button>
                </div>
            </div>
            <div hidden$="[[!showDetalleCuentaCobrar]]" class="mt-2">
                <div class="xLinea2"></div>                
                <br>
            </div>
            <!-- listado -->
            <div hidden$="[[showDetalleCuentaCobrar]]">            
                <div>                
                    <p>Ventas registrados al credito.</p>
                </div>
                <br>
                <input type="text" id="text_buscar_cliente_credito" class="xMiInput w-100" placeholder="Buscar Cliente" onkeyup="xBuscarClienteCredito(this)">
                <br><br>
                <div>
                    <!-- tabla con la lista de cuentas por pagar -->
                    <table class="w-100">
                        <thead>
                            <th>#</th>
                            <th>Cliente</th>
                            <th align="right">Imp. Consumo</th>
                            <th align="right">Pagó</th>
                            <th align="right">Debe Aún</th>
                            <th align="center"></th>
                        </thead>
                        <tbody>
                            <template is="dom-repeat" items="{{listCuentasPagar}}">
                                <tr>
                                    <td>{{displayIndex(index)}}</td>
                                    <td>
                                        {{item.nom_cliente}}
                                        <i hidden$="[[!item.isHistory]]" class="fa fa-history text-primary"></i>
                                    </td>
                                    <td align="right">
                                        <p class="fw-600">{{item.total}}</p>
                                    </td>
                                    <td align="right">
                                        <p class="fw-600 text-success">{{item.pago}}</p>
                                    </td>
                                    <td align="right">
                                        <p class="fw-600 text-primary">{{item.debe}}</p>
                                    </td align="center">                                <td>
                                        <button data-id="[[item.idcliente]]" 
                                            style="width: 60px;"
                                            class="btn btn-sm btn-xsm xBoton_flat_2"
                                            onclick="xCobrarCuentaCliente(this);"
                                            >
                                            <span hidden$="[[item.isHistory]]">Cobrar</span>
                                            <span hidden$="[[!item.isHistory]]">Ver</span>
                                        </button>
                                    </td>
                                </tr>
                            </template>
                            <!-- total -->
                            <tr>
                                <td align="right" colspan="2"><p class="fw-600 fs-15">Totales</p></td>
                                <td align="right"><p class="fw-600 fs-17">{{totalConsumoCliente}}</p></td>
                                <td align="right"><p class="fw-600 fs-17">{{totalPagadoCliente}}</p></td>
                                <td align="right"><p class="fw-600 fs-17">{{totalDebeCliente}}</p></td>
                                <td></td>
                            </tr>                        
                        </tbody>            
                    </table>
                </div>
            </div>

            <!-- detalle cuenta cobrar -->
            <div hidden$="[[!showDetalleCuentaCobrar]]">
                <!-- datos del cliente -->
                <section>
                    <p class="fw-600 fs-17">{{ objCuentaCobrar.nom_cliente }}</p>
                    <div class="d-flexx">
                        <p class="fw-600 fs-15 mr-2">
                            <i class="fa fa-id-card-o mr-1"></i>
                            {{ objCuentaCobrar.num_dni }}
                        </p>
                        <p class="fw-600 fs-15">
                            <i class="fa fa-phone mr-1"></i>
                            {{ objCuentaCobrar.telfono }}
                        </p>
                    </div>
                </section>

                <br>
                <div class="xLinea2"></div>
                <br>

                <!-- listas -->
                <section>
                    <div class="grid-container">
                        <div class="column1">
                            <div class="column-title d-flex justify-content-between align-items-center">
                                <p>Consumos al credito</p>
                                <p class="fw-600 text-primary">Total: <span id="total-consumos-credito">0.00</span></p>
                            </div>
                            <div class="div-table">
                                <table class="w-100 fs-12">
                                    <thead>
                                        <th style="width: 30px;"><input type="checkbox" id="check-all-consumos" onclick="selectAllConsumos(this)"></th>
                                        <th>#</th>
                                        <th>Fecha</th>
                                        <th>Consumo</th>
                                        <th>Pagado</th>
                                        <th>Debe</th>                                        
                                    </thead>
                                    <tbody>
                                        <template is="dom-repeat" items="{{listConsumosCreditoCliente}}">
                                            <tr>
                                                <td>
                                                    <input type="checkbox" class="consumo-check" data-index="{{index}}" data-id="{{item.idregistro_pago_detalle}}" data-debe="{{item.debe}}" onclick="calcularTotalSeleccionado()">
                                                </td>
                                                <td>{{displayIndex(index)}}</td>
                                                <td>
                                                    <p>{{item.fecha}}</p>
                                                    <p hidden$="[[item.isCuentaPagada]]" class="fs-10 text-secondary">{{item.pasaron}}</p>
                                                    <span hidden$="[[!item.isCuentaPagada]]" class="badge badge-primary">{{item.pasaron}}</span>
                                                </td>
                                                <td>
                                                    {{item.total}}
                                                    <button class="btn btn-sm btn-xsm xBoton_flat_2" data-id="{{item.idregistro_pago_detalle}}"
                                                        onclick="verDetalleConsumo(this)">
                                                        Ver
                                                    </button>
                                                </td>
                                                <td>{{item.pagado}}</td>
                                                <td>{{item.debe}}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="column2">
                            <div class="column-title d-flex justify-content-between align-items-center">
                                <p>Historial de Pagos</p>
                                <p class="fw-600 text-success">Total: <span id="total-historial-pagos">0.00</span></p>
                            </div>
                            <div class="div-table">
                                <table class="w-100 fs-12">
                                    <thead>                                        
                                        <th>Fecha</th>
                                        <th>Usuario</th>
                                        <th align="right">Pagado</th>                                        
                                    </thead>
                                    <tbody>
                                        <template is="dom-repeat" items="{{listCuentaPagarHistoriaPagosCliente}}">
                                            <tr>
                                                <td>
                                                    <p>{{item.fecha}}</p>
                                                    <p>{{item.hora}}</p>
                                                </td>
                                                <td>{{item.nom_usuario}}</td>
                                                <td align="right">
                                                    <p class="fw-600">{{item.importe}}</p>
                                                    <p class$="[[item.classTp]]">{{item.nom_tipo_pago}}</p>
                                                </td>                                                
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>
                <br>

                <!-- resumen y accion -->
                <section class="div-resumen-cuenta-pagar">
                    <p class="fw-600 fs-15 text-secondary mb-3">Resumen de cuenta pendiente por pagar</p>
                    <div class="grid-totales pb-2">
                        <div>
                            <p>Imp. Consumo</p>
                            <p class="fs-23 fw-600">{{ arrTotalesListCreditoCliente.total }}</p>
                        </div>
                        <div>
                            <p>Pagado</p>
                            <p class="fs-23 fw-600 text-success">{{ arrTotalesListCreditoCliente.pagado_show }}</p>
                        </div>
                        <div>
                            <p>Debe Aún</p>
                            <p class="fs-23 fw-600 text-primary">{{ arrTotalesListCreditoCliente.debe_show }}</p>
                        </div>
                        <div>
                            <p class="fw-600 fs-15">Importe a Pagar</p>
                            <p class="fs-11 text-secondary">Indique aqui el importe que pagará</p>
                            
                            <!-- Etiqueta para mostrar el importe seleccionado -->
                            <div id="div-importe-seleccionado" style="display: none; margin-bottom: 5px;">
                                <p class="fw-600 fs-13 text-primary">Importe seleccionado: <span id="importe-seleccionado">0.00</span></p>
                            </div>
                            
                            <input 
                                type="number"
                                class="xMiInput fs-23 fw-600" 
                                id="txt_importe_pago_cuenta_credito"
                                onkeyup="xValidarBtnPagoCuentaCobrar(this)"
                                placeholder="">  

                            <button 
                                disabled$="[[!enabledBtnCobrarCuenta]]"
                                class="btn btn-sm mt-2 btn-primary" style="float: right;" onclick="xShowIngresoPagoCuentaCobrar()">Registrar Pago</button>
                        </div>                        
                    </div>
                </section>

            </div>
        </div>
    </template>

    <style>
        .grid-container {
            display: grid;
            /* grid-template-columns: minmax(0, 350px) auto; */
            grid-template-columns: 1fr 1fr;
            /* La primera columna tiene un ancho mínimo de 0 y máximo de 400px, la segunda columna ocupa el espacio restante */
            gap: 10px;
            /* Espacio entre las columnas */
        }
    
        .column1 {
            /* background-color: lightblue; */
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    
        .column2 {
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    
        .column-title {
            border-radius: 5px 5px 0px 0px;
            color: #fff !important;
            padding: 5px 10px 5px 10px;
            background: #424242;
            height: 30px;
            justify-content: space-between;
            display: flex;
            align-items: center;
        }

        .div-table {
            max-height: 300px;
            overflow: auto;
        }

        .grid-totales {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr auto;
            gap: 10px;
        }

        .div-resumen-cuenta-pagar {
            border: 1px solid #d7d7d7;
            padding: 10px;
            border-radius: 5px;
        }
    
        /* Media query para dispositivos móviles */
        @media (max-width: 767px) {
            .grid-container {
                grid-template-columns: 1fr;
                /* Las columnas ocupan todo el ancho */
            }
    
            .column2 {
                margin-top: 10px;
                /* Espacio entre las columnas en dispositivos móviles */
            }

            .grid-totales {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>

    <script>
        var xThisCuentasPorCobrar, itemOptionTpCuentaCobrarSelected;


        async function xInitCuentasPorCobrar(op=23) {
            xPopupLoad.xopen();
            const _httpFecht = new httpFecht();
            const rpt = await _httpFecht.postJson('../../bdphp/log_009.php?op='+ op)
            
            if (rpt.success) {
                xThisCuentasPorCobrar.listCuentasPagar = rpt.datos;
                xThisCuentasPorCobrar.listCuentasPagarMaster = rpt.datos.map(x => {
                    x.isHistory = parseFloat(x.debe) == 0
                    return x;                    
                }); // para busquedas
                xShowTotalCuentasPagar();
            } 

            xPopupLoad.xclose();

            $(document).on('getValorIncial', '.tpf_option_cuenta_cobrar', function (e) {                
                itemOptionTpCuentaCobrarSelected = e.detail.values;
            });
        }

        function xGoListCuentaCobrarHistorial() {
            xThisCuentasPorCobrar.showHistoryPagos = true;
            xInitCuentasPorCobrar(23001)
        }

        function xShowTotalCuentasPagar() {            
            xThisCuentasPorCobrar.totalConsumoCliente = xThisCuentasPorCobrar.listCuentasPagar
                                                    .map(x => parseFloat(removeComas(x.total)))
                                                    .reduce((a, b) => a + b, 0);            
            
            xThisCuentasPorCobrar.totalPagadoCliente = xThisCuentasPorCobrar.listCuentasPagar
                .map(x => parseFloat(removeComas(x.pago)))
                .reduce((a, b) => a + b, 0);             
            
            
                
            xThisCuentasPorCobrar.totalDebeCliente = xThisCuentasPorCobrar.listCuentasPagar
                .map(x => parseFloat(removeComas(x.debe)))
                .reduce((a, b) => a + b, 0);             

            xThisCuentasPorCobrar.totalConsumoCliente = xThisCuentasPorCobrar.totalConsumoCliente.toFixed(2)
            xThisCuentasPorCobrar.totalPagadoCliente = xThisCuentasPorCobrar.totalPagadoCliente.toFixed(2)
            xThisCuentasPorCobrar.totalDebeCliente = xThisCuentasPorCobrar.totalDebeCliente.toFixed(2)
        }

        function xBuscarClienteCredito(obj){
            // buscar en la lista de cuentas por pagar
            const _nom_cliente = obj.value;
            xThisCuentasPorCobrar.listCuentasPagar = xThisCuentasPorCobrar.listCuentasPagarMaster
                            .filter(x => x.nom_cliente.toLowerCase().includes(_nom_cliente.toLowerCase()));

            xShowTotalCuentasPagar();

        }
        
        function xCobrarCuentaCliente(obj) {
            const _idcliente = obj.dataId;            
            const _objCuentaCobrar = xThisCuentasPorCobrar.listCuentasPagar.find(x => x.idcliente == _idcliente);
            xThisCuentasPorCobrar.objCuentaCobrar = _objCuentaCobrar;
            xThisCuentasPorCobrar.showDetalleCuentaCobrar = true;

            txt_importe_pago_cuenta_credito.value = ''

            xLoadConsumoCreditoByCliente();
        }

        async function xLoadConsumoCreditoByCliente() {
            // cargar los consumos del cliente
            xPopupLoad.xopen();
            xThisCuentasPorCobrar.enabledBtnCobrarCuenta = false;
            
            // Resetear la etiqueta de importe seleccionado
            const divImporteSeleccionado = document.getElementById('div-importe-seleccionado');
            if (divImporteSeleccionado) divImporteSeleccionado.style.display = 'none';
            
            const _dataSend = {
                idcliente: xThisCuentasPorCobrar.objCuentaCobrar.idcliente
            }

            const opList = xThisCuentasPorCobrar.showHistoryPagos ? 230101 : 2301; 
            const _httpFecht = new httpFecht();
            const rpt = await _httpFecht.postJson('../../bdphp/log_009.php?op='+ opList, _dataSend)

            if (rpt.success) {
                xThisCuentasPorCobrar.listConsumosCreditoCliente = rpt.datos.map(x => {
                    x.isCuentaPagada = x.flag_pagado == '1';
                    return x;
                });
                
                // Calcular y mostrar el total de consumos al crédito
                let totalConsumosCredito = 0;
                rpt.datos.forEach(item => {
                    totalConsumosCredito += parseFloat(removeComas(item.debe));
                });
                
                const spanTotalConsumosCredito = document.getElementById('total-consumos-credito');
                if (spanTotalConsumosCredito) {
                    spanTotalConsumosCredito.textContent = totalConsumosCredito.toFixed(2);
                }
                // suma los totales
                let _totalesListCreditoCliente = {
                    total: 0,
                    pagado: 0,
                    debe: 0,
                    pagadoShow: 0,
                    debeShow: 0, 
                }

                rpt.datos.map( x => {
                    _totalesListCreditoCliente.total += parseFloat(removeComas(x.total));
                    _totalesListCreditoCliente.pagado += parseFloat(removeComas(x.pagado));
                    _totalesListCreditoCliente.debe += parseFloat(removeComas(x.debe));
                })         

                _totalesListCreditoCliente.total = _totalesListCreditoCliente.total.toFixed(2);
                _totalesListCreditoCliente.pagado = _totalesListCreditoCliente.pagado.toFixed(2);
                _totalesListCreditoCliente.debe = _totalesListCreditoCliente.debe.toFixed(2);

                _totalesListCreditoCliente.pagado_show = _totalesListCreditoCliente.pagado;
                _totalesListCreditoCliente.debe_show = _totalesListCreditoCliente.debe;
                
                xThisCuentasPorCobrar.arrTotalesListCreditoCliente = _totalesListCreditoCliente;
                
                // Resetear los checkboxes después de cargar los datos
                setTimeout(() => {
                    // Resetear el checkbox principal
                    const checkAll = document.getElementById('check-all-consumos');
                    if (checkAll) checkAll.checked = false;
                    
                    // Resetear todos los checkboxes individuales
                    const consumoChecks = document.querySelectorAll('.consumo-check');
                    consumoChecks.forEach(check => {
                        check.checked = false;
                    });
                }, 100);
            }

            xListCuentaPagarHistoriaPagosCliente(); // historial de pagos

            xPopupLoad.xclose();
            
        }

        async function xListCuentaPagarHistoriaPagosCliente() {
            const _dataSend = {
                idcliente: xThisCuentasPorCobrar.objCuentaCobrar.idcliente
            }

            const _httpFecht = new httpFecht();
            const rpt = await _httpFecht.postJson('../../bdphp/log_009.php?op=2303', _dataSend)
            if (rpt.success) {
                xThisCuentasPorCobrar.listCuentaPagarHistoriaPagosCliente = rpt.datos.map( x => {
                    x.classTp = getColorTipoPago(x.idtipo_pago);
                    x.fecha = x.fecha_hora.split(' ')[0];                  
                    x.hora = x.fecha_hora.split(' ')[1];
                    return x;
                });
                
                // Calcular y mostrar el total del historial de pagos
                let totalHistorialPagos = 0;
                rpt.datos.forEach(item => {
                    totalHistorialPagos += parseFloat(removeComas(item.importe));
                });
                
                const spanTotalHistorialPagos = document.getElementById('total-historial-pagos');
                if (spanTotalHistorialPagos) {
                    spanTotalHistorialPagos.textContent = totalHistorialPagos.toFixed(2);
                }

            }
        }

        // Función para seleccionar/deseleccionar todos los consumos
        function selectAllConsumos(checkbox) {
            const isChecked = checkbox.checked;
            const consumoChecks = document.querySelectorAll('.consumo-check');
            
            consumoChecks.forEach(check => {
                check.checked = isChecked;
            });
            
            // Calcular el total de las cuentas seleccionadas
            calcularTotalSeleccionado();
        }
        
        // Función para calcular el total de las cuentas seleccionadas
        function calcularTotalSeleccionado() {
            const consumosSeleccionados = document.querySelectorAll('.consumo-check:checked');
            let totalSeleccionado = 0;
            
            // Sumar los importes de los consumos seleccionados
            consumosSeleccionados.forEach(check => {
                const debe = parseFloat(removeComas(check.dataDebe));
                if (!isNaN(debe)) {
                    totalSeleccionado += debe;
                }
            });
            
            // Mostrar u ocultar la etiqueta de importe seleccionado
            const divImporteSeleccionado = document.getElementById('div-importe-seleccionado');
            const spanImporteSeleccionado = document.getElementById('importe-seleccionado');
            
            if (consumosSeleccionados.length > 0) {
                // Hay consumos seleccionados, mostrar la etiqueta
                if (divImporteSeleccionado) divImporteSeleccionado.style.display = 'block';
                if (spanImporteSeleccionado) spanImporteSeleccionado.textContent = totalSeleccionado.toFixed(2);
            } else {
                // No hay consumos seleccionados, ocultar la etiqueta
                if (divImporteSeleccionado) divImporteSeleccionado.style.display = 'none';
            }
            
            // Actualizar el campo de importe a pagar
            const inputImporte = document.getElementById('txt_importe_pago_cuenta_credito');
            if (inputImporte) {
                inputImporte.value = totalSeleccionado.toFixed(2);
                // Marcar que el valor proviene de los checkboxes
                inputImporte.fromCheckbox = true;
                // Disparar el evento para actualizar los cálculos
                xValidarBtnPagoCuentaCobrar(inputImporte);
                // Restablecer la bandera
                inputImporte.fromCheckbox = false;
            }
        }

        function xGoBackListaCuentasCobrar() {
            xThisCuentasPorCobrar.showDetalleCuentaCobrar = false;
        }

        function xValidarBtnPagoCuentaCobrar(obj) {
            let _pagado = parseFloat(obj.value)
            if ( isNaN(_pagado) ) {
                xThisCuentasPorCobrar.enabledBtnCobrarCuenta = false;
                _pagado = 0
                // return;
            } else {
                if ( _pagado > 0 ) {
                    xThisCuentasPorCobrar.enabledBtnCobrarCuenta = true;
                }
            }
            
            // Si el usuario modifica manualmente el importe, desmarcar checkboxes y ocultar etiqueta
            if (!obj.fromCheckbox) {
                // Ocultar la etiqueta de importe seleccionado
                const divImporteSeleccionado = document.getElementById('div-importe-seleccionado');
                if (divImporteSeleccionado) divImporteSeleccionado.style.display = 'none';
                
                // Desmarcar todos los checkboxes
                const checkAll = document.getElementById('check-all-consumos');
                if (checkAll) checkAll.checked = false;
                
                const consumoChecks = document.querySelectorAll('.consumo-check');
                consumoChecks.forEach(check => {
                    check.checked = false;
                });
            }

            let _importeDebe = parseFloat(xThisCuentasPorCobrar.arrTotalesListCreditoCliente.debe);
            if ( _pagado > _importeDebe ) {
                _pagado = _importeDebe
                obj.value = _pagado;
                // xThisCuentasPorCobrar.enabledBtnCobrarCuenta = false;

        // Función auxiliar para procesar un consumo y calcular el pago
        function procesarConsumo(consumo, importeDisponible) {
            let resultado = {
                importeRestante: importeDisponible,
                itemPagado: null
            };
            
            if (importeDisponible <= 0) return resultado;
            
            let _debeRow = parseFloat(removeComas(consumo.debe));
            if (_debeRow <= 0) return resultado; // Si no debe nada, no procesar
            
            let _diferencia = importeDisponible - _debeRow;
            let _pagadoRow = parseFloat(removeComas(consumo.pagado));
            
            // Restar el importe de este consumo del disponible
            resultado.importeRestante = Math.max(0, _diferencia);
            
            if (_diferencia >= 0) {
                // Puede pagar todo este consumo
                _pagadoRow = parseFloat(consumo.importe);
                _debeRow = 0;
            } else {
                // Pago parcial
                _diferencia = Math.abs(_diferencia);
                _pagadoRow = parseFloat(consumo.importe) - _diferencia;
                _debeRow = _diferencia;
            }
            
            resultado.itemPagado = {
                idregistro_pago_detalle: consumo.idregistro_pago_detalle,
                pagado: _pagadoRow,
                flag_pagado: _debeRow == 0 ? '1' : '0'
            };
            
            return resultado;
        }
        
        async function xShowProccessPagoCuentaCredito() {
            xPopupLoad.xopen();

            // Verificar si hay consumos seleccionados
            const consumosSeleccionados = document.querySelectorAll('.consumo-check:checked');
            const haySeleccionados = consumosSeleccionados.length > 0;
            
            // elaborar lista de item pagados de listCuentasPagar con el importe recibido
            let arrListItemsPagados = [];
            let importePagado = xThisCuentasPorCobrar.importePagadoCuentaCobrar;
            
            if (haySeleccionados) {
                // Procesar solo los consumos seleccionados
                // Crear un mapa de índices seleccionados para acceso rápido
                const indicesSeleccionados = new Map();
                consumosSeleccionados.forEach(check => {
                    const index = parseInt(check.dataIndex);
                    indicesSeleccionados.set(index, true);
                });
                
                // Procesar solo los consumos seleccionados en el orden original
                xThisCuentasPorCobrar.listConsumosCreditoCliente.forEach((consumo, index) => {
                    // Solo procesar si este consumo está seleccionado
                    if (indicesSeleccionados.has(index) && importePagado > 0) {
                        const resultado = procesarConsumo(consumo, importePagado);
                        importePagado = resultado.importeRestante;
                        
                        if (resultado.itemPagado) {
                            arrListItemsPagados.push(resultado.itemPagado);
                        }
                    }
                });
            } else {
                // Si no hay selecciones, procesar por antigüedad (del más antiguo al más nuevo)
                // Ordenamos los consumos por idregistro_pago_detalle asc
                const consumosOrdenados = [...xThisCuentasPorCobrar.listConsumosCreditoCliente]
                    .sort((a, b) => a.idregistro_pago_detalle - b.idregistro_pago_detalle);
                
                // Procesar los consumos ordenados
                for (const consumo of consumosOrdenados) {
                    if (importePagado <= 0) break; // No hay más importe disponible
                    
                    const resultado = procesarConsumo(consumo, importePagado);
                    importePagado = resultado.importeRestante;
                    
                    if (resultado.itemPagado) {
                        arrListItemsPagados.push(resultado.itemPagado);
                    }
                }
            }
            
            // return;

            const _httpFecht = new httpFecht();
            const _dataSend = {
                idcliente: xThisCuentasPorCobrar.objCuentaCobrar.idcliente,
                idtipo_pago: itemOptionTpCuentaCobrarSelected.idtipo_pago,
                importe: xThisCuentasPorCobrar.importePagadoCuentaCobrar,
                debe: xThisCuentasPorCobrar.arrTotalesListCreditoCliente.debe_show,
                idusuario: xIdUsuario,
                listPagados: arrListItemsPagados
                // listPagados: JSON.stringify(arrListItemsPagados)
            }
            const rpt = await _httpFecht.postJson('../../bdphp/log_009.php?op=2302', _dataSend)            
            if (rpt.success) {
                xThisCuentasPorCobrar.showDetalleCuentaCobrar = false;
                xInitCuentasPorCobrar();
                xRegistrarIngresoCajaCobroCredito();
                return;
            }

            xPopupLoad.xclose();
        }
