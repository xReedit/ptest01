<script>
var xThisPrintServerDownload;

var currentServerInfo = null;

function xIniPrintServerDownload() {
	$("#panel_toolbar").show();
	$('body').addClass('loaded');
	$("#Titulo_page").text("Servidor de Impresión");
	
	checkServerStatus();
}

async function checkServerStatus() {
	const container = document.getElementById('serverStatusContainer');
	
	try {
		currentServerInfo = await PrintServerDetector.detectInstalledServer();
		
		if (currentServerInfo.installed) {
			const serverTypeName = currentServerInfo.serverType === 'new' ? 'Nueva versión' : 'Laragon';
			const versionText = currentServerInfo.version ? ` v${currentServerInfo.version}` : '';
			
			container.className = 'server-status-container online';
			container.innerHTML = `
				<span class="status-icon">✓</span>
				<span><strong>Servidor detectado:</strong> ${serverTypeName}${versionText}</span>
				<button class="btn-open-server" onclick="openDetectedServer()">Abrir Servidor</button>
			`;
		} else {
			container.className = 'server-status-container offline';
			container.innerHTML = `
				<span class="status-icon">✗</span>
				<span><strong>No se detectó</strong> ningún servidor de impresión instalado en este equipo.</span>
				<button class="btn-open-server" style="background:#6c757d;" onclick="checkServerStatus()">Reintentar</button>
			`;
		}
	} catch (e) {
		console.error('Error al verificar servidor:', e);
		container.className = 'server-status-container offline';
		container.innerHTML = `
			<span class="status-icon">✗</span>
			<span>Error al verificar el servidor de impresión.</span>
			<button class="btn-open-server" style="background:#6c757d;" onclick="checkServerStatus()">Reintentar</button>
		`;
	}
}

function openDetectedServer() {
	if (currentServerInfo && currentServerInfo.installed) {
		const redirectUrl = PrintServerDetector.getRedirectUrl(currentServerInfo);
		if (redirectUrl) {
			window.open(redirectUrl, 'Servidor de Impresion');
		}
	}
}

function xDownloadPrintServer(platform) {
	var urls = {
		'windows': 'https://papaya-comercio-files.s3.us-east-2.amazonaws.com/installers/RestobarPrintServer-Setup-Win64.exe',  // URL de descarga para Windows
		'linux': 'https://papaya-comercio-files.s3.us-east-2.amazonaws.com/installers/restobar-print-server_amd64.deb',    // URL de descarga para Linux
		'android': 'https://papaya-comercio-files.s3.us-east-2.amazonaws.com/installers/app-print-server.apk'   // URL de descarga para Android
	};
	
	var url = urls[platform];
	
	if (!url || url === '') {
		xShowMensajeToast('La descarga para ' + platform + ' aún no está disponible');
		return;
	}
	
	window.open(url, '_blank');
}

Polymer({
	is: 'x-print-server-donwload',
	properties: {
		xt_org: Number,
		xt_idsede: Number
	},
	attached: function() {
		xThisPrintServerDownload = this;
		xIniPrintServerDownload();
	}
});
</script>
