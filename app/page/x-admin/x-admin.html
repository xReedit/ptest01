<script>
var xThisAdmin, xPopupLoad, arrSede=[];
var currentSortField = '';
var currentSortOrder = 'asc';

    function xIniAdmin() {
		xLoadCpc();
		xLoadSedes();	
		getAllCompaniesFac();
		xLoadRepartidores();
		$('body').addClass('loaded');
	}

	function xLoadSedes(){
		$.ajax({ url: '../../bdphp/log_004.php?op=1' })
		.done((res) => {
			const _res = $.parseJSON(res);
			
			// Procesar cada elemento para calcular la antigüedad
			const datosProcessed = _res.datos.map(item => {
				// Si ya tiene num_dias_creado, lo dejamos como está
				if (item.num_dias_creado) {
					item.num_dias_creado = parseInt(item.num_dias_creado);
					return item;
				}
				
				// Si no tiene num_dias_creado pero tiene finicio, calculamos los días
				if (item.finicio) {
					const fechaInicio = parseFechaInicio(item.finicio);
					if (fechaInicio) {
						const hoy = new Date();
						const diffTime = Math.abs(hoy - fechaInicio);
						item.num_dias_creado = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
						return item;
					}
				}
				
				// Si no hay información de fecha, asignamos 0 días (nuevo)
				item.num_dias_creado = 0;
				return item;
			});
			
			arrSede = datosProcessed;
			xThisAdmin.ListSedes = datosProcessed;	
			console.log('xThisAdmin.ListSedes procesado', xThisAdmin.ListSedes);		
		});
	}
	
	// Función auxiliar para parsear fechas en diferentes formatos
	function parseFechaInicio(fechaStr) {
		if (!fechaStr || fechaStr === '') return null;
		
		// Intentar diferentes formatos de fecha
		let fecha = null;
		
		// Formato YYYY-MM-DD
		if (fechaStr.match(/^\d{4}-\d{2}-\d{2}$/)) {
			fecha = new Date(fechaStr);
		}
		// Formato DD/MM/YYYY
		else if (fechaStr.match(/^\d{2}\/\d{2}\/\d{4}$/)) {
			const parts = fechaStr.split('/');
			fecha = new Date(parts[2], parts[1] - 1, parts[0]);
		}
		
		// Verificar si la fecha es válida
		if (fecha && !isNaN(fecha.getTime())) {
			return fecha;
		}
		
		return null;
	}

	function xBuscarSedesSuscritos(obj) {
		let nom_sede = obj.value.toLowerCase();
		console.log('nom_sede', nom_sede);
		
		// Filtrar por nombre de sede
		let arrSearch = arrSede.filter(s => s.nomsede).filter(s => s.nomsede.toLowerCase().includes(nom_sede));
		console.log('arrSearch', arrSearch);
		
		// Asignar a ListSedes manteniendo los valores calculados
		xThisAdmin.ListSedes = arrSearch;
		
		// Reset sort indicators when searching
		resetSortIndicators();
	}
	
	function sortListSedes(element) {
		// Get the sort field from data-sort attribute
		const sortField = element.getAttribute('data-sort');
		
		// Toggle sort order if clicking on the same column
		if (currentSortField === sortField) {
			currentSortOrder = currentSortOrder === 'asc' ? 'desc' : 'asc';
		} else {
			currentSortField = sortField;
			currentSortOrder = 'asc';
		}
		
		// Reset all sort indicators
		resetSortIndicators();
		
		// Update the sort indicator for the current column
		const icon = element.querySelector('i');
		icon.className = currentSortOrder === 'asc' ? 'fa fa-sort-asc' : 'fa fa-sort-desc';
		
		// Create a copy of the array to sort
		let sortedArray = [...xThisAdmin.ListSedes];
		
		// Sort the array based on the selected field
		sortedArray.sort((a, b) => {
			// Special case for index which is not a property of the items
			if (sortField === 'index') {
				return currentSortOrder === 'asc' ? 1 : -1; // Just reverse the order for index
			}
			
			// Get values to compare
			let valueA = a[sortField] ? a[sortField].toString().toLowerCase() : '';
			let valueB = b[sortField] ? b[sortField].toString().toLowerCase() : '';
			
			// Compare values
			if (valueA < valueB) {
				return currentSortOrder === 'asc' ? -1 : 1;
			}
			if (valueA > valueB) {
				return currentSortOrder === 'asc' ? 1 : -1;
			}
			return 0;
		});
		
		// Update the ListSedes property with the sorted array
		xThisAdmin.ListSedes = sortedArray;
	}
	
	function resetSortIndicators() {
		// Reset all sort indicators to default
		const headers = document.querySelectorAll('th[data-sort]');
		headers.forEach(header => {
			const icon = header.querySelector('i');
			if (icon) {
				icon.className = 'fa fa-sort';
			}
		});
	}

			formatTimeSinceCreation: function(days) {
			// Ya no necesitamos calcular los días, solo formatear el valor
			if (!days) return '-';
			
			days = parseInt(days);
			
			// Convertir a años y meses si es necesario
			if (days >= 365) {
				const years = Math.floor(days / 365);
				const remainingDays = days % 365;
				const months = Math.floor(remainingDays / 30);
				
				if (months > 0) {
					return `${years} año${years > 1 ? 's' : ''}, ${months} mes${months > 1 ? 'es' : ''}`;
				} else {
					return `${years} año${years > 1 ? 's' : ''}`;
				}
			} else if (days >= 30) {
				const months = Math.floor(days / 30);
				const remainingDays = days % 30;
				
				if (remainingDays > 0) {
					return `${months} mes${months > 1 ? 'es' : ''}, ${remainingDays} día${remainingDays > 1 ? 's' : ''}`;
				} else {
					return `${months} mes${months > 1 ? 'es' : ''}`;
				}
			} else {
				return `${days} día${days > 1 ? 's' : ''}`;
			}
		},
		getAntiguedadIndicatorClass: function(days) {
			// Ya no necesitamos calcular los días, solo determinar la clase
			if (!days) return 'indicator-null';
			
			days = parseInt(days);
			
			if (days < 30) {
				return 'indicator-new';
			} else if (days >= 30 && days < 60) {
				return 'indicator-recent';
			} else {
				return 'indicator-established';
			}
		},
		getAntiguedadTitle: function(days) {
			// Ya no necesitamos calcular los días, solo determinar el título
			if (!days) return 'Comercio nuevo';
			
			days = parseInt(days);
			
			if (days < 30) {
				return 'Comercio nuevo (menos de 30 días)';
			} else if (days >= 30 && days < 60) {

			}
