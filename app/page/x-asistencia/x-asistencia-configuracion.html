<dom-module id="x-asistencia-configuracion">
	<template>

		<br>
		<div class="xMiCard xradius inv-card">
			<div class="xEncanezadoCard inv-head">
				<div class="inv-head-top">
					<div>
						<h3 id="asis_cfg_titulo">Como trabaja el local</h3>
						<p id="asis_cfg_bajada">Con esto contestado el marcador se maneja solo y no hay que tocar el calendario todos los dias.</p>
					</div>
					<div class="inv-head-acciones" id="asis_cfg_acciones">
						<button class="btn btn-sm btn-light" onclick="xAsisIr('inicio')"><i class="fa fa-arrow-left"></i>Volver</button>
						<button class="btn btn-sm btn-success" onclick="xAsisCfgGuardar()"><i class="fa fa-check"></i>Guardar</button>
					</div>
				</div>
			</div>
			<div class="xContentCard">

				<!-- 1 -->
				<div class="cfg-paso">
					<div class="cfg-num">1</div>
					<div class="cfg-cuerpo">
						<h4>Que dias NO abre el local</h4>
						<p class="cfg-ayuda">Marca solo los dias de cierre. Los demas se trabajan. Un dia de cierre no le genera falta a nadie.</p>
						<div class="cfg-semana" id="asis_cfg_dias"></div>
					</div>
				</div>

				<!-- 2 -->
				<div class="cfg-paso">
					<div class="cfg-num">2</div>
					<div class="cfg-cuerpo">
						<h4>Que feriados se trabajan</h4>
						<p class="cfg-ayuda">
							La mayoria de restaurantes abre los feriados. Marca los que si se trabaja;
							los que queden sin marcar el marcador los tratara como dia cerrado.
						</p>
						<div class="cfg-barra">
							<span class="cfg-anio" id="asis_cfg_anio"></span>
							<span class="inv-sep"></span>
							<button class="btn btn-sm btn-light" onclick="xAsisCfgFerTodos(true)">Marcar todos</button>
							<button class="btn btn-sm btn-light" onclick="xAsisCfgFerTodos(false)">Ninguno</button>
						</div>
						<div class="cfg-feriados" id="asis_cfg_feriados"></div>

						<label class="inv-check cfg-extra">
							<input type="checkbox" id="asis_cfg_fer_extra" onchange="xAsisCfgFeriado()">
							Al que trabaja un feriado se le paga extra
						</label>
						<div class="inv-form-row" id="asis_cfg_fer_box" hidden style="margin-left:26px">
							<span class="inv-label">Recargo</span>
							<input type="number" class="inv-input" id="asis_cfg_fer_valor" min="0" max="300" value="100" style="width:90px">
							<span class="inv-label">% adicional</span>
						</div>
					</div>
				</div>

				<!-- 3 -->
				<div class="cfg-paso">
					<div class="cfg-num">3</div>
					<div class="cfg-cuerpo">
						<h4>Si alguien viene a trabajar en su dia de descanso</h4>
						<p class="cfg-ayuda">Esto decide que hace el marcador cuando alguien escanea el QR en un dia que le tocaba descansar.</p>
						<label class="inv-check"><input type="radio" name="cfg_desc" value="PERMISO" onchange="xAsisCfgDescanso()"> Hay que pedir permiso al administrador</label>
						<label class="inv-check"><input type="radio" name="cfg_desc" value="RECARGO" onchange="xAsisCfgDescanso()"> Puede marcar y se le paga doble</label>
						<div class="inv-form-row" id="asis_cfg_desc_box" hidden style="margin-left:26px">
							<span class="inv-label">Recargo</span>
							<input type="number" class="inv-input" id="asis_cfg_desc_valor" min="100" max="300" value="100" style="width:90px">
							<span class="inv-label">% adicional</span>
						</div>
						<p class="inv-nota" id="asis_cfg_desc_nota"></p>
					</div>
				</div>

				<div class="cfg-pie">
					<button class="btn btn-sm btn-success" onclick="xAsisCfgGuardar()">
						<i class="fa fa-check"></i><span id="asis_cfg_btn">Guardar configuracion</span>
					</button>
				</div>

			</div>
		</div>
		<br><br>
	</template>
<script>
var xAsisCfgDatos = null;

function xAsisCfgCargar() {
	xPopupLoad.titulo = 'Cargando configuracion...'; xPopupLoad.xopen();
	xAsisApi('cal-configuracion').then(function (r) {
		xPopupLoad.xclose();
		if (!r.success) { return; }
		xAsisCfgDatos = r.datos;
		xAsisCfgPintar();
	});
}

function xAsisCfgPintar() {
	var c = xAsisCfgDatos;

	var html = '';
	XCAL_DIAS.forEach(function (d) {
		var cerrado = c.dias_cierre.indexOf(d) >= 0;
		html += '<label class="cfg-dia' + (cerrado ? ' cerrado' : '') + '">' +
			'<input type="checkbox" class="cal-cfg-dia" data-d="' + d + '"' + (cerrado ? ' checked' : '') +
			' onchange="xAsisCfgDia(this)"> ' + XCAL_DIAS_TXT[d] + '</label>';
	});
	$('#asis_cfg_dias').html(html);

	$('#asis_cfg_anio').text('Feriados ' + c.anio);
	var f = '';
	(c.feriados || []).forEach(function (x) {
		f += '<label class="cfg-fer">' +
			'<input type="checkbox" class="cfg-fer-chk" data-f="' + x.fecha + '"' + (x.labora ? ' checked' : '') + '>' +
			'<span class="cfg-fer-fecha">' + xAsisEsc(xAsisCfgFecha(x.fecha)) + '</span>' +
			'<span class="cfg-fer-nom">' + xAsisEsc(x.descripcion) + '</span>' +
			(x.propio ? '<em>propio</em>' : '') +
			'</label>';
	});
	$('#asis_cfg_feriados').html(f || '<p class="inv-nota">No hay feriados cargados para este ano.</p>');

	$('#asis_cfg_fer_extra').prop('checked', c.feriado_recargo_pct > 0);
	$('#asis_cfg_fer_valor').val(c.feriado_recargo_pct > 0 ? c.feriado_recargo_pct : 100);
	xAsisCfgFeriado();

	$('input[name=cfg_desc][value=' + c.descanso_trabajado + ']').prop('checked', true);
	$('#asis_cfg_desc_valor').val(c.descanso_recargo_pct);
	xAsisCfgDescanso();
}

/** '2026-07-28' -> '28 jul'. La fecha larga no aporta y rompe la fila en celular. */
var XCFG_MES3 = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
function xAsisCfgFecha(f) {
	return parseInt(f.slice(8)) + ' ' + XCFG_MES3[parseInt(f.slice(5, 7)) - 1];
}

function xAsisCfgDia(chk) {
	$(chk).closest('.cfg-dia').toggleClass('cerrado', chk.checked);
}

function xAsisCfgFerTodos(v) {
	$('.cfg-fer-chk').prop('checked', v);
}

function xAsisCfgFeriado() {
	$('#asis_cfg_fer_box').prop('hidden', !$('#asis_cfg_fer_extra').prop('checked'));
}

function xAsisCfgDescanso() {
	var v = $('input[name=cfg_desc]:checked').val();
	$('#asis_cfg_desc_box').prop('hidden', v !== 'RECARGO');
	// Se describe lo que va a ver la gente en el marcador, no como se llama la
	// opcion: el administrador tiene que poder anticipar la consecuencia.
	$('#asis_cfg_desc_nota').text(
		v === 'RECARGO'
			? 'El marcador acepta la marca y la registra como dia pagado doble. Entra a la boleta sin que nadie haga nada.'
		: v === 'PERMISO'
			? 'El marcador rechaza la marca y avisa que hay que habilitar el dia. Lo habilita el administrador desde el propio marcador.'
			: ''
	);
}

function xAsisCfgGuardar(alTerminar) {
	var dias = [];
	$('.cal-cfg-dia:checked').each(function () { dias.push($(this).attr('data-d')); });
	if (dias.length === 7) { xAsisAviso('No se pueden cerrar los siete dias.', 'warning'); return; }

	var trabajados = [];
	$('.cfg-fer-chk:checked').each(function () { trabajados.push($(this).attr('data-f')); });
	var conExtra = $('#asis_cfg_fer_extra').prop('checked');

	xPopupLoad.titulo = 'Guardando...'; xPopupLoad.xopen();
	xAsisApi('cal-configuracion-guardar', {
		anio: xAsisCfgDatos.anio,
		dias_cierre: dias,
		feriados_labora: trabajados,
		feriados_total: (xAsisCfgDatos.feriados || []).length,
		feriado_recargo_pct: conExtra ? parseInt($('#asis_cfg_fer_valor').val() || 100) : 0,
		descanso_trabajado: $('input[name=cfg_desc]:checked').val() || 'PERMISO',
		descanso_recargo_pct: parseInt($('#asis_cfg_desc_valor').val() || 100)
	}).then(function (r) {
		xPopupLoad.xclose();
		if (!r.success) { return; }
		xAsisCfgDatos = r.datos;
		showToastSwal('success', 'Configuracion guardada');
		if (typeof alTerminar === 'function') { alTerminar(); return; }
		xAsisIr('inicio');
	});
}

Polymer({ is: 'x-asistencia-configuracion' });
</script>
</dom-module>
