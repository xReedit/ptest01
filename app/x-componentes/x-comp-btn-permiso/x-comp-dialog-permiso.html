<dom-module id="x-comp-dialog-permiso">
    <template>
        <style>
            .dialog_redondo {
                border-radius: 10px;
            }

            .p-3 {
                padding: 16px;
            }

            .fs-18 {
                font-size: 18px;
            }

            .fw-600 {
                font-weight: 600;
            }

            .fs-11 {
                font-size: 11px;
            }

            .fs-10 {
                font-size: 10px;
            }

            .fs-12 {
                font-size: 12px;
            }

            .btn {
                padding: 8px 16px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }

            .btn-primary {
                background-color: #007bff;
                color: white;
            }

            .btn-secondary {
                background-color: #6c757d;
                color: white;
            }

            .btn-sm {
                font-size: 12px;
            }

            .badge {
                display: inline-block;
                padding: 0.25em 0.4em;
                font-size: 75%;
                font-weight: 700;
                line-height: 1;
                text-align: center;
                white-space: nowrap;
                vertical-align: baseline;
                border-radius: 0.25rem;
            }

            .badge-info {
                background-color: #17a2b8;
                color: white;
            }

            .badge-danger {
                background-color: #dc3545;
                color: white;
            }
        </style>

        <paper-dialog id="com_dialog_solicitud_remota_permiso" class="dialog_redondo" style="max-width: 295px;"
            entry-animation="scale-up-animation" exit-animation="fade-out-animation" with-backdrop>
            <div class="p-3">
                <div>
                    <p class="fs-18 fw-600">Solicitar Permiso Remoto</p>
                    <span class="fw-600 fs-11">Las solicitudes se envian al numero de WhatsApp</span>
                </div>
                <br>

                <p>Quien dará el permiso?</p>
                <select class="selected-template-1" id="selAdmin" on-change="_selectedUsAdmin">
                    <template is="dom-repeat" items="{{listUsAdmin}}" as="item">
                        <option value="{{item.idusuario}}">{{item.nombres}}</option>
                    </template>
                </select>
                <br>

                <p hidden$="[[!isUsAdminHaveTelefono]]" class="fs-10 badge badge-info">Telefono de notificación:
                    [[usAdminSelected.telefono]]</p>
                <p hidden$="[[isUsAdminHaveTelefono]]" class="fs-10 badge badge-danger">No tiene un telefono registrado
                </p>
                <br><br>

                <p class="fw-600">Solicitud:</p>
                <p class="fs-12" id="comp_dialog_permiso_titulo_solicitud"></p>
                <textarea class="selected-template-1" id="text_motivo_solicitud_remoto"
                    placeholder="Indique el motivo de su solicitud" cols="30" rows="3"
                    on-input="_checkFormValidity"></textarea>
                <br><br>
                <button disabled$="[[!canSend]]" class="btn btn-sm btn-primary"
                    on-click="_sendSolicitud">Enviar</button>
                <button class="btn btn-sm btn-secondary" dialog-dismiss>Cancelar</button>
            </div>
        </paper-dialog>
    </template>

    <script>        
    // var xCompArraySolitaPermiso = {
    //         tipo_permiso: 0,
    //         motivo: '',
    //         idusuario_admin: 0,
    //         idusuario_solicita: 0,
    //         nomusuario_solicita: '',
    //         nomusuario_admin: '',
    //         nomsede: '',
    //         data: {},
    //         solicitud: '',
    //         solicitudHtml: '',
    //         link: '',
    //     }

        Polymer({
            is: 'x-comp-dialog-permiso',
            properties: {
                listUsAdmin: {
                    type: Array,
                    value: function () {
                        return [];
                    }
                },
                usAdminSelected: {
                    type: Object,
                    value: function () {
                        return {};
                    }
                },
                isUsAdminHaveTelefono: {
                    type: Boolean,
                    value: false
                },
                canSend: {
                    type: Boolean,
                    computed: '_computeCanSend(isUsAdminHaveTelefono, motivoSolicitud)'
                },
                motivoSolicitud: {
                    type: String,
                    value: ''
                }
            },
            attached: function () {
                this.isUsAdminHaveTelefono = false;
                this._loadUsAdminPermiso();
            },
            _loadUsAdminPermiso: function () {
                this.$.text_motivo_solicitud_remoto.value = '';
                $.ajax({
                    type: 'POST',
                    url: '../../bdphp/log.php?op=70112'
                }).done((res) => {
                    this.listUsAdmin = JSON.parse(res).datos;
                    this._selectedUsAdmin(null, 0);
                });
            },
            _selectedUsAdmin: function (event, index = null) {
                if (index !== null) {
                    this.usAdminSelected = this.listUsAdmin[index];
                } else {
                    const selectedIndex = this.$.selAdmin.selectedIndex;
                    this.usAdminSelected = this.listUsAdmin[selectedIndex];
                }
                this.isUsAdminHaveTelefono = this.usAdminSelected.telefono !== null && this.usAdminSelected.telefono !== '';
                this._checkFormValidity();
            },
            _checkFormValidity: function () {
                this.motivoSolicitud = this.$.text_motivo_solicitud_remoto.value.trim();
            },
            _computeCanSend: function (isUsAdminHaveTelefono, motivoSolicitud) {
                return isUsAdminHaveTelefono && motivoSolicitud !== '';
            },
            _sendSolicitud: async function () {
                const motivo = this.$.text_motivo_solicitud_remoto.value;
                const solicitud = {
                    motivo,
                    idusuario_solicita: xIdUsuario,
                    idusuario_admin: this.usAdminSelected.idusuario,
                    telefono_admin: this.usAdminSelected.telefono,
                    nomusuario_solicita: xNomUsario,
                    nomusuario_admin: primeraConMayusculas(this.usAdminSelected.nombres),
                    nomsede: xm_log_get('datos_org_sede')[0].sedenombre,
                    data: xCompArraySolitaPermiso.obj,
                    solicitud: xCompArraySolitaPermiso.solicitud,
                    tipo_permiso: xCompArraySolitaPermiso.tipo_permiso,
                };

                const _fetchApi = new httpFecht();
                const rpt = await _fetchApi.postJson('../../bdphp/log_009.php?op=40', solicitud);
                if (rpt.success) {
                    this.$.com_dialog_solicitud_remota_permiso.close();
                    this.$.text_motivo_solicitud_remoto.value = '';
                    solicitud.link = rpt.link;
                    _cpSocketSendWhatAppPermisoAdmin(solicitud);

                    const _swalAlertValues = paramsSwalAlert;
                    _swalAlertValues.html = `<div class="p-1">
                        <i class="fa fa-check fa-2x text-success"></i>
                        <p class="fw-600 fs-20">Solicitud enviada</p>
                        <p class="fw-100 fs-14">
                            Se envio la solicitud a <strong>${solicitud.nomusuario_admin}</strong> al WhatsApp <strong>${solicitud.telefono_admin}</strong>. Se le notificara cuando la solicitud sea atendida.
                        </p>
                    </div>`;
                    showAlertSwalHtml(_swalAlertValues);

                    this.fire('xSend', solicitud);
                } else {
                    console.error('Error al enviar la solicitud:', rpt);
                }
            },
            openDialog: function () {
                this._loadUsAdminPermiso();
                this._loadSolicitudData();
                this.$.com_dialog_solicitud_remota_permiso.open();
            },
            _loadSolicitudData: function () {
                const solicitud = xCompArraySolitaPermiso;
                let descripcionEliminar = '';
                let _descripcionEliminarNoHtml = '';

                if (solicitud.tipo_permiso === 1) {
                    const desOperacion = `${solicitud.mesa === '0' ? `del pedido ${solicitud.numpedido}` : `de la mesa ${solicitud.mesa}`}`;
                    descripcionEliminar = `<span class="fw-600 text-danger">Eliminar</span> <strong>${solicitud.mesa === '0' ? `del pedido ${solicitud.numpedido}` : `de la mesa ${solicitud.mesa}`}</strong> el producto <strong>${solicitud.obj.descripcion.toLowerCase()} (${solicitud.obj.precio_unitario}).</strong>`;
                    _descripcionEliminarNoHtml = `Eliminar ${desOperacion} el producto ${solicitud.obj.descripcion.toLowerCase()} (${solicitud.obj.precio_unitario}).`;
                } else if (solicitud.tipo_permiso === 2) {
                    const pedidoPlural = solicitud.obj.length > 1;
                    const tituloPedidoPlural = pedidoPlural ? 'los pedidos' : 'el pedido';
                    const importeTotal = solicitud.importe_total.toFixed(2);
                    descripcionEliminar = `<span class="fw-600 text-danger">Eliminar</span> <strong>${solicitud.mesa === '0' ? `del pedido ${solicitud.numpedido}` : `de la mesa ${solicitud.mesa}`}</strong> ${tituloPedidoPlural} <strong>${solicitud.obj[0].idpedidos}</strong> por un importe de <strong>${importeTotal}</strong>`;
                    _descripcionEliminarNoHtml = `Eliminar ${tituloPedidoPlural} ${solicitud.obj[0].idpedidos} por un importe de ${importeTotal}`;
                } else if (solicitud.tipo_permiso === 3) {
                    const importeTotal = solicitud.obj.importe;
                    const desTpBefore = solicitud.obj.descripcion_before;
                    const desTpAfter = solicitud.obj.descripcion_afeter;
                    descripcionEliminar = `<span class="fw-600 text-danger">Cambiar metodo de pago</span> <strong>${desTpBefore}</strong> de un importe de: <strong>${importeTotal}</strong>`;
                    _descripcionEliminarNoHtml = `Cambiar metodo de pago ${desTpBefore} de un importe de: ${importeTotal}`;
                } else if (solicitud.tipo_permiso === 4) {
                    const importeTotal = solicitud.obj.importe_1.toFixed(2);
                    const importeEvaluar = parseFloat(solicitud.obj.importe_2);
                    const importeDif = (importeTotal - importeEvaluar).toFixed(2);
                    descripcionEliminar = `<span class="fw-600 text-danger">Cerrar caja</span> hay una diferencia en el efectivo de caja. Tengo <strong>${importeTotal}</strong>`;
                    _descripcionEliminarNoHtml = `Cerrar caja hay una diferencia en el efectivo de caja. Tengo ${importeTotal}`;
                } else if (solicitud.tipo_permiso === 5) { // anular registro de pago
                    const importeTotal = solicitud.obj.importe;                    
                    descripcionEliminar = `<span class="fw-900 text-danger">Anular</span> el <strong>registro de pago de pago </strong> que contiene <strong>${solicitud.numpedidos} pedido(s)</strong> del canal de consumo <strong>${solicitud.tipoconsumo}</strong> por un importe de <strong>${solicitud.obj.importe}</strong>`;
                    _descripcionEliminarNoHtml = `Anular el registro de pago que contiene ${solicitud.numpedidos} pedido(s) del canal de consumo ${solicitud.tipoconsumo} por un importe de ${solicitud.obj.importe}`;
                }


                xCompArraySolitaPermiso.solicitud = _descripcionEliminarNoHtml;

                this.$.comp_dialog_permiso_titulo_solicitud.innerHTML = descripcionEliminar;
            }
        });
    </script>
</dom-module>
