<dom-module id="x-comp-selector-mesa">
	<link rel="import" href="../../web_components/paper-dialog/paper-dialog.html">
	
	<template>
		<style>
			:host {
				display: block;
			}
			
			#dialogSelectorMesa {
				max-width: 900px;
				width: 90%;
				min-height: 480px;
				max-height: 90vh;
				padding: 0 !important;
				margin: 0;
				border-radius: 12px;
				overflow: hidden;
			}
			
			#dialogSelectorMesa > * {
				margin: 0;
			}
			
			.modal-header {
				padding: 15px 20px;
				display: flex;
				justify-content: space-between;
				align-items: center;
				background: darkslateblue;
				color: white;
			}
			
			.modal-header h3 {
				margin: 0;
				font-size: 20px;
				font-weight: 600;
			}
			
			.btn-close {
				background: rgba(255, 255, 255, 0.2);
				border: none;
				color: white;
				font-size: 28px;
				width: 36px;
				height: 36px;
				border-radius: 50%;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				transition: all 0.3s;
				line-height: 1;
			}
			
			.btn-close:hover {
				background: rgba(255, 255, 255, 0.3);
				transform: scale(1.1);
			}
			
			.tabs-container {
				display: flex;
				overflow-x: auto;
				background: #f8f9fa;
				border-bottom: 2px solid #e0e0e0;
				padding: 0;
				-webkit-overflow-scrolling: touch;
			}
			
			.tabs-container::-webkit-scrollbar {
				height: 6px;
			}
			
			.tabs-container::-webkit-scrollbar-thumb {
				background: #ccc;
				border-radius: 3px;
			}
			
			.tab-btn {
				flex: 0 0 auto;
				padding: 15px 25px;
				font-size: 16px;
				font-weight: 600;
				background: transparent;
				border: none;
				border-bottom: 3px solid transparent;
				cursor: pointer;
				transition: all 0.3s;
				color: #666;
				white-space: nowrap;
			}
			
			.tab-btn:hover {
				background: rgba(102, 126, 234, 0.1);
				color: #667eea;
			}
			
			.tab-btn.active {
				color: #667eea;
				border-bottom-color: #667eea;
				background: white;
			}
			
			.modal-body {
				padding: 20px;
				overflow-y: auto;
				max-height: calc(90vh - 200px);
			}
			
			.mesas-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
				gap: 10px;
			}
			
			.mesa-btn {
				padding: 20px 10px;
				font-size: 18px;
				font-weight: 600;
				background: white;
				border: 2px solid #e0e0e0;
				border-radius: 8px;
				cursor: pointer;
				transition: all 0.2s;
				text-align: center;
				color: #333;
				min-height: 70px;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			
			.mesa-btn:hover {
				background: #667eea;
				color: white;
				border-color: #667eea;
				transform: translateY(-2px);
				box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
			}
			
			.mesa-btn:active {
				transform: translateY(0);
			}
			
			@media (max-width: 768px) {
				#dialogSelectorMesa {
					width: 95%;
					max-height: 95vh;
				}
				
				.modal-header h3 {
					font-size: 18px;
				}
				
				.tab-btn {
					padding: 12px 20px;
					font-size: 14px;
				}
				
				.mesas-grid {
					grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
					gap: 8px;
				}
				
				.mesa-btn {
					padding: 15px 8px;
					font-size: 16px;
					min-height: 60px;
				}
			}
			
			@media (max-width: 480px) {
				.mesas-grid {
					grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
				}
				
				.tab-btn {
					padding: 10px 15px;
					font-size: 13px;
				}
			}
		</style>
		
		<paper-dialog id="dialogSelectorMesa" modal entry-animation="scale-up-animation" exit-animation="fade-out-animation" with-backdrop>
			<div class="modal-header">
				<h3>Seleccionar Mesa</h3>
				<button class="btn-close" on-click="close">&times;</button>
			</div>
			
			<div class="tabs-container">
				<template is="dom-repeat" items="[[areas]]" as="area" index-as="areaIndex">
					<button 
						class$="tab-btn [[_getTabClass(areaIndex, selectedAreaIndex)]]"
						on-click="_onSelectArea"
						data-index$="[[areaIndex]]"
					>
						[[area.titulo]]
					</button>
				</template>
			</div>
			
			<div class="modal-body">
				<div class="mesas-grid">
					<template is="dom-repeat" items="[[_getSelectedAreaMesas(areas, selectedAreaIndex)]]" as="mesa">
						<button 
							class="mesa-btn" 
							on-click="_onSelectMesa"
							data-codigo$="[[mesa.codigo]]"
						>
							[[mesa.codigo]]
						</button>
					</template>
				</div>
			</div>
		</paper-dialog>
	</template>
	
	<script>
		Polymer({
			is: 'x-comp-selector-mesa',
			
			properties: {
				areas: {
					type: Array,
					value: function() { return []; }
				},
				selectedAreaIndex: {
					type: Number,
					value: 0
				},
				esAlfanumerica: {
					type: Boolean,
					value: false
				}
			},
			
			ready: function() {
				this._loadAreas();
			},
			
			open: function() {
				this._loadAreas();
				this.selectedAreaIndex = 0;
				this.$.dialogSelectorMesa.open();
			},
			
			close: function() {
				this.$.dialogSelectorMesa.close();
			},
			
			_loadAreas: async function() {
				try {
					const datosSede = xm_log_get('sede_otros_datos');
					this.esAlfanumerica = datosSede && datosSede[0] && datosSede[0].mesas_alfanumerica === "1";
					
					const response = await fetch('../../bdphp/log_009.php?op=5001', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' }
					});
					
					const data = await response.json();
					
					if (data && data.datos) {
						const areasData = data.datos.map(area => {
							const mesas = [];
							const desde = parseInt(area.desde);
							const hasta = parseInt(area.hasta);
							
							for (let i = desde; i <= hasta; i++) {
								let codigo = '';
								if (this.esAlfanumerica && area.prefijo) {
									codigo = area.prefijo + this._padLeft(i, 2);
								} else {
									codigo = this._padLeft(i, 2);
								}
								mesas.push({ codigo: codigo });
							}
							
							return {
								titulo: area.titulo,
								idarea_mesa: area.idarea_mesa,
								mesas: mesas
							};
						});
						
						this.set('areas', areasData);
					}
				} catch (error) {
					console.error('Error al cargar áreas:', error);
				}
			},
			
			_padLeft: function(num, size) {
				let s = num + "";
				while (s.length < size) s = "0" + s;
				return s;
			},
			
			_onSelectArea: function(e) {
				const index = parseInt(e.currentTarget.dataset.index);
				this.selectedAreaIndex = index;
			},
			
			_getTabClass: function(areaIndex, selectedIndex) {
				return areaIndex === selectedIndex ? 'active' : '';
			},
			
			_getSelectedAreaMesas: function(areas, selectedIndex) {
				if (!areas || areas.length === 0) return [];
				if (selectedIndex < 0 || selectedIndex >= areas.length) return [];
				return areas[selectedIndex].mesas;
			},
			
			_onSelectMesa: function(e) {
				const codigo = e.currentTarget.dataset.codigo;
				const area = this.areas[this.selectedAreaIndex];
				
				this.fire('mesa-selected', {
					codigo: codigo,
					area: area.titulo
				});
				
				this.close();
			},
			
			validarMesaExiste: function(codigoMesa) {
				const codigoUpper = codigoMesa.trim().toUpperCase();
				
				for (let area of this.areas) {
					for (let mesa of area.mesas) {
						if (mesa.codigo.toUpperCase() === codigoUpper) {
							return true;
						}
					}
				}
				
				return false;
			}
		});
	</script>
</dom-module>
