<dom-module id="x-comp-item-subitems">
    <link rel="import" href="../../x-componentes/x-comp-ctrl-add-fast/x-comp-ctrl-add-fast.html">
    <template>
        <!-- Rediseño 2026-10: grupos como tarjetas, opciones como botones grandes y panel con lo ya agregado.
             La logica de agregar sigue siendo la de siempre: el boton Agregar y los +/- de cada linea disparan
             los .xBtn de las filas de canal (#_xdlgBody, ocultas) que atiende handlerFnMiPedido (item_pedidos.js). -->
        <paper-dialog id="dialog_item_comp" class="xdlg dlg-op" modal with-backdrop
             entry-animation="scale-up-animation" exit-animation="fade-out-animation">
            <div class="op-wrap">
                <div class="op-head">
                    <div class="op-info">
                        <h3>{{desProducto}}</h3>
                        <p class="op-det" hidden$="[[!isShowDetalleProducto]]">{{detalleProducto}}</p>
                        <div class="op-chips">
                            <span class="op-chip" id="opChipStock"><i class="fa fa-cubes"></i> Stock: <b id="contetStock">{{stockProducto}}</b></span>
                        </div>
                        <div class="op-progreso" id="opProgreso"></div>
                    </div>
                    <div class="op-precio"><b id="opPrecio"></b><span id="opPrecioSub"></span></div>
                    <button class="op-x" title="Cerrar" onclick="xListoDlgVR_comp();"><i class="fa fa-times"></i></button>
                </div>

                <div class="op-cuerpo">
                    <div class="op-grupos" hidden$="[[ !isExistSubitems ]]">
                        <template is="dom-repeat" items="[[listContentSub]]" as="contentSub">
                            <div class="op-grupo" data-idcontent$="[[contentSub.iditem_subitem_content]]">
                                <div class="op-g-head">
                                    <span class="op-paso"></span>
                                    <div class="op-g-titulo">[[_titulo(contentSub.des)]]<div class="op-g-regla"></div></div>
                                    <span class="op-g-chip"></span>
                                </div>
                                <div class="op-opciones" id="group-[[contentSub.iditem_subitem_content]]">
                                    <template is="dom-repeat" items="[[contentSub.opciones]]" as="subitem">
                                        <div class="op-op check-subitem" hidden$="{{isSubItemCheckBox(contentSub.show_cant_item)}}"
                                            data-item="{{subitem}}" data-idcontent="{{contentSub.iditem_subitem_content}}" data-id="{{index}}"
                                            on-tap="_tocarOpcion">
                                            <i class="fa fa-circle-o op-ic"></i>
                                            <div class="op-tx">
                                                <div class="op-nom">[[subitem.des]]</div>
                                                <div class="op-sub">
                                                    <span class="op-mas" hidden$="[[!subitem.precio_visible]]">+ S/ [[_dinero(subitem.precio)]]</span>
                                                    <span class="op-stock"></span>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="op-op op-cant-op" hidden$="{{!isSubItemCheckBox(contentSub.show_cant_item)}}" data-item="{{subitem}}">
                                            <div class="op-tx">
                                                <div class="op-nom">[[subitem.des]]</div>
                                                <div class="op-sub">
                                                    <span class="op-mas" hidden$="[[!subitem.precio_visible]]">+ S/ [[_dinero(subitem.precio)]]</span>
                                                    <span class="op-stock"></span>
                                                </div>
                                            </div>
                                            <x-comp-ctrl-add-fast
                                                on-chagecount="handleCountChange"
                                                iditem_subitem_content="[[contentSub.iditem_subitem_content]]"
                                                subitem="{{subitem}}"
                                                descripcion_item_ini="[[subitem.des]]"
                                                max-quantity="[[contentSub.subitem_cant_select]]">
                                            </x-comp-ctrl-add-fast>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>

                    <div class="op-lado">
                        <div class="op-bloque" hidden$="[[ !isExistSubitems ]]">
                            <h4><i class="fa fa-hand-pointer-o"></i> <span id="opTituloSel">Selección</span>
                                <span class="op-der" on-tap="_limpiarSeleccion"><i class="fa fa-eraser"></i> Limpiar</span></h4>
                            <div id="opSeleccion" class="op-resumen"></div>
                        </div>
                        <div class="op-bloque">
                            <h4><i class="fa fa-pencil"></i> Indicaciones adicionales</h4>
                            <input type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" name="nota_plato_item"
                                placeholder="Ej: poco ají, sin arroz" class="op-nota" id="txt_referencia"
                                onkeyup="xChangeIndicacionesItem(); xThisComSubItem._pintar();">
                            <div class="op-rapidas" id="opRapidas"></div>
                        </div>
                        <div class="op-bloque">
                            <h4><i class="fa fa-map-marker"></i> Se agrega a</h4>
                            <div class="op-seg" id="opCanales"></div>
                        </div>
                        <div class="op-bloque">
                            <h4><i class="fa fa-shopping-basket"></i> Ya en el pedido <span id="opCantPedido"></span></h4>
                            <div id="opAgregados"></div>
                        </div>
                        <!-- filas de canal de siempre (xArmarTipoConsumo): ocultas, las usan Agregar y los +/- -->
                        <div class="op-filas-canal xdlgBody" id="_xdlgBody">
                            <div class="spinner"><paper-spinner active></paper-spinner></div>
                        </div>
                    </div>
                </div>

                <div class="op-pie">
                    <div class="op-estado" id="opEstado"></div>
                    <div class="op-total"><small id="opTotalSub"></small><b id="opTotal"></b></div>
                    <button class="btn btn-light op-btn xInvisible" id="dlgBtn" onclick="xListoDlgVR_comp();"><i class="fa fa-check"></i> Listo</button>
                    <button class="btn btn-primary op-btn" id="opBtnAgregar" on-tap="_agregar"></button>
                </div>
            </div>
        </paper-dialog>
    </template>
</dom-module>
<style>
    hr { background: #e0e0e0; } /* global de siempre: otras pantallas lo heredan de aqui */

    /* ===== dialogo de opciones del producto (x-comp-item-subitems) ===== */
    #dialog_item_comp.dlg-op { width: min(1500px, 95vw); height: min(940px, 94vh); max-width: none !important; max-height: none !important; }
    /* alto fijo: si crece con cada linea agregada hay que recentrarlo y parpadea; lo que no entra hace scroll adentro */
    #dialog_item_comp.op-compacto { width: min(980px, 96vw); height: min(720px, 94vh); max-height: 94vh !important; }
    #dialog_item_comp.op-sin-grupos { width: min(640px, 96vw); height: min(560px, 94vh); max-height: 94vh !important; }

    #dialog_item_comp.op-sin-grupos .op-estado { flex-basis: 100%; }
    #dialog_item_comp.op-sin-grupos .op-total { flex: 1 1 auto; text-align: left; }

    #dialog_item_comp .op-head { display: flex; gap: 14px; align-items: center; padding: 10px 18px; background: lavenderblush; border-bottom: 1px solid #edf0f2; }
    /* nombre, stock y obligatorias en una sola fila para que el encabezado sea bajo */
    #dialog_item_comp .op-info { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
    #dialog_item_comp .op-info h3 { margin: 0; font-size: 18px; font-weight: 700; color: #3a3a3a; }

    #dialog_item_comp .op-x:hover { background: rgba(0, 0, 0, .05); }

    #dialog_item_comp .op-cuerpo { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 1fr 380px; }

    #dialog_item_comp .op-grupo.listo { border-color: #b7e4c3; }

    #dialog_item_comp .op-g-titulo { flex: 1 1 auto; font-size: 14px; font-weight: 700; color: #343a40; }
    #dialog_item_comp .op-g-regla { font-size: 11px; color: #6c757d; font-weight: 600; }

    #dialog_item_comp .op-g-chip, #dialog_item_comp .op-badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }

    #dialog_item_comp .op-op[hidden] { display: none; }
    #dialog_item_comp .op-op:hover { border-color: #9ec5fe; }

    #dialog_item_comp .op-sub:empty { display: none; }
    #dialog_item_comp .op-mas { color: #0056b3; font-weight: 700; }
    #dialog_item_comp .op-mas[hidden] { display: none; }
    #dialog_item_comp .op-stock.poco { color: #b45309; font-weight: 700; }
    #dialog_item_comp .op-stock.ago { color: #dc3545; font-weight: 700; }
    #dialog_item_comp .op-op.sel { border-color: #007bff; background: #eaf3ff; box-shadow: inset 0 0 0 1px #007bff; }
    #dialog_item_comp .op-op.sel .op-ic { color: #007bff; }
    #dialog_item_comp .op-op.agotado { cursor: not-allowed; background: #f8f9fa; border-style: dashed; }
    #dialog_item_comp .op-op.agotado .op-nom { color: #adb5bd; text-decoration: line-through; }
    #dialog_item_comp .op-cant-op .container { background: transparent !important; }
    #dialog_item_comp .op-cant-op .increment, #dialog_item_comp .op-cant-op .decrement { font-size: 18px !important; padding: 0 10px 2px !important; }

    #dialog_item_comp .op-bloque[hidden] { display: none; }
    #dialog_item_comp .op-bloque h4 { margin: 0 0 7px; font-size: 11px; font-weight: 700; color: #6c757d; letter-spacing: .5px; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
    #dialog_item_comp .op-der { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 600; color: #007bff; cursor: pointer; }
    #dialog_item_comp .op-resumen { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 9px 12px; }
    #dialog_item_comp .op-resumen.nueva { border: 1px dashed #007bff; }
    #dialog_item_comp .op-linea { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 700; }
    #dialog_item_comp .op-ops-txt { font-size: 11.5px; color: #495057; line-height: 1.45; margin-top: 2px; }
    #dialog_item_comp .op-ops-txt b { color: #0056b3; }
    #dialog_item_comp .op-falta { color: #b45309; font-weight: 600; font-size: 12px; margin-top: 3px; }
    #dialog_item_comp .op-aviso { margin-top: 6px; padding: 6px 8px; border-radius: 6px; font-size: 11px; background: #eaf3ff; color: #0056b3; }
    #dialog_item_comp .op-nota { width: 100%; height: 36px; border: 1px solid #dddddd; border-radius: 8px; padding: 0 10px; font: inherit; font-size: 13px; background: #fff; }
    #dialog_item_comp .op-nota:focus { outline: none; border-color: #007bff; box-shadow: 0 0 0 3px rgba(0, 123, 255, .12); }
    #dialog_item_comp .op-rapidas { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
    #dialog_item_comp .op-rapidas:empty { display: none; }
    #dialog_item_comp .op-rapida { padding: 3px 9px; border-radius: 999px; border: 1px solid #dddddd; background: #fff; font-size: 11px; color: #495057; cursor: pointer; }
    #dialog_item_comp .op-rapida.on { border-color: #007bff; color: #007bff; background: #eaf3ff; }

    #dialog_item_comp .op-seg { display: flex; background: #eef0f3; border-radius: 9px; padding: 3px; gap: 3px; }

    #dialog_item_comp .op-seg span img { width: 16px; height: 16px; object-fit: contain; opacity: .55; flex: 0 0 auto; }
    #dialog_item_comp .op-seg span.on { background: #fff; color: #007bff; box-shadow: 0 1px 2px rgba(16, 24, 40, .08); }
    #dialog_item_comp .op-seg span.on img { opacity: 1; }

    #dialog_item_comp .op-agregado { display: flex; gap: 10px; align-items: center; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; }

    #dialog_item_comp .op-agregado .op-num { width: 24px; height: 24px; border-radius: 50%; background: #e9ecef; color: #495057; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }

    #dialog_item_comp .op-agregado .op-ad b { display: block; font-size: 12px; }
    #dialog_item_comp .op-agregado .op-ad small { display: block; font-size: 11px; color: #6c757d; line-height: 1.3; }
    #dialog_item_comp .op-agregado .op-ad em { font-style: normal; font-size: 10.5px; color: #007bff; font-weight: 700; display: flex; align-items: center; gap: 4px; }
    #dialog_item_comp .op-agregado .op-ad em img { width: 14px; height: 14px; object-fit: contain; }
    #dialog_item_comp .op-vacio { font-size: 12px; color: #6c757d; background: #fff; border: 1px dashed #dddddd; border-radius: 10px; padding: 10px 12px; }
    #dialog_item_comp .op-step { display: inline-flex; align-items: center; border: 1px solid #dddddd; border-radius: 8px; overflow: hidden; background: #fff; flex: 0 0 auto; }

    /* pantallas chicas: una sola columna, todo con scroll */

        #dialog_item_comp.dlg-op, #dialog_item_comp.op-compacto, #dialog_item_comp.op-sin-grupos { width: 100vw; height: 100vh; max-height: none !important; border-radius: 0; }

        #dialog_item_comp .op-pie { flex-wrap: wrap; }
        #dialog_item_comp .op-estado { flex-basis: 100%; font-size: 12px; }
        #dialog_item_comp .op-total { flex: 1 1 auto; text-align: left; }

</style>
<script>
    var xThisComSubItem, itemPedidos_objItemSelected, isExistSubitems = false, _precioProductoIni, _precioProductoUnitario, keyStorageListSubItem = '::app3_listSubItem';

    function compResetInputIndicaciones(val) {
        var el = document.getElementById('txt_referencia');
        if (el) {
            el.value = val || '';
            el.setAttribute('autocomplete', 'off');
        }
    }

    function compGetIndicacionesFromInput() {
        var el = document.getElementById('txt_referencia');
        return el ? (el.value || '').trim() : '';
    }

    function compGetPedidoItemKey(item) {
        if (xidItem) {
            return xidItem;
        }
        if (!item) {
            return '';
        }
        return item.iditem || item.idcarta_lista || '';
    }

    async function xOpenDlgItemVR_comp(tpc, id) {

        if ( !itemPedidos_objItemSelected ) {
            itemPedidos_objItemSelected = xGeneralDataCarta.filter(x => x.idcarta_lista == id)[0];
        }
        
        const _idItem = itemPedidos_objItemSelected.iditem2 ? itemPedidos_objItemSelected.iditem2 : itemPedidos_objItemSelected.iditem;

        xThisComSubItem.isOptionRequeridosComplet = false;
        compResetInputIndicaciones('');

        // itemPedidos_objItemSelected = xThisComSubItem.item_select
        if ( tpc ) {
            // itemPedidos_objItemSelected = xArrayPedidoObj[tpc][id];
            // 220522 cambiamos para socket
            itemPedidos_objItemSelected = xGeneralDataCarta.filter(x => x.iditem == _idItem)[0];
        }

        itemPedidos_objItemSelected.des = itemPedidos_objItemSelected.des ? itemPedidos_objItemSelected.des : itemPedidos_objItemSelected.des_item;
        xThisComSubItem.desProducto = itemPedidos_objItemSelected.des;
        xThisComSubItem.detalleProducto = itemPedidos_objItemSelected.detalle;

    async function getSubtItemsItem(_iditem) {
        var repSubItem = [];

        // consulta primero en el storage
        var listStorageSubItem = JSON.parse(localStorage.getItem(keyStorageListSubItem));
        if ( listStorageSubItem ) {
            repSubItem = listStorageSubItem.filter(x => x.iditem === _iditem)[0];            

            if ( repSubItem ) {
                repSubItem = repSubItem.subitems;
                itemPedidos_objItemSelected.subitems = repSubItem;
                return repSubItem;
            }
        } else {
            listStorageSubItem = [];
        }


        await $.ajax({ type: 'POST', url: '../../bdphp/log.php?op=20051', data:{'iditem': _iditem}})
	    .done( function (dtCarta) {
            var xdt_rpt = $.parseJSON(dtCarta)            
            var repSubItemBD = [], newItemSubItem = {};

            xdt_rpt = xdt_rpt.datos ? xdt_rpt.datos : [];            

            xdt_rpt.map(x => {
                if ( x.subitems ) {
                    x.subitems = JSON.parse(x.subitems);
                    x.subitems.map(s => {
                        repSubItemBD.push(s);
                    });
                } else {
                    repSubItemBD = null;
                }
            })

            itemPedidos_objItemSelected.subitems = repSubItemBD;        
            newItemSubItem.iditem = _iditem,
            newItemSubItem.subitems = repSubItemBD;            
            listStorageSubItem.push(newItemSubItem);

            localStorage.setItem(keyStorageListSubItem, JSON.stringify(listStorageSubItem));

            repSubItem = repSubItemBD;

            return repSubItem;
        });
        
        // return repSubItem;
    }

            return '';
        },
        // "CONSUMIR EN EL LOCAL" es muy largo para el boton del canal
        _nomCanal: function (des) { return /LOCAL/i.test(des) ? 'EN LOCAL' : des; },
        // sugerencias = ultimas 4 indicaciones de este producto (localStorage, compartido entre pestañas)
        _notasRapidas: function () {
            try { return JSON.parse(localStorage.getItem('::app3_notas_item') || '{}')[itemPedidos_objItemSelected.iditem] || []; } catch (e) { return []; }
        },
        _guardarNotas: function () {
            var partes = (document.getElementById('txt_referencia').value || '').split(',').map(function (p) { return p.trim(); }).filter(Boolean);
            if (!partes.length) { return; }
            try {
                var todas = JSON.parse(localStorage.getItem('::app3_notas_item') || '{}'), id = itemPedidos_objItemSelected.iditem;
                var bajas = partes.map(function (p) { return p.toLowerCase(); });
                todas[id] = partes.concat((todas[id] || []).filter(function (n) { return bajas.indexOf(n.toLowerCase()) < 0; })).slice(0, 4);
                localStorage.setItem('::app3_notas_item', JSON.stringify(todas));
            } catch (e) {}
        },

        _prepararVista: function () {
            var n = (this.listContentSub || []).length;
            dialog_item_comp.classList.toggle('op-sin-grupos', n === 0);
            dialog_item_comp.classList.toggle('op-compacto', n > 0 && n <= 2);
            this._canalSel = null;
        },

        _tocarOpcion: function (e) {
            var el = e.currentTarget;
            if (!el.dataItem || el.dataItem.disabled) { return; }
            el.checked = !el.dataItem.selected;
            addSubItem(el); // misma logica que el checkbox de antes (desmarca el exceso del grupo)
        },

        _limpiarSeleccion: function () {
            (this.listContentSub || []).forEach(function (g) {
                g.opciones.forEach(function (o) { o.selected = false; });
                g.cantidad_selected = 0;
                g.isObligatorio = g.subitem_required_select === 1;
            });
            resetCmpCtrlAddFact();
            itemPedidos_objItemSelected.subitems_selected = [];
            compResetInputIndicaciones('');
            checkOptionObligario();
            this._pintar();
        },

        _tocarNota: function (frase) {
            var el = document.getElementById('txt_referencia');
            var partes = (el.value || '').split(',').map(function (p) { return p.trim(); }).filter(Boolean);
            var i = partes.map(function (p) { return p.toLowerCase(); }).indexOf(frase.toLowerCase());
            if (i > -1) { partes.splice(i, 1); } else { partes.push(frase); }
            el.value = partes.join(', ');
            xChangeIndicacionesItem();
            this._pintar();
        },

        // filas de canal de siempre (xArmarTipoConsumo) que quedaron en #_xdlgBody
        _filasCanal: function () {
            return $('#_xdlgBody .xpedir_row').toArray().map(function (f) {
                return { id: String(f.getAttribute('data-id')), des: $(f).find('p').first().text().trim(), el: f };
            });
        },

        _claveItem: function () {
            var it = itemPedidos_objItemSelected || {};
            return it.idcarta_lista || it.iditem;
        },

        // las combinaciones ya agregadas: una linea por subitems_view (xAddSubItemsView), en cada canal
        _lineasPedido: function (filas) {
            var key = this._claveItem(), lineas = [];
            filas.forEach(function (f) {
                var e = (xArrayPedidoObj && xArrayPedidoObj[f.id]) ? xArrayPedidoObj[f.id][key] : null;
                if (!e || !(parseFloat(e.cantidad) > 0)) { return; }
                var base = parseFloat(e.precio_unitario || e.precio) || 0;
                if (e.subitems_view && e.subitems_view.length) {
                    e.subitems_view.forEach(function (v, i) {
                        var q = parseFloat(v.cantidad_seleccionada) || 0;
                        if (q <= 0) { return; }
                        lineas.push({ fila: f, index: i, cant: q, unit: base + (parseFloat(v.precio) || 0) / q, des: v.des || '', vid: v.id, nota: v.indicaciones_item || '' });
                    });
                } else {
                    lineas.push({ fila: f, index: -1, cant: parseFloat(e.cantidad), unit: parseFloat(e.precio) || base, des: '', vid: null, nota: '' });
                }
            });
            return lineas;
        },

        _precioBase: function () {
            var it = itemPedidos_objItemSelected || {};
            var p = parseFloat(it.precio_unitario || it.precio) || 0;
            try { // lista de precios elegida en venta rapida (misma regla que handlerFnMiPedido)
                if (typeof idtipo_precio_selected_vr !== 'undefined' && idtipo_precio_selected_vr !== 0 && it.tipo_precios) {
                    var tp = typeof it.tipo_precios === 'string' ? JSON.parse(it.tipo_precios) : it.tipo_precios;
                    var hit = tp.filter(function (x) { return x.idtipo_precio === idtipo_precio_selected_vr; })[0];
                    if (hit) { p = parseFloat(hit.precio) || p; }
                }
            } catch (err) {}
            return p;
        },

        _agregar: function () {
            if (!this.isOptionRequeridosComplet) { return; }
            var fila = this._filasCanal().filter(function (f) { return f.id === this._canalSel; }, this)[0];
            if (!fila) { return; }
            $(fila.el).find('.xBtnDe').trigger('click'); // el "+" de siempre
            this._guardarNotas();
            this._pintar();
        },

        // +/- de una linea ya agregada: mismo camino que los +/- de la lista de venta rapida (subitems_selected_index)
        _linea: function (idFila, index, signo) {
            var fila = this._filasCanal().filter(function (f) { return f.id === String(idFila); })[0];
            if (!fila) { return; }
            var btn = $(fila.el).find(signo > 0 ? '.xBtnDe' : '.xBtnIz');
            if (index < 0) { btn.trigger('click'); this._pintar(); return; }
            var it = itemPedidos_objItemSelected;
            var e = xArrayPedidoObj[fila.id][this._claveItem()];
            var guardado = it.subitems_selected;
            it.subitems_selected = e.subitems_view[index].subitems;
            it.subitems_selected_index = String(index); // texto: el indice 0 como numero se lee como "sin indice"
            try { btn.trigger('click'); } finally {
                it.subitems_selected = guardado;
                it.subitems_selected_index = undefined;
            }
            this._pintar();
        },

        _pintar: function () {
            if (!itemPedidos_objItemSelected || !this.$) { return; }
            Polymer.dom.flush();
            var self = this, root = Polymer.dom(this.root), esc = this._esc;
            var grupos = this.listContentSub || [];
            var it = itemPedidos_objItemSelected;

            // --- grupos: obligatorios primero, numerados en el orden en que se ven
            var nodos = root.querySelectorAll('.op-grupo');
            var esReq = function (g) { return g.subitem_required_select === 1 ? 1 : 0; };
            var elegidas = function (g) {
                return parseInt(g.show_cant_item, 10) === 1
                    ? g.opciones.reduce(function (a, o) { return a + (o.selected ? (parseFloat(o.cantidad_selected) || 0) : 0); }, 0)
                    : g.opciones.filter(function (o) { return o.selected; }).length;
            };
            var orden = grupos.map(function (g, i) { return i; }).sort(function (a, b) { return (esReq(grupos[b]) - esReq(grupos[a])) || (a - b); });
            var req = 0, reqOk = 0, pendientes = [];
            orden.forEach(function (gi, n) {
                var g = grupos[gi], el = nodos[gi];
                if (!el) { return; }
                var obligatorio = esReq(g) === 1, cuantas = elegidas(g), completo = !obligatorio || !g.isObligatorio;
                var max = parseInt(g.subitem_cant_select, 10) || g.opciones.length;
                var cant = parseInt(g.show_cant_item, 10) === 1;
                if (obligatorio) { req++; if (completo) { reqOk++; } else { pendientes.push(self._titulo(g.des)); } }
                el.className = 'op-grupo' + (obligatorio ? ' op-req' : '') + (obligatorio ? (completo ? ' listo' : ' pendiente') : (cuantas ? ' listo' : ''));
                el.querySelector('.op-paso').innerHTML = obligatorio && completo ? '<i class="fa fa-check"></i>' : String(n + 1);
                var tipo = obligatorio ? 'Obligatorio' : 'Opcional';
                el.querySelector('.op-g-regla').textContent = cant ? tipo + ' · hasta ' + max + ' en total'
                    : (max === 1 ? tipo + ' · elige 1' : (max >= g.opciones.length ? tipo + ' · elige las que quieras' : tipo + ' · elige hasta ' + max));
                var chip = el.querySelector('.op-g-chip');
                if (obligatorio) {
                    chip.className = 'op-g-chip ' + (completo ? 'ok' : 'warn');
                    chip.innerHTML = completo ? '<i class="fa fa-check"></i> Listo' : '<i class="fa fa-exclamation"></i> Falta elegir';
                } else {
                    chip.className = 'op-g-chip info';
                    chip.innerHTML = cuantas ? cuantas + (cuantas > 1 ? ' elegidas' : ' elegida') : '';
                }
                // opciones
                el.querySelectorAll('.op-op').forEach(function (op) {
                    var s = op.dataItem;
                    if (!s) { return; }
                    var agot = !!s.disabled;
                    op.classList.toggle('sel', !!s.selected);
                    op.classList.toggle('agotado', agot);
                    var ic = op.querySelector('.op-ic');
                    if (ic) { ic.className = 'fa op-ic ' + (max === 1 ? (s.selected ? 'fa-dot-circle-o' : 'fa-circle-o') : (s.selected ? 'fa-check-square' : 'fa-square-o')); }
                    var st = op.querySelector('.op-stock');
                    var q = parseFloat(s.cantidad);
                    st.className = 'op-stock' + (!s.cantidad_visible ? '' : (q <= 0 ? ' ago' : (q <= 5 ? ' poco' : '')));
                    st.textContent = !s.cantidad_visible ? '' : (q <= 0 ? 'AGOTADO' : (q <= 5 ? 'quedan ' + q : q + ' disp.'));
                });
            });

            // --- precio con las opciones elegidas
            var sel = [], extra = 0;
            orden.forEach(function (gi) {
                grupos[gi].opciones.forEach(function (o) {
                    if (!o.selected) { return; }
                    var p = parseFloat(o.precio) || 0;
                    extra += p;
                    sel.push(esc(String(o.des || '').trim()) + (p ? ' <b>+' + p.toFixed(2) + '</b>' : ''));
                });
            });
            var unit = this._precioBase() + extra;
            this.$$('#opPrecio').textContent = 'S/ ' + unit.toFixed(2);
            this.$$('#opPrecioSub').textContent = extra ? 'con estas opciones (+ S/ ' + extra.toFixed(2) + ')' : 'precio unitario';
            this.$$('#opProgreso').innerHTML = req ? 'Obligatorias ' + reqOk + ' de ' + req + ' <span class="op-barra"><i style="width:' + (reqOk / req * 100) + '%"></i></span>' : '';
            // el stock se escribe aqui y no por binding: el socket de stock hace .text() sobre #contetStock,
            // eso rompe el binding y el chip se quedaba con el stock de otro producto
            var stock = parseFloat(it.stock_actual);
            this.$$('#contetStock').textContent = isNaN(stock) ? '' : stock;
            this.$$('#opChipStock').style.display = isNaN(stock) || String(it.cantidad).toUpperCase() === 'ND' ? 'none' : '';

            // --- canales con su icono
            var filas = this._filasCanal();
            if (!filas.some(function (f) { return f.id === self._canalSel; })) {
                var canalVenta = (typeof xThisComCanalConsumo !== 'undefined' && xThisComCanalConsumo && xThisComCanalConsumo.canalSeleted)
                    ? String(xThisComCanalConsumo.canalSeleted.idtipo_consumo) : null;
                var conCant = filas.filter(function (f) { var e = xArrayPedidoObj[f.id] && xArrayPedidoObj[f.id][self._claveItem()]; return e && e.cantidad > 0; })[0];
                var porVenta = filas.filter(function (f) { return f.id === canalVenta; })[0];
                this._canalSel = (porVenta || conCant || filas[0] || {}).id || null;
            }
            var canalDes = (filas.filter(function (f) { return f.id === self._canalSel; })[0] || {}).des || '';
            this.$$('#opCanales').innerHTML = filas.map(function (f) {
                var img = self._imgCanal(f.des);
                return '<span data-id="' + esc(f.id) + '" class="' + (f.id === self._canalSel ? 'on' : '') + '">' + (img ? '<img src="' + img + '" alt="">' : '') + esc(self._nomCanal(f.des)) + '</span>';
            }).join('');

            // --- lineas ya agregadas
            var lineas = this._lineasPedido(filas);
            var nota = (document.getElementById('txt_referencia').value || '').trim();
            var claveSel = (it.subitems_selected || []).map(function (x) { return String(x.iditem_subitem); }).join('');
            var iActual = lineas.findIndex(function (l) { return l.fila.id === self._canalSel && l.vid !== null && l.vid === claveSel && l.nota === nota; });
            var total = lineas.reduce(function (a, l) { return a + l.unit * l.cant; }, 0);
            var unidades = lineas.reduce(function (a, l) { return a + l.cant; }, 0);
            this.$$('#opCantPedido').textContent = unidades ? '(' + unidades + ')' : '';
            this.$$('#opAgregados').innerHTML = lineas.length ? lineas.map(function (l, i) {
                var img = self._imgCanal(l.fila.des);
                return '<div class="op-agregado' + (i === iActual ? ' actual' : '') + '"><span class="op-num">' + (i + 1) + '</span>'
                    + '<div class="op-ad"><b>' + l.cant + ' × S/ ' + l.unit.toFixed(2) + '</b>' + (l.des ? '<small>' + esc(l.des) + '</small>' : '')
                    + '<em>' + (img ? '<img src="' + img + '" alt="">' : '') + esc(self._nomCanal(l.fila.des)) + '</em></div>'
                    + '<div class="op-step"><button data-fila="' + esc(l.fila.id) + '" data-index="' + l.index + '" data-signo="-1"><i class="fa fa-minus"></i></button><b>' + l.cant
                    + '</b><button data-fila="' + esc(l.fila.id) + '" data-index="' + l.index + '" data-signo="1"><i class="fa fa-plus"></i></button></div></div>';
            }).join('') : '<div class="op-vacio">Todavía no agregas nada. Elige las opciones y toca <b>Agregar</b>.'
                + (grupos.length ? ' Para otra persona con otras opciones: cambia las opciones y vuelve a tocar Agregar.' : '') + '</div>';

            // --- seleccion actual
            var hayLineas = lineas.some(function (l) { return l.vid !== null; });
            var esNueva = hayLineas && iActual < 0 && claveSel !== '';
            // con stock 0 el "+" de siempre no agrega (handlerFnMiPedido): se avisa en vez de dejar un boton que no responde
            var sinStock = parseFloat(it.stock_actual) === 0;
            var puede = !!this.isOptionRequeridosComplet && filas.length > 0 && !sinStock;
            this.$$('#opTituloSel').textContent = esNueva ? 'Selección nueva' : 'Selección';
            var resumen = this.$$('#opSeleccion');
            resumen.classList.toggle('nueva', esNueva);
            resumen.innerHTML = '<div class="op-linea"><span>' + esc(this.desProducto) + '</span><span>S/ ' + unit.toFixed(2) + '</span></div>'
                + (sel.length ? '<div class="op-ops-txt">' + sel.join(' · ') + '</div>' : '')
                + pendientes.map(function (t) { return '<div class="op-falta"><i class="fa fa-exclamation-circle"></i> Falta: ' + esc(t) + '</div>'; }).join('')
                + (esNueva && puede ? '<div class="op-aviso"><i class="fa fa-info-circle"></i> Opciones distintas: al agregar queda como <b>otra línea (#' + (lineas.length + 1) + ')</b>.</div>' : '')
                + (iActual >= 0 ? '<div class="op-aviso"><i class="fa fa-info-circle"></i> Igual a la <b>#' + (iActual + 1) + '</b>: al agregar suma 1 a esa línea.</div>' : '');

            // --- notas rapidas
            var notaLow = nota.toLowerCase().split(',').map(function (p) { return p.trim(); });
            this.$$('#opRapidas').innerHTML = this._notasRapidas().map(function (t) {
                return '<span class="op-rapida' + (notaLow.indexOf(t.toLowerCase()) > -1 ? ' on' : '') + '" data-nota="' + esc(t) + '">' + esc(t) + '</span>';
            }).join('');

            // --- pie
            var estado = this.$$('#opEstado');
            if (sinStock) {
                estado.className = 'op-estado mal';
                estado.innerHTML = '<i class="fa fa-ban"></i> Sin stock: este producto no se puede agregar';
            } else if (!this.isOptionRequeridosComplet) {
                estado.className = 'op-estado mal';
                estado.innerHTML = '<i class="fa fa-exclamation-triangle"></i> Falta elegir: ' + esc(pendientes.join(', '));
            } else if (esNueva) {
                estado.className = 'op-estado info';
                estado.innerHTML = '<i class="fa fa-plus-circle"></i> Opciones nuevas: se agregará como línea #' + (lineas.length + 1);
            } else {
                estado.className = 'op-estado bien';
                estado.innerHTML = '<i class="fa fa-check-circle"></i> ' + (unidades ? unidades + ' en el pedido' + (lineas.length > 1 ? ', en ' + lineas.length + ' líneas' : '') : 'Todo elegido: ya puedes agregar');
            }
            this.$$('#opTotalSub').textContent = unidades ? unidades + ' en el pedido' : 'precio unitario';
            this.$$('#opTotal').textContent = 'S/ ' + (unidades ? total : unit).toFixed(2);
            this.$$('#dlgBtn').innerHTML = unidades ? '<i class="fa fa-check"></i> Listo' : 'Cerrar';
            var btn = this.$$('#opBtnAgregar');
            btn.disabled = !puede;
            btn.innerHTML = '<i class="fa ' + (puede ? 'fa-plus' : 'fa-lock') + '"></i> '
                + (iActual >= 0 ? 'Agregar otra igual a la #' + (iActual + 1) : 'Agregar ' + (/LOCAL/i.test(canalDes) ? '' : 'a ') + esc(this._nomCanal(canalDes)));
        },
        isSubItemCheckBox: (show_cant_item) => {            
            return show_cant_item === 1 ? true : false;
        },
        handleCountChange: function (e) {            
            
            // console.log('e.detail', e.detail);
            const maxQuantity = e.detail.maxQuantity;
            const iditem_subitem_content = e.detail.iditem_subitem_content;
            const subItem = e.detail.subitem;
            const cantItemSelected = e.detail.quantity;
            const precio_item = subItem.precio;
            const descripcion_item = e.detail.descripcion_item_ini;

            // Store the original price if not already stored
            if (!subItem.precio_inicial) {
                subItem.precio_inicial = precio_item;
            }

            const idGruop = '#group-' + iditem_subitem_content;            
            var group = Polymer.dom(this.root).querySelector(idGruop);
            var items = group.querySelectorAll('x-comp-ctrl-add-fast');
            let totalQuantity = 0;
            items.forEach(function (item) {
                totalQuantity += item.quantity;
            });

            if (totalQuantity >= maxQuantity) {
                items.forEach(function (item) {
                    var incrementControl = item.querySelector('.increment');
                    incrementControl.classList.add('xdisabled');
                    item.disableIncrementButton();                    
                });
            } else {
                items.forEach(function (item) {                    
                    var incrementControl = item.querySelector('.increment');
                    incrementControl.classList.remove('xdisabled');
                    item.enableIncrementButton();
                });
            }

            // bucamos el item seleccionado
            let itemSelected = xThisComSubItem.listContentSub.filter(x => x.iditem_subitem_content === iditem_subitem_content)[0];
            itemSelected.cantidad_selected = totalQuantity;
            
            subItem.cantidad_selected = cantItemSelected;
            subItem.selected = cantItemSelected > 0 ? true : false;
            subItem.des = descripcion_item;
            
            if (subItem.selected) {
                // Calculate price based on the original price and quantity
                subItem.precio = cantItemSelected * subItem.precio_inicial;
                subItem.des = cantItemSelected > 1 ? `${cantItemSelected} ${descripcion_item}` : descripcion_item;
            } else {
                // Reset price to original when not selected
                subItem.precio = 0;
            }
            
            subItem.iditem_subitem_content = iditem_subitem_content;     

            addSubItem(null, subItem);
        }
	})
</script>
