<dom-module id="x-comp-set-pinpad">
    <template>
        <style>
            .pinpad-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px;
                border: 1px solid #ccc;
                margin-bottom: 5px;
                border-radius: 5px;
            }

            .pinpad-item button {
                margin-left: 10px;
            }

            .assigned-pinpad {
                margin-bottom: 10px;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 5px;
                background-color: #f9f9f9;
            }

            .pinpad-list {
                display: none;
            }

            .pinpad-list[visible] {
                display: block;
            }

            .xDivCompPinPad {
                border: 1px solid;
                border-radius: 5px;
                padding: 5px;
                background: #385f72;
                color: white;
                width: 100px;
                text-align: center;
                cursor: pointer;
            }
        </style>

        <paper-dialog id="dialog_comp_pinpad_local" style="width: 280px;"
            class="dialog_redondo animate__animated animate__fadeIn animate__faster" modal="true"
            entry-animation="scale-up-animation" exit-animation="fade-out-animation" modal>
            <div>
                <div class="d-flexx align-items-center">
                    <p class="fw-600 fs-15">Seleccione su PinPad</p>
                    <img src="../../../images/pinpad-min.png" alt="pinpad">
                </div>
                <hr>
                <table class="w-100">
                    <template is="dom-repeat" items="{{pinpads}}" as="pinpad">
                        <tr>
                            <td>
                                <div class="text-uppercase p-2 xCursor d-flexx justify-content-between align-items-center" data-id="[[index]]" on-tap="_selectPinpad">
                                    <div style="line-height: 1.2;">
                                        <p>{{ pinpad.pinpad_sn }}</p>                                                                                
                                        <p class="m-0 fs-9 text-secondary">{{ pinpad.descripcion }} | {{ pinpad.area }}</p>                                                                           
                                    </div>                                    
                                    <!-- check -->
                                    <i hidden$="{{!pinpad.selected}}" class="fa fa-check text-success ml-1"></i>
                                </div>
                            </td>
                        </tr>
                    </template>
                </table>
                <br>
                <paper-progress class="xInvisible" id="dgl_pinpad_loader_progress" indeterminate style="width: 100%;"></paper-progress>
                <p id="msj_connect_pinpad_error" class="xInvisible text-danger fs-600 fs-12">Pinpad no encontrado. Verifique el SN y si tiene instalado el servicio <a href="https://www.google.com" target="_blank">Descargar Instalador.</a></p>
                <p id="msj_connect_pinpad_success" class="xInvisible text-success fs-600 fs-12">Pinpad conectado con existo!</p>

                <br>
                <div>
                    <button class="btn btn-success mr-1" disabled$="{{!pinpadSelected}}"
                        on-tap="_assignPinpad">{{_getButtonText(assignedPinpad)}}</button>
                    <button class="btn btn-dark" dialog-dismiss>Cerrar</button>
                </div>
            </div>
        </paper-dialog>
        
        <div class="xDivCompPinPad" on-tap="_openPinpadDialog" hidden$="[[hiddenPinpad]]">
            <p class="text-warning">Mi PinPad</p>
            <p class="fw-600 text-uppercase">{{assignedPinpad.pinpad_sn}}</p>
            <!-- <span>Pinpad Asignado: [[assignedPinpad.pinpad_sn]]</span> -->
        </div>
    </template>

    <script>
        Polymer({
            is: 'x-comp-set-pinpad',
            properties: {
                pinpads: {
                    type: Array,
                    value: function () {
                        return [];
                    }
                },
                assignedPinpad: {
                    type: Object,
                    value: null
                },
                pinpadSelected: {
                    type: Object,
                    value: null
                },
                hiddenPinpad: {
                    type: Boolean,
                    value: false
                },
                showPinpadList: {
                    type: Boolean,
                    value: false
                },
                showMensajeConnection: {
                    type: Object,
                    value: {
                        success: false,
                        message: ''
                    }
                },
            },
            ready: async function () {                
                await this._getListPinPad();
                this._checkAssignedPinpad();
            },
            _checkSericesPinPad: async function (PinpadSN) {
                return checkPinPad(PinpadSN)
            },
            _checkAssignedPinpad: function () {
                var assignedPinpadSN = localStorage.getItem('::app3_pinpad_sn');
                if (assignedPinpadSN) {
                    var assignedPinpad = this.pinpads.find(pinpad => pinpad.pinpad_sn === assignedPinpadSN);
                    if (assignedPinpad) {
                        // marcar el pinpad seleccionado
                        this._markSelectedPinpad(assignedPinpadSN);


                    //     const rptPinpad = _checkSericesPinPad(assignedPinpadSN);
                    //     console.log('rptPinpad', rptPinpad);                        
                    }

                } else {
                    assignedPinpad = {
                        descripcion: 'Ninguno',
                        pinpad_sn: 'Ninguno',
                        ischeck: false,                        
                    }                                    
                }
                this.set('assignedPinpad', assignedPinpad);
            },
            _markSelectedPinpad: function (pinpadSN) {
                this.pinpads.forEach((pinpad, index) => {
                    this.set(`pinpads.${index}.selected`, false);
                    if (pinpad.pinpad_sn === pinpadSN) {
                        this.set(`pinpads.${index}.selected`, true);
                    }
                });
            },
            _openPinpadDialog: function () {
                this.$.dialog_comp_pinpad_local.open();
            },
            _selectPinpad: async function (e) {
                this.pinpadSelected = null;
                dgl_pinpad_loader_progress.classList.toggle('xInvisible', false);

                var selectedPinpad = e.model.pinpad;
                console.log('selectedPinpad', selectedPinpad);
                this.pinpads.forEach((pinpad, index) => {
                    this.set(`pinpads.${index}.selected`, false);
                });
                this.set(`pinpads.${e.model.index}.selected`, true);
                this.set('selectedPinpad', selectedPinpad);
                
                const rptPinpad = await this._checkSericesPinPad(selectedPinpad.pinpad_sn);                
                msj_connect_pinpad_error.classList.toggle('xInvisible', rptPinpad.success);
                msj_connect_pinpad_success.classList.toggle('xInvisible', true);
                if ( rptPinpad.success ) {
                    this._assignPinpad();
                } else {
                    dgl_pinpad_loader_progress.classList.toggle('xInvisible', true);
                    msj_connect_pinpad_error.innerHTML = `El servicio del pinpad no esta instalado. <a href="https://www.google.com" target="_blank">Descargar Instalador.</a>`;
                }
            },
            _assignPinpad: async function () {
                var pinpad = this.selectedPinpad;
                if (!pinpad) {
                    dgl_pinpad_loader_progress.classList.toggle('xInvisible', true);
                    alert('Por favor, seleccione un pinpad.');
                    return;
                }
                const rptTest = await this._testConnection(pinpad.pinpad_sn);                
                dgl_pinpad_loader_progress.classList.toggle('xInvisible', true);
                msj_connect_pinpad_success.classList.toggle('xInvisible', !rptTest.success);

                if ( !rptTest.success ) {
                    msj_connect_pinpad_error.innerHTML = `PinPad no encontrado. Verifique la conexion del dispositivo. Verifique que el SN coicida con el dispositivo conectado.`;
                    msj_connect_pinpad_error.classList.toggle('xInvisible', false);
                    return;
                }
                
                this.pinpadSelected = pinpad;
                this.assignedPinpad = pinpad;
                this._saveAssignedPinpad();
                console.log('rptTest', rptTest);
            },
            _getListPinPad: async function () {
                var self = this;
                await $.ajax({
                    url: '../../bdphp/log_010.php?op=get-list-pinpad',
                    type: 'GET',
                    success: (data) => {
                        console.log('data', data);
                        const rpt = JSON.parse(data);
                        this.pinpads = rpt.datos;
                        this.hiddenPinpad = this.pinpads.length === 0;
                        console.log(rpt);
                    },
                    error: function (error) {
                        console.log('Error:', error);
                    }
                });
            },
            _testConnection: async function (pinpadSN, callback) {
                return await testConnectionPinPad(pinpadSN, callback);
            },
            _getButtonText: function (assignedPinpad) {
                return assignedPinpad?.descripcion != 'Ninguno' ? 'Asignar' : 'Cambiar';
            },
            _saveAssignedPinpad: function () {
                localStorage.setItem('::app3_pinpad_sn', this.assignedPinpad.pinpad_sn);
                // this.$.dialog_comp_pinpad_local.close();
            }
        });
    </script>
</dom-module>
