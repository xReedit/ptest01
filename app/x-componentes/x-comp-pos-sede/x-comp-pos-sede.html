<link rel="import" href="../../web_components/polymer/polymer.html">
<link rel="import" href="../../web_components/paper-dialog/paper-dialog.html">
<!--
  x-comp-pos-sede — selector de sede operativa (call center / POS multi-sede).
-->
<dom-module id="x-comp-pos-sede">
    <template>
        <style>
            :host {
                display: inline-block;
                vertical-align: middle;
                max-width: calc(100vw - 280px);
            }

            .sede-activa {
                display: inline-block;
                padding: 0 10px 0 8px;
                margin-left: 2px;
                border-left: 3px solid rgba(255,255,255,0.35);
                cursor: default;
                user-select: none;
                line-height: 1.15;
                max-width: 100%;
            }
            .sede-activa.clickable { cursor: pointer; }
            .sede-activa.no-perm { cursor: default; pointer-events: none; }
            .sede-activa.clickable:hover { background: rgba(255,255,255,0.07); border-radius: 0 4px 4px 0; }
            .sede-activa.override { border-left-color: #ffb74d; }
            .sede-activa.loading { opacity: 0.65; pointer-events: none; }

            .sede-activa__nombre {
                font-size: 15px;
                font-weight: 700;
                color: #fff;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 400px;
            }
            .sede-activa__meta {
                font-size: 10px;
                color: rgba(255,255,255,0.78);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 400px;
                margin-top: 1px;
            }

            paper-dialog { min-width: 340px; max-width: 440px; padding: 0 2px 2px; }
            .dlg-header { margin: 20px 0 8px; }
            .dlg-header h3 { margin: 0 0 2px; font-size: 16px; font-weight: 700; color: #1a1a2e; }
            .dlg-header p { margin: 0; font-size: 11px; color: #888; }
            .dlg-activa {
                display: block;
                margin-top: 5px;
                padding: 2px 8px;
                background: #e8f5e9;
                color: #2e7d32;
                border-radius: 4px;
                font-size: 11px;
                font-weight: 600;
                line-height: 1.35;
            }

            .sede-lista {
                max-height: 300px;
                overflow-y: auto;
            }

            .sede-lista .sede-card {
                display: -webkit-box;
                display: -webkit-flex;
                display: flex;
                -webkit-box-orient: horizontal;
                -webkit-box-direction: normal;
                -webkit-flex-direction: row;
                flex-direction: row;
                -webkit-box-align: center;
                -webkit-align-items: center;
                align-items: center;
                gap: 8px;
                padding: 6px 10px;
                margin-bottom: 4px;
                border: 1px solid #e0e0e0;
                border-radius: 6px;
                cursor: pointer;
                background: #fff;
                box-sizing: border-box;
            }
            .sede-lista .sede-card:hover { border-color: #90caf9; background: #fafafa; }
            .sede-lista .sede-card.actual {
                border: 2px solid #43a047;
                background: #f1f8e9;
            }

            .sede-lista .sede-card__check {
                width: 18px;
                height: 18px;
                min-width: 18px;
                border-radius: 50%;
                border: 2px solid #ccc;
                display: -webkit-box;
                display: -webkit-flex;
                display: flex;
                -webkit-box-align: center;
                -webkit-align-items: center;
                align-items: center;
                -webkit-box-pack: center;
                -webkit-justify-content: center;
                justify-content: center;
                flex-shrink: 0;
                color: transparent;
                font-size: 10px;
                line-height: 1;
            }
            .sede-lista .sede-card.actual .sede-card__check {
                border-color: #43a047;
                background: #43a047;
                color: #fff;
            }

            .sede-lista .sede-card__body {
                -webkit-box-flex: 1;
                -webkit-flex: 1;
                flex: 1;
                min-width: 0;
                line-height: 1.25;
            }
            .sede-card__line1 {
                font-size: 13px;
                font-weight: 700;
                color: #212121;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .sede-card.actual .sede-card__line1 { color: #1b5e20; }
            .sede-card__dir {
                font-size: 10px;
                color: #999;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .btn-nueva-pestana {
                display: block;
                margin-top: 6px;
                padding: 6px 10px;
                background: #fafafa;
                border: 1px dashed #bdbdbd;
                border-radius: 6px;
                cursor: pointer;
                text-align: center;
                color: #555;
                font-size: 11px;
            }
            .btn-nueva-pestana:hover { background: #f0f0f0; }
            .dlg-footer { margin-top: 8px; text-align: right; }
        </style>

        <div id="pill" class$="[[_pillClass]]" on-tap="_onPillTap" title$="[[_pillTitle]]">
            <div class="sede-activa__nombre">[[_nombreLabel]]</div>
            <div class="sede-activa__meta" hidden$="[[!_metaLabel]]">[[_metaLabel]]</div>
        </div>

        <paper-dialog id="dlgSedes" class="dialog_redondo" with-backdrop hidden$="[[!_permCallCenter]]"
                      entry-animation="scale-up-animation" exit-animation="fade-out-animation">
            <div class="dlg-header">
                <h3>Cambiar sede</h3>
                <p>Cada pestaña puede operar una sede distinta.</p>
                <span class="dlg-activa">Activa ahora: [[_nombreLabel]][[_activaMetaSuffix]]</span>
            </div>

            <div class="sede-lista">
                <template is="dom-repeat" items="[[sedes]]" as="item">
                    <div class$="[[_clsCard(item)]]"
                         on-tap="_onSedeTap" data-idx$="[[index]]">
                        <div class="sede-card__check"><i class="fa fa-check"></i></div>
                        <div class="sede-card__body">
                            <div class="sede-card__line1">[[item.nombre]] · [[item.ciudad]]</div>
                            <div class="sede-card__dir" hidden$="[[!_tieneDir(item.direccion)]]">[[item.direccion]]</div>
                        </div>
                    </div>
                </template>
            </div>

            <div class="btn-nueva-pestana" hidden$="[[!_permCallCenter]]" on-tap="_abrirNuevaPestanaPrompt">
                + Abrir nueva pestaña con otra sede
            </div>
            <div class="dlg-footer">
                <button class="xBoton2 xPlomo" dialog-dismiss>Cerrar</button>
            </div>
        </paper-dialog>

        <paper-dialog id="dlgPedidoEnCurso" class="dialog_redondo" modal
                      entry-animation="scale-up-animation" exit-animation="fade-out-animation">
            <h3>Hay un pedido en curso</h3>
            <p style="color:#444;">
                No se puede cambiar de sede con un pedido sin terminar.
                Puedes <b>terminar</b> el pedido actual o <b>cancelarlo</b> para continuar.
            </p>
            <div class="buttons" style="display:flex; gap:8px; justify-content:flex-end;">
                <button class="xBoton2 xPlomo" on-tap="_dlgPedidoVolver">Volver</button>
                <button class="xBoton2 xRojo"  on-tap="_dlgPedidoCancelar">Cancelar pedido</button>
                <button class="xBoton2 xAzul"  on-tap="_dlgPedidoTerminar">Terminar pedido</button>
            </div>
        </paper-dialog>

        <paper-dialog id="dlgNuevaPestana" class="dialog_redondo" modal hidden$="[[!_permCallCenter]]"
                      entry-animation="scale-up-animation" exit-animation="fade-out-animation">
            <div class="dlg-header">
                <h3>Nueva pestaña</h3>
                <p>Elige la sede para abrirla en otra pestaña del navegador.</p>
            </div>
            <div class="sede-lista">
                <template is="dom-repeat" items="[[sedes]]" as="item">
                    <div class="sede-card" on-tap="_onNuevaPestanaSedeTap" data-idx$="[[index]]">
                        <div class="sede-card__check"></div>
                        <div class="sede-card__body">
                            <div class="sede-card__line1">[[item.nombre]] · [[item.ciudad]]</div>
                            <div class="sede-card__dir" hidden$="[[!_tieneDir(item.direccion)]]">[[item.direccion]]</div>
                        </div>
                    </div>
                </template>
            </div>
            <div class="dlg-footer">
                <button class="xBoton2 xPlomo" dialog-dismiss>Cerrar</button>
            </div>
        </paper-dialog>
    </template>

    <script>
        (function () {
            Polymer({
                is: 'x-comp-pos-sede',

                properties: {
                    sedes:              { type: Array,   value: function () { return []; } },
                    _nombreLabel:       { type: String,  value: 'Sede' },
                    _metaLabel:         { type: String,  value: '' },
                    _activaMetaSuffix:  { type: String,  value: '' },
                    _pillTitle:         { type: String,  value: '' },
                    _pillClass:         { type: String,  value: 'sede-activa' },
                    _permCallCenter:    { type: Boolean, value: false },
                    _idsedeActual:      { type: Number,  value: 0, notify: true },
                    _sedeSel:           { type: Object,  value: function () { return null; } }
                },

                ready: function () { this._refreshLabel(); },

                attached: function () {
                    var self = this;
                    if (!opSede.tienePermiso()) {
                        self._permCallCenter = false;
                        self._refreshLabel();
                        return;
                    }
                    $.ajax({ type: 'POST', url: '../../bdphp/log_componentes.php?op=1' })
                    .done(function (rpt) {
                        try {
                            var dt = (typeof rpt === 'string') ? JSON.parse(rpt) : rpt;
                            self.sedes = (dt && dt.datos) ? dt.datos : (Array.isArray(dt) ? dt : []);
                            self._refreshLabel();
                            self._marcarSedeActivaEnLista();
                            self._aplicarSedeDesdeURL();
                        } catch (e) { console.error('[x-comp-pos-sede] error parseando sedes:', e); }
                    });
                    window.addEventListener('op-sede-changed', function () {
                        self._refreshLabel();
                        self._marcarSedeActivaEnLista();
                    });
                },

                _readOpSedeParam: function () {
                    if (typeof opSede !== 'undefined' && opSede.readOpSedeFromUrl) {
                        return opSede.readOpSedeFromUrl();
                    }
                    try {
                        return parseInt(new URLSearchParams(window.location.search).get('op_sede'), 10) || 0;
                    } catch (e) { return 0; }
                },

                _aplicarSedeDesdeURL: function () {
                    var idsede = this._readOpSedeParam();
                    if (!idsede) return;
                    if (!opSede.tienePermiso()) return;

                    var sede = this._sedeFromList(idsede);
                    if (!sede) return;

                    var cur = opSede.get();
                    if (parseInt(cur.idsede, 10) === parseInt(sede.idsede, 10)) {
                        if (opSede.clearOpSedeFromUrl) { opSede.clearOpSedeFromUrl(); }
                        return;
                    }

                    this._sedeSel = sede;
                    var self = this;
                    var intentos = 0;
                    (function tryApply() {
                        var host = self._host();
                        if (host && typeof host.aplicarCambioSede === 'function') {
                            self._aplicarCambio(true);
                            return;
                        }
                        if (++intentos < 50) {
                            setTimeout(tryApply, 100);
                        } else {
                            opSede.set({
                                idorg: sede.idorg, idsede: sede.idsede,
                                nombre: sede.nombre, ciudad: sede.ciudad, direccion: sede.direccion
                            });
                            self._refreshLabel();
                            if (opSede.clearOpSedeFromUrl) { opSede.clearOpSedeFromUrl(); }
                        }
                    })();
                },

                _sedeFromList: function (idsede) {
                    var id = parseInt(idsede, 10);
                    return (this.sedes || []).filter(function (x) {
                        return parseInt(x.idsede, 10) === id;
                    })[0] || null;
                },

                _marcarSedeActivaEnLista: function () {
                    var actualId = parseInt(this._idsedeActual, 10) || 0;
                    var lista = this.sedes || [];
                    var out = [];
                    for (var i = 0; i < lista.length; i++) {
                        var s = lista[i];
                        out.push({
                            idorg: s.idorg,
                            idsede: s.idsede,
                            nombre: s.nombre,
                            ciudad: s.ciudad,
                            direccion: s.direccion,
                            esActual: parseInt(s.idsede, 10) === actualId
                        });
                    }
                    this.sedes = out;
                },

                /** Polymer 1 no soporta ternarios en class$ — usar helper. */
                _clsCard: function (item) {
                    if (!item) { return 'sede-card'; }
                    return item.esActual ? 'sede-card actual' : 'sede-card';
                },

                _tieneDir: function (dir) {
                    if (!dir) { return false; }
                    var t = String(dir).replace(/\s+/g, ' ').trim();
                    return t.length > 1;
                },

                _labelNombreSede: function (row) {
                    if (!row) return '';
                    // datos_org_sede: nombre = razón social CPE; sedenombre = nombre comercial
                    return (row.sedenombre || row.nombre || '').trim();
                },

                _labelCiudadSede: function (row) {
                    if (!row) return '';
                    return (row.sedeciudad || row.ciudad || '').trim();
                },

                _labelDireccionSede: function (row) {
                    if (!row) return '';
                    return (row.sededireccion || row.direccion || '').trim();
                },

                _refreshLabel: function () {
                    var s = opSede.get();
                    var hit = this._sedeFromList(s.idsede);
                    if (!hit && typeof xm_log_get === 'function') {
                        try {
                            var datosOrg = xm_log_get('datos_org_sede') || [];
                            var idBus = parseInt(s.idsede, 10) || 0;
                            if (!idBus) {
                                var us0 = xm_log_get('app3_us');
                                idBus = us0 ? (parseInt(us0.idsede, 10) || 0) : 0;
                            }
                            hit = datosOrg.filter(function (x) {
                                return parseInt(x.idsede, 10) === idBus;
                            })[0] || null;
                        } catch (e) { /* ignore */ }
                    }
                    var pill = this.$.pill;

                    var nombre = this._labelNombreSede(hit) || this._labelNombreSede(s) || ('Sede #' + s.idsede);
                    var ciudad = this._labelCiudadSede(hit) || this._labelCiudadSede(s);
                    var direccion = this._labelDireccionSede(hit) || this._labelDireccionSede(s);

                    this._nombreLabel = nombre;
                    this._idsedeActual = parseInt(s.idsede, 10) || 0;

                    var metaParts = [];
                    if (ciudad) metaParts.push(ciudad);
                    if (direccion) metaParts.push(direccion);
                    this._metaLabel = metaParts.join(' · ');
                    this._activaMetaSuffix = ciudad ? (' · ' + ciudad) : '';

                    pill.classList.remove('override', 'clickable', 'loading', 'no-perm');
                    this._permCallCenter = opSede.tienePermiso();
                    if (this._permCallCenter) {
                        pill.classList.add('clickable');
                        this._pillClass = 'sede-activa clickable' + (opSede.isOverride() ? ' override' : '');
                    } else {
                        pill.classList.add('no-perm');
                        this._pillClass = 'sede-activa no-perm';
                    }
                    if (opSede.isOverride() && this._permCallCenter) {
                        pill.classList.add('override');
                    }

                    this._pillTitle = !this._permCallCenter
                        ? nombre
                        : (opSede.isOverride()
                            ? ('Operando en otra sede. Pertenencia: #' + opSede.getPertenencia().idsede)
                            : 'Clic para cambiar sede');
                },

                _onPillTap: function () {
                    if (!opSede.tienePermiso()) return;
                    this._refreshLabel();
                    this._marcarSedeActivaEnLista();
                    var self = this;
                    this.async(function () { self.$.dlgSedes.open(); });
                },

                _onSedeTap: function (ev) {
                    var idx = parseInt(ev.currentTarget.getAttribute('data-idx'), 10);
                    var sede = this.sedes[idx];
                    if (!sede) return;
                    if (parseInt(sede.idsede, 10) === this._idsedeActual) {
                        this.$.dlgSedes.close();
                        return;
                    }
                    this._sedeSel = sede;
                    var host = this._host();
                    var enCurso = host && typeof host.checkPedidoEnCurso === 'function'
                        ? host.checkPedidoEnCurso() : false;
                    if (enCurso) {
                        this.$.dlgSedes.close();
                        this.$.dlgPedidoEnCurso.open();
                        return;
                    }
                    this._aplicarCambio(false);
                },

                _setLoading: function (on) {
                    if (on) { this.$.pill.classList.add('loading'); }
                    else    { this.$.pill.classList.remove('loading'); }
                },

                _aplicarCambio: function (fromUrl) {
                    var self = this;
                    var sede = this._sedeSel;
                    if (!sede) return;
                    this.$.dlgSedes.close();

                    var prev = opSede.get();
                    opSede.set({
                        idorg: sede.idorg, idsede: sede.idsede,
                        nombre: sede.nombre, ciudad: sede.ciudad, direccion: sede.direccion
                    });
                    this._refreshLabel();
                    this._marcarSedeActivaEnLista();
                    this._setLoading(true);

                    var host = this._host();
                    if (host && typeof host.aplicarCambioSede === 'function') {
                        host.aplicarCambioSede(sede, prev, function () {
                            self._setLoading(false);
                            if (fromUrl && opSede.clearOpSedeFromUrl) { opSede.clearOpSedeFromUrl(); }
                            window.dispatchEvent(new CustomEvent('op-sede-changed', {
                                detail: { prev: prev, current: opSede.get() }
                            }));
                        });
                    } else {
                        self._setLoading(false);
                        if (fromUrl && opSede.clearOpSedeFromUrl) { opSede.clearOpSedeFromUrl(); }
                        window.dispatchEvent(new CustomEvent('op-sede-changed', {
                            detail: { prev: prev, current: opSede.get() }
                        }));
                    }
                },

                _dlgPedidoVolver:   function () { this.$.dlgPedidoEnCurso.close(); },
                _dlgPedidoTerminar: function () { this.$.dlgPedidoEnCurso.close(); },
                _dlgPedidoCancelar: function () {
                    var host = this._host();
                    if (host && typeof host.cancelarPedidoEnCurso === 'function') {
                        host.cancelarPedidoEnCurso();
                    }
                    this.$.dlgPedidoEnCurso.close();
                    this._aplicarCambio(false);
                },

                _abrirNuevaPestanaPrompt: function () {
                    if (!opSede.tienePermiso()) return;
                    this.$.dlgSedes.close();
                    this.$.dlgNuevaPestana.open();
                },

                _onNuevaPestanaSedeTap: function (ev) {
                    if (!opSede.tienePermiso()) return;
                    var idx = parseInt(ev.currentTarget.getAttribute('data-idx'), 10);
                    var sede = this.sedes[idx];
                    if (!sede) return;
                    var url = window.location.pathname +
                        '?op_sede=' + encodeURIComponent(sede.idsede) +
                        '#/venta_rapida';
                    window.open(url, '_blank');
                    this.$.dlgNuevaPestana.close();
                },

                _host: function () {
                    if (typeof xCompPosSedeHost !== 'undefined' && xCompPosSedeHost) return xCompPosSedeHost;
                    return null;
                }
            });
        })();
    </script>
</dom-module>
