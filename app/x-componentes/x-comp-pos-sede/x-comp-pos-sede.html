<link rel="import" href="../../web_components/polymer/polymer.html">
<link rel="import" href="../../web_components/paper-dialog/paper-dialog.html">
<link rel="import" href="../x-comp-direccion-google/x-comp-direccion-google.html">
<!--
  x-comp-pos-sede — selector de sede operativa (call center / POS multi-sede).
-->
<dom-module id="x-comp-pos-sede">
    <template>
        <style>
            :host {
                display: inline-block;
                vertical-align: middle;
                max-width: calc(100vw - 280px);
            }

            .sede-activa {
                display: inline-block;
                padding: 0 10px 0 8px;
                margin-left: 2px;
                border-left: 3px solid rgba(255,255,255,0.35);
                cursor: default;
                user-select: none;
                line-height: 1.15;
                max-width: 100%;
            }
            .sede-activa.clickable { cursor: pointer; }
            .sede-activa.no-perm { cursor: default; pointer-events: none; }
            .sede-activa.clickable:hover { background: rgba(255,255,255,0.07); border-radius: 0 4px 4px 0; }
            .sede-activa.override { border-left-color: #ffb74d; }
            .sede-activa.loading { opacity: 0.65; pointer-events: none; }

            .sede-activa__nombre {
                font-size: 15px;
                font-weight: 700;
                color: #fff;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 400px;
            }
            .sede-activa__meta {
                font-size: 10px;
                color: rgba(255,255,255,0.78);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 400px;
                margin-top: 1px;
            }

            paper-dialog { min-width: 340px; max-width: 440px; padding: 0 2px 2px; }
            #dlgSedes { width: 560px; max-width: calc(100vw - 32px); max-height: calc(100vh - 24px); overflow-y: auto; padding-bottom: 16px; }
            #dlgSedes .dlg-header { margin: 24px 0 18px; }
            #dlgSedes .dlg-header h3 { margin-bottom: 4px; font-size: 18px; }
            #dlgSedes .dlg-header p { font-size: 12px; }
            #dlgSedes .dlg-activa { margin-top: 10px; padding: 6px 10px; font-size: 12px; }
            #dlgSedes .buscar-cli { margin-bottom: 16px; }
            #dlgSedes .buscar-dir { margin-bottom: 18px; }
            #dlgSedes .buscar-dir__ayuda { margin-top: 6px; font-size: 11px; }
            #dlgSedes .sede-lista { max-height: min(320px, calc(100vh - 470px)); }
            #dlgSedes .sede-card { padding: 10px 12px; margin-bottom: 7px; }
            #dlgSedes .sede-card__line1 { font-size: 14px; }
            #dlgSedes .sede-card__dir { font-size: 11px; }
            #dlgSedes .btn-nueva-pestana { margin: 12px 24px 0; padding: 9px 10px; font-size: 12px; }
            .dlg-x { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; padding: 0; border: none; border-radius: 50%; background: transparent; color: #757575; font-size: 17px; cursor: pointer; transition: background .15s, color .15s; }
            .dlg-x:hover { background: #f0f0f0; color: #212121; }
            #dlgSedes .sede-card.cercana.actual { border-color: #43a047; }
            .btn-continuar { display: block; width: calc(100% - 48px); height: 44px; margin: 12px 24px 0; padding: 0 12px; border: none; border-radius: 8px; background: #43a047; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; animation: cliEntra .22s ease; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
            .btn-continuar:hover { background: #388e3c; }
            .dlg-header { margin: 20px 0 8px; }
            .dlg-header h3 { margin: 0 0 2px; font-size: 16px; font-weight: 700; color: #1a1a2e; }
            .dlg-header p { margin: 0; font-size: 11px; color: #888; }
            .dlg-activa {
                display: block;
                margin-top: 5px;
                padding: 2px 8px;
                background: #e8f5e9;
                color: #2e7d32;
                border-radius: 4px;
                font-size: 11px;
                font-weight: 600;
                line-height: 1.35;
            }

            .sede-lista {
                max-height: 300px;
                overflow-y: auto;
            }

            .sede-lista .sede-card {
                display: -webkit-box;
                display: -webkit-flex;
                display: flex;
                -webkit-box-orient: horizontal;
                -webkit-box-direction: normal;
                -webkit-flex-direction: row;
                flex-direction: row;
                -webkit-box-align: center;
                -webkit-align-items: center;
                align-items: center;
                gap: 8px;
                padding: 6px 10px;
                margin-bottom: 4px;
                border: 1px solid #e0e0e0;
                border-radius: 6px;
                cursor: pointer;
                background: #fff;
                box-sizing: border-box;
            }
            .sede-lista .sede-card:hover { border-color: #90caf9; background: #fafafa; }
            .sede-lista .sede-card.actual {
                border: 2px solid #43a047;
                background: #f1f8e9;
            }

            .sede-lista .sede-card__check {
                width: 18px;
                height: 18px;
                min-width: 18px;
                border-radius: 50%;
                border: 2px solid #ccc;
                display: -webkit-box;
                display: -webkit-flex;
                display: flex;
                -webkit-box-align: center;
                -webkit-align-items: center;
                align-items: center;
                -webkit-box-pack: center;
                -webkit-justify-content: center;
                justify-content: center;
                flex-shrink: 0;
                color: transparent;
                font-size: 10px;
                line-height: 1;
            }
            .sede-lista .sede-card.actual .sede-card__check {
                border-color: #43a047;
                background: #43a047;
                color: #fff;
            }

            .sede-lista .sede-card__body {
                -webkit-box-flex: 1;
                -webkit-flex: 1;
                flex: 1;
                min-width: 0;
                line-height: 1.25;
            }
            .sede-card__line1 {
                font-size: 13px;
                font-weight: 700;
                color: #212121;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .sede-card.actual .sede-card__line1 { color: #1b5e20; }
            .sede-card__km { font-size: 12px; font-weight: 700; color: #555; white-space: nowrap; }
            .sede-card.cercana { border: 2px solid #1e88e5; }
            .sede-card.cercana .sede-card__km { color: #1565c0; }
            .sede-card__badge {
                display: inline-block; margin-left: 4px; padding: 0 5px; border-radius: 3px;
                background: #1e88e5; color: #fff; font-size: 9px; font-weight: 700; vertical-align: middle;
            }
            .buscar-cli { margin: 0 0 8px; }
            .buscar-cli__lista { max-height: 132px; overflow-y: auto; margin-top: 4px; border: 1px solid #e0e0e0; border-radius: 6px; }
            .cli-fila { display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; font-size: 12px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
            .cli-fila:hover { background: #f5f9ff; }
            .cli-fila__tel { margin-left: 4px; font-size: 11px; color: #777; }
            .cli-fila__dir { font-size: 10px; font-weight: 700; white-space: nowrap; color: #2e7d32; }
            .cli-fila__dir.sin { color: #c62828; }
            #dlgSedes [hidden] { display: none !important; }
            .cli-buscar { position: relative; }
            .cli-buscar .fa { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 13px; color: #9e9e9e; }
            .cli-buscar input { width: 100%; height: 40px; box-sizing: border-box; padding: 0 12px 0 34px; border: 1px solid #d6d9de; border-radius: 8px; background: #fff; font-size: 13px; outline: none; }
            .cli-buscar input:focus { border-color: #1e88e5; box-shadow: 0 0 0 3px rgba(30,136,229,.12); }
            .cli-card { margin: 0 24px 14px; padding: 12px 14px; border: 1px solid #e3e8ef; border-radius: 10px; background: #f8fafc; }
            .cli-card__top { display: flex; align-items: center; gap: 10px; }
            @keyframes cliEntra { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
            .cli-card, .cli-dirs, .buscar-cli__lista, .cli-msj { animation: cliEntra .22s ease; }
            .cli-card__dat { flex: 1; min-width: 0; line-height: 1.3; }
            .cli-card__nom { overflow: hidden; font-size: 14px; font-weight: 700; color: #212121; white-space: nowrap; text-overflow: ellipsis; }
            .cli-card__tel { font-size: 12px; color: #757575; }
            .cli-link { font-size: 12px; font-weight: 600; color: #1565c0; cursor: pointer; white-space: nowrap; }
            .cli-link:hover { text-decoration: underline; }
            .cli-dir { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #dde3ea; font-size: 13px; color: #37474f; }
            .cli-dir .fa, .cli-dirs__f .fa { flex-shrink: 0; color: #ef6c00; }
            .cli-dir__txt { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
            .cli-dirs { max-height: 150px; margin-top: 10px; padding-top: 8px; overflow-y: auto; border-top: 1px dashed #dde3ea; }
            .cli-dirs__f { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; font-size: 12px; color: #37474f; cursor: pointer; }
            .cli-dirs__f:hover { background: #eef4fb; }
            .cli-dirs__f.sel { background: #eef7ee; color: #1b5e20; font-weight: 700; }
            .cli-sin { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: #fff8e1; color: #7a5d00; font-size: 12px; }
            .cli-agregar { display: inline-block; margin-top: 10px; }
            .cli-cancelar { display: inline-block; margin-top: 6px; }
            .cli-msj { margin: -8px 0 12px; }
            .buscar-dir { margin: 0 0 8px; }
            .buscar-dir__ayuda { margin-top: 3px; font-size: 10px; color: #888; }
            .buscar-dir__quitar { color: #1565c0; cursor: pointer; text-decoration: underline; }
            .sede-card__dir {
                font-size: 10px;
                color: #999;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .btn-nueva-pestana {
                display: block;
                margin-top: 6px;
                padding: 6px 10px;
                background: #fafafa;
                border: 1px dashed #bdbdbd;
                border-radius: 6px;
                cursor: pointer;
                text-align: center;
                color: #555;
                font-size: 11px;
            }
            .btn-nueva-pestana:hover { background: #f0f0f0; }
            .dlg-footer { margin-top: 8px; text-align: right; }
        </style>

        <div id="pill" class$="[[_pillClass]]" on-tap="_onPillTap" title$="[[_pillTitle]]">
            <div class="sede-activa__nombre">[[_nombreLabel]]</div>
            <div class="sede-activa__meta" hidden$="[[!_metaLabel]]">[[_metaLabel]]</div>
        </div>

        <paper-dialog id="dlgSedes" class="dialog_redondo" with-backdrop hidden$="[[!_permCallCenter]]"
                      entry-animation="scale-up-animation" exit-animation="fade-out-animation">
            <div class="dlg-header">
                <button type="button" class="dlg-x" dialog-dismiss hidden$="[[_obligatorio]]" title="Cerrar" aria-label="Cerrar"><i class="fa fa-times"></i></button>
                <h3>[[_tituloSedes(_obligatorio, _tituloObligatorio)]]</h3>
                <p>Cada pestaña puede operar una sede distinta.</p>
                <span class="dlg-activa">Activa ahora: [[_nombreLabel]][[_activaMetaSuffix]]</span>
            </div>

            <div class="buscar-cli" hidden$="[[_tiene(_cliSel)]]">
                <div class="cli-buscar">
                    <i class="fa fa-search"></i>
                    <input id="txtCliente" type="text" autocomplete="off"
                           placeholder="Buscar cliente por nombre o celular" on-input="_onClienteInput">
                </div>
                <div class="buscar-cli__lista" hidden$="[[!_hayClientes(_clientes)]]">
                    <template is="dom-repeat" items="[[_clientes]]" as="c">
                        <div class="cli-fila" on-tap="_onClienteTap" data-idx$="[[index]]">
                            <span>[[c.nombres]]<span class="cli-fila__tel">[[c.telefono]]</span></span>
                            <span class$="[[_clsDirCli(c)]]">[[_txtDirCli(c)]]</span>
                        </div>
                    </template>
                </div>
            </div>

            <div class="cli-card" hidden$="[[!_cliSel]]">
                <div class="cli-card__top">
                    <div class="cli-card__dat">
                        <div class="cli-card__nom">[[_cliSel.nombres]]</div>
                        <div class="cli-card__tel">[[_cliSel.telefono]]</div>
                    </div>
                    <span class="cli-link" on-tap="_limpiarDir">Cambiar cliente</span>
                </div>

                <div class="cli-dir" hidden$="[[_ocultaFilaDir(_dirCli, _verDirs)]]">
                    <i class="fa fa-map-marker"></i>
                    <span class="cli-dir__txt" title$="[[_dirCli.direccion]]">[[_dirCli.direccion]]</span>
                    <span class="cli-link" hidden$="[[!_masDeUna(_dirsCli)]]" on-tap="_toggleDirs">Cambiar</span>
                </div>

                <div class="cli-dirs" hidden$="[[!_verDirs]]">
                    <template is="dom-repeat" items="[[_dirsCli]]" as="d">
                        <div class$="[[_clsFilaDir(d, _dirCli)]]" on-tap="_onDirTap" data-idx$="[[index]]">
                            <i class="fa fa-map-marker"></i><span class="cli-dir__txt">[[d.direccion]]</span>
                        </div>
                    </template>
                </div>

                <div class="cli-sin" hidden$="[[!_sinDirs(_cliSel, _dirCli)]]">Este cliente aún no tiene dirección. Escríbela abajo y queda guardada.</div>
                <span class="cli-link cli-agregar" hidden$="[[_ocultaAgregar(_dirCli, _agregando)]]" on-tap="_abrirAgregar"><i class="fa fa-plus"></i> Agregar otra dirección</span>
            </div>
            <div class="buscar-dir__ayuda cli-msj" hidden$="[[!_cliMsj]]">[[_cliMsj]]</div>

            <div class="buscar-dir">
                <div hidden$="[[_ocultaDir(_cliSel, _agregando)]]">
                    <x-comp-direccion-google id="dirSede"></x-comp-direccion-google>
                    <span class="cli-link cli-cancelar" hidden$="[[!_dirCli]]" on-tap="_cancelarAgregar">Cancelar</span>
                </div>
                <div class="buscar-dir__ayuda" hidden$="[[_ocultaAyuda(_dirOrden, _cliSel)]]">¿Ya tienes la dirección del cliente? Escríbela o pega la ubicación y las sedes se ordenan de la más cercana a la más lejana.</div>
                <div class="buscar-dir__ayuda" hidden$="[[!_dirOrden]]">Sedes ordenadas por cercanía (en línea recta)<span hidden$="[[_tiene(_cliSel)]]"> · <span class="buscar-dir__quitar" on-tap="_limpiarDir">quitar</span></span></div>
            </div>

            <div class="sede-lista">
                <template is="dom-repeat" items="[[sedes]]" as="item">
                    <div class$="[[_clsCard(item)]]"
                         on-tap="_onSedeTap" data-idx$="[[index]]">
                        <div class="sede-card__check"><i class="fa fa-check"></i></div>
                        <div class="sede-card__body">
                            <div class="sede-card__line1">[[item.nombre]] · [[item.ciudad]]</div>
                            <div class="sede-card__dir" hidden$="[[!_tieneDir(item.direccion)]]">[[item.direccion]]</div>
                        </div>
                        <div class="sede-card__km" hidden$="[[!item.km]]">[[item.km]]<span class="sede-card__badge" hidden$="[[!item.cercana]]">MÁS CERCANA</span></div>
                    </div>
                </template>
            </div>

            <button class="btn-continuar" hidden$="[[!_sugerida]]" on-tap="_confirmarSugerida">Listo</button>

            <div class="btn-nueva-pestana" hidden$="[[!_permCallCenter]]" on-tap="_abrirNuevaPestanaPrompt">
                + Abrir nueva pestaña con otra sede
            </div>
        </paper-dialog>

        <paper-dialog id="dlgPedidoEnCurso" class="dialog_redondo" modal
                      entry-animation="scale-up-animation" exit-animation="fade-out-animation">
            <h3>Hay un pedido en curso</h3>
            <p style="color:#444;">
                No se puede cambiar de sede con un pedido sin terminar.
                Puedes <b>terminar</b> el pedido actual o <b>cancelarlo</b> para continuar.
            </p>
            <div class="buttons" style="display:flex; gap:8px; justify-content:flex-end;">
                <button class="xBoton2 xPlomo" on-tap="_dlgPedidoVolver">Volver</button>
                <button class="xBoton2 xRojo"  on-tap="_dlgPedidoCancelar">Cancelar pedido</button>
                <button class="xBoton2 xAzul"  on-tap="_dlgPedidoTerminar">Terminar pedido</button>
            </div>
        </paper-dialog>

        <paper-dialog id="dlgNuevaPestana" class="dialog_redondo" modal hidden$="[[!_permCallCenter]]"
                      entry-animation="scale-up-animation" exit-animation="fade-out-animation">
            <div class="dlg-header">
                <h3>Nueva pestaña</h3>
                <p>Elige la sede para abrirla en otra pestaña del navegador.</p>
            </div>
            <div class="sede-lista">
                <template is="dom-repeat" items="[[sedes]]" as="item">
                    <div class="sede-card" on-tap="_onNuevaPestanaSedeTap" data-idx$="[[index]]">
                        <div class="sede-card__check"></div>
                        <div class="sede-card__body">
                            <div class="sede-card__line1">[[item.nombre]] · [[item.ciudad]]</div>
                            <div class="sede-card__dir" hidden$="[[!_tieneDir(item.direccion)]]">[[item.direccion]]</div>
                        </div>
                    </div>
                </template>
            </div>
            <div class="dlg-footer">
                <button class="xBoton2 xPlomo" dialog-dismiss>Cerrar</button>
            </div>
        </paper-dialog>
    </template>

    <script>
        (function () {
            Polymer({
                is: 'x-comp-pos-sede',

                properties: {
                    sedes:              { type: Array,   value: function () { return []; } },
                    _nombreLabel:       { type: String,  value: 'Sede' },
                    _metaLabel:         { type: String,  value: '' },
                    _activaMetaSuffix:  { type: String,  value: '' },
                    _pillTitle:         { type: String,  value: '' },
                    _pillClass:         { type: String,  value: 'sede-activa' },
                    _permCallCenter:    { type: Boolean, value: false },
                    _idsedeActual:      { type: Number,  value: 0, notify: true },
                    _sedeSel:           { type: Object,  value: function () { return null; } },
                    _obligatorio:       { type: Boolean, value: false },
                    _tituloObligatorio: { type: String,  value: '' },
                    _clientes:          { type: Array,   value: function () { return []; } },
                    _sugerida:          { type: Object,  value: null },
                    _cliSel:            { type: Object,  value: null },
                    _dirsCli:           { type: Array,   value: function () { return []; } },
                    _dirCli:            { type: Object,  value: null },
                    _verDirs:           { type: Boolean, value: false },
                    _agregando:         { type: Boolean, value: false },
                    _cliMsj:            { type: String,  value: '' },
                    _dirOrden:          { type: Boolean, value: false }
                },

                observers: ['_recentrar(_clientes, _cliSel, _dirCli, _verDirs, _agregando, _cliMsj, _sugerida)'],

                listeners: {
                    'dlgSedes.iron-overlay-opened': '_onSedesAbierto',
                    'dlgSedes.iron-overlay-closed': '_onSedesCerrado',
                    'dlgSedes.iron-overlay-canceled': '_onSedesCancelado',
                    'dlgNuevaPestana.iron-overlay-closed': '_onNuevaPestanaCerrado'
                },

                ready: function () {
                    this._refreshLabel();
                    // direccion del cliente -> sedes por cercania (Google o coordenadas pegadas, p. ej. ubicacion de WhatsApp)
                    var self = this, dir = this.$.dirSede;
                    dir.addEventListener('getPlaces', function (e) {
                        var loc = e.detail && e.detail.geometry && e.detail.geometry.location;
                        if (!loc) { return; }
                        // coordenadas pegadas: Google devuelve la direccion mas cercana, el punto sigue siendo el pegado
                        var p = self._coordsPegadas, lat = p ? p.lat : loc.lat(), lng = p ? p.lng : loc.lng();
                        clearTimeout(self._pegadasTimer);
                        self._coordsPegadas = null;
                        self._ordenarPorCercania(lat, lng);
                        self._guardarDirNueva(lat, lng, e.detail);
                    });
                    dir.$.autocomplete.addEventListener('input', function () {
                        clearTimeout(self._pegadasTimer);
                        self._coordsPegadas = null;
                        if (!dir.isCoordinates(this.value)) { return; }
                        var c = this.value.split(','), lat = parseFloat(c[0]), lng = parseFloat(c[1]), texto = this.value.trim();
                        self._ordenarPorCercania(lat, lng);
                        self._coordsPegadas = { lat: lat, lng: lng };
                        // si Google no responde, se guarda con las coordenadas como texto
                        self._pegadasTimer = setTimeout(function () {
                            self._coordsPegadas = null;
                            self._guardarDirNueva(lat, lng, { formatted_address: texto });
                        }, 2000);
                    });
                },

                // las sugerencias de Google se pintan fuera del dialogo: elegir una no debe cerrarlo
                _onSedesCancelado: function (e) {
                    var t = e.detail && e.detail.target;
                    if (t && t.closest && t.closest('.pac-container')) { e.preventDefault(); }
                },

                _ordenarPorCercania: function (lat, lng) {
                    if (isNaN(lat) || isNaN(lng)) { return; }
                    var self = this;
                    var lista = (this.sedes || []).map(function (s) {
                        var la = parseFloat(s.latitude), lo = parseFloat(s.longitude);
                        var d = (la && lo) ? self._km(lat, lng, la, lo) : null;
                        var km = d === null ? 'sin ubicación' : (d < 1 ? Math.round(d * 1000) + ' m' : d.toFixed(1) + ' km');
                        return Object.assign({}, s, { _d: d, km: km, cercana: false });
                    });
                    lista.sort(function (a, b) {
                        if (a._d === null || b._d === null) { return (a._d === null) - (b._d === null); }
                        return a._d - b._d;
                    });
                    var sug = (lista[0] && lista[0]._d !== null) ? lista[0] : null;
                    if (sug) { sug.cercana = true; }
                    this._sugerida = sug; // antes de pintar: _clsCard decide con esto cual lleva el check
                    this.sedes = lista;
                    this._dirOrden = true;
                    if (sug) { this.async(this._animarSugerida, 40); }
                },

                // La primera fila se reutiliza al reordenar: una clase CSS no volveria a animarse.
                _animarSugerida: function () {
                    var lista = this.$.dlgSedes.querySelector('.sede-lista'), card = lista.querySelector('.sede-card');
                    lista.scrollTop = 0;
                    if (!card || !card.animate) { return; }
                    card.animate([{ boxShadow: '0 0 0 0 rgba(67,160,71,.5)' }, { boxShadow: '0 0 0 9px rgba(67,160,71,0)' }], { duration: 560, easing: 'ease-out' });

                },

                            { transform: 'translateY(' + (topAntes - r.top) + 'px)', height: altoAntes + 'px' },
                            { transform: 'none', height: r.height + 'px' }

                    });

                _onDirTap: function (ev) {

                _abrirAgregar: function () {

                // Solo guarda si se esta agregando la direccion de un cliente; sin cliente el campo solo ordena las sedes.
                _guardarDirNueva: function (lat, lng, place) {

                    var self = this, cli = this._cliSel;
                    var parte = function (tipo) {
                        var c = (place.address_components || []).filter(function (x) { return x.types.indexOf(tipo) >= 0; })[0];
                        return c ? c.long_name : '';

                    $.ajax({ type: 'POST', url: '../../bdphp/log_sedes_atiende.php?op=agregar-direccion-cliente', dataType: 'json', data: {
                        idcliente: cli.idcliente, latitude: lat, longitude: lng,
                        direccion: place.formatted_address || place.name || '',
                        ciudad: parte('locality'), provincia: parte('administrative_area_level_2'),
                        departamento: parte('administrative_area_level_1'), pais: parte('country'), codigo: parte('postal_code')
                    } }).done(function (r) {
                        if (self._cliSel !== cli) { return; }
                        if (!r || !r.success) { self._cliMsj = (r && r.error) || 'No se pudo guardar la dirección.'; return; }
                        var ya = self._dirsCli.filter(function (d) { return d.idcliente_pwa_direccion === r.datos.idcliente_pwa_direccion; })[0];
                        if (!ya) { self._dirsCli = [r.datos].concat(self._dirsCli); }
                        self._elegirDirCli(ya || r.datos);

                    }).fail(function () {

                _limpiarDir: function () {
                    this._limpiarCliente();

                        return Object.assign({}, s, { _d: null, km: '', cercana: false });
                    }).sort(function (a, b) { return String(a.nombre).localeCompare(String(b.nombre)); });
                },

                // distancia en linea recta (haversine), en km
                // ponytail: linea recta, no ruta; si un rio/via la engaña, pasar a Distance Matrix de Google
                _km: function (lat1, lng1, lat2, lng2) {
                    var r = Math.PI / 180;
                    var a = Math.pow(Math.sin((lat2 - lat1) * r / 2), 2) +
                        Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.pow(Math.sin((lng2 - lng1) * r / 2), 2);
                    return 12742 * Math.asin(Math.sqrt(a));
                },

                /**
                 * Call center: tras cada venta hay que elegir la sede del siguiente pedido.
                 * Sin "Cerrar" ni clic afuera: se elige una sede (la actual sigue igual) o se abre otra pestaña.
                 */
                elegirSedeObligatorio: function (titulo) {
                    if (typeof opSede === 'undefined' || !opSede.tienePermiso()) return;

                    this.async(function () { self.$.dlgSedes.open(); });

                _tituloSedes: function (obligatorio, titulo) {
                    return obligatorio ? (titulo || '¿Para qué sede es el siguiente pedido?') : 'Cambiar sede';

                // Call center: al abrir el POS se elige la sede antes de armar el pedido

                _onSedesCerrado: function () {

                    this._volverObligatorio = false;
                    this.elegirSedeObligatorio(this._tituloObligatorio);

                attached: function () {

                            self.sedes = (dt && dt.datos) ? dt.datos : (Array.isArray(dt) ? dt : []);

                detached: function () {

                _readOpSedeParam: function () {
                    if (typeof opSede !== 'undefined' && opSede.readOpSedeFromUrl) {
                        return opSede.readOpSedeFromUrl();

                    try {
                        return parseInt(new URLSearchParams(window.location.search).get('op_sede'), 10) || 0;
                    } catch (e) { return 0; }

                _aplicarSedeDesdeURL: function () {
                    var idsede = this._readOpSedeParam();
                    if (!idsede) return;
                    if (!opSede.tienePermiso()) return;

                    var sede = this._sedeFromList(idsede);
                    if (!sede) return;

                    var cur = opSede.get();

                    var intentos = 0;

                _sedeFromList: function (idsede) {
                    var id = parseInt(idsede, 10);

                    var marcada = this._sugerida ? item.cercana : item.esActual;

                _tieneDir: function (dir) {

                _labelNombreSede: function (row) {

                    return (row.sedenombre || row.nombre || '').trim();

                _refreshLabel: function () {

                    if (!opSede.tienePermiso()) return;

                    this._marcarSedeActivaEnLista();
                    var self = this;
                    this.async(function () { self.$.dlgSedes.open(); });
                },

                _onSedeTap: function (ev) {

                _elegirSede: function (sede) {
                    if (!sede) return;

                        return;

                    this._sedeSel = sede;

                    var prev = opSede.get();
                    opSede.set({
                        idorg: sede.idorg, idsede: sede.idsede,
                        nombre: sede.nombre, ciudad: sede.ciudad, direccion: sede.direccion

                    this._marcarSedeActivaEnLista();
                    this._setLoading(true);

                    var host = this._host();
                    if (host && typeof host.aplicarCambioSede === 'function') {
                        host.aplicarCambioSede(sede, prev, function () {
                            self._setLoading(false);
                            if (fromUrl && opSede.clearOpSedeFromUrl) { opSede.clearOpSedeFromUrl(); }
                            window.dispatchEvent(new CustomEvent('op-sede-changed', {
                                detail: { prev: prev, current: opSede.get() }
                            }));
                        });
                    } else {
                        self._setLoading(false);
                        if (fromUrl && opSede.clearOpSedeFromUrl) { opSede.clearOpSedeFromUrl(); }
                        window.dispatchEvent(new CustomEvent('op-sede-changed', {
                            detail: { prev: prev, current: opSede.get() }
                        }));
                    }

                _dlgPedidoTerminar: function () { this.$.dlgPedidoEnCurso.close(); },
                _dlgPedidoCancelar: function () {
                    var host = this._host();
                    if (host && typeof host.cancelarPedidoEnCurso === 'function') {
                        host.cancelarPedidoEnCurso();

                    this.$.dlgPedidoEnCurso.close();
                    this._aplicarCambio(false);
                },

                _abrirNuevaPestanaPrompt: function () {
                    if (!opSede.tienePermiso()) return;

                    this.$.dlgSedes.close();
                    this.$.dlgNuevaPestana.open();

                _onNuevaPestanaSedeTap: function (ev) {
                    if (!opSede.tienePermiso()) return;
                    var idx = parseInt(ev.currentTarget.getAttribute('data-idx'), 10);
                    var sede = this.sedes[idx];
                    if (!sede) return;
                    var url = window.location.pathname +
                        '?op_sede=' + encodeURIComponent(sede.idsede) +
                        '#/venta_rapida';
                    window.open(url, '_blank');
                    this.$.dlgNuevaPestana.close();

                _host: function () {
                    if (typeof xCompPosSedeHost !== 'undefined' && xCompPosSedeHost) return xCompPosSedeHost;
                    return null;
                }
