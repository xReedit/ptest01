<link rel="import" href="../../web_components/polymer/polymer.html">
<link rel="import" href="../../web_components/paper-input-autocomplete/paper-input-autocomplete.html">

<dom-module id="x-comp-search-data">
    <template>
        <style>
            paper-input-autocomplete {
                width: 100%;
            }
        </style>
        <paper-input-autocomplete id="inputAutocomplete" label="[[label]]" source="[[filteredData]]"
            on-autocomplete-selected="_onAutocompleteSelected" on-input="_onInput" search-property="[[displayKey]]">
        </paper-input-autocomplete>
    </template>

    <script>
        Polymer({
            is: 'x-comp-search-data',

            properties: {
                label: {
                    type: String,
                    value: 'Buscar'
                },
                sourceData: {
                    type: Array,
                    value: function () { return []; }
                },
                searchKey: {
                    type: String,
                    value: 'id'
                },
                displayKey: {
                    type: String,
                    value: 'label'
                },
                filteredData: {
                    type: Array,
                    value: function () { return []; }
                },
                minChars: {
                    type: Number,
                    value: 2
                }
            },

            _onAutocompleteSelected: function (event) {
                const selectedItem = event.detail.value;
                this.dispatchEvent(new CustomEvent('item-selected', {
                    detail: {
                        item: selectedItem
                    },
                    bubbles: true,
                    composed: true
                }));
            },

            _onInput: function (event) {
                const searchText = this.$.inputAutocomplete.value;
                if (searchText.length < this.minChars) {
                    this.filteredData = [];
                    return;
                }

                this.debounce('filterData', () => {
                    this.filteredData = this.sourceData.filter(item => {
                        return item[this.searchKey].toString()
                            .toLowerCase()
                            .includes(searchText.toLowerCase());
                    });
                }, 300);
            },

            getValue: function () {
                return this.$.inputAutocomplete.value;
            },

            setValue: function (item) {
                this.$.inputAutocomplete.value = item;
                this.$.inputAutocomplete.$.input.value = item[this.displayKey];
            },

            clear: function () {
                this.$.inputAutocomplete.value = '';
                this.$.inputAutocomplete.$.input.value = '';
                this.filteredData = [];
            }
        });
    </script>
</dom-module>
