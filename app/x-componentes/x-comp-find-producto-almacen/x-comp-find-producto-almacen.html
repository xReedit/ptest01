<dom-module id="x-comp-find-producto-almacen">
	<template is="dom-bind">
        <style>
            :host {
                display: block;
            }

            .comp-input {
                width: 100%;
                min-height: 38px;
                padding: 8px 10px;
                box-sizing: border-box;
                border: 1px solid var(--ui-border, #e5e7eb) !important;
                border-radius: 8px;
                background: var(--comp-input-bg, #fff);
                color: var(--comp-input-color, #1f2933);
                font-size: 12px;
            }

            .comp-input::placeholder {
                color: var(--comp-input-placeholder, #98a2b3);
                opacity: 1;
            }

            .comp-input:focus {
                outline: none;
                border-color: var(--comp-input-focus, #80bdff) !important;
                box-shadow: 0 0 0 2px rgba(0, 123, 255, .08);
            }
        </style>
		<div>
            <input type="text" class="xMiInput xPasarEnter2 fs-12 comp-input" onChange="conMayusculas(this)" id="des_item_comp" onkeyup="xloadProductoAlmacenComp(this)" placeholder$="[[placeholder]]">						
		</div>
	</template>


	<script>
		var xThisCompProductoAlmacen, dtProductosComp, productoSeleted;

        function xloadProductoAlmacenComp(obj){
            const _val = obj.value;
            const _idFiltro = xThisCompProductoAlmacen.idalmacenfiltro || 0;
            if ( _val.length < 3) {return; }

            $.ajax({ type: 'POST', url: '../../bdphp/log_componentes.php?op=20', data: {search: _val, idfiltro: _idFiltro}})
            .done( function (DtItems) {
                var xDtItems=JSON.parse(DtItems);
                dtProductosComp=xDtItems.datos;                
                dtProductosComp.map(x => {
                    const _labl = x.label.split(' | ');
                        if (xThisCompProductoAlmacen.onlynomproducto) {
                            x.label = _labl[2];
                        }
                        if (xThisCompProductoAlmacen.onlynomalmacen) {
                            x.label = _labl[0] + ' | ' + _labl[2];
                        }
                        if (xThisCompProductoAlmacen.onlynomfamilia) {
                            x.label = _labl[1] + ' | ' + _labl[2];
                        }
                });
                xCargarProductoItemComp();
            })
        }

        function xCargarProductoItemComp () {      
            xThisCompProductoAlmacen.appendtocmp = xThisCompProductoAlmacen.appendtocmp || 'body';              
            var xPrecio_pro_calc=0;
            var xObjTxtItemPro=$("#des_item_comp");
                xObjTxtItemPro.autocomplete({
                    autoFocus:true,
                    source:dtProductosComp,
                    appendTo: $(xThisCompProductoAlmacen.appendtocmp),
                    select: function( event, ui ) {
                        xObjTxtItemPro.val(ui.item.label);
                        xObjTxtItemPro.attr('data-id',ui.item.value);                        
                        productoSeleted=ui.item;

                        xThisCompProductoAlmacen.fire('productoSeleted', productoSeleted);
                        

                        // console.log(productoSeleted)

                        return false;
                    },
                    focus:function(event, ui){return false;},
                    change:function( event, ui ) {
                        if(ui.item===null){
                            xObjTxtItemPro.attr('data-value',"");
                            xObjTxtItemPro.attr('data-id',"");
                            
                            xNewItemPro=true;
                            productoSeleted = null;
                            xThisCompProductoAlmacen.fire('productoSeleted', productoSeleted);
                        }else{xNewItemPro=false;}
                        return false;
                    }
                });
        }
        


		Polymer({
			is: 'x-comp-find-producto-almacen',
			properties: {				
                dtProItem: [],                
                idalmacenfiltro: Number,// idalmacen filtro 0 o null = all
                onlynomproducto: Boolean,
                onlynomalmacen: Boolean,
                onlynomfamilia: Boolean, //
                appendtocmp: String,
                placeholder: {
                    type: String,
                    value: ''
                },
			},
			attached: function () {        
                // this.appendtocmp = 'body'                      
				xThisCompProductoAlmacen = this;								
			},
            getProductoSeletedAlmacen: () => {                
                return productoSeleted;
            },
            resetText: () => {
                des_item_comp.value = '';
                productoSeleted = null;
            },
            focusText: () => {
                des_item_comp.focus();
            }
		})
	</script>

</dom-module>
